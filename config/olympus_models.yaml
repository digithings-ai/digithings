# Olympus (Atlas + Hermes) — centralized model tier policy.
#
# Single source of truth for per-phase model selection and OpenRouter cost knobs.
# Override the active tier at runtime: OLYMPUS_MODEL_TIER=cheap|balanced|quality
#
# ── ROUTING MODEL (Jun 2026) ────────────────────────────────────────────────
# Two pool kinds — do not conflate them:
#
#   allowed_models   — phase LLM calls (structured JSON, function tools, reasoning).
#                      BARE slugs only (no ``:online``). Every entry MUST support
#                      OpenRouter function tools. ``:online`` is a web-search variant and
#                      does NOT imply tool support — for open-weight models the ``:online``
#                      endpoints 404 on function tools, so it is banned from phase pools.
#                      Web grounding is NOT done here; it is a separate pre-pass (below).
#
#   web_search_models — grounding pre-passes only (Atlas/Hermes live_search). Carries the
#                      ``:online``/native-search models (perplexity/sonar). The pre-pass
#                      injects a ``web_grounding`` block into the prompt before the phase
#                      runs, so phase models never need ``:online`` themselves. These models
#                      may lack function tools — NEVER routed to run_tools phases.
#
# Phase routing: stable hash(phase_slug) → capability pool (extraction / research /
# reasoning). Grounding: hash(segment) → web_search_models pool.
#
# Tier philosophy:
#   cheap     — open-weight OSS models (bare) for phases; ``:online``/perplexity grounding
#   balanced  — cheap pool + mid-tier (Gemini Flash, GPT-5.6 Luna, Grok), all bare
#   quality   — unbounded frontier models; no auto-router sanitization
#
# Pools prefer the latest generation release per vendor as of #2368 (2026-08-14,
# grok-4.6 added 2026-08-15) where cost allows — balanced keeps grok-4.3 rather
# than the current grok-4.6 flagship, which is quality-only. See
# docs/providers/snapshots/*.yaml for the vendor model IDs this was checked
# against as of that file's own last_checked date; a slug added after a
# snapshot was last refreshed won't appear there yet.
# Endpoint capability (tools + strict json_schema + context floor) is live-verified
# by scripts/validate_olympus_pools.py (.github/workflows/validate-olympus-pools.yml).
#
# Fail-hard when grounding unavailable: OLYMPUS_WEB_SEARCH=required.
#
# Env contract: house calls go service → digillm → LiteLLM (OPENAI_API_BASE).
# apply_olympus_openrouter_env() sets OPENROUTER_ALLOWED_MODELS +
# OPENROUTER_COST_QUALITY_TRADEOFF at chain startup, and points the default
# client at OpenRouter's OpenAI-compat API only when OPENAI_API_BASE is unset
# (CLI/GHA without a local proxy). Prefixes (openrouter/, gemini/, …) are
# BYOK/diagnostics — do not put them on house pins.

default_tier: cheap

openrouter_defaults:
  allowed_models: "deepseek/*,meta-llama/*,mistralai/*,nvidia/*,google/gemma*,perplexity/*"
  cost_quality_tradeoff: 10

tiers:
  cheap:
    openrouter:
      allowed_models: "deepseek/*,meta-llama/*,mistralai/*,nvidia/*,google/gemma*,perplexity/*"
      cost_quality_tradeoff: 10
    # Phase pools = bare slugs (function tools). ``:online`` is web-search-only and lives
    # in ``web_search_models``; grounding is a separate pre-pass injected into the prompt.
    allowed_models:
      # mistralai/mistral-small-3.1-24b-instruct removed — no endpoint supports function
      # tools for it. deepseek-r1 and llama-4-maverick dropped from ``reasoning`` — CoT/
      # empty-completion failures under strict json_schema (#1617, #1006).
      extraction:
        - "deepseek/deepseek-v4-flash"
        - "meta-llama/llama-4-maverick"
      research:
        - "deepseek/deepseek-v4-flash"
        - "meta-llama/llama-4-maverick"
      reasoning:
        - "deepseek/deepseek-v4-flash"
    web_search_models:
      - "perplexity/sonar"
      - "deepseek/deepseek-v4-flash:online"
      - "meta-llama/llama-4-maverick:online"

  balanced:
    openrouter:
      allowed_models: "deepseek/*,meta-llama/*,mistralai/*,google/*,x-ai/*,z-ai/*,openai/gpt-5.6-luna*,perplexity/*"
      cost_quality_tradeoff: 7
    allowed_models:
      # gemini-3.7-flash: native PDF/image vision for filing- and chart-heavy phases.
      # deepseek-v4-pro added to research/reasoning as a mid-cost reasoning bump —
      # already gate-proven in the ``quality`` tier below. glm-5 removed — empty-body
      # failures under strict json_schema; re-add a GLM only once a variant passes the
      # gate consistently.
      extraction:
        - "deepseek/deepseek-v4-flash"
        - "google/gemini-3.7-flash"
        - "openai/gpt-5.6-luna"
        - "meta-llama/llama-4-maverick"
      research:
        - "deepseek/deepseek-v4-flash"
        - "deepseek/deepseek-v4-pro"
        - "meta-llama/llama-4-maverick"
        - "google/gemini-3.7-flash"
        - "x-ai/grok-4.3"
        - "openai/gpt-5.6-luna"
      reasoning:
        - "deepseek/deepseek-v4-flash"
        - "deepseek/deepseek-v4-pro"
        - "x-ai/grok-4.3"
        - "google/gemini-3.7-flash"
    web_search_models:
      - "perplexity/sonar"
      - "google/gemini-3.7-flash:online"
      - "openai/gpt-5.6-luna:online"

  quality:
    openrouter:
      allowed_models: "deepseek/*,meta-llama/*,mistralai/*,openai/*,google/*,anthropic/*,x-ai/*,z-ai/*,perplexity/*"
      cost_quality_tradeoff: 0
    allowed_models:
      # This tier is capability- not cost-constrained: unbounded frontier models, no
      # auto-router sanitization. No Gemini Pro entry — three Pro variants failed the
      # gate in a row (non-JSON output, 404, empty body); gemini-3.7-flash carries
      # Google coverage instead. glm-5.2 stays out — matches glm-5's pre-existing
      # pass/fail record; re-evaluate independently.
      extraction:
        - "deepseek/deepseek-v4-flash"
        - "openai/gpt-5.6-sol"
        - "google/gemini-3.7-flash"
        - "anthropic/claude-sonnet-5"
      research:
        - "deepseek/deepseek-v4-pro"
        - "openai/gpt-5.6-sol"
        - "anthropic/claude-sonnet-5"
        - "google/gemini-3.7-flash"
        - "x-ai/grok-4.6"
      reasoning:
        - "deepseek/deepseek-v4-pro"
        - "anthropic/claude-sonnet-5"
        - "openai/gpt-5.6-sol"
        - "x-ai/grok-4.6"
    web_search_models:
      - "perplexity/sonar"
      - "openai/gpt-5.6-sol:online"
      - "deepseek/deepseek-v4-flash:online"
      - "anthropic/claude-sonnet-5:online"
      - "x-ai/grok-4.6:online"

phase_capabilities:
  macro: research
  bonds: research
  commodities: research
  forex: research
  crypto: research
  international: research
  equity: research
  risk-aggressive: research
  risk-conservative: research
  phase9-evolution: research
  decision-reflector: research
  pm-rebalance: reasoning
  master-digest: reasoning
  monthly-digest: reasoning
  hermes/portfolio/pm-direction: reasoning
  beliefs-distillation: research

phase_capability_prefixes:
  alt-: extraction
  inst-: extraction
  sector-: research
  technical-analyst-: extraction
  sentiment-analyst-: extraction
  news-analyst-: extraction
  fundamental-analyst-: extraction
  bull-researcher-: research
  bear-researcher-: research
  research-manager-: research
  hermes/thesis/market-: research
  hermes/thesis/vehicle-: research
  hermes/portfolio/asset-analyst-: extraction
  # Deliberation turns emit strict JSON (DeliberationPmTurn/AnalystTurn). The `reasoning`
  # pool is not guaranteed JSON-clean for every vendor — json.loads failed at char 0 for
  # ~1/3 of tickers on a CoT-style model (run 27984259662). `research` is JSON+tool
  # capable and matches the per-turn h6_* mappings below.
  hermes/portfolio/deliberation-: research
  h6_pm_challenge-: research
  h6_analyst_response-: research
