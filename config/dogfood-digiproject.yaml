# digithings client #0 — digigraph project config (committed operator default).
# Set DIGI_PROJECT_CONFIG to this file (or docs/projects/digithings/digiproject.yaml).
# Local overrides: config/dogfood-digiproject.local.yaml (gitignored via compose override).
#
# Spec: docs/spec/project-spec-v1alpha1.md

project:
  name: digithings-dogfood
  description: "digithings.ai/chat — client #0 dogfood (digichat + digigraph + digivault + digisearch)"
  version: "0.1.0"

graph:
  workflow_profile: research_rag

skills:
  enabled:
    - search
    - digivault

agents:
  enabled:
    - research
  # llm_mode is access/cost policy. The public embed picker (#3829) defaults to
  # Cheaper Inference cheap slugs (deepseek-v4.1-flash-1017), so `free` would refuse them.
  # OpenRouter retired openai/gpt-oss-20b:free (404 → paid openai/gpt-oss-20b).
  llm_mode: test
  llm:
    provider: litellm
    model: deepseek/deepseek-v4.1-flash-1017
    api_key_env: OPENAI_API_KEY
  # Skip ResearchBrief post-pass so the SSE stream ends when answer text completes.
  research_brief: false
  allowed_tools:
    - digisearch
    - digivault_search_notes
    - digivault_get_note
  research_system_prompt: >
    You are the digithings help assistant for digithings.ai chat. Answer questions
    about digithings: the products, the docs, and how the stack fits together. Use
    the docs and vault notes you retrieve, and cite the path or URL. Web search is
    on. Use it when the corpus does not cover the question, and say when an answer
    comes from the web. Do not invent features, pricing, or capabilities. If you do
    not have a grounded answer, say so. Politely decline questions that are not
    about digithings.

indexes:
  - name: digithings_docs
    backend: chroma

services:
  digisearch_url: ${DIGISEARCH_URL:-http://digisearch:8002}
  digivault_url: ${DIGIVAULT_URL:-http://digivault:8004}
