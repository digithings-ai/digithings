# LiteLLM router config – Digi Ecosystem (Phase 1+)
# digigraph calls LiteLLM at http://litellm:4000/v1.
# Model selection: callers must pass a concrete model string; use DIGI_LLM_MODE + model_modes.yaml to resolve it.
# Agents: when adding models, update config/model_modes.yaml and config/MODELS.md.
#
# Docker default: strict routing (no model fallbacks). For Ollama fallback behavior,
# use litellm.dev.yaml (set LITELLM_CONFIG in compose or override the command — see DOCKER.md).
# BYOK (#3605): OPENAI_API_BASE is a LiteLLM proxy only when it is a declared
# :4000 URL (or DIGILLM_TRUSTED_LITELLM_BASES). extra_body.api_base is regex-
# pinned to catalog hosts; unrestricted ["api_key", "api_base"] is forbidden.

model_list:
  # OpenAI (optional; set OPENAI_API_KEY in .env for LiteLLM container — upstream provider)
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      configurable_clientside_auth_params: &byok_auth_openai
        - api_key
        - api_base: "^https://api\\.openai\\.com/v1/?$"
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      configurable_clientside_auth_params: *byok_auth_openai

  # ── OpenRouter house slugs (#3414) ────────────────────────────────────────
  # digiquant pins and dogfood send unprefixed OpenRouter ids (no openrouter/).
  # LiteLLM maps each model_name to openrouter/<slug>. Prefixed aliases remain
  # so leftover openrouter/… callers still resolve. No default marketplace.
  # BYOK: extra_body api_key is allowed; api_base is regex-pinned to the
  # catalog host for this group (OpenRouter), never an arbitrary upstream (#3605).
  # Do not add router fallbacks here (strict routing; see litellm.dev.yaml).
  - model_name: openai/gpt-oss-20b:free
    litellm_params: &or_gpt_oss_20b_free
      model: openrouter/openai/gpt-oss-20b:free
      api_key: os.environ/OPENROUTER_API_KEY
      configurable_clientside_auth_params: &byok_auth_openrouter
        - api_key
        - api_base: "^https://openrouter\\.ai/api/v1/?$"
  - model_name: openrouter/openai/gpt-oss-20b:free
    litellm_params: *or_gpt_oss_20b_free
  # digithings.ai public picker cheap/free OSS (#3777) — OpenRouter until CI overlay merge
  - model_name: openai/gpt-oss-20b
    litellm_params: &or_openai_gpt_oss_20b
