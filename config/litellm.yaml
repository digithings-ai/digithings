router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true
  # Proxy-side response cache (local disk-backed by default). BYOK requests
  # must send extra_body.cache {no-cache, no-store} so this layer cannot
  # reuse one principal's completion for another (#3605). digigraph also has
  # in-process DIGI_LLM_CACHE_* — see digigraph/ARCHITECTURE.md and config/MODELS.md.
  cache: true
  cache_params:
    type: local
    ttl: 3600
  num_retries: 2
  request_timeout: 120

general_settings: {}
