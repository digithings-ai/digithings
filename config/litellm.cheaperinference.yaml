# LiteLLM overlay — hosted Cheaper Inference (digillm house default when keyed).
# Merge when CHEAPERINFERENCE_API_KEY is set (stack entrypoint does this automatically).
# Distinct from self-hosted OmniRoute (litellm.omniroute.yaml / OMNIROUTE_*).
#
# Merge over config/litellm.yaml with:
#   python scripts/merge_litellm_cheaperinference.py > /tmp/litellm.merged.yaml
# then LITELLM_CONFIG=/tmp/litellm.merged.yaml (or pass --config).
# Force OpenRouter: DIGI_HOUSE_UPSTREAM=openrouter. See docs/providers/cheaperinference.md.
#
# House pins keep OpenRouter-style model_name keys (digiquant_models.yaml).
# CI catalog uses bare ids — map only models that exist there.
# BYOK passthrough is regex-pinned to the CI host (never a bare api_base, #3605).
# Dead OpenRouter house routes (maverick, grok-4.3/4.6, claude-sonnet-5,
# perplexity/sonar, and their :online aliases) were retired from litellm.yaml
# in #3788 — they were billable but unused by digiquant pools. Remaining
# :online / unmapped pins fail closed under CI-only house (#3660).

model_list:
  - model_name: deepseek/deepseek-v4.1-flash
    litellm_params: &ci_ds_v41_flash
      model: openai/deepseek-v4.1-flash
      api_base: os.environ/CHEAPERINFERENCE_API_BASE
      api_key: os.environ/CHEAPERINFERENCE_API_KEY
      configurable_clientside_auth_params:
        - api_key
        - api_base: "^https://api\\.cheaperinference\\.com/v1/?$"
  - model_name: openrouter/deepseek/deepseek-v4.1-flash
    litellm_params: *ci_ds_v41_flash

