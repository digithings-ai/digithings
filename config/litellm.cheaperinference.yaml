# LiteLLM overlay — hosted Cheaper Inference (digillm house default when keyed).
# Merge when CHEAPERINFERENCE_API_KEY is set (stack entrypoint does this automatically).
# Distinct from self-hosted OmniRoute (litellm.omniroute.yaml / OMNIROUTE_*).
#
# Merge over config/litellm.yaml with:
#   python scripts/merge_litellm_cheaperinference.py > /tmp/litellm.merged.yaml
# then LITELLM_CONFIG=/tmp/litellm.merged.yaml (or pass --config).
# Force OpenRouter: DIGI_HOUSE_UPSTREAM=openrouter. See docs/providers/cheaperinference.md.
#
# House pins keep OpenRouter-style model_name keys (digiquant_models.yaml).
# CI catalog uses bare ids — map only models that exist there.
# Stay on OpenRouter (default litellm.yaml): meta-llama/*, perplexity/sonar,
# all :online variants, x-ai/grok-4.3|4.6 (CI has grok-4.5 only), anthropic/*
# (quality bake-off required before cutting).

model_list:
  - model_name: deepseek/deepseek-v4-flash
    litellm_params: &ci_ds_v4_flash
      model: openai/deepseek-v4-flash
      api_base: os.environ/CHEAPERINFERENCE_API_BASE
      api_key: os.environ/CHEAPERINFERENCE_API_KEY
      configurable_clientside_auth_params: ["api_key", "api_base"]
  - model_name: openrouter/deepseek/deepseek-v4-flash
    litellm_params: *ci_ds_v4_flash

  - model_name: deepseek/deepseek-v4-pro
    litellm_params: &ci_ds_v4_pro
      model: openai/deepseek-v4-pro
      api_base: os.environ/CHEAPERINFERENCE_API_BASE
      api_key: os.environ/CHEAPERINFERENCE_API_KEY
      configurable_clientside_auth_params: ["api_key", "api_base"]
  - model_name: openrouter/deepseek/deepseek-v4-pro
    litellm_params: *ci_ds_v4_pro

  - model_name: google/gemini-3.7-flash
    litellm_params: &ci_gem_37_flash
      model: openai/gemini-3.7-flash
      api_base: os.environ/CHEAPERINFERENCE_API_BASE
      api_key: os.environ/CHEAPERINFERENCE_API_KEY
      configurable_clientside_auth_params: ["api_key", "api_base"]
  - model_name: openrouter/google/gemini-3.7-flash
    litellm_params: *ci_gem_37_flash

  - model_name: openai/gpt-5.6-luna
    litellm_params: &ci_gpt56_luna
      model: openai/gpt-5.6-luna
      api_base: os.environ/CHEAPERINFERENCE_API_BASE
      api_key: os.environ/CHEAPERINFERENCE_API_KEY
      configurable_clientside_auth_params: ["api_key", "api_base"]
  - model_name: openrouter/openai/gpt-5.6-luna
    litellm_params: *ci_gpt56_luna

  - model_name: openai/gpt-5.6-sol
    litellm_params: &ci_gpt56_sol
      model: openai/gpt-5.6-sol
      api_base: os.environ/CHEAPERINFERENCE_API_BASE
      api_key: os.environ/CHEAPERINFERENCE_API_KEY
      configurable_clientside_auth_params: ["api_key", "api_base"]
  - model_name: openrouter/openai/gpt-5.6-sol
    litellm_params: *ci_gpt56_sol
