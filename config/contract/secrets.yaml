# digithings secrets contract.
#
# ONE contract, TWO deployment variants. The self-hosted reference stack and the
# Cloudflare-hosted production stack use the SAME variable names; a variant only
# supplies different values. Names are therefore the contract, values never are.
#
# THIS FILE CARRIES NAMES AND SHAPES ONLY. It must never contain a secret value,
# a base64 blob, or a placeholder that looks like one. `dt secrets render` reads
# this file to know WHAT to resolve and renders values into a gitignored `.dev.vars`.
#
# Consumers were measured in the source tree (not from documentation), so every
# entry names at least one file that actually reads the variable.
#
# See docs/adr/0029-secrets-management.md for the vendor decision (still Proposed,
# not adopted) and docs/ops/SECRETS_INVENTORY.md for the per-name inventory.

version: 1
name: digithings-secrets-contract

contract:
  # Both variants implement this contract; parity CI fails when they drift.
  variants: [selfhost, hosted]
  # `dt secrets render` defaults to this variant.
  default_variant: selfhost
  # Rendered output. Never committed, never echoed to a terminal.
  output: .dev.vars
  output_mode: "0600"
  # Keychain item namespace read on macOS.
  keychain_service_prefix: "digithings/"

# Source vocabulary. A test asserts every entry uses one of these keys.
sources:
  keychain:
    renderable: true
    description: >-
      Read from the operator's credential store. macOS reads the generic password
      `security find-generic-password -s digithings/<NAME> -w`. Linux/OSS falls back
      to `pass show digithings/<NAME>`, then the 1Password CLI, then an interactive
      prompt. No vendor SDK is imported: every store is reached by shelling out to
      its CLI, per docs/adr/0029-secrets-management.md.
  generated-local:
    renderable: true
    description: >-
      Generated on this machine by `dt secrets render`. Never read from a
      production store. An entry declares HOW in exactly one of three ways:
      `generate` is an argv list whose stdout is the value; `generate_field`
      names the KEY of one `KEY="value"` line in that output; `generate_kind:
      template` renders `template` with `__random_hex_N__` placeholders replaced
      by N random hex characters. An entry that must EQUAL another secret uses
      `same_as` and never generates its own value.
  operator-prompt:
    renderable: true
    description: >-
      Supplied by the operator at render time. Used for per-workspace or
      locally-issued credentials that are not a shared digithings secret.
  github-secret:
    renderable: false
    description: >-
      Lives in GitHub Actions secrets. The renderer never reads it; a hosted-only
      secret has no local value by design.
  cloudflare-secret:
    renderable: false
    description: >-
      Lives as a Cloudflare Worker secret. Write-only via `wrangler secret put`;
      `wrangler secret list` returns names and types, never values. The renderer
      never reads it.

secrets:
  - name: AUTH_SECRET
    consumers: [digichat, digichat-cloudflare]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-base64", "32"]
    notes: >-
      NextAuth signing secret. docker-compose requires it non-empty
      (${AUTH_SECRET:?}). The hosted copy is also a digichat Worker secret and is
      therefore independent of the local one.


  - name: AZURE_SEARCH_API_KEY
    consumers: [digisearch]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: Paired with AZURE_SEARCH_ENDPOINT; used by the Azure AI Search index backend.


  - name: BYOK_API_KEY
    consumers: [digiquant]
    required_in: [selfhost]
    source: operator-prompt
    renderable: true
    notes: >-
      Per-workspace BYOK overlay key sealed by digiquant. Not a shared digithings
      credential, so it is never stored in the credential store for everyone.


  - name: CHEAPERINFERENCE_API_KEY
    consumers: [digiquant-runner]
    required_in: [hosted]
    source: keychain
    renderable: true


  - name: CLOUDFLARE_ACCOUNT_ID
    consumers: [digiquant-runner, digithings-cron, digithings-stack-cloudflare]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: An identifier, not a credential, but it ships as a secret on the deploy paths.


  - name: CLOUDFLARE_API_TOKEN
    consumers: [digiquant-runner, digithings-cron]
    required_in: [hosted]
    source: keychain
    renderable: true


  - name: CLOUDFLARE_EMAIL_API_TOKEN
    consumers: [digiquant-runner]
    required_in: [hosted]
    source: keychain
    renderable: true


  - name: CORE_POSTGRES_URI
    consumers: [digithings-cron, digiquant-runner]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: >-
      The self-hosted variant uses a local connection string instead, so this entry
      is hosted-only by design.


  - name: CORE_SUPABASE_SERVICE_KEY
    consumers: [digiquant, digithings-cron, digiquant-runner]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    generate: ["supabase", "status", "-o", "env"]
    generate_field: SERVICE_ROLE_KEY
    notes: >-
      Canonical name. SUPABASE_SERVICE_ROLE_KEY was retired; do not reintroduce it.
      On self-host the value is the local Supabase instance's OWN service_role key
      and must never be copied from production.


  - name: CRON_KICK_SECRET
    consumers: [digithings-cron]
    required_in: [hosted]
    source: keychain
    renderable: true


  - name: D1_API_TOKEN
    consumers: [digisearch, digithings-stack-cloudflare]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: Cloudflare D1 binding token.


  - name: DIGICHAT_EMBED_TOKEN
    consumers: [digichat]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-hex", "32"]
    notes: Read by the digichat deploy-config loader and the CLI's bin entry.


  - name: DIGICHAT_POSTGRES_PASSWORD
    consumers: [digichat, digichat-db]
    required_in: [selfhost]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-hex", "24"]
    notes: >-
      Local database password. .env.example shows the compose default literal
      `digichat`; the rendered value replaces it, so no local stack ships the default.


  - name: DIGICLAW_DIGIKEY_API_KEY
    consumers: [digiclaw, heartbeat]
    required_in: [selfhost, hosted]
    source: operator-prompt
    renderable: true
    notes: >-
      A `dgk_live_` digikey API key. On self-host it is minted by the LOCAL digikey
      during seeding and must never be copied from production.


  - name: DIGIGRAPH_UPSTREAM_API_KEY
    consumers: [digichat]
    required_in: [selfhost, hosted]
    source: operator-prompt
    renderable: true
    notes: >-
      The digichat-to-digigraph upstream key. On self-host the LOCAL digikey mints
      it during seeding; on hosted it is a digichat Worker secret.


  - name: DIGIKEY_ADMIN_TOKEN
    consumers: [digithings-stack-cloudflare, digithings-web]
    required_in: [selfhost, hosted]
    source: keychain
    renderable: true


  - name: DIGIKEY_BFF_TOKEN
    consumers: [digichat-cloudflare, digichat]
    required_in: [selfhost, hosted]
    source: keychain
    renderable: true


  - name: DIGIKEY_DATABASE_URL
    consumers: [digikey]
    required_in: [selfhost]
    source: generated-local
    renderable: true
    generate_kind: template
    template: "postgresql://digikey:__random_hex_24__@127.0.0.1:54329/digikey"
    notes: >-
      Local digikey database connection string. The password component is generated
      here, so it is never the production one.


  - name: DIGIKEY_LITELLM_PROXY_KEY
    consumers: [digikey, digichat]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    same_as: LITELLM_MASTER_KEY
    notes: >-
      Carries the SAME value as LITELLM_MASTER_KEY on both variants, so the two
      services agree on proxy auth. It does not generate a second value.


  - name: DIGIKEY_PRIVATE_KEY_PEM
    consumers: [digithings-stack-cloudflare]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: >-
      Stable RS256 signing key, multiline PEM. Hosted-only: the self-hosted variant
      sets the non-secret flag DIGIKEY_ALLOW_EPHEMERAL_KEY=1 (declared in
      .env.example) so digikey generates an ephemeral key and rotates JWKS on restart.
      This key has no rollover path, which is why it is not auto-generated here.


  - name: DIGIQUANT_VAULT_MASTER_KEY
    consumers: [digiquant]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-base64", "32"]
    notes: Base64 of exactly 32 raw bytes; wraps the digiquant vault envelope.


  - name: DIGISEARCH_MONITORS_DB
    consumers: [digisearch]
    required_in: [selfhost]
    source: generated-local
    renderable: true
    generate_kind: template
    template: "postgresql://digivault:__random_hex_24__@127.0.0.1:54329/digivault"
    notes: >-
      Connection string for the digisearch monitors store. The password component is
      generated here, so it is never the production one.


  - name: DIGISEARCH_SEED_API_KEY
    consumers: [digisearch, scripts]
    required_in: [selfhost]
    source: operator-prompt
    renderable: true
    notes: >-
      A `dgk_live_` key with the digisearch:ingest scope, used to seed the local
      index. Minted by the LOCAL digikey; never taken from production.


  - name: E2E_BEARER_TOKEN
    consumers: [digithings-ci]
    required_in: [selfhost]
    source: operator-prompt
    renderable: true
    notes: A digikey JWT used by the end-to-end workflow against the local stack.


  - name: EXA_API_KEY
    consumers: [digisearch]
    required_in: [selfhost, hosted]
    source: keychain
    renderable: true


  - name: EXA_MONITOR_WEBHOOK_SECRET
    consumers: [digisearch]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-hex", "32"]
    notes: >-
      Shared secret between digisearch monitors and the Exa webhook. On hosted the
      matching value is configured in the Exa account, so a local render cannot
      replace it there.


  - name: GH_DISPATCH_TOKEN
    consumers: [digithings-cron, digithings-ci]
    required_in: [hosted]
    source: keychain
    renderable: true


  - name: GLOOMBERB_SESSION_COOKIE
    consumers: [digithings-stack-cloudflare]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: >-
      Owned by whoever deploys the stack; explicitly NOT a shared digithings
      credential. See docs/ops/gloomberb-session-cookie.md.


  - name: GRAFANA_ADMIN_PASSWORD
    consumers: [grafana]
    required_in: [selfhost]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-base64", "24"]
    notes: docker-compose requires it non-empty (${GRAFANA_ADMIN_PASSWORD:?}).


  - name: LITELLM_MASTER_KEY
    consumers: [litellm, digikey, digillm, digithings-stack-cloudflare]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-base64", "32"]
    notes: >-
      Shared with DIGIKEY_LITELLM_PROXY_KEY. On hosted it is also a Worker secret, so
      the local value and the hosted value are independent.


  - name: LITELLM_PROXY_API_KEY
    consumers: [digigraph, digillm, digithings-stack-cloudflare]
    required_in: [selfhost, hosted]
    source: generated-local
    renderable: true
    generate: ["openssl", "rand", "-base64", "32"]
    notes: Client-side proxy key presented by digigraph and digillm to LiteLLM.


  - name: MCP_EDGE_KEY
    consumers: [dashboard-api]
    required_in: [selfhost, hosted]
    source: keychain
    renderable: true


  - name: OPENROUTER_API_KEY
    consumers: [digillm, digichat-cloudflare, digithings-ci]
    required_in: [selfhost, hosted]
    source: keychain
    renderable: true


  - name: RUNNER_AUTH_TOKEN
    consumers: [digiquant-runner]
    required_in: [hosted]
    source: keychain
    renderable: true


  - name: STRIPE_SECRET_KEY
    consumers: [digiquant]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: >-
      Hosted only, because no local stack takes a payment.


  - name: XAI_API_KEY
    consumers: [digillm, litellm]
    required_in: [selfhost, hosted]
    source: keychain
    renderable: true


  - name: ZAMMAD_API_TOKEN
    consumers: [digithings-stack-cloudflare, digichat]
    required_in: [hosted]
    source: keychain
    renderable: true
    notes: >-
      Bearer for the live Zammad tenant, so it is hosted-only and never rendered
      into a local stack.
