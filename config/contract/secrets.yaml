# Config contract — secrets manifest (epic DIG-2758 §4).
#
# NAMES ONLY. Values live in macOS Keychain (prod), are generated locally
# (local-only keys), or are put via workflows — NEVER in this repo.
# S5 (`dt secrets render`) resolves `source` into .dev.vars / .env.local.
# Exact Keychain item names are S5's scope; `keychain` below means the
# `security find-generic-password -s digithings/<name>` convention.
#
# required_in: selfhost | hosted | profile:<compose profile>. A secret needed
# in a variant MUST be rendered for that variant; absence fails closed.

secrets:
  # ── Worker secrets (wrangler secret put) ──────────────────────────
  - name: AUTH_SECRET
    consumers: [digithings-digichat worker, digithings-stack worker, compose digichat]
    required_in: [selfhost, hosted]
    source: keychain
  - name: DIGICHAT_EMBED_TENANTS
    consumers: [digithings-digichat worker, digithings-stack worker]
    required_in: [hosted]
    source: keychain
  - name: DIGIGRAPH_INTERNAL_URL
    consumers: [digithings-digichat worker]
    required_in: [hosted]
    source: keychain
    note: URL, but secret-managed (internal topology).
  - name: DIGIKEY_URL
    consumers: [digithings-digichat worker, compose digichat, compose heartbeat]
    required_in: [selfhost, hosted]
    source: keychain
    note: Selfhost default http://digikey:8005 comes from shared_env, not from a value here.
  - name: DIGIKEY_BFF_TOKEN
    consumers: [digithings-digichat worker, compose digichat]
    required_in: [selfhost, hosted]
    source: keychain
  - name: DIGICHAT_PLAN_PROOF_SECRET
    consumers: [digithings-digichat worker, digithings-stack worker]
    required_in: [hosted]
    source: keychain
  - name: DIGICHAT_MONITOR_TOKENS
    consumers: [digithings-digichat worker]
    required_in: [hosted]
    source: keychain
    note: Optional; fails open.
  - name: DIGICHAT_DASHBOARD_SUPABASE_URL
    consumers: [digithings-digichat worker]
    required_in: [hosted]
    source: keychain
    note: Legacy forward; deleted post-deploy (canonical SUPABASE_URL in [vars]).
  - name: DIGICHAT_DASHBOARD_SUPABASE_ANON_KEY
    consumers: [digithings-digichat worker]
    required_in: [hosted]
    source: keychain
  - name: SUPABASE_SERVICE_ROLE_KEY
    consumers: [dashboard-api worker]
    required_in: [hosted]
    source: keychain
  - name: SUPABASE_ANON_KEY
    consumers: [digithings-stack worker]
    required_in: [hosted]
    source: keychain
  - name: NEXTAUTH_SECRET
    consumers: [digitrace-langfuse worker]
    required_in: [hosted]
    source: keychain
  - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
    consumers: [digitrace-langfuse worker]
    required_in: [hosted]
    source: keychain
  - name: R2_ACCOUNT_ID
    consumers: [digithings-stack worker, digiquant-runner worker]
    required_in: [hosted]
    source: keychain
  - name: R2_ACCESS_KEY_ID
    consumers: [digithings-stack worker, digiquant-runner worker]
    required_in: [hosted]
    source: keychain
  - name: R2_SECRET_ACCESS_KEY
    consumers: [digithings-stack worker, digiquant-runner worker]
    required_in: [hosted]
    source: keychain
  - name: R2_BUCKET
    consumers: [digithings-stack worker, digiquant-runner worker]
    required_in: [hosted]
    source: keychain
    note: Non-secret strictly, but put alongside the R2 credentials.
  - name: MCP_EDGE_KEY
    consumers: [digithings-stack worker]
    required_in: [hosted]
    source: keychain
    note: Key-gates x-digi-mcp-key on the auth-exempt Worker surface.
  - name: GH_DISPATCH_TOKEN
    consumers: [digithings-cron worker]
    required_in: [hosted]
    source: keychain
  - name: CRON_KICK_SECRET
    consumers: [digithings-cron worker]
    required_in: [hosted]
    source: keychain
    note: Optional; enables POST /kick and GET /runs/:id.
  - name: RUNNER_AUTH_TOKEN
    consumers: [digithings-cron worker, digiquant-runner worker]
    required_in: [hosted]
    source: keychain
  - name: CORE_POSTGRES_URI
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: keychain
  - name: CORE_SUPABASE_URL
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: keychain
  - name: CORE_SUPABASE_SERVICE_KEY
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: keychain
  - name: CLOUDFLARE_EMAIL_API_TOKEN
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: keychain
    note: execution-cron-check probe only.
  - name: CLOUDFLARE_ACCOUNT_ID
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: keychain
    note: execution-cron-check probe only.
  - name: NOTIFY_FROM
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: keychain
    note: execution-cron-check probe only.
  # Runner keys put by workflow (Phase 3 Task 7), never by hand:
  - name: DIGIQUANT_DIGIKEY_API_KEY
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: workflow:.github/workflows/sync-digiquant-runner-digikey-secret.yml
  - name: LANGFUSE_SECRET_KEY
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: workflow:.github/workflows/sync-digiquant-runner-digikey-secret.yml
  - name: LANGFUSE_PUBLIC_KEY
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: workflow:.github/workflows/sync-digiquant-runner-digikey-secret.yml
  - name: LANGFUSE_BASE_URL
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: workflow:.github/workflows/sync-digiquant-runner-digikey-secret.yml
  - name: DIGITRACE_LANGFUSE_OTLP_ENDPOINT
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: workflow:.github/workflows/sync-digiquant-runner-digikey-secret.yml
  - name: DIGI_OTEL_HEADERS
    consumers: [digiquant-runner worker]
    required_in: [hosted]
    source: workflow:.github/workflows/sync-digiquant-runner-digikey-secret.yml

  # ── Compose / local-stack secrets ─────────────────────────────────
  - name: DIGIKEY_PRIVATE_KEY_PEM
    consumers: [compose digikey]
    required_in: [hosted]
    source: keychain
    note: Prod default requires it (JWKS stable across restarts). Local dev
      opts out explicitly with DIGIKEY_ALLOW_EPHEMERAL_KEY=1.
  - name: DIGIKEY_ADMIN_TOKEN
    consumers: [compose digikey]
    required_in: [selfhost, hosted]
    source: keychain
  - name: DIGIKEY_DATABASE_URL
    consumers: [compose digikey]
    required_in: [selfhost]
    source: generated-local
    note: Selfhost default sqlite:////data/digikey.db. Hosted value is S5's scope.
  - name: LITELLM_MASTER_KEY
    consumers: [compose litellm, compose digigraph]
    required_in: [selfhost, hosted]
    source: keychain
    note: Optional while the loopback stack runs no-auth (dev sentinel sk-no-key-required).
  - name: LITELLM_PROXY_API_KEY
    consumers: [compose digigraph]
    required_in: [selfhost, hosted]
    source: keychain
    note: Falls back to LITELLM_MASTER_KEY then OPENAI_API_KEY.
  - name: DIGICHAT_POSTGRES_PASSWORD
    consumers: [compose digichat-db, compose digichat]
    required_in: [profile:digichat]
    source: generated-local
    note: Compose default `digichat`; generate for any shared deployment.
  - name: DIGICLAW_DIGIKEY_API_KEY
    consumers: [compose heartbeat]
    required_in: [profile:heartbeat]
    source: keychain
  - name: DIGIGRAPH_UPSTREAM_API_KEY
    consumers: [compose digichat]
    required_in: [selfhost, hosted]
    source: keychain
  - name: OMNIROUTE_AUTH_PASSWORD
    consumers: [compose omniroute-auth-guard, compose omniroute]
    required_in: [profile:omniroute]
    source: operator
    note: No safe placeholder (compose-validated); enforced at profile start, never committed.
  - name: OMNIROUTE_API_KEY
    consumers: [compose omniroute]
    required_in: [profile:omniroute]
    source: operator
  - name: GRAFANA_ADMIN_PASSWORD
    consumers: [compose grafana]
    required_in: [profile:observability]
    source: operator
    note: Grafana refuses to start without it (${...:?} in compose).
  - name: ZAMMAD_API_TOKEN
    consumers: [compose zammad-mcp]
    required_in: [profile:zammad-mcp]
    source: operator
    note: Arrives via .env env_file only; raw token or full `Token token=<x>` value.

  # ── Upstream provider keys (BYOK, operator-owned, all optional) ────
  - name: OPENROUTER_API_KEY
    consumers: [compose litellm]
    required_in: []
    source: operator
  - name: CHEAPERINFERENCE_API_KEY
    consumers: [compose litellm]
    required_in: []
    source: operator
  - name: XAI_API_KEY
    consumers: [compose litellm, digiquant research]
    required_in: []
    source: operator
  - name: OPENAI_API_KEY
    consumers: [compose litellm]
    required_in: []
    source: operator
  - name: OLLAMA_API_KEY
    consumers: [compose litellm]
    required_in: []
    source: operator
