ports:
- name: digigraph
  container_port: 8000
  host_port: 8000
  note: public route graph.digithings.ai
- name: digiquant
  container_port: 8001
  host_port: 8001
- name: digisearch
  container_port: 8002
  host_port: 8002
  note: public route search.digithings.ai; binds 0.0.0.0 in-container so the Worker can proxy (#4071)
- name: digitrace
  container_port: 8003
  host_port: 8003
- name: digivault
  container_port: 8004
  host_port: 8004
- name: digikey
  container_port: 8005
  host_port: 8005
  note: public route key.digithings.ai
- name: digillm
  container_port: 4000
  host_port: 4000
  note: network alias litellm (OPENAI_API_BASE=http://litellm:4000/v1)
- name: ollama
  container_port: 11434
  host_port: 11435
  note: host port is remapped
- name: digichat
  container_port: 3000
  host_port: 3005
  note: host port is DIGICHAT_PUBLISH_PORT, default 3005
- name: digichat-db
  container_port: 5432
  host_port: 5433
  note: host port is remapped
- name: digisearch-mcp
  container_port: 8765
  host_port: 8765
- name: digivault-mcp
  container_port: 8769
  host_port: 8769
- name: zammad-mcp
  container_port: 8770
  host_port: 8770
- name: searxng
  container_port: 8080
  host_port: 8080
- name: omniroute
  container_port: 20128
  host_port: 20128
- name: prometheus
  container_port: 9090
  host_port: 9090
- name: grafana
  container_port: 3000
  host_port: 3001
  note: host port is remapped
- name: otel-collector
  container_port: 4317
  host_port: 4317
  note: gRPC 4317 and HTTP 4318
- name: digiquant-mcp-container
  container_port: 8767
  host_port: null
  note: FastMCP inside the stack Worker, not published
