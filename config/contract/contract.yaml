  worker: digithings-digichat, digithings-stack
  required: true
- name: DIGIGRAPH_INTERNAL_URL
  worker: digithings-digichat, digithings-stack
  required: true
- name: DIGIKEY_URL
  worker: digithings-digichat, digithings-stack
  required: true
- name: DIGICHAT_PLAN_PROOF_SECRET
  worker: digithings-digichat, digithings-stack
  required: true
- name: DIGICHAT_MONITOR_TOKENS
  worker: digithings-digichat
  required: false
bindings:
- worker: digiquant-runner
  type: container
  class_name: DigiQuantRunnerContainer
  image: ../../infra/docker/Dockerfile.digiquant-runner
  max_instances: 1
  instance_type: standard-1
  source: apps/digiquant-runner/wrangler.toml
- worker: digiquant-runner
  type: durable_object
  name: RUNNER_CONTAINER
  class_name: DigiQuantRunnerContainer
  source: apps/digiquant-runner/wrangler.toml
- worker: digiquant-runner
  type: r2_bucket
  name: ARCHIVE
  bucket_name: digithings-archive
  source: apps/digiquant-runner/wrangler.toml
- worker: digithings-cron
  type: durable_object
  name: BACKFILL_LEDGER
  class_name: BackfillLedger
  source: apps/digithings-cron/wrangler.toml
# DIG-4384 cron-tick claim ledger: one instance, each tick claims its own slot.
- worker: digithings-cron
  type: durable_object
  name: START_COUNTER
  class_name: StartCounter
  source: apps/digithings-cron/wrangler.toml
- worker: digithings-cron
  type: service
  name: RUNNER
  service: digiquant-runner
  source: apps/digithings-cron/wrangler.toml
- worker: digithings-cron
  type: service
  name: TWELVEX_RUNNER
  service: twelvex-runner
  source: apps/digithings-cron/wrangler.toml
# DIG-4487: two slots, so a deploy can start the new instance while the
# previous id's instance drains. Mirrors apps/digichat-cloudflare/wrangler.toml.
- worker: digithings-digichat
  type: container
  class_name: DigiChatContainer
  image: ../../infra/docker/Dockerfile.digichat-cloudflare
  max_instances: 2
  instance_type: null
  source: apps/digichat-cloudflare/wrangler.toml
- worker: digithings-digichat
  type: durable_object
  name: DIGICHAT
  class_name: DigiChatContainer
  source: apps/digichat-cloudflare/wrangler.toml
- worker: digithings-digichat
  type: kv_namespace
  name: DIGICHAT_TENANTS_KV
  source: apps/digichat-cloudflare/wrangler.toml
- worker: digithings-stack
  type: container
  class_name: DigiStackContainer
  image: ../../infra/docker/Dockerfile.digithings-stack-cloudflare
  max_instances: 5
  instance_type: standard-2
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: durable_object
  name: STACK
  class_name: DigiStackContainer
  source: apps/digithings-stack-cloudflare/wrangler.toml
# DIG-2913 (#6466): the Worker-native market-data MCP that replaced the container
# route. Its row was missing, so check_contract.py reported this binding as
# unmapped and tests/config/test_config_contract.py went red on develop.
- worker: digithings-stack
  type: durable_object
  name: DIGIQUANT_MCP
  class_name: DigiQuantMcpAgent
  source: apps/digithings-stack-cloudflare/wrangler.toml
# A Worker's binding to itself: the digikey JWKS on key.digithings.ai is served by
# this Worker, so a plain fetch would re-enter its own public route. Same missing
# row as DIGIQUANT_MCP above.
- worker: digithings-stack
  type: service
  name: DIGIKEY_SELF
  service: digithings-stack
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: r2_bucket
  name: MARKET_DATA
  bucket_name: digithings-archive
  source: apps/digithings-stack-cloudflare/wrangler.toml
# DIG-2657 / ADR-0036: the OTLP/HTTP ingest path. The receiver writes the queue,
# the consumer writes the archive, the index and the aggregates.
- worker: digitrace-ingest
  type: r2_bucket
  name: ARCHIVE
  bucket_name: digitrace-archive
  source: apps/digitrace-ingest/wrangler.toml
- worker: digitrace-ingest
  type: kv_namespace
  name: INGEST_TOKENS
  source: apps/digitrace-ingest/wrangler.toml
- worker: digitrace-ingest
  type: queue
  name: INGEST_QUEUE
  queue: digitrace-ingest
  dead_letter_queue: digitrace-ingest-dlq
  max_retries: 5
  source: apps/digitrace-ingest/wrangler.toml
- worker: digitrace-ingest
  type: analytics_engine_dataset
  name: ANALYTICS
  dataset: digitrace_ingest
  source: apps/digitrace-ingest/wrangler.toml
# twelvex-runner has no public hostname: digithings-cron reaches it through the
# TWELVEX_RUNNER service binding, and the container starts per request.
- worker: twelvex-runner
  type: container
  class_name: TwelveXRunnerContainer
  image: ../../infra/docker/Dockerfile.twelvex-runner
  max_instances: 1
  instance_type: basic
  source: apps/twelvex-runner/wrangler.toml
- worker: twelvex-runner
  type: durable_object
  name: TWELVEX_CONTAINER
  class_name: TwelveXRunnerContainer
  source: apps/twelvex-runner/wrangler.toml
# DIG-2895 data API. The D1 database is a LOCAL placeholder id (no deploy, no
# routes, no remote database); the binding exists so the parity contract can see
# the name. A remote database_id is a cutover step and needs Chris's approval.
- worker: digidata-api
  type: d1_database
  name: TWELVEX_DB
  database_name: twelvex
  source: apps/digidata-api/wrangler.toml
# Daily corpus index. The KV id in wrangler.toml is a placeholder. The live
# namespace id stays out of this repo. No production deploy workflow.
- worker: corpus-index
  type: kv_namespace
  name: CORPUS_INDEX_KV
  source: apps/corpus-index/wrangler.toml
# DIG-3759 tenant config. Recorded by binding NAME only, never the namespace
# id: the id is a Cloudflare account resource, not a surface name, and the
# parity gate records names and kinds only. Namespace-id pinning, if wanted
# later, belongs in the deploy gate, not the parity baseline.
- worker: digithings-stack
  type: kv_namespace
  name: TENANT_CONFIG
  source: apps/digithings-stack-cloudflare/wrangler.toml
