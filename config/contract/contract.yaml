- name: DIGICHAT_ARTIFACT_CONVERSATION
  description: >-
    Conversation an oversized Zammad retrieval is filed under (DIG-2785).
    Empty by default and honestly so - the conversation is per-session, so
    no static default can name a live one. With it unset the tools render rows in full.
  secret: false
  sources:
    wrangler_workers: []
    compose_files:
    - docker-compose.yml
    env_example_files: []
    compose_literal:
    - DIGICHAT_ARTIFACT_CONVERSATION
- name: DIGICHAT_ARTIFACT_GRANT
  description: >-
    Bearer grant the zammad-mcp container presents to the artifact-ingest
    door (DIG-2785). Names one conversation and authorises one write; it is
    not an object-store key and not a database credential. Empty until a
    conversation issues one. Issued per conversation, so no static default can name a live one.
  secret: true
  sources:
    wrangler_workers: []
    compose_files:
    - docker-compose.yml
    env_example_files: []
    compose_literal:
    - DIGICHAT_ARTIFACT_GRANT
- name: DIGICHAT_ARTIFACT_INGEST_URL
  description: >-
    DigiChat artifact-ingest door the zammad-mcp container posts an oversized
    retrieval to (DIG-2785). In-network URL: service name plus the digichat
    container port, same shape as DIGIGRAPH_INTERNAL_URL. Oversized retrievals go to the artifact store instead of a spool in the caller.
  secret: false
  sources:
    wrangler_workers: []
    compose_files:
    - docker-compose.yml
    env_example_files: []
    compose_literal:
    - DIGICHAT_ARTIFACT_INGEST_URL
- name: DIGICHAT_ALLOW_LOCAL_EMBED_PARENTS
  description: Allow localhost parents to embed digichat (local profile-a bundle override only).
  secret: false
  sources:
    wrangler_workers: []
    compose_files: []
    env_example_files: []
    compose_literal:
    - DIGICHAT_ALLOW_LOCAL_EMBED_PARENTS
  compose_literal_files:
