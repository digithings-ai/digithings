bindings:
- worker: digiquant-runner
  type: container
  class_name: DigiQuantRunnerContainer
  image: ../../Dockerfile.digiquant-runner
  max_instances: 1
  instance_type: standard-2
  source: apps/digiquant-runner/wrangler.toml
- worker: digiquant-runner
  type: durable_object
  name: RUNNER_CONTAINER
  class_name: DigiQuantRunnerContainer
  source: apps/digiquant-runner/wrangler.toml
- worker: digiquant-runner
  type: r2_bucket
  name: ARCHIVE
  bucket_name: digithings-archive
  source: apps/digiquant-runner/wrangler.toml
- worker: digithings-cron
  type: durable_object
  name: BACKFILL_LEDGER
  class_name: BackfillLedger
  source: apps/digithings-cron/wrangler.toml
- worker: digithings-cron
  type: service
  name: RUNNER
  service: digiquant-runner
  source: apps/digithings-cron/wrangler.toml
- worker: digithings-digichat
  type: container
  class_name: DigiChatContainer
  image: ../../Dockerfile.digichat-cloudflare
  max_instances: 5
  instance_type: null
  source: apps/digichat-cloudflare/wrangler.toml
- worker: digithings-digichat
  type: durable_object
  name: DIGICHAT
  class_name: DigiChatContainer
  source: apps/digichat-cloudflare/wrangler.toml
- worker: digithings-stack
  type: container
  class_name: DigiStackContainer
  image: ../../Dockerfile.digithings-stack-cloudflare
  max_instances: 5
  instance_type: standard-2
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: container
  class_name: DigiQuantMcpContainer
  image: ../../digiquant/Dockerfile.mcp
  max_instances: 1
  instance_type: standard-2
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: container
  class_name: DigiChatContainer
  image: ../../Dockerfile.digichat-cloudflare
  max_instances: 5
  instance_type: standard-2
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: durable_object
  name: STACK
  class_name: DigiStackContainer
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: durable_object
  name: MCP_STACK
  class_name: DigiQuantMcpContainer
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: durable_object
  name: DIGICHAT
  class_name: DigiChatContainer
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digithings-stack
  type: r2_bucket
  name: MARKET_DATA
  bucket_name: digithings-archive
  source: apps/digithings-stack-cloudflare/wrangler.toml
- worker: digitrace-langfuse
  type: container
  class_name: LangfuseWebContainer
  image: ../../Dockerfile.digitrace-langfuse-web
  max_instances: 2
  instance_type: standard-2
  source: apps/digitrace-langfuse/wrangler.toml
- worker: digitrace-langfuse
  type: container
  class_name: LangfuseWorkerContainer
  image: ../../Dockerfile.digitrace-langfuse-worker
  max_instances: 1
  instance_type: standard-2
  source: apps/digitrace-langfuse/wrangler.toml
- worker: digitrace-langfuse
  type: durable_object
  name: LANGFUSE_WEB
  class_name: LangfuseWebContainer
  source: apps/digitrace-langfuse/wrangler.toml
- worker: digitrace-langfuse
  type: durable_object
  name: LANGFUSE_WORKER
  class_name: LangfuseWorkerContainer
  source: apps/digitrace-langfuse/wrangler.toml
- worker: digitrace-langfuse
  type: r2_bucket
  name: LANGFUSE_EVENTS
  bucket_name: digitrace-langfuse-events
  source: apps/digitrace-langfuse/wrangler.toml
