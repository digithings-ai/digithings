secrets:
- name: DIGIKEY_DATABASE_URL
  worker: digithings-stack
  required: true
  note: a var fallback would lose every issued key and the revocation blocklist on the next instance replace
    (#4080)
- name: DIGIKEY_PRIVATE_KEY_PEM
  worker: digithings-stack
  required: true
  note: stable RS256 key; no ephemeral keys in production
- name: DIGIKEY_BFF_TOKEN
  worker: digithings-stack, digithings-digichat
  required: true
- name: DIGIKEY_ADMIN_TOKEN
  worker: digithings-stack
  required: false
- name: LITELLM_PROXY_API_KEY
  worker: digithings-stack
  required: true
- name: GROQ_API_KEY
  worker: digithings-stack
  required: false
- name: OPENROUTER_API_KEY
  worker: digithings-stack
  required: false
- name: OPENAI_API_KEY
  worker: digithings-stack
  required: false
- name: CHEAPERINFERENCE_API_KEY
  worker: digithings-stack
  required: false
- name: ZAMMAD_API_TOKEN
  worker: digithings-stack
  required: false
  note: read-only ticketing MCP
- name: GLOOMBERB_SESSION_COOKIE
  worker: digithings-stack
  required: false
  note: not a shared digithings credential; owner is the deployer
- name: R2_ACCOUNT_ID
  worker: digithings-stack, digiquant-runner
  required: true
- name: R2_BUCKET
  worker: digithings-stack, digiquant-runner
  required: true
- name: R2_ACCESS_KEY_ID
  worker: digithings-stack, digiquant-runner
  required: true
- name: R2_SECRET_ACCESS_KEY
  worker: digithings-stack, digiquant-runner
  required: true
- name: CLOUDFLARE_ACCOUNT_ID
  worker: digithings-stack, digiquant-runner
  required: true
- name: CLOUDFLARE_API_TOKEN
  worker: digithings-stack, digiquant-runner
  required: true
  note: same account as CLOUDFLARE_ACCOUNT_ID; also wrangler's own auth var, so unset it before any wrangler
    secret put
- name: D1_DATABASE_MAP
  worker: digithings-stack
  required: true
  note: tenant -> D1 id JSON
- name: SUPABASE_SERVICE_ROLE_KEY
