# MCP server registry
# Free providers are enabled by default.
# Premium providers require env vars to be set.

mcp_servers:
  openbb:
    description: "OpenBB financial data MCP server (yfinance, SEC EDGAR)"
    enabled: true
    tool_exposure_mode: summary  # Use summary mode to save context tokens
    free_providers:
      - name: yfinance
        enabled: true
      - name: sec_edgar
        enabled: true
      - name: fama_french
        enabled: true
    premium_providers:
      - name: intrinio
        enabled_if_env: INTRINIO_API_KEY
      - name: benzinga
        enabled_if_env: BENZINGA_API_KEY
      - name: polygon
        enabled_if_env: POLYGON_API_KEY
