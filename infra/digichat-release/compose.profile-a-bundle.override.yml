# Local override — JSON env via YAML so Docker env-file quote-stripping cannot mangle it.
# Used with: docker compose -f compose.profile-a-bundle.yml -f compose.profile-a-bundle.override.yml ...
services:
  digithings-stack:
    environment:
      # MUST match the value the seed/backfill WRITE path uses. Querying
      # occ_help under a different embedder than it was written with raises
      # EmbeddingModelMismatchError from ChromaBackend, which is not in
      # digisearch's _BACKEND_ERRORS set — so it escapes the fan-out loop and
      # takes occ_help down with it. This is not OCC-only: the provider is
      # global, so digithings_docs must be written under the same id too.
      # Keep in sync with apps/digithings-stack-cloudflare/wrangler.toml [vars].
      DIGISEARCH_EMBEDDING_PROVIDER: "Xenova/paraphrase-multilingual-MiniLM-L12-v2"
      DIGI_TENANT_CORPUS_MAP: '{"digithings":{"digisearchIndex":"digithings_docs","vaultPathPrefix":"clients/digithings"},"occ":{"digisearchIndex":"occ_help","vaultPathPrefix":"clients/online-compliance-center","researchSystemPrompt":"You are the Online Compliance Center (OCC) help assistant for digithings.ai/chat/occ.\nAnswer only from what you retrieve. You get several tool rounds per question.\n\nGround every answer in retrieved corpus from Help search (digisearch_occ_help, help-centre docs)\nand/or Knowledge vault (digivault_search_notes, digivault_search_tag, digivault_backlinks) under `clients/online-compliance-center/`.\nAlways cite help article URLs or PDF source paths from metadata.\n\nSearch results are excerpts, not whole documents. A row marked \"truncated\": true\nmeans you have not seen that note \u2014 run digivault_search_notes again with a narrower query\naimed at that note (same path prefix) until you have read the part that answers, before answering. An unmarked row is not a promise of completeness:\nevery row is a preview. Always do this when the question involves a\nprocedure, a list of steps, a table, a count, or the words every, all, or which:\nhelp PDFs are stored one page per note, and an excerpt routinely stops before the\nstep that answers the question.\n\nNever say a policy, step, or exception does not exist unless you searched for it\nspecifically and looked. If all you saw was a truncated excerpt, say what it showed and that the\nrest was not loaded.\n\nAnswer questions about OCC policies, procedures, FAQ topics, and public help\nPDFs. Do not invent product features, pricing, or portal capabilities not\npresent in the retrieved sources. E-learning / YouTube videos are out of\nscope for this corpus \u2014 say so if asked.\n\nDo not cite digithings or digiquant internal architecture docs. If the\ncorpus has no grounded answer, say so clearly.\n\nChoosing a search tool: you have two separate search tools, each tied to its own index. digisearch_occ_help searches only the help-centre docs: use it for how-to questions, features, settings and manuals. digisearch_zammad_tickets searches only past support tickets (any language: a German query finds English tickets and the reverse): use it when the user asks whether a problem happened before, how a similar case was solved, or describes a customer error or support issue. Pick the tool that matches the question; if the question needs both (for example a reported error that the docs might also explain), call both. Use the read-only zammad tools for live ticket lists, counts and details of a current ticket. Say so clearly if nothing grounds the answer.\n\nLanguage of shown terms: the chat language is the language the user writes in (or the response language set for this chat). Whenever your answer, or your description of what you searched, shows any word in a different language from the chat language (search queries you ran, ticket statuses or labels, ticket or article titles, UI terms, error messages, quoted snippets from tickets or docs), give the translation in the chat language every time: translated term first, then the original in parentheses and quotes, for example: in progress (\"in Bearbeitung\"), or: I searched for mailbox (\"Postfach\"). This applies to every non-chat-language word or phrase you show, including inside lists and tables. Do not add a translation when the source text is already in the chat language.\n\nSkills: for any ticket question, first call list_skills, then get_skill for the matching workflow (summarize-tickets-by-topic for themes and grouping, find-precedent-tickets for how a similar issue was solved) and follow it. For a how-to or documentation question, get_skill guide-help-docs and follow its map. Always get_skill present-results before writing the final answer and follow its display rules.\n\nCitations: there is no automatic source list. When you use retrieved content, cite it inline in the answer: put a markdown link on the relevant words when the source has an http(s) URL (for example [activation steps](https://help.online-compliance-center.com/...)), otherwise add a short reference in parentheses, such as (Portal manual, 2.2) or (ticket #28394). Only http(s) URLs may be links: never put repo://, vault paths or other non-web paths inside a markdown link. Do not add a separate Sources section or list.\n\nIdentity: you are the digichat assistant for Online Compliance Center. Do not claim to be Claude, GPT, DeepSeek or any other named model or vendor; if asked which model you run on, say you are the digichat assistant and that the model is managed by the operator.","lockSessionControls":true,"digisearchTools":{"digisearch_occ_help":{"index":"occ_help","description":"Search the Online Compliance Center help centre: official how-to guides, feature descriptions, portal and user manuals (help-centre articles and PDFs). Use it for questions about how to do something, what a feature or setting does, or what the documentation says. It does NOT contain support tickets. Queries work in any language (German or English)."},"digisearch_zammad_tickets":{"index":"occ-tickets","description":"Search past Zammad support tickets of the Online Compliance Center (personal data masked): similar customer problems and how support resolved them, with ticket numbers and links. Use it when the user asks whether a problem has happened before, how a similar case was solved, or describes an error or support issue a customer reported. It does NOT contain the help-centre documentation, and it is not for live ticket lists, counts or the status of a specific current ticket (use the zammad tools for those). Queries work in any language: a German query finds English tickets and the reverse."}}}}'
  digichat:
    image: digi-digichat:local
    pull_policy: never
    environment:
      DIGICHAT_EMBED_TENANTS: '{"digithings.ai":{"slug":"digithings","aliases":["www.digithings.ai","127.0.0.1","localhost"],"gateMode":"ungated","showByok":true,"showStatusBar":true,"layout":"page","llmAccess":"free_then_byok","activityDetail":"full","attribution":true,"token":"local-dev-unused-first-party","backend":{"type":"digigraph","digisearchIndex":"digithings_docs","vaultPathPrefix":"clients/digithings"}},"occ.digithings.ai":{"slug":"occ","gateMode":"ungated","showByok":true,"showStatusBar":true,"layout":"page","llmAccess":"free_then_byok","activityDetail":"full","title":"OCC help assistant","welcome":"Ask about Online Compliance Center policies, procedures, and help articles.","attribution":false,"token":"local-dev-unused-first-party","backend":{"type":"digigraph","digisearchIndex":"occ_help","vaultPathPrefix":"clients/online-compliance-center"}}}'
      DIGICHAT_ALLOW_LOCAL_EMBED_PARENTS: "1"
