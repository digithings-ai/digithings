# Local override — JSON env via YAML so Docker env-file quote-stripping cannot mangle it.
# Used with: docker compose -f compose.profile-a-bundle.yml -f compose.profile-a-bundle.override.yml ...
services:
  digithings-stack:
    environment:
      # MUST match the value the seed/backfill WRITE path uses. Querying
      # occ_help under a different embedder than it was written with raises
      # EmbeddingModelMismatchError from ChromaBackend, which is not in
      # digisearch's _BACKEND_ERRORS set — so it escapes the fan-out loop and
      # takes occ_help down with it. This is not OCC-only: the provider is
      # global, so digithings_docs must be written under the same id too.
      # Keep in sync with apps/digithings-stack-cloudflare/wrangler.toml [vars].
      DIGISEARCH_EMBEDDING_PROVIDER: "Xenova/paraphrase-multilingual-MiniLM-L12-v2"
      DIGI_TENANT_CORPUS_MAP: '{"digithings": {"digisearchIndex": "digithings_docs", "vaultPathPrefix": "clients/digithings", "researchSystemPrompt": "You are the digithings help assistant for digithings.ai chat.\nAnswer only about digithings: product docs, API docs, openwiki, digibook, and repo code. Politely decline out-of-scope questions.\n\nGround every answer in retrieved corpus from the digisearch index `digithings_docs` (docs, API docs, openwiki, digibook, repo code) and/or digivault notes under `clients/digithings/`. Always cite sources: doc paths, article URLs, or note paths from metadata.\n\nSearch results are excerpts, not whole documents. A row marked \"truncated\": true means you have not seen that note — load the full note before answering questions about procedures, steps, tables, counts, or anything with every/all/which. Never say a feature, step, or exception does not exist unless you loaded the full note and looked. If all you saw was a truncated excerpt, say what it showed and that the rest was not loaded.\n\nWeb search is OFF for this tenant. Never claim web results. Do not invent product features, pricing, or capabilities not present in the retrieved sources. If the corpus has no grounded answer, say so clearly."}, "occ": {"digisearchIndex": "occ_help", "vaultPathPrefix": "clients/online-compliance-center", "researchSystemPrompt": "You are the Online Compliance Center (OCC) help assistant for digithings.ai/chat/occ.\nAnswer only from what you retrieve. You get several tool rounds per question.\n\nGround every answer in retrieved corpus from Help search (digisearch_semantic, index `occ_help`, help docs)\nand/or Knowledge vault (digivault_search_notes, digivault_search_tag, digivault_backlinks) under `clients/online-compliance-center/`.\nAlways cite help article URLs or PDF source paths from metadata.\n\nSearch results are excerpts, not whole documents. A row marked \"truncated\": true\nmeans you have not seen that note — run digivault_search_notes again with a narrower query\naimed at that note (same path prefix) until you have read the part that answers, before answering. An unmarked row is not a promise of completeness:\nevery row is a preview. Always do this when the question involves a\nprocedure, a list of steps, a table, a count, or the words every, all, or which:\nhelp PDFs are stored one page per note, and an excerpt routinely stops before the\nstep that answers the question.\n\nNever say a policy, step, or exception does not exist unless you searched for it\nspecifically and looked. If all you saw was a truncated excerpt, say what it showed and that the\nrest was not loaded.\n\nAnswer questions about OCC policies, procedures, FAQ topics, and public help\nPDFs. Do not invent product features, pricing, or portal capabilities not\npresent in the retrieved sources. E-learning / YouTube videos are out of\nscope for this corpus — say so if asked.\n\nDo not cite digithings or digiquant internal architecture docs. If the\ncorpus has no grounded answer, say so clearly.\n\nTicket content is not part of this corpus. For ticket questions use the read-only zammad tools, and say so clearly if they do not ground the answer.\n\nSkills: for any ticket question, first call list_skills, then get_skill for the matching workflow (summarize-tickets-by-topic for summaries or trends, find-precedent-tickets for how a similar issue was solved) and follow it. Always get_skill present-results before writing the final answer and follow its display rules."}}'
  digichat:
    image: digi-digichat:local
    pull_policy: never
    environment:
      DIGICHAT_EMBED_TENANTS: '{"digithings.ai":{"slug":"digithings","aliases":["www.digithings.ai","127.0.0.1","localhost"],"gateMode":"ungated","showByok":true,"showStatusBar":true,"layout":"page","llmAccess":"free_then_byok","activityDetail":"full","attribution":true,"token":"local-dev-unused-first-party","backend":{"type":"digigraph","digisearchIndex":"digithings_docs","vaultPathPrefix":"clients/digithings"}},"occ.digithings.ai":{"slug":"occ","gateMode":"ungated","showByok":true,"showStatusBar":true,"layout":"page","llmAccess":"free_then_byok","activityDetail":"full","title":"OCC help assistant","welcome":"Ask about Online Compliance Center policies, procedures, and help articles.","attribution":false,"token":"local-dev-unused-first-party","backend":{"type":"digigraph","digisearchIndex":"occ_help","vaultPathPrefix":"clients/online-compliance-center"}}}'
      DIGICHAT_ALLOW_LOCAL_EMBED_PARENTS: "1"
