# Pull a published digichat image instead of building from the monorepo.
# Usage (from repo root, with DIGICHAT_VERSION set):
#   docker compose -f docker-compose.yml \
#     -f infra/digichat-release/compose.digichat-release.yml \
#     --profile digichat up -d
#
# Or: make digichat-release-up VERSION=1.0.0
#
# Clients without the monorepo should prefer compose.profile-a.yml /
# compose.profile-b.yml which are self-contained (Profile A still builds
# digikey/digigraph/digivault from the monorepo until those have GHCR tags).
#
# Requires Docker Compose that supports `build: !reset null` (Compose v2.24+ /
# Compose specification merge; verified on Compose v5).

services:
  digichat:
    image: ghcr.io/digithings-ai/digichat:v${DIGICHAT_VERSION:?set DIGICHAT_VERSION e.g. 1.0.0}
    build: !reset null
    pull_policy: always
