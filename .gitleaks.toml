# Gitleaks configuration for digithings.
#
# Policy: extend the default ruleset (detect-secrets for AWS/GCP/Azure, JWTs,
# generic API keys, PEM private keys, etc.) and allowlist a small, reviewed
# set of paths that contain test fixtures, documentation examples, and
# placeholder values. Adding a new allowlist entry requires a brief comment
# explaining why the match is safe (see SECURITY.md "Secrets scanning").

# Inherit every rule from gitleaks' built-in default config. Custom rules
# below (if any) are additive.
[extend]
useDefault = true

[allowlist]
description = "digithings fixtures, docs, and placeholder values"

paths = [
  # Next.js build output (.next/ anywhere): per-build, randomly generated dev
  # preview-mode/draft keys that only guard a local dev server. Build output must
  # never be committed (.gitignore covers .next/); this keeps history clean of
  # those generated values. Reviewed 2026-10-09 (run 37979577270).
  '''(^|/)\.next/''',

  # Unit + integration test fixtures: fake JWTs minted at runtime via
  # tests/digi_test_jwt.py, ephemeral RSA keys generated by conftest.py, and
  # canned payloads under tests/fixtures/. No production secrets live here.
  '''^tests/''',

  # Documentation commonly includes example tokens, JWT structure samples,
  # and curl snippets with obviously-fake bearer values (e.g. "sk-your-key").
  '''^docs/.*\.md$''',

  # Claude Code PreToolUse hook fixtures (protected-path-guard, etc.): these
  # may carry canned inputs resembling secrets for hook unit tests.
  '''^scripts/claude-hooks/fixtures/''',

  # Top-level README and top-level markdown examples mirror the docs/ policy.
  '''^[A-Z]+\.md$''',

  # Frontend/JS unit-test fixtures (*.test.tsx/ts/js): canned payloads with fake
  # field values (e.g. `key_tension: '...'`) that trip the generic-api-key rule.
  # No production secrets live in test files (mirrors the ^tests/ Python policy).
  '''\.test\.(ts|tsx|js|jsx)$''',

  # History-only path: the pre-migration research example template lived here
  # (file absent at HEAD, present in history). It carries the same three real
  # free-tier data-API keys (FRED / CoinGecko / Alpha Vantage) as the live path
  # below; the owner confirmed those keys dead/rotated (2026-06-18). Kept so a
  # full-history scan (`make secrets-scan`) does not re-report the nine findings
  # the base config already suppressed. NOT a generic fixture.
  '''^apps/digiquant-atlas/config/mcp\.secrets\.env\.example$''',

  # digithings-mcp research example template: three real free-tier data-API keys
  # (FRED / CoinGecko / Alpha Vantage) sit in git history at this path, which the
  # owner confirmed dead/rotated (2026-06-18); no live credential remains.
  # History can't be rewritten cheaply, so this one exact path stays allowlisted.
  # NOT a generic fixture — see SECURITY.md "Secrets scanning".
  '''^digiquant/src/digiquant/research/config/mcp\.secrets\.env\.example$''',

  # History-only path: third copy of the same example template from the same
  # migration, at the olympus/atlas location (file absent at HEAD, present in
  # history). Verified byte-identical to the research path above: the same four
  # names (FRED / CoinGecko / Alpha Vantage / SEC_EDGAR_USER_AGENT) and the
  # same value literals, so the owner-confirmed dead 2026-06-18 record in
  # docs/ops/SECRETS_INVENTORY.md covers this path too. Verified 2026-10-04 by
  # comparing per-key digests inside the shell; no value was read or printed.
  # Adding the third sibling changes no exposure — the identical literals are
  # already suppressed at the two paths above. Without this entry the full-history
  # scan on push reports 90 findings and fails every push to main (DIG-267).
  # NOT a generic fixture — see SECURITY.md "Secrets scanning".
  '''^digiquant/src/digiquant/olympus/atlas/config/mcp\.secrets\.env\.example$''',
]

# Known-safe values that gitleaks' default rules flag. Either a canonical
# AWS/GitHub/etc. "EXAMPLE" value published by the vendor — never a real leaked
# secret — or obvious placeholder text from a template. Matching placeholders
# here keeps example/template files scanned instead of needing a path exemption.
regexes = [
  # AWS documentation example access key id (literally "AKIAIOSFODNN7EXAMPLE").
  '''AKIAIOSFODNN7EXAMPLE''',
  # AWS documentation example secret (literally
  # "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY").
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  # Template placeholders: e.g. `AUTH_SECRET=replace-with-openssl-rand-base64-32`
  # (root .env.example:240,278).
  '''replace-with-''',
  # Template placeholders: e.g. `your-api-key-here`.
  '''your-.*-here''',
  # LiteLLM's documented no-auth loopback marker.
  '''sk-no-key-required''',
  # Conventional "change me" placeholder.
  '''changeme''',
  # Angle-bracket placeholders, e.g. `<slug>`, `<your-api-key>`, `<uuid>`.
  '''<[A-Za-z0-9][A-Za-z0-9 _./:@-]*>''',
  # OCC test-script dummy keys (scripts/test_verify_occ_invite_key.sh,
  # scripts/test_occ_rollout_scope_guard.sh on the DIG-2781/DIG-2779 OCC
  # branches). Obviously patterned throwaway values, never real invite keys.
  # Matched by exact literal (not by commit) because those branches get
  # rebased, and every rebase minted new SHAs that defeated the exact-fingerprint
  # .gitleaksignore entries (runs 38066108442, 38067884838). Reviewed 2026-10-10.
  '''a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90''',
  '''2222bbbb3333cccc4444dddd5555eeee6666ffff7777aaaa8888bbbb9999''',
  '''111122223333444455556666777788889999aaaabbbbccccddddeeeeffff0000''',
]

# Commit-level allowlist. Entries must be full SHAs with a dated comment
# describing (a) why the commit is safe and (b) whether any credential it
# referenced has been rotated. Never allowlist a commit without rotating
# first (see SECURITY.md "Secrets scanning").
commits = [
  # 2026-04: smoke-test commits on the gitleaks-CI introduction PR (#68).
  # Three commits form the full smoke-test cycle — introduce, mutate, delete —
  # all containing only synthetic AWS-shaped strings that were never real
  # credentials. Specific payloads per commit:
  #   0b076c8 — introduced leaktest-smoke.txt with AKIAIOSFODNN7FAKEKEY1 and
  #              abcd1234wJalrXUtnFEMI/K7MDENG/bPxRfiCYFAKEAAAA
  #   2832d60 — mutated the file to AKIAZ7VQXYLMNOPQRSTU
  #   41b291b — deleted leaktest-smoke.txt entirely (reverted smoke test)
  # The workflow intentionally failed on 0b076c8/2832d60 then passed on
  # 41b291b, proving end-to-end detection. The file is absent at HEAD.
  # No rotation needed — these were never real credentials (see SECURITY.md).
  "0b076c8058e823ae723e76bf338109a8e7895707",
  "2832d60d70dd9b6c6409b7bd4d387e613187cad7",
  "41b291b19acc6053f3cfc778b997eebcd31611e8",

  # 2026-04: backlog-reorg tooling PR (#323). Commit 3ed49c4 added
  # file-children.py with a literal `"key": "296-jwt-claims"` dict entry that
  # tripped gitleaks' generic-api-key rule. The string is a task-identifier
  # slug, not a credential. Follow-up commit renamed the field `key` → `slug`
  # so HEAD no longer matches the rule, but gitleaks scans historical diffs
  # and still flags the introducing commit. No rotation needed —
  # "296-jwt-claims" was never a secret.
  "3ed49c426d38c5e7ed91be48e8f71a5cee9fe9ae",

  # 2026-10-01: 0f193360 committed apps/digiquant-app/.next dev build output.
  # prerender-manifest.json carries the preview-mode material that Next.js
  # generates locally: previewModeId plus previewModeSigningKey and
  # previewModeEncryptionKey. These are not provider credentials, so the
  # generic-api-key rule fires on entropy alone, and there is nothing to
  # rotate at any vendor. Security verified the whole commit tree (183 added
  # files); the only other credential-shaped assignments are two OpenTelemetry
  # regex character-class templates vendored into a sourcemap.
  # Recurrence is closed: a later commit removed the tree, and the root
  # .gitignore lists `.next/`, `.next-*/` and `.opencode/`, so develop tracks
  # no build output. History is not rewritten, and the push job walks all refs
  # with no --log-opts, so this commit stays in scope until the refs are gone.
  # No rotation needed (see SECURITY.md "Secrets scanning").
  "0f193360d21305ca8a65d33c47a7502a7ad5ec60",

  # 2026-10-06: stash-archive snapshot 1a657079c. It was reachable only from the
  # local refs/tags/stash-archive/28 and /29; DIG-1304 expired all 45
  # stash-archive/* tags on 2026-10-06, so it is now unreachable from every ref
  # in the local repo and present on no remote. The commit object is still in the
  # object database, and Security re-confirmed on 2026-10-06 that it is still
  # reachable inside .git/stash-archive/stash-archive.bundle. A bundle is not a
  # ref, so no gc reaches it; retiring it is DIG-1313, which Counsel owns with
  # Chris. The exemption therefore stays.
  # The commit adds six strings that match gitleaks' aws-access-token rule
  # (secretLen 20, entropy 3.52, AWS key-ID prefix true) inside client research
  # briefs under projects/*/vault/. Their provenance is unestablished: a shape
  # test cannot distinguish a live key from a quoted sample, and this entry does
  # not assert liveness in either direction. What is established is that the old
  # blanket "research prose" justification for muting projects/*/vault/ had the
  # wrong basis, so the path mute is removed and the exemption is scoped to the
  # one commit that carries findings. Any NEW file under projects/*/vault/ is
  # scanned normally. An auditor can enumerate the exact paths with
  # `git ls-tree -r 1a657079c`; they are deliberately not named here because this
  # file is tracked outside projects/.
  # Removing the path mute changes nothing on remote-visible history. 1a657079c
  # is on no remote and in no branch, so it is not among the commits CI scans,
  # and a --branches scan reports the same findings before and after with none
  # under projects/. This commit-scoped entry is what keeps a local
  # full-history scan quiet on those six.
  # No rotation identified as owed (see SECURITY.md "Secrets scanning"):
  # docs/ops/SECRETS_INVENTORY.md records no AWS credential. That inventory is
  # repo-scoped, so it establishes only that no AWS credential is tracked there,
  # not that none exists anywhere.
  "1a657079c54ecd34ab07a881c87c2b2c19543d23",
]

# --- Gloomberb deployer cookie (DIG-2752) --------------------------------------
#
# DEFENCE IN DEPTH, NOT THE GATE. The allowlist above exempts `^tests/` and
# `^docs/.*\.md$`, so a cookie committed in either would never reach these rules
# at all. The enforcement point for "no cookie value in the repo" is
# `tests/scripts/test_gloomberb_session_cookie_runbook.py`
# (`test_no_committed_deployment_config_carries_a_cookie_value`), which scans
# every committed deployment-config file and is quoting-agnostic. These rules
# cover everything the allowlist does not exempt.
#
# TWO ARMS, split on 2026-10-10 after a measured false positive. The first
# version was one rule whose value class allowed `.`, so a config that merely
# FORWARDS the env var by name matched on the name itself: a 29-character
# identifier reference was reported as a cookie value. Reproduced with this
# file's own config under gitleaks 8.30.1. It cost one develop-breaking
# suppression and stayed live, because that suppression pins one exact
# fingerprint at the file's pre-rename path (the `cloudflare/` tree moved under
# `apps/` the next day), so the same code at its current path cannot match the
# ignored fingerprint.
#
# The split is the only expressible fix. RE2 has no lookahead, so "this value is
# not an identifier reference" cannot be stated negatively, and a
# rule-local allowlist with `regexTarget = match` silenced every arm under
# 8.30.1 (measured, rejected). Requiring the closing quote on the quoted arm and
# dropping `.` from the unquoted arm is what actually discriminates.
#
# Measured matrix (gitleaks 8.30.1, this file, `--no-git`). Every row is a
# control, positive or negative, and the same matrix is asserted in
# `tests/scripts/test_gloomberb_session_cookie_runbook.py` so CI needs no
# scanner binary:
#   NAME: env.NAME                     env passthrough, no secret -> silent
#   NAME: "cookie"                     quoted value               -> FIRE
#   NAME=cookie                        unquoted value             -> FIRE
#   NAME="cookie"                      .env quoted value          -> FIRE
#   process.env.NAME                   bare read                  -> silent
#   ctx.env.NAME                       identifier reference       -> silent
#   NAME, then a real quoted cookie on the same line                -> FIRE
#   a near-miss identifier ending in the name                       -> silent
# The single rule fired on five of those eight. Splitting loses no cookie
# shape and removes five false-positive classes.
#
# DECLARED GAP: an UNQUOTED assignment whose cookie value contains a `.` is no
# longer matched by the unquoted arm, because a `.` is what separates an
# identifier reference from a value in every shape measured here. Such a value
# is still matched when quoted, and the pytest gate above scans every committed
# deployment-config file regardless of quoting.
#
# An earlier draft also matched the vendor's own cookie-slot spellings so a
# shell snippet wiring the cookie directly would be caught, but spelling the
# vendor's storage slot in this file is itself a DIG-1415 vendor-content
# finding, and an agent seat cannot approve that exception (only `approved`
# entries may suppress a V rule, and one that named a vendor symbol would be
# self-approval). The gap is named on DIG-2752; the pytest guard is the
# enforcement point, and these rules are defence in depth for the env-var
# spelling only.
# History note: the old "canonical store" was the GitHub Actions `cron`
# environment secret, now retired; a pipeline copy is a credential nobody owns.
[[rules]]
id = "gloomberb-deployer-session-cookie"
description = "A quoted Gloomberb session cookie value committed to the repository (DIG-2752)"
regex = '''GLOOMBERB_SESSION_COOKIE"?[ \t]*[=:][ \t]*"[A-Za-z0-9_\-\.]{20,}"'''
keywords = ["GLOOMBERB_SESSION_COOKIE"]

[[rules]]
id = "gloomberb-deployer-session-cookie-unquoted"
description = "An unquoted Gloomberb session cookie value committed to the repository (DIG-2752)"
regex = '''GLOOMBERB_SESSION_COOKIE[ \t]*=[ \t]*[A-Za-z0-9_\-]{20,}'''
keywords = ["GLOOMBERB_SESSION_COOKIE"]
# ---------------------------------------------------------------------------
# DIG-1723 (2026-10-07, Security) — labeled credentials the default ruleset
# provably cannot reach.
#
# A live X-API-Key for a client MCP endpoint was found sitting in a
# digithings-books inbox transcript that gitleaks reported as clean. It was not
# the allowlist. Two independent limits of the default `generic-api-key` rule
# were measured on gitleaks 8.30.1, using synthetic fixtures only:
#
#   1. Length ceiling. `X-API-Key: <n random chars>` hits generic-api-key at
#      n = 146..150 and misses at n >= 151. The real value was 381 chars, so it
#      was structurally invisible.
#   2. Value character class. The rule matches a contiguous [A-Za-z0-9_-+/=]
#      run. Inserting a single `:` at offset 4, 20, 60 or 119 inside an
#      otherwise-matching 120-char value made it miss every time; the same value
#      with `-` in that position still hit. The real value is <36>:<344>.
#
# The default ruleset is not broken; it simply has no rule for "a credential
# label whose value is longer than ~150 chars, or contains a delimiter".
# These two rules cover exactly that region and nothing else:
#
#   labeled-credential-long-value      value of 100+ chars in the value class
#   labeled-credential-delimited-value value of <20+>:<20+>
#
# They are strictly additive to `useDefault`, so no existing detection
# behaviour changes; they can only add findings. The 100-char floor and the
# two-sided 20-char delimiter pair are the FP controls: the reference-shaped
# text that a naive "label then value" rule sweeps up is short (measured 22-35
# chars) and delimiter-free — `os.environ/FOO_BAR_KEY`, `process.env.X_API_KEY`,
# a bare `_OPENAI_API_KEY` name — so it matches neither rule.
#
# Measured against the two corpora, values masked, counts and lengths only:
#   this repo (working tree)          0 findings from these two rules
#   digithings-books, tracked inbox/chat (121 files)  0 findings from these rules
#   digithings-books, whole repo      only the one live file, in inbox/chat/
#   synthetic true shapes             4 of 4 caught (two by both rules)
#   env-reference / variable-name shapes              0 findings
#
# A 64-char colon-free labeled value is deliberately left to generic-api-key:
# it is inside the region the default ruleset already covers.
#
# Regression test: tests/scripts/test_gitleaks_labeled_credential_rule.py
# (pytest -m unit). It pins both rules to the four measured shapes, so a future
# edit that widens them past the false-positive surface fails the test.
#
# Rotation owed by this finding is tracked on DIG-1723, not here. No credential
# value is recorded in this file, in the test, or in any issue.

[[rules]]
id = "labeled-credential-long-value"
description = "A credential label followed by a value of 100+ characters. The default generic-api-key rule stops matching above 150 characters, so this region is unscanned by default. Labeled values this long are not environment-variable references."
keywords = [
  "api key",
  "api-key",
  "api_key",
  "apikey",
  "x-api-key",
  "authorization",
  "auth-token",
  "auth_token",
  "access-token",
  "access_token",
  "bearer",
  "client-secret",
  "client_secret",
  "api-secret",
  "api_secret",
  "webhook-secret",
  "webhook_secret",
  "private-token",
  "private_token",
  "session-key",
  "session_key",
]
regex = '''(?i)\b(?:x[-_ ]?api[-_ ]?key|api[-_ ]?key|apikey|authorization|auth[-_ ]?token|access[-_ ]?token|bearer|client[-_ ]?secret|api[-_ ]?secret|webhook[-_ ]?secret|private[-_ ]?token|session[-_ ]?key)\b[^\n]{0,16}?["']?\s*[:=]\s*(?:["']?\s*)(?:bearer\s+|basic\s+|token\s+)?["']?([A-Za-z0-9_:\-+/=.~]{100,})'''
secretGroup = 1

[[rules]]
id = "labeled-credential-delimited-value"
description = "A credential label followed by a value of the form <20+>:<20+>. The default generic-api-key rule matches only a contiguous [A-Za-z0-9_-+/=] run, so any delimiter inside the value makes it miss. Composed credentials (id:secret, tenant:key) and JWT-shaped values live here."
keywords = [
  "api key",
  "api-key",
  "api_key",
  "apikey",
  "x-api-key",
  "authorization",
  "auth-token",
  "auth_token",
  "access-token",
  "access_token",
  "bearer",
  "client-secret",
  "client_secret",
  "api-secret",
  "api_secret",
  "webhook-secret",
  "webhook_secret",
  "private-token",
  "private_token",
  "session-key",
  "session_key",
]
regex = '''(?i)\b(?:x[-_ ]?api[-_ ]?key|api[-_ ]?key|apikey|authorization|auth[-_ ]?token|access[-_ ]?token|bearer|client[-_ ]?secret|api[-_ ]?secret|webhook[-_ ]?secret|private[-_ ]?token|session[-_ ]?key)\b[^\n]{0,16}?["']?\s*[:=]\s*(?:["']?\s*)(?:bearer\s+|basic\s+|token\s+)?["']?([A-Za-z0-9_\-+/=.~]{20,}:[A-Za-z0-9_\-+/=.~]{20,})'''
secretGroup = 1
