# This directory holds the reviewable copy of the host CI runner that posts the
# `local-ci` status (see README.md here). The host copy in ~/Code/local-ci is
# its own checkout and has diverged from this repository - it carries the
# post-merge driver, which is not in this repository at all - so the two are
# synced deliberately, not copied over. Do not read this file as "the host runs
# exactly these bytes".
#
# E701/E702 are the compact one-line style that script has always used. They are the
# only rules waived, and only here. Everything else in the root config still applies.
extend = "../../ruff.toml"

[lint]
ignore = ["E701", "E702"]
