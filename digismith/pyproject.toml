[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digismith"
version = "0.1.0"
description = "DigiSmith – LangSmith-aligned observability helpers for DigiThings"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "uvicorn[standard]>=0.30",
    "fastapi>=0.115",
    "digibase>=0.1.0",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.1"]
otel = ["digibase[otel]"]
dev = ["pytest>=8", "pytest-cov>=4", "httpx>=0.27", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F", "I", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["../tests/dsm"]
pythonpath = ["src"]
