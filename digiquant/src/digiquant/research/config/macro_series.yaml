# Manifest for systematic macro ingestion into sealed R2 generations.
# The `fred:` block below is the gloomberb panel (dataset id remains `fred`:
# generations are still sealed as `fred__{SERIES}` with `source="fred"`).
# Refreshed from anonymous gloomberb `econ_series` pages — no FRED_API_KEY.
# Dropped 2026-09-29 (not served by the panel, do not re-add without a probe):
# DTWEXBGS, GVZCLS, MANEMP, MORTGAGE30US, NFCI, OVXCLS, STLFSI4, VXNCLS.
# Treasury: scripts/ingest_treasury_curve.py → us_treasury + treasury_market (not listed here).
#
# FX rates (FX/EUR, FX/GBP, FX/JPY, FX/CAD) come from Yahoo Finance via
# fetch_fx_yahoo — no YAML entry required (the symbol map is hard-coded in the
# fetcher). Issue #328 dropped the Frankfurter and crypto_fear_greed blocks
# from defaults; both fetchers stay callable via `--sources frankfurter,fng`.

fred:
  # observation_start for --backfill (incremental uses DB max(obs_date) per series)
  backfill_start: "1990-01-01"
  series:
    - id: DGS2
      title: "Treasury 2Y constant maturity"
      unit: percent
    - id: DGS5
      title: "Treasury 5Y constant maturity"
      unit: percent
    - id: DGS10
      title: "Treasury 10Y constant maturity"
      unit: percent
    - id: DGS30
      title: "Treasury 30Y constant maturity"
      unit: percent
    - id: DFF
      title: "Effective federal funds rate"
      unit: percent
    - id: SOFR
      title: "SOFR"
      unit: percent
    - id: T10Y2Y
      title: "10Y minus 2Y Treasury spread"
      unit: percent
    - id: T10Y3M
      title: "10Y minus 3M Treasury spread"
      unit: percent
    - id: T10YIE
      title: "10Y breakeven inflation"
      unit: percent
    - id: T5YIE
      title: "5Y breakeven inflation"
      unit: percent
    - id: DFII10
      title: "10Y TIPS real yield"
      unit: percent
    - id: T5YIFR
      title: "5Y5Y forward inflation expectation"
      unit: percent
    - id: BAMLH0A0HYM2
      title: "ICE BofA US high yield OAS"
      unit: percent
    - id: BAMLC0A0CM
      title: "ICE BofA US corporate OAS (IG)"
      unit: percent
    - id: VIXCLS
      title: "VIX close"
      unit: index
    # Volatility complex (#708, Phase D) — VIXCLS/VXVCLS term structure only.
    # VXNCLS/GVZCLS/OVXCLS are not on the gloomberb panel (dropped 2026-09-29).
    - id: VXVCLS
      title: "VIX 3-month (VIX3M)"
      unit: index
    # Macro-liquidity regime gauge (#1085) — M2 + labor.
    - id: M2SL
      cadence: monthly
      title: "M2 money stock (seasonally adjusted)"
      unit: billions_usd
    - id: UNRATE
      cadence: monthly
      title: "Unemployment rate"
      unit: percent
    - id: CPIAUCSL
      cadence: monthly
      title: "CPI all urban consumers"
      unit: index
    - id: PCEPI
      cadence: monthly
      title: "PCE price index"
      unit: index
    - id: DCOILWTICO
      title: "WTI crude oil spot (EIA via FRED)"
      unit: usd_per_barrel
    - id: WALCL
      cadence: weekly
      title: "Fed total assets (weekly H.4.1)"
      unit: millions_usd
    - id: ICSA
      cadence: weekly
      title: "Initial jobless claims (weekly)"
      unit: persons
