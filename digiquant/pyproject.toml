[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digiquant"
version = "0.1.0"
description = "digiquant – high-perf Nautilus + Polars quant pipeline (Digi Ecosystem)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "digikey>=0.1.0",
    "click>=8",
    "pydantic>=2",
    "uvicorn[standard]>=0.30",
    "fastapi>=0.115",
    "polars>=1.0",
    "optuna>=4.7.0",
    "digibase>=0.1.0",
    "langgraph>=0.2",
    # digiquant.vault seals broker credentials with AES-256-GCM. Declared directly
    # even though digikey already pulls it in: a transitive crypto primitive can
    # vanish under a green install if digikey ever changes JWT backends. Unbounded
    # per CLAUDE.md (runtime dep, no known incompatibility).
    "cryptography>=42",
    # K5 email templates (notify/dispatch).
    "jinja2>=3.1",
]
[project.optional-dependencies]
nautilus = ["nautilus_trader>=1.190,<2", "requests>=2.28", "statsmodels>=0.14"]
indicators = ["statsmodels>=0.14", "numpy>=1.26"]
visualization = ["plotly>=6.3.1", "matplotlib>=3.8"]
data = ["yfinance>=0.2", "curl-cffi>=0.15.0"]
prices = [
    "yfinance>=0.2",
    "requests>=2.28",
    "pyyaml>=6",
    "supabase>=2.0",
    "python-dotenv>=1",
    "pyarrow>=15",
    # Trading-calendar source for trading_calendar table (ADR-0013, issue #337).
    # exchange_calendars returns pandas DataFrames; calendar_sync.py flattens
    # them to dicts at the boundary so the rest of the pipeline stays Polars-only.
    "exchange_calendars>=4.5",
]
# Atlas research pipeline runtime. The atlas sub-package also imports
# `digigraph` (workspace-local, not on PyPI) — install via
# scripts/install-workspace.sh or `pip install -e ./digigraph` first.
atlas = [
    "PyYAML>=6",
    "jsonschema>=4.21",
    "python-dotenv>=1",
    "httpx>=0.27",
    "supabase>=2.0",
]
optimize = ["optuna>=3.0"]
# M2 Liquidity strategy: global M2 money-supply from FRED + FX rates from yfinance.
# Requires FRED_API_KEY (free) for live fetches; unit tests mock the clients.
m2 = ["fredapi>=0.5", "yfinance>=0.2"]
all = ["digiquant[nautilus]"]
# Pulls in atlas runtime deps too, so `pytest tests/dq/research/` works whenever
# digigraph is also on the path (via install-workspace.sh or editable install).
# Test/lint tooling (pytest, ruff, ...) lives in [dependency-groups] below, not
# here -- a uv dependency-group syncs by default with plain `uv sync`, while an
# optional-dependencies extra needs --extra dev / --all-extras. Bundling pytest
# into this extra meant `uv sync --all-packages` (no --all-extras) silently left
# pytest out of digiquant's venv, and `uv run pytest` fell through to whatever
# `pytest` happened to be on PATH instead -- see the digillm/CallPurpose
# shadowing investigation for the same failure mode in digigraph.
dev = ["digiquant[atlas]", "digiquant[indicators]", "digiquant[m2]"]
# Upper-bounded: mcp 2.0 removed `mcp.server.fastmcp`, which both MCP servers
# import (see #1705). Lift the bound only together with a migration to the 2.x API.
mcp = ["mcp>=1.2,<2"]
otel = ["digibase[otel]"]
# Alpaca paper Trading API adapter (K1). Cap to the current 0.x major — a broker
# SDK is a behavior-critical boundary (auth kwargs, order request shapes, status
# enums); a silent 1.x bump could change submit/idempotency semantics under a
# green install. Lift deliberately with adapter + mock-test updates.
brokers-alpaca = ["alpaca-py>=0.40,<1"]
# K2 IBKR adapter: thin httpx transport factory (optional). The adapter itself imports
# without this extra — construct IbkrAdapter with any injected IbkrTransport. OAuth 1.0a
# signing is not in this extra; production auth lands with vendor onboarding.
brokers-ibkr = ["httpx>=0.27"]

[project.scripts]
digiquant = "digiquant.cli:main"

[dependency-groups]
# Synced by default with plain `uv sync` (unlike [project.optional-dependencies],
# which needs --extra/--all-extras) -- so pytest is always present in digiquant's
# own venv regardless of which extras a given `uv sync` invocation requests.
# Bounds match CLAUDE.md's "Dependency version bounds": tools whose output gates
# CI are capped to their current major.
dev = ["pytest>=8,<10", "pytest-cov>=4,<8", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Skills, templates, config, and docs live alongside the engine packages
# (digiquant.research, digiquant.portfolio) so they ship inside the wheel —
# pip-installs are self-contained, no path-walking outside the package.
# See issue #486 for the consolidation rationale.
"digiquant.research" = [
    "skills/**/*.md",
    "templates/**/*.json",
    "config/**/*.yaml",
    "config/**/*.yml",
    "config/**/*.md",
    "config/**/*.json",
    "config/**/*.example",
    "docs/**/*.md",
]
"digiquant.portfolio" = [
    "skills/**/*.md",
    "templates/**/*.json",
    "docs/**/*.md",
]
"digiquant.dashboard.replay" = [
    "shadow_criteria/**/*.json",
]
"digiquant.notify" = [
    "templates/**/*.j2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Atlas legacy scripts (pandas/yfinance, migrated from apps/digiquant-atlas/scripts/
# in #316) opt out of the strict Polars-only lint rules. They are not actively
# maintained — slated for further trim in subsequent atlas-engine cleanup.
extend-exclude = ["scripts/atlas"]

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F", "I", "DTZ", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Service entrypoint imports after dotenv/sys.path bootstrap — by design.
"src/digiquant/server.py" = ["E402"]
# Tearsheet optionally uses plotly via a try/import availability guard.
"src/digiquant/tearsheet.py" = ["F401"]
# Package __init__ files re-export public symbols.
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
# Monorepo tests live at repo root tests/dq/; from digiquant/: `pytest` picks these up; or `make test-unit` from repo root.
testpaths = ["../tests/dq"]
#
# pythonpath must list the repo root plus every workspace sibling that src/digiquant or
# tests/dq imports directly (digibase, digigraph, digikey, digillm) -- not just "src". Reason:
# when pytest is invoked with no path args from *inside* digiquant/ (e.g.
# `cd digiquant && uv run pytest -m unit`), its rootdir/config search starts at cwd and
# stops at the first ancestor with a recognized config -- this file -- so it never walks
# up to the repo-root pytest.ini, which carries the full list (". digibase/src digillm/src
# digikey/src ..."). If that's the only thing putting a sibling's editable install (or the
# repo root, needed for `from tests.conftest import ...` / `from tests.dq...` in the shared
# test suite) on sys.path, the omission silently resolves imports against whatever global
# site-packages that other interpreter has instead of the workspace's editable copy.
# Listing them here is both the fix and the safety net. See digigraph's fix for the
# original root-cause writeup (digillm/CallPurpose ImportError).
pythonpath = ["..", "src", "../digibase/src", "../digigraph/src", "../digikey/src", "../digillm/src"]
