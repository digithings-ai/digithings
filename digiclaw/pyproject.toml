[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digiclaw"
version = "0.1.0"
description = "DigiClaw – heartbeat runner + append-only JSONL audit log for the DigiThings stack"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "digibase>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
digiclaw-heartbeat = "digiclaw.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["../tests/dc"]
pythonpath = ["src"]
