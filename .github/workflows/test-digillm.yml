name: "Test: digillm"

# Follows the test-digibase.yml pattern (#1714): installs from the committed
# uv.lock instead of resolving fresh, so a new release of a tool cannot change
# what runs here without a lockfile change showing up in a diff.
#
# Added by #1788. Before it, `digillm/tests/test_digillm.py` — 57 tests over
# provider routing, the client cache, retry/backoff, the response cache, the
# tool-calling loop and BYOK overrides — ran in no CI lane at all, and
# `digillm/**` was not lint-gated either (the `ruff-and-scripts` job in ci.yml
# lints six other src trees plus `tests`, not this one).
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails if uv.lock is stale rather than silently re-resolving.
      # --all-packages matches the other lanes: digillm's [trace] extra pulls the
      # digismith sibling, and one uniform command avoids per-workflow reasoning
      # about which workspace members a suite touches.
      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      # Both checks, matching test-digivault.yml and the sibling digifetch lane.
      # `ruff format --check` is already clean on this tree, so gating it costs
      # nothing and stops it from drifting the way digifetch's did.
      - name: Ruff
        run: |
          uv run --frozen --no-sync ruff check digillm/src digillm/tests
          uv run --frozen --no-sync ruff format --check digillm/src digillm/tests

      # Deliberately NOT `-m unit`, unlike the digibase/digivault lanes: no test
      # in digillm/tests carries the `unit` marker, so `-m unit` would select
      # zero of the 57 and report a green run that asserted nothing. The suite is
      # offline by construction (every provider call is monkeypatched), so
      # running it unfiltered is correct. Marking the suite is tracked in #1788's
      # follow-ups — it is not done here because PR #1779 is open against this
      # same file and the marker buys no coverage this lane does not already give.
      - name: Unit tests (digillm/tests)
        run: uv run --frozen --no-sync pytest digillm/tests -v --tb=short
