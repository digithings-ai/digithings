# Put house secrets onto digiquant-runner (Phase 3 Task 7 / #4761).
# DIGIQUANT_DIGIKEY_API_KEY plus Langfuse OTLP names. Never LangSmith.
# Values stay inside Actions; this job never prints them.
# Single Worker script (wrangler.toml has no env blocks).
name: "Ops: sync digiquant-runner house secrets"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-runner-house:
    runs-on: ubuntu-latest
    # DIG-248: CI-read secrets live at `cron` environment scope, not repo/org scope.
    environment: cron
    steps:
      - name: Put digikey + Langfuse secrets on digiquant-runner via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGIQUANT_DIGIKEY_API_KEY: ${{ secrets.DIGIQUANT_DIGIKEY_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          set -euo pipefail
          script="digiquant-runner"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/secrets"
          put() {
            local name="$1" text="$2"
            if [ -z "${text}" ]; then
              echo "FAIL empty $name"
              exit 1
            fi
            echo "putting $name on $script (len=${#text})"
            curl -sS -f -X PUT "$base" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg n "$name" --arg t "$text" '{type:"secret_text",name:$n,text:$t}')" \
              | jq -e '.success == true' >/dev/null
            echo "ok $name"
          }
          put DIGIQUANT_DIGIKEY_API_KEY "$DIGIQUANT_DIGIKEY_API_KEY"
          put LANGFUSE_SECRET_KEY "$LANGFUSE_SECRET_KEY"
          put LANGFUSE_PUBLIC_KEY "$LANGFUSE_PUBLIC_KEY"
          put LANGFUSE_BASE_URL "$LANGFUSE_BASE_URL"
          otlp_endpoint="${LANGFUSE_BASE_URL%/}/api/public/otel"
          otel_headers="Authorization=Basic $(printf '%s:%s' "$LANGFUSE_PUBLIC_KEY" "$LANGFUSE_SECRET_KEY" | base64 -w0)"
          put DIGITRACE_LANGFUSE_OTLP_ENDPOINT "$otlp_endpoint"
          put DIGI_OTEL_HEADERS "$otel_headers"
          echo "runner house secrets ok"
