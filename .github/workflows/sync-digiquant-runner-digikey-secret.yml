# Put house secrets onto digiquant-runner (Phase 3 Task 7 / #4761).
# DIGIQUANT_DIGIKEY_API_KEY only. Never LangSmith. Tracing is in-house digitrace.
# Values stay inside Actions; this job never prints them.
# Single Worker script (wrangler.toml has no env blocks).
name: "Ops: sync digiquant-runner house secrets"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-runner-house:
    runs-on: ubuntu-latest
    # DIG-248: CI-read secrets live at `cron` environment scope, not repo/org scope.
    environment: cron
    steps:
      - name: Put the house digikey on digiquant-runner via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGIQUANT_DIGIKEY_API_KEY: ${{ secrets.DIGIQUANT_DIGIKEY_API_KEY }}
        run: |
          set -euo pipefail
          script="digiquant-runner"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/secrets"
          put() {
            local name="$1" text="$2"
            if [ -z "${text}" ]; then
              echo "FAIL empty $name"
              exit 1
            fi
            echo "putting $name on $script (len=${#text})"
            curl -sS -f -X PUT "$base" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg n "$name" --arg t "$text" '{type:"secret_text",name:$n,text:$t}')" \
              | jq -e '.success == true' >/dev/null
            echo "ok $name"
          }
          put DIGIQUANT_DIGIKEY_API_KEY "$DIGIQUANT_DIGIKEY_API_KEY"
          echo "runner house secrets ok"
