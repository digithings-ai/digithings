# Drift check for the `cron` environment gate, plus a names-only secret ageing
# report (#248). Read which half of that sentence can actually run here.
#
# WHAT RUNS HERE, AND WHAT CANNOT
#
# The secret listings CANNOT be read from this workflow. `GET
# repos/{owner}/{repo}/actions/secrets` (and the org and environment equivalents)
# documents that it needs the `repo` scope, which a workflow's GITHUB_TOKEN cannot
# have: GITHUB_TOKEN is a GitHub App installation token, and the `permissions:`
# vocabulary has no key for secrets at all. This job ran with `actions: read` from
# 2026-10-04 to 2026-10-04 (run 37235973852, merged in #5063) and all three listings
# still answered `Resource not accessible by integration (HTTP 403)`. No value of
# `permissions:` changes that; only a PAT (`repo`, plus `admin:org` for the org
# level) or a purpose-built GitHub App installation token can read them.
#
# So this job files no secret tracker and ages nothing. It reports all three levels
# as NOT CHECKED, with the reason, which is the honest outcome.
#
# The ageing half runs where a scoped token already exists, which today means an
# operator's shell on the Mac — `gh auth` there already carries `repo` and
# `admin:org`. It does NOT mean the Keymaster weekly key report: that report is
# built from Bitwarden and never reads the GitHub Actions secrets API. Do not
# reintroduce that claim. Paperclip DIG-477 tracks giving this half a real home.
#
#     gh secret list --repo digithings-ai/digithings        # repo names + dates
#     make secrets-staleness                                # reports, files nothing
#
# `#248` measured 16 of 33 listed names past the 90-day window on 2026-10-04 from
# such a shell. Those 16 are tracked in `docs/ops/SECRETS_INVENTORY.md` until the
# ageing half is given a credential.
#
# WHAT DOES RUN HERE
#
# The environment-gate drift check works, because the environment and
# deployment-branch-policy endpoints are readable with `contents: read`. This job
# re-reads the live protection rules and compares them with
# `.github/environments.json`. If `cron` has since been given a required reviewer,
# every scheduled pipeline would queue behind an approval instead of running, which
# is a silent stop rather than a red run. That condition fails this job, and it is
# the reason this workflow exists at all.
#
# No `on.schedule` here on purpose: every clock for this repo lives on the
# digithings-cron Worker (a schedule on develop would double-fire, and
# tests/scripts/test_no_gha_schedules.py enforces that). The monthly 06:17 on the
# 1st is registered there as the `secret-staleness` job, so the next automatic fire
# after 2026-10-04 is 2026-11-01 06:17 UTC — a silent month, which is another reason
# to read the 16 overdue names in the inventory rather than wait for the clock.
name: "Ops: secret staleness"

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Rotation window in days"
        required: false
        default: "90"

permissions:
  contents: read
  # No `actions` key, and adding one back is a mistake. #5063 granted
  # `actions: read` on the belief that it unlocked the secret listings; run
  # 37235973852 disproved that with `Actions: read` visibly granted in the job
  # banner and all three listings still answering `Resource not accessible by
  # integration (HTTP 403)`. Those endpoints need a token carrying the `repo` scope,
  # which no `permissions:` value can express, so the grant bought nothing and only
  # widened the token.
  issues: write

concurrency:
  group: secret-staleness-check
  cancel-in-progress: false

jobs:
  check:
    # No `environment:` here on purpose. Adding the `cron` environment would make
    # this job depend on the very scope it audits.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the cron gate, and report the secret levels as unread
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '90' }}
        run: |
          python3 scripts/secret_staleness_check.py \
            --max-age-days "$MAX_AGE_DAYS" \
            --environment cron \
            --summary "$GITHUB_STEP_SUMMARY" \
            --open-issue

      - name: Show the report
        if: always()
        run: cat "$GITHUB_STEP_SUMMARY"