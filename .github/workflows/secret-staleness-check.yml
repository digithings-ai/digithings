# Environment-gate drift check for `cron` (#248).
#
# WHAT THIS RUNS
#
# One thing: it compares `.github/environments.json` against the live protection
# rules and exits 1 on drift. That is the whole job, and it is the part that works.
#
# The 32 jobs declared `environment: cron` in #248 are only safe because that
# environment has no required reviewer and no wait timer. Both are armed from the
# GitHub UI, where no test runs, and the failure mode is #2541 again — pipelines
# stop, with every assertion still green. That is a silent stop rather than a red
# run, which is why it is worth a job of its own.
#
# WHAT THIS DOES NOT RUN, AND WHY
#
# Secret ageing is out of automation by decision: Paperclip DIG-477, option D
# (Chris, 2026-10-05). This file used to attempt it every month and print three
# `NOT CHECKED` lines, because the secret listings CANNOT be read from a workflow
# at all: `GET repos/{owner}/{repo}/actions/secrets` and the org and environment
# equivalents document that they need the `repo` scope, and a workflow's
# GITHUB_TOKEN is a GitHub App installation token whose `permissions:` vocabulary
# has no key for secrets. This job ran with `actions: read` from 2026-10-04 to
# 2026-10-04 (#5063, run 37235973852) and all three listings still answered
# `Resource not accessible by integration (HTTP 403)`. No value of `permissions:`
# changes that.
#
# So `--gates-only` never makes the call. A monthly job that discovers this again
# every 30 days and files an issue saying "I could not do my job" is noise wearing
# a tracker's clothes, and giving CI a token that could read the listings would
# stand up the exact category of repo-scoped credential #248 exists to shrink.
#
# Rotation is a human decision. The 16 of 33 names measured past the 90-day window
# on 2026-10-04 are recorded in `docs/ops/SECRETS_INVENTORY.md`, and they are aged
# by hand with:
#
#     make secrets-staleness          # reads repo, org and cron names + dates
#
# Run that from a shell whose `gh auth` already carries `repo` and `admin:org`.
# It does NOT run from the Keymaster weekly key report: that report is built from
# Bitwarden and never reads the GitHub Actions secrets API. Do not reintroduce
# that claim.
#
# WHAT IS LOST, STATED PLAINLY
#
# Nothing will notice a credential becoming dead. `token-canary.yml` probes two
# names daily (`DIGITHINGS_PROJECT_TOKEN`, `GH_DISPATCH_TOKEN`); the other 14
# overdue names have no automated liveness check. That is the deliberate trade in
# option D, and it is why the inventory is a record and not a report nobody reads.
#
# No `on.schedule` here on purpose: every clock for this repo lives on the
# digithings-cron Worker (a schedule on develop would double-fire, and
# tests/scripts/test_no_gha_schedules.py enforces that). The monthly 06:17 on the
# 1st is registered there as the `secret-staleness` job, so the next automatic fire
# is 2026-11-01 06:17 UTC.
name: "Ops: environment gate drift"

on:
  # No inputs. The rotation window used to be an input here; it configured the
  # ageing half, which is gone (DIG-477). Nothing in this job takes a parameter.
  workflow_dispatch:

permissions:
  contents: read
  # No `actions` key, and adding one back is a mistake. #5063 granted
  # `actions: read` on the belief that it unlocked the secret listings; run
  # 37235973852 disproved that with `Actions: read` visibly granted in the job
  # banner and all three listings still answering `Resource not accessible by
  # integration (HTTP 403)`. Those endpoints need a token carrying the `repo` scope,
  # which no `permissions:` value can express, so the grant bought nothing and only
  # widened the token.
  #
  # `issues: write` is also gone. Nothing in this job writes an issue any more:
  # #5078 stopped the tracker because it could only ever say it read nothing, and
  # DIG-477 removed the ageing that tracker existed for.

concurrency:
  group: secret-staleness-check
  cancel-in-progress: false

jobs:
  check:
    # No `environment:` here on purpose. Adding the `cron` environment would make
    # this job depend on the very scope it audits.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the cron gate against the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `set +e` around the run, and `exit "$rc"` after the copy. GitHub runs a
          # Linux `run:` block under `bash -e`, and gate drift is the ONLY thing
          # that makes this script exit non-zero — so under `-e` the step aborted on
          # the `python3` line and the `cp` below never ran. The report then vanished
          # from the log on exactly the run a human needs to read, and `Show the
          # report` failed with "No such file or directory" for an unrelated reason.
          # The summary file itself is still rendered on the run page; this copy is
          # what makes the body greppable in the raw log.
          set +e
          python3 scripts/secret_staleness_check.py \
            --gates-only \
            --environment cron \
            --summary "$GITHUB_STEP_SUMMARY"
          rc=$?
          cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/gate-report.md"
          exit "$rc"

      - name: Show the report
        if: always()
        # `$RUNNER_TEMP`, not `$GITHUB_STEP_SUMMARY`. That variable is unique *per
        # step*: the previous step wrote its summary, and this step's own
        # `$GITHUB_STEP_SUMMARY` is a different, empty file. So this step used to
        # `cat` nothing, succeed, and leave zero lines in the log under a name that
        # promises the report — found while verifying #5087, which meant verifying a
        # fix required grepping the wrong artefact. GitHub renders the previous
        # step's summary on the run page either way; this copy exists so the report
        # is also greppable in the raw log.
        run: cat "$RUNNER_TEMP/gate-report.md"
