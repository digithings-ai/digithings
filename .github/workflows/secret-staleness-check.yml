# Names-only ageing check for GitHub Actions secrets (#248).
#
# Why this can exist at all: `gh secret list` and the Actions secrets API return a
# name and a last-written date and never a value, so this job needs no credential
# beyond the automatic GITHUB_TOKEN and reads no secret. The 90-day rotation rule in
# docs/ops/SECRETS_INVENTORY.md stops being a memory exercise.
#
# It files one tracking issue listing every repo, org and `cron`-environment secret
# past the window, and updates that same issue on later runs. A stale credential is
# a human decision (rotate, or record why not), so this job never fails the build.
#
# The org level needs `admin:org`, which a workflow's GITHUB_TOKEN never has. From
# CI the org row is reported as NOT CHECKED and the operator's shell (or the
# Keymaster weekly key report, which runs with a PAT) is the authoritative org read.
name: "Ops: secret staleness"

on:
  schedule:
    # 06:17 on the 1st of each month. Deliberately off :00 — every repo on the
    # shared runner pool queues at the top of the hour.
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Rotation window in days"
        required: false
        default: "90"

permissions:
  contents: read
  issues: write

concurrency:
  group: secret-staleness-check
  cancel-in-progress: false

jobs:
  check:
    # No `environment:` here on purpose. This job reads only GITHUB_TOKEN, which
    # Actions provides to any job, and adding the `cron` environment would make it
    # depend on the very scope it is auditing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Age every secret name
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '90' }}
        run: |
          python3 scripts/secret_staleness_check.py \
            --max-age-days "$MAX_AGE_DAYS" \
            --environment cron \
            --summary "$GITHUB_STEP_SUMMARY" \
            --open-issue

      - name: Show the report
        if: always()
        run: cat "$GITHUB_STEP_SUMMARY"