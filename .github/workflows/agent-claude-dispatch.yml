name: "Agent: Claude dispatch"

# Fires when the agent-task label is applied to an issue whose component routes
# to the claude tier (see tiers in scripts/project_routing.json).
#
# Policy: Tier claude is LOCAL ONLY. Cloud dispatch is intentionally
# disabled — only cursor-tier issues auto-execute. When a task needs
# human-supervised execution, a human runs `make task ISSUE=N` locally.
#
# This workflow exists solely to:
#   1. Confirm the label was applied (and surface the expected branch/gate)
#   2. Resolve component metadata (branch name, test command) so the human
#      has copy-paste-ready instructions in the issue comments
#
# If cloud dispatch is ever re-enabled, restore the Run Claude Code steps
# from git history (pre-issue #384) and gate behind ANTHROPIC_API_KEY /
# CLAUDE_CODE_OAUTH_TOKEN again.

on:
  issues:
    types: [labeled, opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    name: Acknowledge claude-tier agent task
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'agent-task') ||
      ((github.event.action == 'opened' || github.event.action == 'reopened') &&
       contains(github.event.issue.labels.*.name, 'agent-task'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Resolve component metadata + tier
        id: meta
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE:  ${{ github.event.issue.title }}
        run: |
          LABELS='${{ toJson(github.event.issue.labels) }}'
          META=$(echo "$LABELS" | python3 -c "
          import json, sys
          routing = json.load(open('scripts/project_routing.json'))
          tiers = routing.get('tiers', {})
          names = [l['name'] for l in json.load(sys.stdin)]
          component = next((n.split(':', 1)[1] for n in names if n.startswith('component:')), 'root')
          print(json.dumps({'component': component, 'tier': tiers.get(f'component:{component}', tiers.get('default', 'cursor'))}))
          ")
          echo "$META" | python3 -c "import json,sys; print('tier=' + json.load(sys.stdin)['tier'])" >> "$GITHUB_OUTPUT"
          COMPONENT=$(echo "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['component'])")
          if [[ "$(echo "$META" | python3 -c "import json,sys; print(json.load(sys.stdin)['tier'])")" != "claude" ]]; then
            echo "Tier is cursor — cloud automation owns this issue, nothing to post."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A TEST_CMD=(
            [digigraph]="pytest -m unit -k digigraph -v --tb=short"
            [digiquant]="pytest -m unit -k digiquant -v --tb=short"
            [digisearch]="pytest -m unit -k digisearch -v --tb=short"
            [digikey]="pytest -m unit -k digikey -v --tb=short"
            [digismith]="pytest -m unit -k digismith -v --tb=short"
            [digiclaw]="pytest -m unit -k digiclaw -v --tb=short"
            [digibase]="pytest -m unit -k digibase -v --tb=short"
            [digichat]="npm run test --prefix frontend/digichat"
            [root]="pytest -m unit -v --tb=short"
          )

          TEST="${TEST_CMD[$COMPONENT]:-pytest -m unit -v --tb=short}"
          BRANCH_SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' |
                        sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | cut -c1-40 | sed 's/-$//')

          {
            echo "component=$COMPONENT"
            echo "test_cmd=$TEST"
            echo "branch=task/${ISSUE_NUMBER}-${BRANCH_SLUG}"
          } >> "$GITHUB_OUTPUT"

      - name: Post local-dispatch instructions
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          REPO:         ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH:       ${{ steps.meta.outputs.branch }}
          TEST_CMD:     ${{ steps.meta.outputs.test_cmd }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "\
          **Claude tier — human-supervised, local only**

          Cloud dispatch is disabled by policy. To execute this task, run locally:

          \`\`\`
          make task ISSUE=${ISSUE_NUMBER}
          \`\`\`

          This will create branch \`${BRANCH}\` from the active module branch.

          Gate before PR: \`make score && ${TEST_CMD} && ruff check .\`"
