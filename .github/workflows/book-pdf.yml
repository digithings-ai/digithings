name: "Book: print the PDF"

# The book's printed edition, as a build artifact (DIG-2821).
#
# Its own workflow rather than a step in `test-web.yml` for three reasons:
# it needs a browser, it needs a full `next build` (which no lane in this repo
# runs for digithings-web), and most of it is not a test — the book is prose.
#
# The exception is `Diagrams are committed` (DIG-5436). That step is a
# generated-artefact check, and a check that only runs after a merge is how the
# diagrams drifted onto `develop` in the first place, so this workflow also runs
# on pull requests that touch the book. The `book-diagrams-<sha>` artifact of
# such a run is the authoritative copy of the committed SVGs: mermaid sizes
# every box from text metrics measured in the browser, so only the image that
# runs the check can produce bytes the check accepts.
#
# No paid service: Playwright downloads a Chromium, everything else is in the
# lockfile.

on:
  push:
    branches: [develop]
    paths: &book-paths
      - "apps/digithings-web/content/book/**"
      - "apps/digithings-web/lib/book/**"
      - "apps/digithings-web/components/book/**"
      - "apps/digithings-web/app/book/**"
      - "apps/digithings-web/scripts/book/**"
      - "apps/digithings-web/public/book/diagrams/**"
      - "apps/digithings-web/package.json"
      - "package-lock.json"
      - ".github/workflows/book-pdf.yml"
  pull_request:
    paths: *book-paths
  workflow_dispatch:

concurrency:
  group: book-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./package-lock.json

      # Root, not the workspace: npm needs the workspaces list to link
      # @digithings/ui and @digithings/design.
      - name: Install (root workspaces)
        run: npm ci --no-audit --no-fund

      # The same browser the build step renders diagrams with. Installing it
      # here means `render-diagrams` and `print-pdf` cannot disagree about
      # which engine draws the book.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The editorial lint: digibook stays high level (no env names, loopback
      # hosts, ports or secret-like words). `prebuild` runs it too; it is its
      # own step here so the failure is named.
      - name: Lint the book
        run: npm run book:lint --workspace digithings-web

      # Every mermaid fence becomes two static SVGs (light + dark) under
      # public/book/diagrams/. The pages and the PDF load those files; nothing
      # renders mermaid at request time. Rendered here, not in `prebuild`, so a
      # site build without a browser (Cloudflare Pages) still works from the
      # committed files.
      - name: Render diagrams
        run: npm run render-diagrams --workspace digithings-web

      # The bytes this runner produced, whether or not they match what is
      # committed. That makes this workflow the way to regenerate the diagrams
      # (DIG-5436): mermaid sizes every box from text metrics it measures in
      # the browser, so only the image that also runs the check can say what
      # the committed files must contain. Download it, replace
      # apps/digithings-web/public/book/diagrams with it, commit.
      - name: Upload the rendered diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-diagrams-${{ github.sha }}
          path: apps/digithings-web/public/book/diagrams
          if-no-files-found: error

      - name: Diagrams are committed
        run: git diff --exit-code -- apps/digithings-web/public/book/diagrams

      - name: Build the site
        run: npm run build --workspace digithings-web

      - name: Print the PDF
        run: npm run book:pdf --workspace digithings-web

      # print-pdf.mjs writes each edition it lists in PRINTED to
      # public/book/<file>, and copies it into out/book/ for the exported site.
      # It takes no output argument, so a CLI path here is ignored and the
      # upload then looked for a file nothing writes. The glob keeps this
      # working when another edition (theme/palette) is added to PRINTED.
      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: digithings-book-${{ github.sha }}
          path: apps/digithings-web/public/book/*.pdf
          if-no-files-found: error
          if-no-files-found: error
