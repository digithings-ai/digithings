# After CI passes on an agent branch PR, add automerge-agent when low-risk.
name: "Agent: PR autolabel"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  issues: read

jobs:
  label:
    name: Add automerge-agent when CI green
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Label eligible agent PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR=""
          if [[ -n "$BRANCH" ]]; then
            case "$BRANCH" in
              cursor/*|copilot/*|bot/*|task/*|claude/*) ;;
              *) echo "Not an agent branch — skipping."; exit 0 ;;
            esac
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
              --json number,labels,body,title,headRefOid,headRefName,isCrossRepository --jq '.[0]')
          fi
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            PR=$(gh pr list --repo "$REPO" --state open \
              --json number,labels,body,title,headRefOid,headRefName,isCrossRepository \
              --jq ".[] | select(.headRefOid==\"$HEAD_SHA\")")
          fi
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            echo "No open PR for $BRANCH"
            exit 0
          fi
          NUM=$(echo "$PR" | jq -r '.number')
          # CWE-862 guard: a branch name matching an agent prefix is not proof of
          # origin — anyone can name a fork branch `task/1-anything`. isCrossRepository
          # comes from the live PR object via the API, not from the (attacker-
          # controlled) branch string, so this can't be spoofed the same way.
          IS_FORK=$(echo "$PR" | jq -r '.isCrossRepository // false')
          if [[ "$IS_FORK" == "true" ]]; then
            echo "PR #$NUM is from a fork — refusing to auto-label."
            exit 0
          fi
          HAS=$(echo "$PR" | jq '[.labels[].name] | index("automerge-agent") != null')
          if [[ "$HAS" == "true" ]]; then
            echo "PR #$NUM already labeled automerge-agent"
            exit 0
          fi
          TEXT=$(echo "$PR" | jq -r '.body + "\n" + .title')
          # Not -q: under `set -o pipefail` (set above) -q exits at the first match,
          # printf takes SIGPIPE and the pipeline reports 141 -- so a body near
          # GitHub's 65,536-char cap can read as unlinked: the threshold is
          # grep-version-dependent (~56KB on GNU grep 3.11, ~131KB on 3.8), so it
          # can sit below that cap. Redirecting lets grep drain stdin.
          if ! printf '%s' "$TEXT" | grep -Ei '(fixes|closes|resolves)[[:space:]]+#[0-9]+' >/dev/null; then
            echo "PR #$NUM not issue-linked — skipping autolabel"
            exit 0
          fi
          # Label simplification 2026-09: no label-based human gate remains.
          # Merge-time safety is path-based: verify_agent_automerge_pr.py runs in
          # agent-pr-automerge.yml before auto-merge is enabled (deny-list covers
          # digikey/, brokers/, live-trading, workflows). Autolabel itself only
          # marks CI-green agent PRs as candidates.
          HEAD_BRANCH=$(echo "$PR" | jq -r '.headRefName')
          HEAD_SHA=$(echo "$PR" | jq -r '.headRefOid')
          if ! python3 scripts/agent_pr_checks.py "$REPO" "$NUM" "$HEAD_BRANCH" "$HEAD_SHA"; then
            echo "Agent CI gate not satisfied for PR #$NUM — skipping autolabel"
            exit 0
          fi
          gh pr edit "$NUM" --repo "$REPO" --add-label "automerge-agent"
          echo "Added automerge-agent to PR #$NUM"
