name: "Pipeline: Olympus research"

# Unified Atlas+Hermes daily cron (replaces atlas-baseline/delta/monthly/fed-odds).
# Single daily cadence + optional workflow_dispatch refresh_scope.
# Tunables: .github/olympus-pipeline.yml.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "Force full rewrites (none|all|segments|hermes|digest|beliefs)."
        type: choice
        options:
          - none
          - all
          - segments
          - hermes
          - digest
          - beliefs
        default: none
      run_date:
        description: "Logical run date (YYYY-MM-DD). Defaults to today UTC."
        required: false
        default: ""
      dry_run:
        description: "Compile + validate inputs only (no LLM calls / no writes)."
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: "Resume a prior run's checkpoints (its GITHUB_RUN_ID). Empty = fresh run."
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: olympus-pipeline
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      refresh_scope: ${{ steps.decide.outputs.refresh_scope }}
      run_date: ${{ steps.decide.outputs.run_date }}
    steps:
      - name: Decide refresh scope and run date
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REFRESH_SCOPE: ${{ inputs.refresh_scope }}
          INPUT_RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail

          today_dow=$(date -u +%u)   # 1=Mon .. 7=Sun

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_REFRESH_SCOPE:-}" ]; then
            refresh_scope="${INPUT_REFRESH_SCOPE}"
          elif [ "$today_dow" -eq 7 ]; then
            refresh_scope="all"
          else
            refresh_scope="none"
          fi

          if [ -n "${INPUT_RUN_DATE:-}" ]; then
            run_date="${INPUT_RUN_DATE}"
          else
            run_date="$(date -u +%Y-%m-%d)"
          fi

          {
            echo "refresh_scope=$refresh_scope"
            echo "run_date=$run_date"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: refresh_scope=$refresh_scope run_date=$run_date"

  run:
    needs: resolve
    runs-on: ubuntu-latest
    # 240 min — full-refresh worst case: 3 outer attempts x in-process LLM retry (#461).
    timeout-minutes: 240
    env:
      REFRESH_SCOPE: ${{ needs.resolve.outputs.refresh_scope }}
      RUN_DATE: ${{ needs.resolve.outputs.run_date }}
    steps:
      - name: Check out Olympus source
        uses: actions/checkout@v4
        with:
          ref: main   # scheduled triggers fire from default branch; code pinned to main (#814)

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # From the lockfile in the checked-out tree (`main`) — see #1717/#1721.
      #
      # This job takes the workspace-wide sync rather than `--package digiquant`
      # like its sibling pipelines, because its dependencies span two members:
      # `install-workspace.sh digiquant` pulled in digigraph among others, and the
      # resume path (#665) needs `langgraph-checkpoint-postgres`, which is declared
      # as digigraph's `checkpoint-postgres` extra. `uv sync` accepts only one
      # `--package`, so there is no narrower command that covers both — and the
      # research chain imports across members at runtime anyway.
      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Load pipeline configuration
        run: |
          uv run --frozen --no-sync python3 -c "
          import yaml
          with open('.github/olympus-pipeline.yml') as fh:
              cfg = yaml.safe_load(fh) or {}
          for key, value in (cfg.get('env') or {}).items():
              print(f'{key}={value}')
          " >> "$GITHUB_ENV"

      - name: Ingest Fed rate-decision odds
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # transition (#1090): legacy names fed from the same secrets until readers migrate
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=(
            uv run --frozen --no-sync python -m digiquant prices fetch-macro
            --sources fedprob
            --manifest digiquant/src/digiquant/olympus/atlas/config/macro_series.yaml
          )
          if [ "${DRY_RUN:-}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--supabase)
          fi
          "${ARGS[@]}" || echo "::warning::Fed rate-decision odds ingest failed (fail-soft) — pipeline continues"

      - name: Validate AI provider routing
        # Hard ceiling for the whole preflight LLM probe block (#2531). A hung provider must
        # fail this step cleanly, not burn the job's 240-minute timeout → cancelled.
        timeout-minutes: 10
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # transition (#1090): legacy names fed from the same secrets until readers migrate
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Per-attempt read timeout for digillm during preflight only (#2528/#2531). The real
          # pipeline run step keeps digillm's 600s default.
          DIGILLM_REQUEST_TIMEOUT_SECONDS: "20"
          # Same pool as the "Run Olympus research pipeline" step below (#1622). OPENROUTER_ALLOWED_MODELS
          # is applied in-process by validate-providers.py via apply_olympus_openrouter_env() — same
          # as Hermes chain startup (#2532). Fallback routing applies to the initial request as well
          # as empty-response retries (#2540); check_openrouter_function_tools() surfaces model
          # substitution instead of hard-failing when it matches production tolerance.
          OPENROUTER_FALLBACK_MODELS: &olympus_openrouter_fallback_models "deepseek/deepseek-v4-flash,deepseek/deepseek-v4-pro,meta-llama/llama-4-maverick"
        run: |
          uv run --frozen --no-sync python digiquant/scripts/atlas/validate-providers.py --skip-dry-run

      - name: Run Olympus research pipeline
        id: run
        # Bound under the job's 240m cap so a hung attempt fails this step
        # (artifacts / outcome report still run) instead of cancelling the job (#3426).
        timeout-minutes: 210
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # transition (#1090): legacy names fed from the same secrets until readers migrate
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # #1622: provider-error fallback chain. digillm attaches models+route=fallback to
          # every openrouter/ request when this is set (primary call, not only empty retries).
          # That covers provider errors (5xx, rate limits, endpoint refusals) — not empty 200s
          # with blank content (#2520). Cheap→capable, all endpoint-gate-verified.
          OPENROUTER_FALLBACK_MODELS: *olympus_openrouter_fallback_models
          DRY_RUN: ${{ inputs.dry_run }}
          DIGI_CHECKPOINTER_POSTGRES_URI: ${{ secrets.DIGI_CHECKPOINTER_POSTGRES_URI }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: olympus-daily
          # WP10.1 (#2758): post-H9 immutable shadow allocation JSON under artifacts/
          # (uploaded below). Export is fail-soft; disable with OLYMPUS_SHADOW_ARTIFACT_MODE=off.
          OLYMPUS_SHADOW_ARTIFACT_MODE: export
          OLYMPUS_SHADOW_ARTIFACT_DIR: artifacts
        run: |
          mkdir -p artifacts
          set -o pipefail

          MAX_OUTER_ATTEMPTS=3
          OUTER_BACKOFF=(0 300 900)
          attempt=1
          while : ; do
            sleep "${OUTER_BACKOFF[$((attempt-1))]}"
            echo "── Pipeline attempt ${attempt}/${MAX_OUTER_ATTEMPTS} (daily refresh_scope=${REFRESH_SCOPE}) ──"
            # Thread the loop counter into the process so each attempt's diagnostics row is
            # keyed per-attempt instead of overwriting the previous one (#1762). GITHUB_RUN_ID
            # is identical across these attempts and stays the resume handle, so the attempt
            # number is the only thing that can distinguish them. Exported (not an assignment
            # prefix on CMD) because CMD is invoked through a pipe into `tee`.
            export OLYMPUS_ATTEMPT="${attempt}"
            CMD=(uv run --frozen --no-sync python -m digiquant.olympus.hermes.chain
                 --cadence daily
                 --run-date "${RUN_DATE}"
                 --refresh-scope "${REFRESH_SCOPE}")
            [ "${DRY_RUN:-}" = "true" ] && CMD+=(--dry-run)
            [ -n "${RESUME_RUN_ID:-}" ] && CMD+=(--resume-run-id "${RESUME_RUN_ID}")
            if "${CMD[@]}" 2>&1 | tee -a artifacts/run.log; then
              break
            fi
            if [ "${attempt}" -ge "${MAX_OUTER_ATTEMPTS}" ]; then
              echo "Pipeline failed after ${MAX_OUTER_ATTEMPTS} attempts."
              exit 1
            fi
            attempt=$((attempt + 1))
          done

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olympus-daily-${{ needs.resolve.outputs.refresh_scope }}-${{ needs.resolve.outputs.run_date }}
          # Includes run.log and WP10.1 shadow-allocation-*.json when H9 completed.
          path: artifacts/
          retention-days: ${{ needs.resolve.outputs.refresh_scope == 'all' && 90 || 30 }}

      # `if: failure() || cancelled()` — NOT `if: failure()` (#1733/#1763). A job that blows
      # the 240-minute `timeout-minutes` is *cancelled*, not failed, so for every silent
      # timeout this step never ran and nothing was ever reported: the run simply vanished.
      # `job.status` distinguishes the two so one step serves both, and the failure title is
      # byte-identical to before, keeping the exact-title issue dedupe below working.
      - name: Report pipeline outcome
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Anything that is not an explicit cancellation is reported as a failure — an
          # unrecognised status must degrade to today's behaviour, never to silence.
          case "${JOB_STATUS:-}" in
            cancelled) OUTCOME="cancelled" ;;
            *)         OUTCOME="failure" ;;
          esac
          TITLE="olympus-daily-${OUTCOME}"
          mkdir -p artifacts
          if [ -f artifacts/run.log ]; then
            tail -n 200 artifacts/run.log > artifacts/tail.log
          else
            printf '(no log captured)\n' > artifacts/tail.log
          fi

          # Best-effort read of the chain CLI's final JSON summary. This workflow runs from the
          # default branch while the code is pinned to `main` above, so the summary may be an
          # older shape (no `status` key) or absent entirely on an early crash / timeout.
          # Never fail the job over it.
          cat > "${RUNNER_TEMP:-/tmp}/read_outcome.py" <<'PY'
          """Print the chain CLI's final JSON summary as `key=value` pairs, or nothing."""
          import json
          import pathlib

          log = pathlib.Path("artifacts/run.log")
          if log.is_file():
              for line in reversed(log.read_text(errors="replace").splitlines()):
                  line = line.strip()
                  if not (line.startswith("{") and line.endswith("}")):
                      continue
                  try:
                      payload = json.loads(line)
                  except ValueError:
                      continue
                  summary = payload.get("summary") if isinstance(payload, dict) else None
                  if not isinstance(summary, dict):
                      continue
                  keys = ("status", "degraded", "book_materialized", "book_committed")
                  print(" ".join(f"{k}={summary[k]}" for k in keys if k in summary))
                  break
          PY
          OUTCOME_LINE=$(python3 "${RUNNER_TEMP:-/tmp}/read_outcome.py" 2>/dev/null || true)
          [ -n "${OUTCOME_LINE// /}" ] || OUTCOME_LINE="(no structured outcome recorded)"

          FAILED_STEP=$(gh run view "$RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name][0] // "unknown"' \
            2>/dev/null || echo "unknown")
          LAST_OK=$(gh run list --workflow="$WORKFLOW_NAME" --status=success --limit=1 \
            --json updatedAt --jq '.[0].updatedAt // "unknown"' 2>/dev/null || echo "unknown")

          LAST_OK_REL="never recorded"
          if [ "$LAST_OK" != "unknown" ]; then
            if LAST_OK_EPOCH=$(date -u -d "$LAST_OK" +%s 2>/dev/null); then
              DELTA_SEC=$(( $(date -u +%s) - LAST_OK_EPOCH ))
              if [ "$DELTA_SEC" -lt 86400 ]; then
                LAST_OK_REL="$(( DELTA_SEC / 3600 )) hours ago"
              else
                LAST_OK_REL="$(( DELTA_SEC / 86400 )) days ago"
              fi
            else
              LAST_OK_REL="age unknown"
            fi
          fi

          if [ "$OUTCOME" = "cancelled" ]; then
            LEAD='Olympus daily run was CANCELLED on %s (refresh_scope=%s) — most likely the 240-minute job timeout, otherwise an operator cancel.\n\n'
          else
            LEAD='Olympus daily run failed on %s (refresh_scope=%s).\n\n'
          fi

          {
            # shellcheck disable=SC2059  # LEAD is a trusted local format string
            printf "$LEAD" "$RUN_DATE" "$REFRESH_SCOPE"
            printf '**Last step reached:** %s\n' "$FAILED_STEP"
            printf '**Chain outcome:** %s\n' "$OUTCOME_LINE"
            printf '**Last successful run:** %s (%s)\n' "$LAST_OK" "$LAST_OK_REL"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '**On-call:** see [RUNBOOK](%s/blob/develop/digiquant/src/digiquant/olympus/atlas/docs/RUNBOOK.md) §"Atlas job failure triage".\n\n' "$REPO_URL"
            printf '<details><summary>Last 200 log lines</summary>\n\n```\n'
            cat artifacts/tail.log
            printf '\n```\n\n</details>\n'
          } > artifacts/issue-body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq '[.[] | select(.title == "'"$TITLE"'")][0].number' || echo "")
          # Fail-soft: reporting an outcome must never itself decide the job's conclusion.
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file artifacts/issue-body.md \
              || echo "::warning::could not comment on #${EXISTING}; outcome report dropped"
          else
            gh issue create --title "$TITLE" --body-file artifacts/issue-body.md \
              --label "ci:failure" \
              || echo "::warning::could not create ${TITLE}; outcome report dropped"
          fi
