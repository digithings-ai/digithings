name: "Test: digiclaw"

# Installs from the committed uv.lock rather than resolving fresh (#1714).
#
# Verified equivalent: "5 passed" on develop under pip (run 30503444075) and
# 5 passed from the lock.
#
# The four hand-ordered `pip install -e` lines collapse into one sync: the lock
# already records that digiclaw needs digibase, digikey and digismith, so the
# install order no longer has to be spelled out and kept correct by hand.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Ruff
        run: uv run --frozen --no-sync ruff check digiclaw/src

      - name: Pytest
        run: uv run --frozen --no-sync pytest tests/dc/ -m unit -v --tb=short
