name: "Agent: quota reset"

# RETIRED 2026-09 (board cleanup): quota parking dropped in favor of Project
# status + explicit manual pickup (`make task ISSUE=N`). Monthly schedule
# disabled; manual dispatch kept as a no-op backstop.
#
# Label simplification 2026-09: exec:* labels deleted; re-dispatch bounces
# agent-task instead. Tier routing lives in scripts/project_routing.json.
#
# Can still be triggered manually via workflow_dispatch, but it will find
# nothing to do unless the labels are recreated.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  QUOTA_STATE_ISSUE: 387

jobs:
  reset:
    name: Clear quota flags + re-dispatch parked tasks
    runs-on: ubuntu-latest
    steps:
      - name: Clear quota flags on state issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
        run: |
          for LABEL in "quota:cursor-exhausted"; do
            gh issue edit "$QUOTA_STATE_ISSUE" --repo "$REPO" --remove-label "$LABEL" 2>/dev/null || true
          done
          gh issue comment "$QUOTA_STATE_ISSUE" --repo "$REPO" --body "\
          **Monthly quota reset — $(date -u +%Y-%m-%d)** — cleared \`quota:*\` flags.
          If either service is still exhausted, re-apply the flag manually."

      - name: Re-dispatch parked cursor tasks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
        run: |
          # Bounce the agent-task label to re-fire dispatch (see
          # agent-dispatch-replay.yml for the dry-run version of this).
          ISSUES=$(gh issue list --repo "$REPO" --state open --label "agent-task" --json number --jq '.[].number')
          for N in $ISSUES; do
            echo "Re-dispatching task #$N"
            gh issue edit "$N" --repo "$REPO" --remove-label "agent-task" || true
            gh issue edit "$N" --repo "$REPO" --add-label "agent-task"
          done
