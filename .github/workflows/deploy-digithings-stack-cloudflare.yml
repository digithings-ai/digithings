# Manual deploy for the digithings-stack Cloudflare Container (Profile A stack:
# digikey + digigraph + digisearch + digivault + LiteLLM under supervisord —
# see cloudflare/digithings-stack-cloudflare/README.md).
#
# Before this file the stack deploy was manual-only (`npx wrangler deploy`
# from cloudflare/digithings-stack-cloudflare/ on a developer machine with
# Docker + `wrangler login`) — verified no workflow anywhere ran it. It stays
# human-approved after it: the `deploy` job runs on `workflow_dispatch` only,
# behind the `production` environment gate; pull requests run the `check` job
# only and can never deploy.
#
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID — NOT
# guaranteed present. Until they are added (Settings -> Secrets and variables
# -> Actions, or `gh secret set`), the deploy job fails closed with a wrangler
# auth error rather than deploying nothing silently. The token needs at least
# Workers Scripts:Edit on the digithings.ai Cloudflare account.
name: "Deploy: digithings-stack (Cloudflare Containers)"

on:
  pull_request:
    paths:
      - "Dockerfile.digithings-stack-cloudflare"
      - "cloudflare/digithings-stack-cloudflare/**"
      - "digiquant/Dockerfile.mcp"
      - "digivault/Dockerfile.mcp"
      - ".github/workflows/deploy-digithings-stack-cloudflare.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: develop tip)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Per-run group: manual deploys may target different refs (inputs.ref), so the
  # newest run is NOT a superset of what it displaces — cancel-in-progress would
  # kill a running approved deploy. Unique-per-run groups never queue (#2541).
  group: deploy-digithings-stack-cloudflare-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        # Root lockfile owns this workspace (cloudflare/*): the stack package
        # has no lockfile of its own, so `npm ci` must run at repo root — in
        # the stack dir it fails with EUSAGE (no package-lock.json there).
        run: npm ci

      - name: Typecheck stack worker
        working-directory: cloudflare/digithings-stack-cloudflare
        run: npx tsc --noEmit

      - name: Test stack worker
        working-directory: cloudflare/digithings-stack-cloudflare
        run: npx vitest run

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [check]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty input falls back to the dispatched branch tip.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Deploy stack container
        working-directory: cloudflare/digithings-stack-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
