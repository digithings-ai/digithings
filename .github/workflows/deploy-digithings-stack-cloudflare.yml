# Manual deploy for the digithings-stack Cloudflare Container (Profile A stack:
# digikey + digigraph + digisearch + digivault + LiteLLM under supervisord —
# see apps/digithings-stack-cloudflare/README.md).
#
# Before this file the stack deploy was manual-only (`npx wrangler deploy`
# from apps/digithings-stack-cloudflare/ on a developer machine with
# Docker + `wrangler login`) — verified no workflow anywhere ran it. Automation
# replaced the manual keyboard, NOT the human: the `deploy` job runs on a merge
# to `main` and on `workflow_dispatch`, always behind the `production`
# environment gate. Pull requests run the `check` job only and can never deploy.
#
# DIG-1569: this file originally triggered on `pull_request` +
# `workflow_dispatch` ONLY — there was no `push` trigger, so a merge to `main`
# deployed nothing at all. On DIG-1484 the fix that retired an unmasked
# customer-PII seed payload was merged as `da88fa71` and production served the
# retiring container (`shared-v16`) for ~19 hours afterwards, with three
# deployments parked on the `production` gate and no alert. The gate is still
# the control that lets Chris stop a deploy; the trigger is what makes the gate
# observable. Do not remove `push` without replacing the merge-to-main deploy
# path, and keep `.github/workflows/production-deploy-gate-watchdog.yml` able to
# see anything that sits on the gate.
#
# The `push` and `pull_request` path filters below are deliberately duplicated
# rather than shared through a YAML anchor: an anchor here is invisible to
# review, and the one thing this file must never do is let the merge path and
# the review path drift apart. `tests/scripts/test_deploy_digithings_stack_cloudflare.py`
# pins the two lists as byte-identical and fails on drift.
#
# Deploy runs from the repo root (`-c apps/digithings-stack-cloudflare/
# wrangler.toml`) — the documented command, and it keeps the relative `-c` path
# and npm workspace resolution unambiguous. The container Docker build context
# itself is NOT the cwd: wrangler resolves it from the config file and defaults
# it to the Dockerfile's directory, so both containers pin
# `image_build_context = "../.."` in wrangler.toml (#4046).
#
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID — NOT
# guaranteed present. Until they are added (Settings -> Secrets and variables
# -> Actions, or `gh secret set`), the deploy job fails closed with a wrangler
# auth error rather than deploying nothing silently. The token needs at least
# Workers Scripts:Edit on the digithings.ai Cloudflare account.
name: "Deploy: digithings-stack (Cloudflare Containers)"

on:
  push:
    branches:
      - "main"
    paths:
      - "Dockerfile.digithings-stack-cloudflare"
      - "apps/digithings-stack-cloudflare/**"
      - "digiquant/**"
      - "digivault/**"
      - "apps/dashboard-api/**"
      - "apps/digichat-cloudflare/**"
      - "Dockerfile.digichat-cloudflare"
      - "apps/digichat/**"
      - "config/**"
      - "infra/**"
      - "scripts/**"
      - "digibase/**"
      - "digiclaw/**"
      - "digifetch/**"
      - "digigraph/**"
      - "digikey/**"
      - "digillm/**"
      - "digismith/**"
      - "digisearch/**"
      - ".github/workflows/deploy-digithings-stack-cloudflare.yml"
      - ".github/workflows/deploy-digichat-cloudflare.yml"
  pull_request:
    paths:
      - "Dockerfile.digithings-stack-cloudflare"
      - "apps/digithings-stack-cloudflare/**"
      - "digiquant/**"
      - "digivault/**"
      - "apps/dashboard-api/**"
      - "apps/digichat-cloudflare/**"
      - "Dockerfile.digichat-cloudflare"
      - "apps/digichat/**"
      - "config/**"
      - "infra/**"
      - "scripts/**"
      - "digibase/**"
      - "digiclaw/**"
      - "digifetch/**"
      - "digigraph/**"
      - "digikey/**"
      - "digillm/**"
      - "digismith/**"
      - "digisearch/**"
      - ".github/workflows/deploy-digithings-stack-cloudflare.yml"
      - ".github/workflows/deploy-digichat-cloudflare.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: main tip — promote to main first)"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  # Per-run group, unchanged from before this PR and unchanged for the same reason.
  # #2541: a shared group + `environment: production` + cancel-in-progress: false
  # means an unapproved run does not delay the workflow, it STOPS it -- every later
  # run is evicted from the group's single pending slot and reports `cancelled` with
  # zero jobs, which reads like a cancelled deploy rather than one that never ran.
  # db-migrate lost 15 days and migrations 066-070 that way.
  #
  # I changed this to a per-ref group on the reasoning that two merges in quick
  # succession would race two `wrangler deploy`s onto the same container name. That
  # is a real hazard, and this change is still the wrong fix for it: a per-ref group
  # restores the #2541 starvation, and with a push trigger it would now do it on the
  # common path -- one unapproved merge to main parks every deploy behind it.
  # tests/scripts/test_workflow_environment_concurrency.py enforces the rule repo-wide
  # and failed this branch, correctly.
  #
  # The serialising race between two merges is real and is NOT solved here: nothing
  # in this file mutual-excludes two `production` deployments, and the group above is
  # per-run by design. An earlier draft claimed the environment gate bounds it; that
  # is wrong -- GitHub environments gate each deployment independently and do not
  # exclude one another, so two approved merges can run `wrangler deploy` against the
  # same container name at once. Fixing it needs a shared group or a deploy-level
  # lock, each of which trades against #2541, so it is separate work with its own
  # test rather than a drive-by inside a production-trigger change.
  group: deploy-digithings-stack-cloudflare-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # ── Validation only. Runs on every trigger, deploys nothing. ────────────────
  # Its steps are duplicated in `check-deploy-gate` rather than shared through a
  # composite action on purpose: the pull_request path must be readable on its
  # own as "this cannot deploy", with no shared job whose steps could later grow
  # a deploy command.
  check:
    name: "check (pull request — validation only)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        # Root lockfile owns this workspace (apps/*, packages/*): the stack package
        # has no lockfile of its own, so `npm ci` must run at repo root — in
        # the stack dir it fails with EUSAGE (no package-lock.json there).
        run: npm ci

      - name: Typecheck stack worker
        working-directory: apps/digithings-stack-cloudflare
        run: npx tsc --noEmit

      - name: Test stack worker
        working-directory: apps/digithings-stack-cloudflare
        run: npx vitest run

  # ── The gate that decides whether a deploy is allowed to start. ─────────────
  # Same checks as `check`, on the ref that will actually be deployed. A failed
  # gate skips the deploy job below, so a red typecheck on main cannot reach
  # production.
  check-deploy-gate:
    name: "check (deploy gate)"
    if: github.event_name != 'pull_request'
    # Deliberately no `needs`. `check` is pull_request-only, and a skipped need
    # skips everything downstream: with `needs: [check]` here, merging to main
    # skipped `check`, which skipped this job, which skipped `deploy` -- the exact
    # DIG-1569 failure, reproduced inside its own fix. `actionlint` does not catch
    # it, and the repo's own ci.yml only gets away with depending on path-filtered
    # jobs because its consumer declares `if: always()`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch may target inputs.ref; on push it is always the pushed sha.
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck stack worker
        working-directory: apps/digithings-stack-cloudflare
        run: npx tsc --noEmit

      - name: Test stack worker
        working-directory: apps/digithings-stack-cloudflare
        run: npx vitest run

  deploy:
    name: "deploy (production)"
    # Merge to main, or an explicit manual dispatch. Never a pull request.
    # The `production` environment below is the human-approval control — a
    # reviewer (Chris) still has the last word, so automation here does not
    # remove the gate, it only stops the gate from silently holding a deploy
    # for a day. production-deploy-gate-watchdog.yml alerts when it does.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [check-deploy-gate]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default input is main: a no-input dispatch ships the promoted tip.
          # On push, inputs.ref is unset, so this is github.sha — the exact
          # commit the gate above validated.
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Deploy stack container
        # Root cwd + relative -c: wrangler resolves image / image_build_context
        # relative to the config file, and both containers pin the build
        # context to the repo root in wrangler.toml (image_build_context).
        # Never add working-directory here — `npm ci` and the -c path assume
        # the repo root (#4046).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c apps/digithings-stack-cloudflare/wrangler.toml
