# Public CI for the open-source repository (#6751, D-G4).
#
# This file is the whole of this repository's CI. The public R0 core used to be
# exported from a private monorepo, and this same file ran there against the
# full tree; that export is retired and the split repositories (R1-R7, see
# docs/REPO_MAP.md) each carry their own lanes. There is no upstream copy of
# this workflow to stay in step with, and nothing here is skipped on the
# grounds that "the monorepo runs its own CI".
#
# Fork-safe by construction: the trigger is `pull_request`, never
# `pull_request_target`, so a fork's code runs with a read-only token and no
# secrets. The private-terms step needs the R0_PRIVATE_TERMS secret and skips
# itself when the secret is not there (fork PRs).
name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.scope.outputs.public }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/split
      - id: scope
        run: |
          # Retained guard for the retired export tree, which carried
          # scripts/split/manifest.py. R0 has no such file, so this repository
          # always takes the `public=true` branch and runs every job below.
          if [ -f scripts/split/manifest.py ]; then
            echo "Export tree checkout: public CI is skipped here."
            echo "public=false" >> "$GITHUB_OUTPUT"
          else
            echo "public=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: scope
    if: needs.scope.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.24"
          enable-cache: true
      - name: Install lint tooling from lockfile
        run: uv sync --frozen --all-packages
      - name: Ruff
        run: |
          uv run --frozen --no-sync ruff check \
            digibase/src digibot/src digigraph/src digiquant/src \
            digisearch/src digitrace/src tests
      - name: Private terms
        env:
          R0_PRIVATE_TERMS: ${{ secrets.R0_PRIVATE_TERMS }}
        run: |
          if [ -z "$R0_PRIVATE_TERMS" ]; then
            echo "R0_PRIVATE_TERMS is not available (fork PR): skipped."
            exit 0
          fi
          python3 scripts/check_r0_private_terms.py

  secrets:
    needs: scope
    if: needs.scope.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned gitleaks OSS CLI release and the checksum of its
      # gitleaks_<version>_linux_x64.tar.gz asset. Bump both together.
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Example-credential guard
        run: python3 scripts/check_example_credentials.py
      - name: Personal data in tracked payloads
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_pii_seed_payloads.py --base "origin/${GITHUB_BASE_REF}" --head HEAD
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # An idempotent GET of an immutable asset, checksum-verified below,
          # so retrying every error is safe.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 -o /tmp/gitleaks.tgz "$url"
          actual="$(sha256sum /tmp/gitleaks.tgz | awk '{print $1}')"
          if [ "$actual" != "$GITLEAKS_SHA256" ]; then
            echo "checksum mismatch: expected $GITLEAKS_SHA256 got $actual" >&2
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: |
          range=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range=(--log-opts="--no-merges origin/${GITHUB_BASE_REF}..HEAD")
          fi
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner "${range[@]}"

  unit:
    needs: scope
    if: needs.scope.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.24"
          enable-cache: true
      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras
      - name: Git identity for hook tests
        run: |
          git config --global user.name "digithings CI"
          git config --global user.email "ci@digithings.ai"
      - name: Unit tests
        # The Nautilus-gated files abort when they share a process with the
        # rest of the suite (exit 134, #42), so they run in the next step.
        run: |
          uv run --frozen --no-sync pytest tests -m unit --tb=short -o addopts="" \
            --ignore=tests/dq/test_api.py --ignore=tests/dq/test_audit.py \
            --ignore=tests/dq/test_balance_path_metrics.py --ignore=tests/dq/test_backtest.py \
            --ignore=tests/dq/test_calibrations_loader.py --ignore=tests/dq/test_charts.py \
            --ignore=tests/dq/test_honesty_series.py --ignore=tests/dq/test_nautilus_runner.py \
            --ignore=tests/dq/test_pipeline_graph.py --ignore=tests/dq/test_strategies.py \
            --ignore=tests/dq/test_tearsheet_isolation.py --ignore=tests/dq/test_v1_jobs.py \
            --ignore=tests/dq/data/test_levels_nautilus.py --ignore=tests/dq/replay
      - name: Nautilus-gated unit tests
        run: |
          uv run --frozen --no-sync pytest -m unit --tb=short -o addopts="" \
            tests/dq/test_api.py tests/dq/test_audit.py tests/dq/test_balance_path_metrics.py \
            tests/dq/test_backtest.py tests/dq/test_charts.py \
            tests/dq/test_honesty_series.py tests/dq/test_nautilus_runner.py \
            tests/dq/test_pipeline_graph.py tests/dq/test_v1_jobs.py \
            tests/dq/data/test_levels_nautilus.py tests/dq/replay

  no-chroma:
    needs: scope
    if: needs.scope.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.24"
          enable-cache: true
      - name: Install the public runtime without Chroma
        # `all` re-adds Chroma through digisearch[chroma], so exclude both the
        # named extra and the meta-extra. This is the supported public install.
        run: |
          uv sync --frozen --all-packages --all-extras \
            --no-extra chroma --no-extra all
      - name: Assert Chroma is not installed
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.util
          import sys
          if importlib.util.find_spec("chromadb") is not None:
              sys.exit("chromadb is installed in the public no-chroma job")
          PY
      - name: Public digisearch tests without Chroma
        run: |
          uv run --frozen --no-sync pytest tests/ds -m unit --tb=short -o addopts="" -q
