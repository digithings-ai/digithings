name: "Test: digibase"

# Pilot for the uv-workspace cutover (#1714). This gate installs from the
# committed uv.lock instead of resolving fresh, so a new release of a tool
# cannot change what runs here without a lockfile change showing up in a diff.
# The other 26 workflows still use pip; they are converted in a follow-up so the
# pattern is proven on one small gate first.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails if uv.lock is stale rather than silently re-resolving,
      # which is the whole point: CI must not drift from the committed lock.
      # --all-packages is deliberate over --package digibase: tests/conftest.py
      # imports digikey for shared JWT fixtures, and several suites reach across
      # members, so one uniform command avoids per-workflow reasoning about which
      # members a suite touches. Measured at 34s cold, ~0s warm with the cache.
      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Ruff
        run: uv run --frozen --no-sync ruff check digibase/src tests/db

      - name: Unit tests (tests/db + request-id hops)
        run: |
          uv run --frozen --no-sync pytest \
            tests/db tests/integration/test_request_id_hops.py -m unit -v --tb=short
