# E2e contract tests gate PRs via ci.yml workflow_call.
# Full compose stack job is develop push / workflow_dispatch only (non-blocking).
# Requires Docker Compose. Protected routes get a JWT minted from the stack this
# job starts (no stored E2E_BEARER_TOKEN — a stored JWT would expire; #4357).
name: "Test: e2e stack"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "tests/test_e2e.py"
      - "tests/test_e2e_contract.py"
      - "docker-compose.yml"
      - ".github/workflows/test-e2e.yml"

permissions:
  contents: read

jobs:
  e2e-contract:
    name: e2e contract (no stack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Installs from the committed uv.lock rather than resolving fresh (#1715).
      # `cryptography` was redundant here — digikey declares `cryptography>=42`.
      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras
      - run: uv run --frozen --no-sync pytest tests/test_e2e_contract.py -m unit -v --tb=short

  e2e:
    name: pytest -m e2e (compose stack)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Non-blocking on develop: stack + secrets are operator-owned.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The stack itself is built by docker compose from the service Dockerfiles;
      # this env only runs the pytest client against it, so the lock covers it.
      - name: Install test deps from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Start stack
        env:
          # test-only explicit opt-in: compose defaults are now prod-safe
          # (ephemeral=0 + fail-closed). Do not rely on the compose default here.
          DIGIKEY_ALLOW_EPHEMERAL_KEY: "1"
          DIGIKEY_REQUIRE_BLOCKLIST: "0"
        run: |
          cp .env.example .env
          docker compose up -d --wait digigraph digiquant digisearch digikey

      # Protected-route tests need a digikey JWT. Mint one from the stack this job
      # just started and exchange it at /v1/oauth/token. A stored JWT would expire
      # and would have to be rotated by hand; dev_global keys are opt-in, so pass
      # the flag to this exec only.
      - name: Mint a digikey JWT for protected routes
        run: |
          KEY=$(docker compose exec -T -e DIGIKEY_ALLOW_DEV_GLOBAL=1 digikey \
            python -m digikey.cli issue-key \
            --tenant default --label ci-e2e --scopes '*' --kind dev_global \
            | sed -n 's/^api_key=//p')
          if [ -z "$KEY" ]; then
            echo "issue-key printed no api_key line" >&2
            exit 1
          fi
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8005/v1/oauth/token \
            -H 'content-type: application/json' \
            -d "{\"grant_type\":\"api_key\",\"api_key\":\"$KEY\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          if [ -z "$TOKEN" ]; then
            echo "token exchange returned no access_token" >&2
            exit 1
          fi
          echo "E2E_BEARER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "minted a bearer for protected routes (token not logged)"

      - name: Run e2e tests
        run: |
          uv run --frozen --no-sync pytest tests/test_e2e.py -m e2e -v --tb=short

      - name: Tear down
        if: always()
        run: docker compose down -v
