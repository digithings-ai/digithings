name: "Test: digisearch"

# Installs from the committed uv.lock rather than resolving fresh (#1714).
#
# Verified equivalent: "200 passed, 3 skipped" on develop under pip
# (run 30503444075) and 200 passed / 3 skipped from the lock — including the
# `rank_bm25` skip, which is the useful part of that comparison. rank_bm25 is
# declared by no package, so it is absent from the lock and the keyword-search
# test stays skipped exactly as before; syncing the whole workspace does not
# quietly switch that test on.
#
# `pip install cryptography httpx` dropped as redundant: digisearch declares
# `httpx>=0.27` and cryptography arrives via digikey.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Ruff
        run: uv run --frozen --no-sync ruff check digisearch/src

      - name: Pytest
        run: uv run --frozen --no-sync pytest tests/ds/ -m unit -v --tb=short
