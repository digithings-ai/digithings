# Refresh the repository-activity snapshot rendered on digithings.ai.
#
# digithings.ai is a Next.js static export served by Cloudflare Pages, so the
# homepage's activity band cannot fetch GitHub at request time and Cloudflare's build
# has no token to fetch it at build time either. The snapshot is therefore committed,
# and this job is what keeps it from rotting.
#
# It opens a PR rather than pushing: `develop` requires a pull request (checked
# 2026-08-06 — required_pull_request_reviews is set, with 0 approvals), so a direct
# push can only fail. Same shape as pipeline-provider-review.yml, which pushes a
# branch and then opens a PR for exactly this reason.
#
# Branch name is `chore/…` on purpose: ci-pr-hygiene.yml's linkage gate bypasses
# `chore/*` outright, so a generated-data refresh needs no backlog issue to point at.
# The commit is authored by github-actions[bot], which check_review_coverage.py lists
# in BOT_AUTHORS — so the snapshot commit cannot wedge a later promotion into main on
# the "every commit was reviewed" gate.
#
# The snapshot reaches production at the next develop→main promotion, not on merge
# here. That lag is why every surface rendering these figures prints the snapshot
# date: an old snapshot reads as dated rather than as current.
# Production clock: Cloudflare Worker digithings-cron (frontend/digithings-cron). Schedule removed #3579.
name: "Refresh: repo activity snapshot"

on:
  workflow_dispatch:

concurrency:
  group: refresh-repo-activity
  cancel-in-progress: false

permissions:
  contents: write # commits the regenerated snapshot on a chore/ branch
  pull-requests: write # opens the PR for it

jobs:
  refresh:
    name: Regenerate and open a PR
    runs-on: ubuntu-latest
    steps:
      # Pinned, like agent-backlog-snapshot.yml — the other weekly generated-data PR.
      # The cron would check out develop anyway (it is the repo default), but
      # workflow_dispatch accepts any ref carrying this file, and the job then commits
      # on top of whatever it checked out and opens the PR against develop. Dispatched
      # from a divergent branch, that PR would sweep in that branch's unrelated
      # commits alongside the snapshot.
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_repo_activity.py

      - name: Assert the snapshot it just wrote is well-formed and current
        run: python3 scripts/fetch_repo_activity.py --check --max-age-days 1

      - name: Open a PR when the figures moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT: frontend/digithings-web/lib/repo-activity.json
        run: |
          set -euo pipefail
          # Only `generatedAt` changing is not worth a PR — it moves on every run by
          # definition, so committing on that alone would open 52 empty PRs a year.
          if git diff --quiet -- "$SNAPSHOT"; then
            echo "::notice::Snapshot unchanged — nothing to open."
            exit 0
          fi
          if [ "$(git diff --numstat -- "$SNAPSHOT" | awk '{print $1+$2}')" = "2" ] \
             && git diff -U0 -- "$SNAPSHOT" | grep -q '"generatedAt"'; then
            echo "::notice::Only the timestamp moved — no figure changed, skipping."
            exit 0
          fi

          BRANCH="chore/repo-activity-$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already pushed today — leaving it alone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # By path, never `git add -A`: this job's tree can carry other artifacts.
          git add "$SNAPSHOT"
          git commit -m "chore(website): refresh the repo-activity snapshot"
          git push -u origin "$BRANCH"

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(website): refresh the repo-activity snapshot" \
            --body "$(cat <<'BODY'
          Generated by `.github/workflows/refresh-repo-activity.yml` — the committed
          snapshot behind digithings.ai's repository-activity band.

          The site is a static export with no token at build time, so these figures
          have to be committed rather than fetched. Regenerate locally with:

              scripts/fetch_repo_activity.py

          Reaches production at the next develop→main promotion; until then the page
          keeps printing the previous snapshot's date, which is the intended behaviour.
          BODY
          )"
