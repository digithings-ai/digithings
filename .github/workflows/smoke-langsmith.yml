name: "Smoke: LangSmith"

# Dispatch-only readiness check (#687): does the LANGSMITH_API_KEY secret
# authenticate, and do @traceable calls nest under the LangGraph root across
# parallel node threads (the basis for "1 trace per graph, 3 per run")?
# Run this once before enabling LANGSMITH_TRACING on the atlas workflows.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: langsmith-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs from the committed uv.lock rather than resolving fresh (#1715).
      # Replaces install-workspace.sh + `digiquant[atlas]`: the script existed to
      # install siblings in topological order because they are not on PyPI, which
      # a uv workspace handles natively. This job checks out the default ref, so
      # the lock is present — unlike the pipelines pinned to `ref: main`.
      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Run LangSmith smoke
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # Key alone yields zero traces — the flag is required (empirically verified).
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: atlas-langsmith-smoke
        run: |
          uv run --frozen --no-sync python digiquant/scripts/research/smoke_langsmith.py
