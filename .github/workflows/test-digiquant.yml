name: "Test: digiquant"

# Installs from the committed uv.lock rather than resolving fresh (#1714).
#
# THIS LANE DOES NOT USE `--all-extras`, and that is the whole point of the
# comment. Every other converted gate syncs the full workspace; this one must
# not, for two compounding reasons:
#
#   1. `--all-extras` installs `digiquant[nautilus]`. tests/dq/conftest.py drops
#      nine nautilus-importing modules from collection ONLY when the extra is
#      absent (`if importlib.util.find_spec("nautilus_trader") is None`). Install
#      it and those modules come back — collection goes 573 → 1701 items, this
#      lane starts duplicating test-nautilus.yml, and it reopens the SIGABRT
#      (exit 134) that #42 exists to avoid.
#   2. `digiquant[all]` is `["digiquant[nautilus]"]`, so excluding the nautilus
#      extra alone does not work — `--no-extra nautilus` leaves `all` to pull it
#      straight back in. Both would have to be excluded.
#
# So the lane pins its own extras instead of subtracting from everything, which
# also keeps the historical set exact rather than approximately right:
# `[dev,visualization,brokers-alpaca,mcp]` transitively brings research, indicators and m2
# (via dev) plus the optional Alpaca paper SDK for `tests/dq/brokers/` and the
# MCP client SDK for the `digifetch_*` MCP server tests, but not prices, data,
# optimize, otel or nautilus. digibase and digikey arrive as declared
# dependencies of digiquant.
#
# The `mcp` extra is `mcp>=1.2,<2` plus `yfinance>=0.2` and pulls in neither
# nautilus nor otel, so it widens the gate without reopening the #42 SIGABRT.
# It was added for the §7 envelope contract: `tests/dq/data/test_gloomberb_agent_tools.py`
# calls the live MCP wrappers, and while the lane had no `mcp` extra that
# assertion was skipped — the contract stopped being gated in CI (DIG-3427).
#
# Verified equivalent on the K1 tip with ``--extra brokers-alpaca`` included:
# "1031 passed, 48 skipped, 66 deselected" (uv sync --frozen --package digiquant
# --extra dev --extra visualization --extra brokers-alpaca). The historical
# pre-brokers count was 491/18/64 under pip (run 30503444075). For contrast,
# `--all-extras` gave 1534 passed / 13 skipped / 79 deselected — a silent 3x
# widening of the gate (nautilus), which is what this shape avoids.
#
# Verified on the 2026-10-22 tip with `--extra mcp` added: the four
# `tests/dq/test_mcp_*.py` files the lane used to skip now run (195 tests), and
# together with `tests/dq/data/test_gloomberb_agent_tools.py` they give
# "223 passed" in 28.85s. The lane total on that tip is 3999 passed / 87 skipped
# / 4 deselected / 1 xfailed, with 74 failures and 139 errors that predate this
# change — the migrations split (#5854) broke the migration checks, which
# DIG-3427 repairs for the 20 in the S28 shard (PR #6204); the rest are tracked
# separately.
#
# `pip install cryptography pandas` dropped as redundant: both arrive
# transitively (cryptography via digikey, pandas via the research/m2 extras).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure bash, no deps — deliberately ahead of the uv sync so a malformed or
      # colliding migration filename fails in seconds rather than after an install
      # (#1811). The `digiquant/**` filter in ci.yml covers supabase/migrations/**,
      # so every PR touching the chain reaches this step.
      - name: Supabase migration chain guard
        run: bash digiquant/scripts/research/verify-supabase-migrations.sh

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.24"
          enable-cache: true

      # --frozen fails if uv.lock is stale rather than silently re-resolving.
      # Deliberately NOT --all-packages --all-extras — see the header.
      # brokers-alpaca is explicit (not via --all-extras) so tests/dq/brokers/
      # unit tests run against alpaca-py without pulling nautilus (#42).
      # mcp is explicit for the same reason: the digifetch_* MCP wrapper tests
      # need the mcp extra, and it is the one that gates the §7 envelope
      # contract (DIG-3427).
      - name: Install from lockfile (excludes nautilus — see header, #42)
        run: >-
          uv sync --frozen --package digiquant
          --extra dev --extra visualization --extra brokers-alpaca --extra mcp

      - name: Ruff
        run: uv run --frozen --no-sync ruff check digiquant/src

      - name: Pytest
        # Modules transitively importing nautilus_trader are dropped at
        # collection by tests/dq/conftest.py when the extra isn't installed.
        # Those files run in test-nautilus.yml instead (#1501).
        run: uv run --frozen --no-sync pytest tests/dq/ -m unit -v --tb=short

  # The Edge Functions under digiquant/supabase/functions are Deno, so the pytest
  # lane below never loads a line of them. This lane is the only place they run.
  # Kept separate from `test` on purpose: no uv sync, no extras, seconds.
  deno-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned so a local `deno task test` and this lane are the same run.
          deno-version: "v2.9.7"

      - name: Edge Function unit tests
        run: deno task --cwd digiquant/supabase/functions test
