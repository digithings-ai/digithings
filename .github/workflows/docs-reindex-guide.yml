# Reindex the digithings-guide `docs` index on merge to develop.
#
# Keep the `paths:` filter below in sync with `sources:` in
# docs/projects/digithings-guide/indexes/docs.yaml.
#
# Dry-run always runs (resolves globs, parses + chunks in-process via the
# digisearch stub backend). There is no apply step here: `ingest_live` posts an
# absolute filesystem path and sends no auth header, so it only works when
# digisearch shares the host (local stack / Cursor Cloud). Run it by hand there —
# `DIGISEARCH_URL=http://127.0.0.1:8002 python scripts/reindex_digithings_guide.py
# --apply` (see the script docstring). Hosted `search.digithings.ai` is JWT-gated
# and cannot read this runner's filesystem. Removed in #4357.
name: "Docs: reindex guide"

on:
  push:
    branches: [develop]
    paths:
      - README.md
      - ROADMAP.md
      - ARCHITECTURE.md
      - AGENTS.md
      - CONTRIBUTING.md
      - RELEASES.md
      - SECURITY.md
      - BRANCHING.md
      - docs/VISION.md
      - docs/adr/*.md
      - digibase/ARCHITECTURE.md
      - digibase/AGENTS.md
      - digibase/README.md
      - digibase/DIGI*.md
      - digichat/ARCHITECTURE.md
      - digichat/AGENTS.md
      - digichat/README.md
      - digichat/DIGI*.md
      - digiclaw/ARCHITECTURE.md
      - digiclaw/AGENTS.md
      - digiclaw/DIGI*.md
      - digigraph/ARCHITECTURE.md
      - digigraph/AGENTS.md
      - digigraph/DIGI*.md
      - digikey/ARCHITECTURE.md
      - digikey/AGENTS.md
      - digikey/README.md
      - digikey/DIGI*.md
      - digiquant/ARCHITECTURE.md
      - digiquant/AGENTS.md
      - digiquant/DIGI*.md
      - digisearch/ARCHITECTURE.md
      - digisearch/AGENTS.md
      - digisearch/DIGI*.md
      - digismith/ARCHITECTURE.md
      - digismith/AGENTS.md
      - digismith/DIGI*.md
      - docs/projects/digithings-guide/**
      - scripts/reindex_digithings_guide.py
      - .github/workflows/docs-reindex-guide.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs from the committed uv.lock rather than resolving fresh (#1715).
      # The workspace sync supersedes the hand-listed pyyaml + digisearch
      # [ingestion] install: [ingestion] supplies the parser deps (base is light
      # post-#633), and the script talks to the running service over HTTP, so no
      # [server] runtime is required — both extras are in the lock either way.
      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Reindex (dry-run)
        env:
          DIGISEARCH_ALLOW_STUB: "1"
        run: uv run --frozen --no-sync python scripts/reindex_digithings_guide.py
