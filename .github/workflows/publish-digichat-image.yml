# Publishes the digichat image to GHCR, bound to the commit its release tag names.
#
# WHAT THIS LANE IS (DIG-1294 — restoring the build lane, lane A of DIG-1242)
# -------------------------------------------------------------------------
# It builds and publishes an image. It cannot promote anything: there is no
# `azure/login`, no `az`, no `environment:` and deliberately no
# `id-token: write` below, so this workflow holds no credential that could reach
# a customer Container App. The DataTap ACA promotion is a human step run from
# docs/ops/digichat-datatap-aca.md. That is the whole point of lane A — the
# artifact is reproducible in CI, the production write stays with a person who
# owns the Azure subscription. Adding `azure/login` here would be a different
# lane (and a different security decision, DIG-1349) and must not be an
# "improvement" to this file.
#
# WHY A TAG PUSH IS THE ONLY AUTOMATIC TRIGGER
# --------------------------------------------
# The release moment is the `digichat-vX.Y.Z` tag, so that is the only trigger
# that can produce a bound image: it names a version, and it resolves to exactly
# one commit. The pre-deletion workflow also fired on `push: branches: [main]`
# as a backstop for "a version reached main without its tag push being rerun".
# That backstop is *harmful* here, and removing it is the substantive change
# from the deleted file. A main-push build would publish `v2.4.0` labelled with
# main's commit; the tag's idempotency guard would then skip the tag build, and
# the release tag would name a commit no published image was built from — the
# exact image→commit hole DIG-1242 exists to close, re-opened by the safety net.
# One tag, one image, one commit.
#
# The old file's header also explained that a release-please-cut tag could not
# start it, because events raised by GITHUB_TOKEN do not create runs (#4348), so
# release-please dispatched it instead. release-please-digichat.yml was deleted
# in the same strict-essentials cut (`f54af7052`, #4919) and is not coming back:
# digichat versions are hand-bumped on develop. So the tag is now cut by a
# person with a real credential, and `push.tags` works as written.
#
# THE SECOND PATH: A REF BUILD IS NOT A RELEASE
# -------------------------------------------
# `workflow_dispatch` takes a `ref` as well as a `tag`, and the two build
# different artifacts. A tag build is a release: one version, one commit, and
# the two names `vX.Y.Z` and `latest`. A ref build is a rehearsal artifact, and
# it publishes exactly one name, `sha-<12 chars of the commit>`. It never takes
# a `vX.Y.Z` name and it never moves `latest`, for the reason the paragraph
# above gives: a name that is not the release tag's must not claim to be.
#
# The path exists because the runbook's Step 1 rehearsal needs an artifact to
# promote, and `digichat-v2.4.0` does not exist. Cutting that tag is a release
# decision, not a deploy step, so without a ref path the only images this lane
# could ever produce are for releases that have already shipped.
#
# What is NOT added is a branch trigger. A build on every merge to develop
# would cost a full Next.js build per merge to publish an artifact nobody asked
# for. The rehearsal is requested deliberately, by a person, when it is wanted.
#
# WHAT IT REFUSES TO DO
# ---------------------
# * Publish when the tag's version differs from apps/digichat/package.json — a
#   hand-made or mismatched tag must not mint a plausible-looking release image.
#   The version is read from the *tag's tree*, because the checkout is pinned to
#   that tag; reading it from develop is how you audit the wrong artifact.
# * Overwrite an existing tag. There is no `force` input, deliberately: a
#   release tag is the identity clients cite, and re-pushing it would change the
#   digest under that name. To replace a broken image, cut a new patch version.
#   The check below distinguishes "absent" from "could not ask" and fails on
#   the second rather than treating it as the first.
# * Run on a schedule. develop has zero `on.schedule` keys, pinned by
#   tests/scripts/test_no_gha_schedules.py.
#
# It also proves its own output before exiting, twice. Before the push: the
# image is booted on the runner and watched until `/healthz` answers 200 with
# `ok=true` and `/api/health` reports the version it was built as. After the
# push: it is pulled back and run through
# scripts/check_digichat_image_binding.py, so a Dockerfile that silently
# stopped emitting `org.opencontainers.image.revision` fails this lane instead
# of being discovered at the next promotion.
#
# That order is the point, and it is not defensive tidiness. Prod digichat is a
# Single-revision Container App: there is no traffic shift and no automatic
# rollback, so a bad revision is an outage until a person notices. And a
# release tag here is immutable — to replace a broken image you cut a new patch
# version — so CI cannot undo its own bad publish. An image that cannot serve
# `/healthz` has to fail here, where the cost is a red run, and not in East US
# 2, where the cost is the customer.
#
# OPERATOR NOTE - the GHCR package already exists, and it is private
# -------------------------------------------------------------------
# Measured 2026-10-09 with `gh api /orgs/digithings-ai/packages/container/digichat`:
# id 13179652, package_type container, visibility `private`, 28 versions,
# created 2026-07-05, last published 2026-09-21 (tags `v2.3.2` and `latest`).
#
# An earlier revision of this note claimed the package did not exist, on the
# strength of a 401 from an anonymous `docker pull` and an empty package list
# filtered to `visibility=public`. Neither measurement can tell a PRIVATE
# package from an ABSENT one: a 401 means "authentication required", not "no
# such package". Do not repeat that inference; check the authenticated route.
#
# So this lane appends to an existing private package rather than creating one.
# Do not change that package's visibility from here: publishing it would put
# 28 existing release digests behind anonymous pull, and whether an anonymous
# install path is wanted at all is the repository owner's call - not a side
# effect of this lane landing.
name: "Publish: digichat image"

on:
  push:
    tags:
      - "digichat-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. digichat-v2.4.0). Leave empty when using ref."
        required: false
        type: string
      ref:
        description: "Branch or sha to build a rehearsal image from (e.g. develop). Leave empty when using tag."
        required: false
        type: string

# Queue, do not cancel: a publish already halfway through pushing must not be
# killed by a second run of the same tag.
concurrency:
  group: publish-digichat-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so the release tag is present and `git rev-list -n1 <tag>`
      # can resolve it — the binding check needs the tag's commit, and a shallow
      # clone of the tag would not have it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve what to build, and what the image is called
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          image_repo="ghcr.io/digithings-ai/digichat"
          tag="${INPUT_TAG:-}"
          ref="${INPUT_REF:-}"

          # A TAG PUSH IS THE RELEASE TRIGGER, and inputs.tag is only ever set by
          # workflow_dispatch. On the push event this lane therefore fell through to
          # the rehearsal branch and published sha-<commit> instead of the release
          # name: run 39541165954, the digichat-v2.6.4 tag push, probed
          # ghcr.io/digithings-ai/digichat:sha-800f5e89a419 and never v2.6.4, so
          # the release name was never even attempted. On a push, the tag is the
          # ref the event carries.
          if [ -z "$tag" ] && [ -z "$ref" ] && [ "$EVENT_NAME" = "push" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME:-}"
            tag="${tag#refs/tags/}"
            echo "Tag push: releasing ${tag}."
          fi

          if [ -n "$tag" ] && [ -n "$ref" ]; then
            echo "::error::set 'tag' or 'ref', not both: a release tag names one version and one commit, a ref names neither."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$tag" ] && [ -z "$ref" ]; then
            echo "::error::set 'tag' to publish a release image, or 'ref' (e.g. develop) to build a rehearsal image."
            exit 1
          fi

          # Read from the checked-out tree, which is pinned to the tag or ref.
          version="$(jq -r .version apps/digichat/package.json)"

          if [ -n "$tag" ]; then
            # Same shape as TAG_RE in scripts/check_digichat_image_binding.py, so
            # the lane and the checker cannot disagree about what a release tag is.
            if ! [[ "$tag" =~ ^digichat-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$tag is not a digichat-vX.Y.Z release tag — refusing to publish."
              exit 1
            fi
            tag_version="${tag#digichat-v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::$tag does not match apps/digichat/package.json ($version) — refusing to publish."
              exit 1
            fi
            # The image is built from the CHECKED-OUT tree, so the commit the
            # image is labelled with has to be the commit that tree is at. The
            # tag ref the checkout fetched is resolved once more only to prove
            # the two agree, so the label is always the tree's own commit and
            # never a commit resolved from somewhere else.
            # `|| true` so the emptiness checks below are reachable: under `set -e`
            # a bad ref would abort the step with git's own `fatal: ambiguous
            # argument` before this diagnostic could explain what went wrong.
            commit="$(git rev-parse HEAD 2>/dev/null || true)"
            tag_commit="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            if [ -z "$commit" ]; then
              echo "::error::the checked-out tree has no commit (git rev-parse HEAD failed) — there is nothing to bind an image to."
              exit 1
            fi
            if [ -z "$tag_commit" ]; then
              echo "::error::$tag does not resolve to a commit — there is nothing to bind an image to."
              exit 1
            fi
            if [ "$commit" != "$tag_commit" ]; then
              echo "::error::the checked-out tree ($commit) is not the commit of $tag ($tag_commit) — refusing to bind an image to a tree it was not built from."
              exit 1
            fi
            image="${image_repo}:v${version}"
            tags="${image}"$'\n'"${image_repo}:latest"
            mode="release"
            label="$tag"
          else
            # A ref build is a rehearsal artifact, named by the commit it was
            # built from. It never takes `:vX.Y.Z` and never takes `:latest`:
            # those are release names, and the header explains why a build that
            # is not the tag's commit must not take one. The commit-derived name
            # is also what makes a rehearsal image promotable by hand later —
            # the runbook's Step 2 pins an image, not a tag.
            commit="$(git rev-parse HEAD)"
            image="${image_repo}:sha-$(git rev-parse --short=12 HEAD)"
            tags="$image"
            mode="ref"
            label="${ref:-${GITHUB_REF_NAME}}"
          fi

          echo "Building $label (mode $mode, version $version) from commit $commit."
          {
            echo "mode=$mode"
            echo "label=$label"
            echo "version=$version"
            echo "commit=$commit"
            echo "image=$image"
            # The release path publishes two names (the version tag and
            # :latest), so `tags` is a two-line value and has to be written in
            # the heredoc form. A plain `echo "tags=$tags"` writes the second
            # name as its own line; the runner reads that line as an output
            # key, finds no `=` in it, and fails the step with "Invalid
            # format" before anything is built.
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check if this version is already published
        id: check
        env:
          # The name the build will actually publish, taken from the resolve step
          # rather than rebuilt here. On the release path that is :vX.Y.Z; on the
          # ref path it is :sha-<commit>. Rebuilding it from the version alone
          # would make this guard ask about a release name during a rehearsal,
          # so the first rehearsal run after any release of that version would
          # see exists=true and skip the build it was dispatched to make.
          IMAGE_TAG: ${{ steps.version.outputs.image }}
        run: |
          set -euo pipefail
          # Three outcomes, not two. `docker manifest inspect` exits non-zero for
          # a genuinely absent tag and also for "could not ask" — a registry 5xx,
          # an expired login, DNS, a rate limit. Treating both as "not published"
          # would repush `:vX.Y.Z` over a released name and change the digest
          # under a tag clients already cite. So: success means published,
          # the registry's own "manifest unknown" means absent, and anything else
          # fails the run rather than guessing.
          if output="$(docker manifest inspect "$IMAGE_TAG" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q '^manifest unknown$' <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not determine whether $IMAGE_TAG is published — refusing to guess. Registry said:"
            echo "$output"
            exit 1
          fi

      # The image's build context is the repo root, and the Dockerfile COPYs
      # image-packages/digichat/ — a directory that is GENERATED, not committed
      # (.gitignore: "/image-packages/"). A checkout therefore never carries
      # it, so without this step the build context has no such directory and
      # the build dies computing its cache key, before a single build step
      # runs (run 39334821302, 2026-10-19). The digichat image installs npm
      # tarballs and workspace manifests and no wheel, so only those are
      # packaged: the wheels and the frozen exports under image-packages/
      # belong to the stack and runner images, and packaging them here would
      # make a release depend on uv and on unrelated Python packages building.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package the image inputs
        id: package
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          python3 scripts/package_r5_image_inputs.py --npm-only
          if [ -z "$(ls -A image-packages/digichat/npm 2>/dev/null)" ]; then
            echo "::error::image-packages/digichat/npm is empty — the build context would carry no packaged input"
            exit 1
          fi

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/digichat/Dockerfile
          # NOT pushed here. The image is loaded into this runner so the boot
          # probe can start it and watch it serve; the separate push step runs
          # only after that probe passes. A build step that pushes publishes an
          # image nobody has booted, and the header explains why this lane
          # cannot take it back afterwards.
          push: false
          load: true
          # The repo root is the build context, not apps/digichat: digichat is an
          # npm workspace member whose lockfile lives at the root and whose
          # private @digithings/design dependency resolves only through the
          # workspace link.
          build-args: |
            DIGICHAT_VERSION=${{ steps.version.outputs.version }}
            DIGICHAT_REVISION=${{ steps.version.outputs.commit }}
            DIGICHAT_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          # The names are decided once, in the resolve step, and handed over
          # whole as one output value, so no consumer can tear a `${{ … }}`
          # apart the way an inline multi-line list can.
          tags: ${{ steps.version.outputs.tags }}

      - name: Boot the image and probe it
        if: steps.check.outputs.exists == 'false'
        id: probe
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Provenance first, and on BOTH paths. The release path also gets this
          # from check_digichat_image_binding.py; asserting it here as well means
          # a rehearsal image carries the same proof, and it is the assertion that
          # fails first when a Dockerfile change drops the revision label.
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          if [ "$revision" != "$COMMIT" ]; then
            echo "::error::$IMAGE carries org.opencontainers.image.revision '$revision', expected '$COMMIT'."
            exit 1
          fi

          # An ephemeral host port, so the probe never collides with a runner
          # service and never hardcodes a port the image does not listen on.
          #
          # The boot is BARE: no -e, no --env, no secret. Production supplies two
          # secretRefs this runner cannot have, so the image has to serve with no
          # environment at all - that is what makes the probe's answer
          # transferable to a Container App that has both. It also means the four
          # ecosystem services are enabled by default
          # (apps/digichat/src/lib/capabilities.ts), so /api/health answers 503
          # in here; the version check below reads that status instead of
          # demanding a 200.
          container="$(docker run --detach --rm --publish 127.0.0.1::3000 "$IMAGE")"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$container" 3000/tcp | head -n1 | sed 's/.*://')"
          base="http://127.0.0.1:${port}"
          echo "Probing $IMAGE on $base (container $container)."

          code="000"
          deadline=$(( SECONDS + 120 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(docker inspect --format '{{ .State.Running }}' "$container" 2>/dev/null || true)" != "true" ]; then
              echo "::error::the container exited before it served one probe. Logs:"
              docker logs "$container" 2>&1 || true
              exit 1
            fi
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$base/healthz" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "::error::/healthz never returned 200 within 120s (last status '$code'). Logs:"
            docker logs "$container" 2>&1 || true
            exit 1
          fi

          # 200 alone is not the contract: healthz is a fixed {"ok":true}, so the
          # body has to say so, or a catch-all route that shadows it passes.
          healthz="$(curl --silent --show-error --fail "$base/healthz")"
          if [ "$(jq -r '.ok' <<< "$healthz")" != "true" ]; then
            echo "::error::/healthz did not report ok=true: $healthz"
            exit 1
          fi

          # And the version the image SERVES must be the version it was built
          # from. This is the assertion that catches a stale layer, a wrong tag
          # on the tree, or a build that silently published the previous release
          # — none of which any other step in this lane would notice.
          #
          # The status code is READ, not demanded. A standalone container has no
          # digigraph/digisearch/digiquant/digitrace to reach, and /api/health
          # answers 503 when one of those checks fails: that is the route
          # telling the truth about a degraded environment, not a broken image.
          # The earlier lane asked for this URL with `curl --fail`, which is
          # what killed run 39541165954 (the digichat-v2.6.4 tag push,
          # 2026-10-21T03:57Z, "curl: (22) The requested URL returned error:
          # 503"). So the body has to report the version it was built as, and
          # a failing check is tolerated only when it is one of those four
          # ecosystem services and the database is skipped.
          #
          # Only two answers are honest here: 200 (every check reachable) and
          # 503 (the route telling the truth about a degraded environment).
          # Any other status - a 500 from a route regression that still
          # serialises `version`, a 502 from something in front of the app -
          # is a fault and stops the lane.
          curl_rc=0
          api_response="$(curl --silent --show-error --max-time 60 --write-out '\n%{http_code}' "$base/api/health")" || curl_rc=$?
          api_status="$(printf '%s\n' "$api_response" | tail -n1)"
          api_body="$(printf '%s\n' "$api_response" | sed '$d')"
          if [ "$curl_rc" -ne 0 ]; then
            echo "::error::the request to /api/health did not complete (curl exited $curl_rc) — a timeout or a refused connection, not an answer from the image."
            exit 1
          fi
          # The rules live in ONE place: scripts/digichat_probe_verdict.mjs,
          # which the local rehearsal calls too. The two lanes used to keep
          # their own copy of the contract and drifted - the local lane never
          # read the status code this lane reads - so a rehearsal could pass
          # where the release failed.
          #
          # The helper comes from the tree when the tree has it (a tag cut
          # after this contract landed) and from the workflow's own commit
          # otherwise (a repair dispatch for an older tag): the rules that
          # judge an image belong to the lane that runs, not to the image
          # that is judged.
          helper="scripts/digichat_probe_verdict.mjs"
          if [ ! -f "$helper" ]; then
            helper="/tmp/digichat_probe_verdict.mjs"
            curl --silent --show-error --fail --max-time 30 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/digichat_probe_verdict.mjs" \
              --output "$helper" \
              || { echo "::error::the probe verdict helper is not in the checkout and could not be fetched from ${GITHUB_SHA}."; exit 1; }
          fi
          # The verdict is the helper's OUTPUT, not its exit status: a wrapper
          # that swallowed the exit code must not be able to turn a refusal
          # into a pass.
          verdict="$(printf '%s' "$api_body" | node "$helper" --status "$api_status" --version "$VERSION" || true)"
          case "$verdict" in
            "OK "*) ;;
            *)
              reason="$(printf '%s' "$verdict" | sed -e 's/^REFUSE //' | tr '\n\r' '  ')"
              echo "::error::${reason:-the probe verdict helper returned no verdict.}"
              exit 1
              ;;
          esac
          reported="${verdict#OK version=}"
          reported="${reported%% *}"
          if [ "$api_status" = "503" ]; then
            echo "::warning::/api/health answered $api_status: the image serves version $reported, and only the ecosystem services it cannot reach failed (${verdict##*tolerated=})."
          fi
          echo "Probed ok: /healthz ok=true, /api/health version=$reported, revision bound to $COMMIT."

      - name: Push the probed image
        # Gated on the probe's own outcome, not on success(): the image leaves
        # this runner only if it was watched serving first.
        if: steps.probe.outcome == 'success'
        id: push
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            echo "Pushing $ref"
            docker push "$ref"
          done <<< "$TAGS"
          {
            echo "digest=$(docker image inspect --format '{{ if .RepoDigests }}{{ index .RepoDigests 0 }}{{ end }}' "$IMAGE")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the published image is bound to the tag's commit
        if: steps.check.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          LABEL: ${{ steps.version.outputs.label }}
          MODE: ${{ steps.version.outputs.mode }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="$IMAGE"
          docker pull -q "$image" > /dev/null
          # --format everywhere: a bare `docker inspect` emits a JSON array,
          # which the checker rejects as bad input (see the runbook §2).
          # Guard the index lookups — `index .RepoDigests 0` raises index out of
          # range on an image with no repo digest, and that would fail this step
          # *after* the push already succeeded.
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          image_version="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")"
          repo_digest="$(docker inspect --format '{{ if .RepoDigests }}{{ index .RepoDigests 0 }}{{ end }}' "$image")"
          {
            echo "### digichat image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| mode | \`$MODE\` |"
            echo "| ref or tag | \`$LABEL\` |"
            echo "| commit | \`$COMMIT\` |"
            echo "| image | \`$image\` |"
            echo "| digest | \`$repo_digest\` |"
            echo "| pushed digest | \`$DIGEST\` |"
            echo "| boot probe | \`/healthz\` 200 ok=true, \`/api/health\` version $VERSION |"
            echo ""
            if [ "$MODE" = "release" ]; then
              echo "Promote it with the steps in docs/ops/digichat-datatap-aca.md."
            else
              echo "This is a rehearsal image, not a release. It carries no \`vX.Y.Z\` name and"
              echo "does not move \`:latest\`. Promote it only as the Step 1 rehearsal, and read"
              echo "\`docs/ops/digichat-datatap-aca.md\` §4 before any prod write."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The checker's contract is a release tag; a `sha-` name is not one and
          # is refused by TAG_RE on purpose. So it runs on the release path only.
          # The ref path's provenance was asserted by the probe step instead.
          if [ "$MODE" = "release" ]; then
            jq -n \
              --arg version "$image_version" \
              --arg package_version "$VERSION" \
              --arg tag "${TAG#refs/tags/}" \
              --arg tag_commit "$COMMIT" \
              --arg image_ref "$image" \
              --arg image_revision "$revision" \
              --arg image_digest "$repo_digest" \
              '{version:$version, package_version:$package_version, tag:$tag,
                tag_commit:$tag_commit, image_ref:$image_ref,
                image_revision:$image_revision, image_digest:$image_digest}' \
              | python3 scripts/check_digichat_image_binding.py --facts -
          else
            echo "Ref build: checked provenance directly in the probe step (checker requires a release tag)."
          fi

      - name: Report an already-published version
        if: steps.check.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          echo "$IMAGE is already published - nothing to do."
          echo "Release tags are immutable here: to replace a broken image, cut a new patch version."
