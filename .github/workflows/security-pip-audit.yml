# Dependency-audit CI — runs pip-audit against each Python component.
#
# Epic #2 hardening sub-task: scheduled + PR-triggered CVE audit.
# Blocks on HIGH/CRITICAL findings (OSV severity); warns on MEDIUM/LOW.
# Known/accepted CVEs can be listed in `pip-audit-ignore.txt` at the repo root
# (one vuln ID per line — `GHSA-xxxx-xxxx-xxxx` or `PYSEC-YYYY-NNN` — with
# `#`-prefixed comments for justification).
#
# Scope: Python components only. A sibling `npm audit --omit=dev` job for
# digichat/ is a follow-up (see docs/backlog/epic-2-hardening.md).
# Production clock: Cloudflare Worker digithings-cron (frontend/digithings-cron). Schedule removed #3579.
name: "Security: pip-audit"

on:
  workflow_dispatch:
  workflow_call:

jobs:
  audit:
    name: pip-audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component:
          - digibase
          - digigraph
          - digiquant
          - digisearch
          - digismith
          - digikey
          - digiclaw
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export this component's locked closure
        # Audits the component's dependency closure as recorded in uv.lock
        # instead of installing it first (#1715). Three things change for the better:
        #
        #  1. The matrix becomes meaningful. Previously every entry pre-installed
        #     ALL local packages before adding the target's extras, so all seven
        #     jobs audited a near-identical superset. Per-component export gives
        #     genuinely different closures (digibase 27 deps, digikey 48,
        #     digiquant 111), so a finding now points at a real owner.
        #  2. `[nautilus]` is no longer excluded. It was excluded because the
        #     Nautilus C++ engine SIGABRTs on Linux when *imported* (#42) — a text
        #     export imports nothing, so the exclusion bought nothing here and
        #     cost us CVE coverage on nautilus_trader's transitive tree.
        #  3. The audited set is exactly the set CI installs, because both come
        #     from the same lockfile. The old comment argued for auditing the live
        #     environment "rather than a stale lockfile"; since #1714 the lockfile
        #     *is* what CI installs, so that reasoning now points the other way.
        #
        # --no-emit-workspace drops the `-e ./digibase` style lines: pip-audit
        # cannot resolve local editable paths from a requirements file, and those
        # are first-party packages with no CVE feed anyway.
        run: |
          uv export --frozen \
            --package "${{ matrix.component }}" --all-extras \
            --format requirements-txt \
            --no-emit-project --no-emit-workspace --no-hashes \
            -o audit-requirements.txt
          echo "── audited closure: $(grep -c '==' audit-requirements.txt) pinned packages"

      - name: Build --ignore-vuln args from pip-audit-ignore.txt
        id: ignores
        run: |
          args=""
          if [ -f pip-audit-ignore.txt ]; then
            while IFS= read -r line; do
              # strip comments and whitespace
              id="${line%%#*}"
              id="$(echo "$id" | tr -d '[:space:]')"
              [ -z "$id" ] && continue
              args="$args --ignore-vuln $id"
            done < pip-audit-ignore.txt
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Run pip-audit (JSON, non-blocking capture)
        id: audit
        # Audits the exported locked closure (-r), which since #1714 is exactly
        # what CI installs. `uvx` runs pip-audit as an ephemeral tool so it is not
        # itself a project dependency — it is an auditor, not part of the app.
        # --strict causes pip-audit to error on metadata problems; we still
        # want the JSON so we tolerate a non-zero rc and gate on parsed output.
        run: |
          set +e
          uvx pip-audit \
            --vulnerability-service osv \
            --strict \
            --format json \
            -r audit-requirements.txt \
            ${{ steps.ignores.outputs.args }} \
            > audit.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Classify findings (HIGH/CRITICAL block; MEDIUM/LOW warn)
        # OSV severity lives under dependencies[].vulns[].aliases + .fix_versions;
        # severity strings come via .vulns[].severity (list of {type,score}) or
        # .vulns[].aliases. pip-audit flattens this into each vuln entry; we
        # inspect `severity` (CVSS vector) and a coarse label if present.
        run: |
          python - <<'PY'
          import json, os, sys
          try:
              data = json.load(open("audit.json"))
          except Exception as e:
              print(f"::error::could not parse pip-audit JSON: {e}")
              sys.exit(1)

          def severity_label(vuln):
              # pip-audit (OSV) emits an optional "severity" list with CVSS
              # vectors. We also accept a plain label if the upstream advisory
              # exposes one via aliases/summary.
              sev = (vuln.get("severity") or "").upper() if isinstance(vuln.get("severity"), str) else ""
              if sev:
                  return sev
              for s in vuln.get("severity_list", []) or []:
                  if isinstance(s, dict) and s.get("type", "").upper() in {"CVSS_V3", "CVSS_V4"}:
                      score = float(s.get("score", "0") or 0)
                      if score >= 9.0: return "CRITICAL"
                      if score >= 7.0: return "HIGH"
                      if score >= 4.0: return "MEDIUM"
                      if score > 0:    return "LOW"
              return "UNKNOWN"

          blockers, warns = [], []
          deps = data.get("dependencies", []) if isinstance(data, dict) else []
          for dep in deps:
              name = dep.get("name", "?")
              version = dep.get("version", "?")
              for v in dep.get("vulns", []) or []:
                  vid = v.get("id", "?")
                  label = severity_label(v)
                  entry = f"{name}=={version} {vid} [{label}]"
                  if label in {"HIGH", "CRITICAL"}:
                      blockers.append(entry)
                  elif label in {"MEDIUM", "LOW"}:
                      warns.append(entry)
                  else:
                      # Unknown severity — treat as warn; surfaces in logs
                      # but doesn't fail the job. Promote to blocker via
                      # explicit pinning or ignore-list entry if needed.
                      warns.append(entry + " (severity unknown)")

          for w in warns:
              print(f"::warning::pip-audit: {w}")
          for b in blockers:
              print(f"::error::pip-audit blocker: {b}")

          if blockers:
              print(f"\nFAIL: {len(blockers)} HIGH/CRITICAL vulnerabilit{'y' if len(blockers)==1 else 'ies'}.")
              print("Fix by pinning a patched version in the component's pyproject.toml,")
              print("or add the vuln ID to pip-audit-ignore.txt with a justification comment.")
              sys.exit(1)
          print(f"OK: 0 HIGH/CRITICAL vulnerabilities ({len(warns)} MEDIUM/LOW warnings).")
          PY
