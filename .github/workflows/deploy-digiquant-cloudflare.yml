# REM-084: Document and gate digiquant.io Cloudflare Pages build (ADR-0012).
# Primary deploy is Cloudflare Pages watching `main` + scripts/build-digiquant.sh.
# This workflow validates the build script on PRs touching digiquant.io assets.
name: "Deploy: digiquant.io build check"

on:
  pull_request:
    paths:
      - "frontend/digiquant-web/**"
      - "frontend/digiweb/web/**"
      - "frontend/olympus/**"
      - "frontend/digiweb/design/**"
      - "scripts/build-digiquant.sh"
      # The build script's callees. Watching the caller alone leaves the gap this
      # check exists to close, and the two files below fail in different places.
      # `write-build-info.sh` runs inside the real Cloudflare build under
      # `set -euo pipefail` (scripts/build-digiquant.sh:88) and the build hard-fails
      # when the stamp it writes is absent — a bug there breaks the production deploy.
      # `check_deploy_freshness.py` is never reached by the real deploy (Cloudflare's
      # build command is `bash scripts/build-digiquant.sh`, which does not call it);
      # it is the evaluator behind this workflow's "Assert deploy build stamp" step and
      # smoke-site.yml's daily probe, so a bug there breaks detection instead — every
      # production probe turns into a false verdict while the site builds fine.
      # Neither is untested today: ci.yml's ruff_and_scripts filter matches scripts/**,
      # so tests/scripts/ runs on both. What that suite cannot reach is this job — the
      # real npm install, both Next builds, and the writer running *in situ*. The unit
      # suite never executes a build script at all (it only reads their text) and runs
      # the writer standalone, with an absolute output path and a controlled env. So a
      # stamp that breaks only under the build script's `cd` to the repo root — which is
      # what makes the relative `dist/build-info.json` resolve, and what the `git
      # rev-parse` fallback reads — or only once fed through the evaluator, passes there
      # and fails on Cloudflare. The teardown-ordering hazard the digithings sibling of
      # this comment names does not exist here: build-digiquant.sh clears dist/ before
      # `npm install`, not after the builds, so nothing can delete a stamp written once
      # the exports are assembled.
      - "scripts/write-build-info.sh"
      - "scripts/check_deploy_freshness.py"
      - ".github/workflows/deploy-digiquant-cloudflare.yml"
      # Root packaging manifests are what make Cloudflare's build image auto-run a
      # dependency install ahead of the build command, so a change to one can break the
      # deploy without touching a single frontend file. #1714 was exactly that — it edited
      # only the root pyproject.toml and uv.lock, matched none of the globs above, and so
      # froze this site for three days without ever running this check.
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dist:
    name: bash scripts/build-digiquant.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Cloudflare's build image auto-detects languages from the repo root, finds the root
      # pyproject.toml, and runs `pip install .` BEFORE the configured build command. If that
      # fails, the build command is never reached — so this whole job passing proves nothing
      # about the real deploy. That is not hypothetical: #1714 added the root pyproject.toml
      # on 2026-07-30 and both production sites silently built nothing until 2026-08-02, with
      # every PR green throughout. Run the same step Cloudflare runs, first, in the same order.
      # --dry-run suffices: the failure occurs in "getting requirements to build wheel", which
      # --dry-run still performs, and it avoids mutating the runner's site-packages.
      - name: Assert the repo root is pip-installable (Cloudflare runs `pip install .`)
        run: python3 -m pip install --dry-run --no-deps .

      - name: Assemble dist/ (same as Cloudflare Pages)
        run: bash scripts/build-digiquant.sh

      - name: Assert dist layout
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -d dist/olympus
          grep -q digiquant.io dist/CNAME

      # The daily freshness probe in smoke-site.yml reads this stamp off the live
      # site (#1759). Validate the stamp the build just wrote with the same
      # evaluator, so a regression in either half fails here rather than turning
      # every production probe into a false UNSTAMPED.
      - name: Assert deploy build stamp
        run: |
          test -f dist/build-info.json
          python3 scripts/check_deploy_freshness.py \
            --url dist/build-info.json \
            --status 200 \
            --body-file dist/build-info.json \
            --max-age-hours 1
