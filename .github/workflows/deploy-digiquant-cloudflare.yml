# REM-084: Document and gate digiquant.io Cloudflare Pages build (ADR-0012).
# Primary deploy is Cloudflare Pages watching `main` + scripts/build-digiquant.sh.
# This workflow validates the build script on PRs touching digiquant.io assets.
name: "Deploy: digiquant.io build check"

on:
  pull_request:
    paths:
      - "frontend/digiquant-web/**"
      - "frontend/digiweb/web/**"
      - "frontend/olympus/**"
      - "frontend/digiweb/design/**"
      - "scripts/build-digiquant.sh"
      # The build script's callees. Watching the caller alone leaves the gap this
      # check exists to close, and the two files below fail in different places.
      # `write-build-info.sh` runs inside the real Cloudflare build under
      # `set -euo pipefail` (scripts/build-digiquant.sh, "writing dist/build-info.json")
      # and the build hard-fails
      # when the stamp it writes is absent — a bug there breaks the production deploy.
      # `check_deploy_freshness.py` is never reached by the real deploy (Cloudflare's
      # build command is `bash scripts/build-digiquant.sh`, which does not call it);
      # it is the evaluator behind this workflow's "Assert deploy build stamp" step and
      # smoke-site.yml's daily probe, so a bug there breaks detection instead — every
      # production probe turns into a false verdict while the site builds fine.
      # Neither is untested today: ci.yml's ruff_and_scripts filter matches scripts/**,
      # so tests/scripts/ runs on both. What that suite cannot reach is this job — the
      # real npm install, both Next builds, and the writer running *in situ*. The unit
      # suite never executes a build script at all (it only reads their text) and runs
      # the writer standalone, with an absolute output path and a controlled env. So a
      # stamp that breaks only under the build script's `cd` to the repo root — which is
      # what makes the relative `dist/build-info.json` resolve, and what the `git
      # rev-parse` fallback reads — or only once fed through the evaluator, passes there
      # and fails on Cloudflare. The teardown-ordering hazard the digithings sibling of
      # this comment names does not exist here: build-digiquant.sh clears dist/ before
      # `npm install`, not after the builds, so nothing can delete a stamp written once
      # the exports are assembled.
      - "scripts/write-build-info.sh"
      - "scripts/check_deploy_freshness.py"
      - ".github/workflows/deploy-digiquant-cloudflare.yml"
      # Root packaging manifests are what make Cloudflare's build image auto-run a
      # dependency install ahead of the build command, so a change to one can break the
      # deploy without touching a single frontend file. #1714 was exactly that — it edited
      # only the root pyproject.toml and uv.lock, matched none of the globs above, and so
      # froze this site for three days without ever running this check.
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
      # The npm manifests break the deploy the same way, by a more direct route: the
      # build script runs its own root install (scripts/build-digiquant.sh:19) — `npm
      # install`, which reconciles the lock against the manifests, not `npm ci`, which
      # installs from it — so a bad resolution there fails the build with no frontend
      # file touched, and no Cloudflare auto-detection needed. That is not hypothetical:
      # PR #1949 changed package-lock.json by -1646/+176 lines, matched none of the globs
      # above, and this check never ran on it.
      #
      # Both entries are root-anchored, and only the root hole is closed: a `paths:`
      # pattern is matched against the whole repo-root-relative path, so a wildcard-free
      # name matches that one file and nothing nested. Do NOT re-cite #1702/#1708/#1712
      # as proof of that, the way an earlier draft did. Those three did each edit 11
      # nested pyproject.toml files and fire neither check — but they merged 2026-07-29
      # and -07-30, and `pyproject.toml` only entered these filters on 2026-08-02
      # (ff384b4f). The entry did not exist yet, so their silence is evidence of nothing.
      # The standing in-repo corroboration is docs-reindex-guide.yml, which lists bare
      # `ARCHITECTURE.md` alongside `digibase/ARCHITECTURE.md`, `digichat/ARCHITECTURE.md`
      # and ~20 further per-component paths — every one of them redundant if the bare
      # name reached nested files. Each workspace manifest is matched, or not, one by one.
      - "package.json"
      - "package-lock.json"
      # No per-workspace manifest is listed here *for build reasons*, and that is a
      # derived result rather than an omission. This site's build closure, read off the
      # @digithings/* deps, is digiquant-web → design + web and olympus → design + web,
      # with web → design — and all four of those manifests already fall under the
      # directory globs at the top of this list. The root lock would not stand in for them
      # if they did not: counted at PR granularity, 17 of the 38 PRs that have touched one
      # of the eight left package-lock.json out of the PR entirely. The one per-workspace
      # manifest that *is* listed, at the end, is there for an install reason instead; see
      # the paragraph that names it.
      #
      # The digithings check carries one extra entry, frontend/digichat-ui/**, because
      # digithings-web imports digichat-ui at build time; nothing built here does. (It
      # began as frontend/digichat-ui/package.json in #1956 and was widened to the whole
      # directory in #1966, which supersedes the manifest line.) Re-derive the closure
      # before adding a glob rather than mirroring that file — `**/package.json` is still
      # rejected, because it would fire this check on every unrelated workspace including
      # digigraph's vendored echarts manifest. Naming digiweb/reference's manifest one by
      # one is the opposite of that sweep, not a step toward it.
      #
      # Residual, deliberate: the root `npm install` above resolves all eight
      # workspaces, so an unresolvable manifest in one outside that closure still fails
      # this build. Four sit outside it. Three are covered by a lane that installs at the
      # root — frontend/digichat and frontend/digithings-web by ci.yml's `digichat` and
      # `web`, and frontend/digichat-ui by those same two filters, which both list
      # frontend/digichat-ui/**. (An earlier draft said the digithings deploy check was
      # digichat-ui's *only* cover and called it a coupling rather than a guarantee. The
      # coupling is real but it is not the only cover, and #1966 made narrowing it fail
      # tests/scripts/test_deploy_build_inputs.py rather than pass quietly.) Those lanes
      # run `npm ci`, which catches a bad range by refusing to run when manifest and lock
      # disagree rather than by resolving it — a different route to the same cover. The
      # fourth,
      # frontend/digiweb/reference, was in no path filter in this repo at all — of the
      # eight it was the one manifest watched by nothing — so it is now named below. Note
      # that this site never builds that workspace: the entry is an install input, not a
      # build input, and it is here because the root `npm install` above resolves all
      # eight manifests before either site compiles.
      #
      # Only the manifest, not `frontend/digiweb/reference/**`. Nothing in CI *builds*
      # that app. Since #1981 the directory is reached by ci.yml's `web` lane, which
      # lints and type-checks it, as well as by the unconditional frontend-canon guard —
      # so the narrow entry here is a division of labour, not the app's only coverage:
      # an install input for this build, a lint/typecheck input for that lane, and no
      # `next build` anywhere. (Before #1981 nothing built or linted it at all; do not
      # restore that wording.) Widening this entry to the directory would
      # fire this site's two-app Next build, and digithings' one, on every edit to a
      # design reference with ~137 commits in the month since it was scaffolded
      # (2026-07-06) — while the manifest's *content* has not changed since that same day.
      # Content stability is the evidence for that, not path history: the lone commit at
      # this path is the `git mv` that created it, and `git log --follow` is unreliable
      # here (it walks back past the app's own creation).
      # digithings-stack-cloudflare is an install-input workspace (CF Profile A
      # Containers Worker). Pages does not build it; name the manifest so it is
      # not an orphan under tests/scripts/test_deploy_build_inputs.py.
      - "frontend/digithings-stack-cloudflare/package.json"
      - "frontend/digiweb/reference/package.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dist:
    name: bash scripts/build-digiquant.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Cloudflare's build image auto-detects languages from the repo root, finds the root
      # pyproject.toml, and runs `pip install .` BEFORE the configured build command. If that
      # fails, the build command is never reached — so this whole job passing proves nothing
      # about the real deploy. That is not hypothetical: #1714 added the root pyproject.toml
      # on 2026-07-30 and both production sites silently built nothing until 2026-08-02, with
      # every PR green throughout. Run the same step Cloudflare runs, first, in the same order.
      # --dry-run suffices: the failure occurs in "getting requirements to build wheel", which
      # --dry-run still performs, and it avoids mutating the runner's site-packages.
      - name: Assert the repo root is pip-installable (Cloudflare runs `pip install .`)
        run: python3 -m pip install --dry-run --no-deps .

      - name: Assemble dist/ (same as Cloudflare Pages)
        run: bash scripts/build-digiquant.sh

      - name: Assert dist layout
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -d dist/dashboard
          grep -q digiquant.io dist/CNAME

      # The daily freshness probe in smoke-site.yml reads this stamp off the live
      # site (#1759). Validate the stamp the build just wrote with the same
      # evaluator, so a regression in either half fails here rather than turning
      # every production probe into a false UNSTAMPED.
      - name: Assert deploy build stamp
        run: |
          test -f dist/build-info.json
          python3 scripts/check_deploy_freshness.py \
            --url dist/build-info.json \
            --status 200 \
            --body-file dist/build-info.json \
            --max-age-hours 1
