# REM-084: Document and gate digiquant.io Cloudflare Pages build (ADR-0012).
# Primary deploy is Cloudflare Pages watching `main` + scripts/build-digiquant.sh.
# This workflow validates the build script on PRs touching digiquant.io assets.
name: "Deploy: digiquant.io build check"

on:
  pull_request:
    paths:
      - "frontend/digiquant-web/**"
      - "frontend/digiweb/web/**"
      - "frontend/olympus/**"
      - "frontend/digiweb/design/**"
      - "scripts/build-digiquant.sh"
      - ".github/workflows/deploy-digiquant-cloudflare.yml"
      # Root packaging manifests are what make Cloudflare's build image auto-run a
      # dependency install ahead of the build command, so a change to one can break the
      # deploy without touching a single frontend file. #1714 was exactly that — it edited
      # only the root pyproject.toml and uv.lock, matched none of the globs above, and so
      # froze this site for three days without ever running this check.
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
      # The npm manifests break the deploy the same way, by a more direct route: the
      # build script runs its own root install (scripts/build-digiquant.sh:19) — `npm
      # install`, which reconciles the lock against the manifests, not `npm ci`, which
      # installs from it — so a bad resolution there fails the build with no frontend
      # file touched, and no Cloudflare auto-detection needed. That is not hypothetical:
      # PR #1949 changed package-lock.json by -1646/+176 lines, matched none of the globs
      # above, and this check never ran on it.
      #
      # Both entries are root-anchored, and only the root hole is closed: a `paths:`
      # pattern is matched against the whole repo-root-relative path, so a wildcard-free
      # name matches that one file and nothing nested. Do NOT re-cite #1702/#1708/#1712
      # as proof of that, the way an earlier draft did. Those three did each edit 11
      # nested pyproject.toml files and fire neither check — but they merged 2026-07-29
      # and -07-30, and `pyproject.toml` only entered these filters on 2026-08-02
      # (ff384b4f). The entry did not exist yet, so their silence is evidence of nothing.
      # The standing in-repo corroboration is docs-reindex-guide.yml, which lists bare
      # `ARCHITECTURE.md` alongside `digibase/ARCHITECTURE.md`, `digichat/ARCHITECTURE.md`
      # and ~20 further per-component paths — every one of them redundant if the bare
      # name reached nested files. Each workspace manifest is matched, or not, one by one.
      - "package.json"
      - "package-lock.json"
      # No per-workspace manifest is listed here, and that is a derived result rather
      # than an omission. This site's build closure, read off the @digithings/* deps, is
      # digiquant-web → design + web and olympus → design + web, with web → design — and
      # all four of those manifests already fall under the directory globs at the top of
      # this list. The root lock would not stand in for them if they did not: counted at
      # PR granularity, 17 of the 38 PRs that have touched one of the eight left
      # package-lock.json out of the PR entirely.
      #
      # The digithings check carries one extra entry, frontend/digichat-ui/**, because
      # digithings-web imports digichat-ui at build time; nothing built here does. (It
      # began as frontend/digichat-ui/package.json in #1956 and was widened to the whole
      # directory in #1966, which supersedes the manifest line.) Re-derive the closure
      # before adding a glob rather than mirroring that file — `**/package.json` was
      # rejected precisely because it would fire this check on digichat and
      # digiweb/reference, which this site never builds.
      #
      # Residual, deliberate: the root `npm install` above resolves all eight
      # workspaces, so an unresolvable manifest in one outside that closure still fails
      # this build. Four sit outside it. Three are covered by a lane that runs its own
      # root install — frontend/digichat and frontend/digithings-web by ci.yml's
      # `digichat` and `web`, and frontend/digichat-ui by the digithings deploy check,
      # whose frontend/digichat-ui/** glob covers that manifest and which runs a
      # byte-identical root `npm install`. Note what that last one is: a coupling, not a
      # guarantee. Narrow or drop the digichat-ui entry over there and this site silently
      # loses its only cover for it — though since #1966 that narrowing now fails
      # tests/scripts/test_deploy_build_inputs.py rather than passing quietly. The fourth,
      # frontend/digiweb/reference/package.json, is in no path filter in this repo — of
      # the eight it is the one manifest watched by nothing.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dist:
    name: bash scripts/build-digiquant.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Cloudflare's build image auto-detects languages from the repo root, finds the root
      # pyproject.toml, and runs `pip install .` BEFORE the configured build command. If that
      # fails, the build command is never reached — so this whole job passing proves nothing
      # about the real deploy. That is not hypothetical: #1714 added the root pyproject.toml
      # on 2026-07-30 and both production sites silently built nothing until 2026-08-02, with
      # every PR green throughout. Run the same step Cloudflare runs, first, in the same order.
      # --dry-run suffices: the failure occurs in "getting requirements to build wheel", which
      # --dry-run still performs, and it avoids mutating the runner's site-packages.
      - name: Assert the repo root is pip-installable (Cloudflare runs `pip install .`)
        run: python3 -m pip install --dry-run --no-deps .

      - name: Assemble dist/ (same as Cloudflare Pages)
        run: bash scripts/build-digiquant.sh

      - name: Assert dist layout
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -d dist/olympus
          grep -q digiquant.io dist/CNAME

      # The daily freshness probe in smoke-site.yml reads this stamp off the live
      # site (#1759). Validate the stamp the build just wrote with the same
      # evaluator, so a regression in either half fails here rather than turning
      # every production probe into a false UNSTAMPED.
      - name: Assert deploy build stamp
        run: |
          test -f dist/build-info.json
          python3 scripts/check_deploy_freshness.py \
            --url dist/build-info.json \
            --status 200 \
            --body-file dist/build-info.json \
            --max-age-hours 1
