# Put CHEAPERINFERENCE_* onto digithings-stack + digithings-digichat.
# Mirror of deploy-digithings-cron.yml secret sync. Default: secrets only (no Container rebuild).
name: "Ops: sync Cheaper Inference CF secrets"

on:
  workflow_dispatch:
    inputs:
      deploy_stack:
        description: "Also wrangler deploy digithings-stack (Container rebuild)"
        type: boolean
        default: false
      deploy_digichat:
        description: "Also wrangler deploy digithings-digichat"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Worker secrets (digithings-stack)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend/digithings-stack-cloudflare
          command: ${{ inputs.deploy_stack && 'deploy' || 'secret list' }}
          wranglerVersion: "4.28.0"
          secrets: |
            CHEAPERINFERENCE_API_KEY
            CHEAPERINFERENCE_API_BASE
            DIGI_HOUSE_UPSTREAM
            OPENROUTER_API_KEY
        env:
          CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
          CHEAPERINFERENCE_API_BASE: ${{ secrets.CHEAPERINFERENCE_API_BASE }}
          DIGI_HOUSE_UPSTREAM: ${{ secrets.DIGI_HOUSE_UPSTREAM }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  sync-digichat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Worker secrets (digithings-digichat)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend/digichat-cloudflare
          command: ${{ inputs.deploy_digichat && format('deploy --message sync-ci-{0}', github.run_id) || 'secret list' }}
          wranglerVersion: "^4.28.0"
          secrets: |
            CHEAPERINFERENCE_API_KEY
            CHEAPERINFERENCE_API_BASE
            DIGI_HOUSE_UPSTREAM
            OPENROUTER_API_KEY
        env:
          CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
          CHEAPERINFERENCE_API_BASE: ${{ secrets.CHEAPERINFERENCE_API_BASE }}
          DIGI_HOUSE_UPSTREAM: ${{ secrets.DIGI_HOUSE_UPSTREAM }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
