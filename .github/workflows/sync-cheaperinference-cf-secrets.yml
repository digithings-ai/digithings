# Put CHEAPERINFERENCE_API_KEY (+ OPENROUTER_API_KEY) onto digithings-stack
# and digithings-digichat.
# digichat: wrangler-action (wrangler 4.28.0 is fine for that package).
# digithings-stack: wrangler 4.28 rejects instance_type=standard-2, so use the
# Workers Secrets HTTP API instead of parsing wrangler.toml.
name: "Ops: sync Cheaper Inference CF secrets"

on:
  workflow_dispatch:
    inputs:
      deploy_digichat:
        description: "Also wrangler deploy digithings-digichat"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Put secrets on digithings-stack via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          script="digithings-stack"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/secrets"
          put() {
            local name="$1" text="$2"
            if [ -z "$text" ]; then
              echo "skip $name (empty)"
              return 0
            fi
            echo "putting $name on $script"
            curl -sS -f -X PUT "$base" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg n "$name" --arg t "$text" '{type:"secret_text",name:$n,text:$t}')" \
              | jq -e '.success == true' >/dev/null
          }
          put CHEAPERINFERENCE_API_KEY "$CHEAPERINFERENCE_API_KEY"
          put OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          echo "stack secrets ok"

  sync-digichat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Worker secrets (digithings-digichat)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend/digichat-cloudflare
          command: ${{ inputs.deploy_digichat && format('deploy --message sync-ci-{0}', github.run_id) || 'secret list' }}
          wranglerVersion: "4.28.0"
          secrets: |
            CHEAPERINFERENCE_API_KEY
            OPENROUTER_API_KEY
        env:
          CHEAPERINFERENCE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
