name: "Pipeline: Atlas metrics refresh"

# Daily refresh of the derived performance + lookback surfaces the Olympus
# dashboard reads (portfolio_metrics, current_book_lookback). Both are deterministic
# Polars/SQL recomputes — zero LLM cost. Runs after the EOD price ingest (21:00,
# pipeline-digiquant-prices.yml) so the latest closes are in price_history, and after the
# weekday delta book (12:00) / Saturday baseline book have materialized.
#
# Before this cron, these scripts ran nowhere, so portfolio_metrics +
# position_attribution stayed empty in prod and the Performance / Attribution
# dashboard tabs showed no data (post-audit fix, #786). Task 3.3 (#2598) renames
# the diagnostic table to current_book_lookback; position_attribution remains a
# compatibility view. Realized daily contribution is daily_realized_attribution
# (finalized accounting), never the 21-day lookback.
#
# SEVEN days a week since #1833. It was MON-SAT, but the book cron
# (pipeline-olympus.yml, `0 12 * * *`) is daily — so a Sunday book was written and then never
# enriched, keeping current_price / unrealized_pnl_pct / metrics_as_of NULL *permanently*
# rather than until the next run. Measured in prod: both Sundays in the window (2026-07-26,
# 2026-08-02) had 0 of N rows marked, while trading days had 8-11 of 9-12. The live-price
# overlay (#1834) cannot cover it either — markets are closed, so prices_live has no fresh
# quote and the badge correctly degrades to unavailable. Sunday was the one state with no path
# to a number at all.
#
# A Sunday run marks the book at the last available close and records THAT date in
# metrics_as_of, so the carry is visible rather than disguised as a Sunday close. See
# refresh_performance_metrics.refresh_positions_metrics.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        # Empty no longer means "latest existing book" for metrics (#1746): it means today
        # UTC, and the metrics step exits 3 if today has no positions book. Dispatching
        # empty before the 12:00 UTC Olympus book lands is therefore expected to go red —
        # pass an explicit date whose book exists to recompute one.
        description: "Metrics/lookback date (YYYY-MM-DD). Empty = today UTC (metrics exits 3 if today has no book)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: atlas-refresh-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Production pipeline runs RELEASED code from main (deploy migration #814).
          # Scheduled triggers still fire from the default branch (develop); only the
          # checked-out CODE is pinned to main. Releases flow develop -> main.
          ref: main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs from the uv.lock in the CHECKED-OUT tree, which is `main` above,
      # not develop. That is why this conversion had to wait for the develop→main
      # release (#1721): before it, main had no pyproject.toml or uv.lock and
      # `--frozen` would have failed on the first line of a pipeline that touches
      # live data (#1717).
      #
      # `--package digiquant --extra atlas` rather than the workspace-wide sync the
      # test gates use: this reproduces exactly what `install-workspace.sh digiquant`
      # plus `digiquant[atlas]` installed, and keeps NautilusTrader out of a job that
      # never needs it. digibase and digikey arrive as declared dependencies of
      # digiquant, so the hand-ordered install script is no longer needed here.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra atlas

      # STEP ORDER (#2597/#2598): accounting finalizer BEFORE metrics. Once a complete
      # status=final period exists, metrics consume it for pnl_pct / indexed NAV.
      # Lookback refresh (current_book_lookback) runs after metrics for the diagnostic
      # surface only — it must never feed daily pnl_pct (OLY-REV-007 / Task 3.3).
      # Job order is therefore irrelevant for daily semantics once the finalizer lands.
      # Exit 3 from the metrics step = no positions book for today UTC (stale-book
      # guard, #1746). That red run is the intended signal, not a flake.
      - name: Finalize period accounting (shadow; private tables)
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLYMPUS_ACCOUNTING_FINALIZER: shadow
          RUN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            uv run --frozen --no-sync python digiquant/scripts/atlas/finalize_period_accounting.py --supabase --date "$RUN_DATE"
          else
            uv run --frozen --no-sync python digiquant/scripts/atlas/finalize_period_accounting.py --supabase
          fi
        continue-on-error: true

      - name: Refresh portfolio_metrics (Sharpe / vol / drawdown / NAV continuity)
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # transition (#1090): legacy names fed from the same secrets until readers migrate
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Bind the dispatch input via env (never interpolate ${{ inputs.* }} into run:).
          RUN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_performance_metrics.py --supabase --date "$RUN_DATE"
          else
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_performance_metrics.py --supabase
          fi

      - name: Refresh current_book_lookback (21-day diagnostic; not realized)
        # Run even if metrics refresh failed — lookback is independent of daily pnl.
        if: always()
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # transition (#1090): legacy names fed from the same secrets until readers migrate
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_attribution.py --date "$RUN_DATE"
          else
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_attribution.py
          fi
