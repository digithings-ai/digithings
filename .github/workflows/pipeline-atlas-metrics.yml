name: "Pipeline: Atlas metrics refresh"

# Daily refresh of the derived performance + attribution surfaces the Olympus
# dashboard reads (portfolio_metrics, position_attribution). Both are deterministic
# Polars/SQL recomputes — zero LLM cost. Runs after the EOD price ingest (21:00,
# pipeline-digiquant-prices.yml) so the latest closes are in price_history, and after the
# weekday delta book (12:00) / Saturday baseline book have materialized.
#
# Before this cron, these scripts ran nowhere, so portfolio_metrics +
# position_attribution stayed empty in prod and the Performance / Attribution
# dashboard tabs showed no data (post-audit fix, #786).

on:
  schedule:
    - cron: "0 22 * * MON-SAT"
  workflow_dispatch:
    inputs:
      date:
        # Empty no longer means "latest existing book" for metrics (#1746): it means today
        # UTC, and the metrics step exits 3 if today has no positions book. Dispatching
        # empty before the 12:00 UTC Olympus book lands is therefore expected to go red —
        # pass an explicit date whose book exists to recompute one.
        description: "Metrics/attribution date (YYYY-MM-DD). Empty = today UTC (metrics exits 3 if today has no book)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: atlas-refresh-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Production pipeline runs RELEASED code from main (deploy migration #814).
          # Scheduled triggers still fire from the default branch (develop); only the
          # checked-out CODE is pinned to main. Releases flow develop -> main.
          ref: main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs from the uv.lock in the CHECKED-OUT tree, which is `main` above,
      # not develop. That is why this conversion had to wait for the develop→main
      # release (#1721): before it, main had no pyproject.toml or uv.lock and
      # `--frozen` would have failed on the first line of a pipeline that touches
      # live data (#1717).
      #
      # `--package digiquant --extra atlas` rather than the workspace-wide sync the
      # test gates use: this reproduces exactly what `install-workspace.sh digiquant`
      # plus `digiquant[atlas]` installed, and keeps NautilusTrader out of a job that
      # never needs it. digibase and digikey arrive as declared dependencies of
      # digiquant, so the hand-ordered install script is no longer needed here.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra atlas

      # STEP ORDER IS LOAD-BEARING — metrics BEFORE attribution. Do not reorder (#1746).
      # upsert_portfolio_metrics_daily prefers SUM(position_attribution.contribution_pct)
      # for pnl_pct and falls back to the nav day-over-day return. Those two are NOT the
      # same quantity: refresh_attribution computes a 21-day trailing window return
      # (_DEFAULT_WINDOW_DAYS = 21), so the sum is a 21-day contribution, ~5-10x the daily
      # move and often the opposite sign (prod 2026-07-29: attribution sum +0.98% vs nav day
      # return -0.42%; XLE position_return_pct +5.49%, DBO +14.94% on a single "day").
      # Running metrics first means the attribution rows for today do not exist yet, so
      # pnl_pct takes the correct one-day nav path. Reordering would put a 21-day number in
      # a daily column on every row. Tracked separately; do not "fix" it by reordering here.
      #
      # Exit 3 from this step = no positions book for today UTC (stale-book guard, #1746;
      # 22 of 33 green runs 2026-06-22..07-31 silently re-stamped an older row instead).
      # That red run is the intended signal, not a flake: it means the upstream Olympus
      # book never materialized, so there is no new date to compute.
      - name: Refresh portfolio_metrics (Sharpe / vol / drawdown / NAV continuity)
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # transition (#1090): legacy names fed from the same secrets until readers migrate
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Bind the dispatch input via env (never interpolate ${{ inputs.* }} into run:).
          RUN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_performance_metrics.py --supabase --date "$RUN_DATE"
          else
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_performance_metrics.py --supabase
          fi

      - name: Refresh position_attribution (single-benchmark Brinson-lite)
        # Run even if metrics refresh failed — the two surfaces are independent.
        if: always()
        env:
          CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # transition (#1090): legacy names fed from the same secrets until readers migrate
          SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_attribution.py --date "$RUN_DATE"
          else
            uv run --frozen --no-sync python digiquant/scripts/atlas/refresh_attribution.py
          fi
