name: "Pipeline: digiquant tearsheets"

# Daily Slapper + BTC-SDCA tearsheet regeneration for digiquant.io
# (#1068, #1069, #3453).
#
# DB-driven delivery: the job regenerates and upserts the tearsheet payload
# (headline metrics + equity curve + trade list + current signal) to Supabase
# `strategy_tearsheets`. digiquant.io reads that table live at runtime, so there
# is NO repo commit and NO deploy in this path — updating the row updates the site.
# `settings.json` is the target list (btc_slapper / eth_slapper / sol_slapper /
# btc_sdca). Pinning checkout to `main` (#1626) means a family is unpublished
# until that settings entry is on main — do not assume develop-only keys land.
#
# Prerequisite (#1067): calibrations uploaded to strategy_calibrations via
# digiquant/scripts/sync_strategy_calibrations.py (one-time, service role).
#
# 1. Fetch latest Coinbase daily OHLCV
# 2. Stage M2SL / DTWEXBGS CSVs so btc_sdca keeps its published composite weights
# 3. Backtest with calibrations from Supabase (private IP — never in repo/CI secrets)
# 4. Upsert the tearsheet payload + current signal to Supabase (service role)

on:
  schedule:
    # 00:00 UTC — after Coinbase daily close; fresh signal for digiquant.io tearsheets
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tearsheets:
    name: Regenerate Slapper + BTC-SDCA tearsheets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: digiquant-tearsheets
      cancel-in-progress: false
    env:
      CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # scheduled triggers fire from default branch; code pinned to main (#1626)

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # From the lockfile in the checked-out tree (`main`) — see #1717/#1721.
      # This is the one pipeline that keeps NautilusTrader: it generates real
      # tearsheets, so the engine is the point rather than a hazard (#42 is about
      # the dq *test* lane, not this job).
      #
      # ccxt is NOT in the lock because it is declared in no pyproject, despite
      # `digiquant/scripts/fetch_coinbase.py` importing it unguarded at module
      # scope. It is supplied per-step below with `uv run --with` instead of being
      # added to the lock here: the lockfile this job reads lives on `main`, so a
      # new dependency could not take effect until the next release and the step
      # would break in between. Declaring and pinning it is tracked separately.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra nautilus --extra prices

      - name: Verify calibrations exist in Supabase
        run: uv run --frozen --no-sync python digiquant/scripts/verify_strategy_calibrations_rls.py

      - name: Fetch Coinbase daily OHLCV
        run: uv run --frozen --with ccxt python digiquant/scripts/fetch_coinbase.py --through-yesterday

      - name: Stage SDCA macro siblings (M2, DXY)
        # Workflow YAML comes from the default branch (develop); this job checks
        # out `main`. Skip until the script exists on main so a develop-only
        # step cannot fail the nightly (#3456 review).
        run: |
          if [ -f digiquant/scripts/export_sdca_macro.py ]; then
            uv run --frozen --no-sync python digiquant/scripts/export_sdca_macro.py
          else
            echo "export_sdca_macro.py not on this checkout (main lags develop) — skip staging"
          fi

      - name: Generate tearsheets + push to Supabase
        # --push-supabase: upsert the tearsheet payload + current signal to
        # strategy_tearsheets (service role). --signal-delay-days 3 (#1462):
        # public figures lag reality by 3 days (end-date shift) so the live
        # position can't be read off the curve. No repo commit — the DB is the
        # delivery; digiquant.io reads strategy_tearsheets live.
        # --cache-dir must match fetch_coinbase / export_sdca_macro defaults
        # (digiquant/data/price-history). Explicit so the job still works while
        # checkout stays on main (#1626) and DEFAULT_CACHE has not yet been
        # promoted (#3472 — REPO_ROOT vs DIGIQUANT_ROOT mismatch).
        run: |
          uv run --frozen --no-sync python digiquant/scripts/generate_tearsheets.py \
            --from-supabase \
            --push-supabase \
            --signal-delay-days 3 \
            --cache-dir digiquant/data/price-history

      - name: Update persistent failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const stamp = new Date().toISOString().slice(0, 16);
            const title = "digiquant-tearsheets — recurring failures";
            const labels = ["ci-failure", "component:digiquant", "pipeline:tearsheets"];
            const marker = "<!-- digiquant-tearsheets-tracker -->";
            const failLine = `- ${stamp} — [run ${context.runId}](${runUrl})`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci-failure,pipeline:tearsheets",
              per_page: 100,
            });
            const tracker = existing.find((i) => (i.body || "").includes(marker));

            if (tracker) {
              const MAX_LINES = 20;
              const body = tracker.body || "";
              const parts = body.split("## Recent failures");
              const header = parts[0];
              const tailRaw = (parts[1] || "").split("\n").filter((l) => l.startsWith("- "));
              const tail = [failLine, ...tailRaw].slice(0, MAX_LINES).join("\n");
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                body: `${header.trim()}\n\n## Recent failures (latest first)\n${tail}`,
              });
            } else {
              const body = [
                marker,
                "## Persistent tracker for digiquant-tearsheets failures",
                "",
                "Scheduled Slapper + BTC-SDCA tearsheet pipeline (`0 0 * * *`) has been failing.",
                "",
                "**Likely causes:** missing strategy_calibrations (run sync_strategy_calibrations.py),",
                "Nautilus crash on Linux, Coinbase/ccxt outage, Supabase credentials.",
                "",
                "## Recent failures (latest first)",
                failLine,
              ].join("\n");
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
            }
