# Deploys the thin digithings-cron Worker (org production clocks, #3579).
# No Containers. Syncs GH_DISPATCH_TOKEN via wrangler-action secrets input.
name: "Deploy: digithings-cron"

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "apps/digithings-cron/**"
      - ".github/workflows/deploy-digithings-cron.yml"
  workflow_dispatch:

concurrency:
  group: deploy-digithings-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # DIG-248: CI-read secrets live at `cron` environment scope, not repo/org scope.
    environment: cron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package dependencies
        run: npm ci --no-audit --no-fund

      # DIG-732. The required-trigger contract must be asserted against the
      # DEPLOYED trigger list, not only wrangler.toml: a contract the repo
      # satisfies while the deployment does not is exactly DIG-553 Finding 1
      # wearing a passing test. Read permission only, no writes, no deploy.
      # This script observes and asserts nothing — the contract check that
      # consumes its output is the same vitest test that runs locally, so there
      # is one implementation of the contract, not a copy in CI.
      - name: Fetch deployed cron triggers
        run: |
          crons="$(node apps/digithings-cron/scripts/fetch-deployed-triggers.mjs)"
          echo "Deployed cron triggers: ${crons}"
          echo "DIGITHINGS_CRON_DEPLOYED_TRIGGERS=${crons}" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # An unmet contract fails here, so the deploy below never runs with a
      # required FX trigger missing. See apps/digithings-cron/src/triggers.ts.
      - name: Test + typecheck (asserts the required-trigger contract)
        run: |
          npm run test --workspace digithings-cron
          npm run typecheck --workspace digithings-cron

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/digithings-cron
          command: deploy
          wranglerVersion: "4.28.0"
          secrets: |
            GH_DISPATCH_TOKEN
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
