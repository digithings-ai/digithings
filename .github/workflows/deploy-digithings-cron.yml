# Deploys the thin digithings-cron Worker (org production clocks, #3579).
# No Containers. Syncs GH_DISPATCH_TOKEN via wrangler-action secrets input.
#
# Push to main (path-filtered) or workflow_dispatch. No schedule key.
# environment: production — this lane publishes org-wide production clocks, so a
# deploy is a human gate (DIG-3129). develop is not a deploy path: a change there
# is validated by the CI `web` lane (test-web.yml, which owns this workspace's
# Vitest + typecheck) and by build-cloudflare-workers.yml, and reaches production
# only when develop is promoted into main.
name: "Deploy: digithings-cron"

on:
  push:
    branches:
      - main
    paths:
      - "apps/digithings-cron/**"
      - ".github/workflows/deploy-digithings-cron.yml"
  workflow_dispatch:

concurrency:
  # Per-run group. environment: production can hold a run at the approval gate;
  # a shared group with cancel-in-progress: false queues every later deploy
  # behind that wait (#2541). A newer clock set is not always a superset of an
  # in-flight workflow_dispatch ref, so this does not cancel it. Same pattern as
  # deploy-digiquant-runner.yml.
  group: deploy-digithings-cron-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # DIG-248: CI-read secret names resolve at repo scope today; when they move
    # to environment scope they belong at `production` for this lane.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package dependencies
        run: npm ci --no-audit --no-fund

      - name: Test + typecheck
        run: |
          npm run test --workspace digithings-cron
          npm run typecheck --workspace digithings-cron

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/digithings-cron
          command: deploy
          wranglerVersion: "4.28.0"
          secrets: |
            GH_DISPATCH_TOKEN
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}

      # DIG-732: a contract satisfied by the repo but not by the deployment is
      # DIG-553 Finding 1 wearing a passing test. The "Test + typecheck" step above
      # proves the contract against wrangler.toml; this step proves it against the
      # deployed schedule. Unmet here fails the deploy AND opens a twelve-x alarm
      # (label cron-missing-required-trigger), so a missing backstop is never silent.
      - name: Verify the deployed trigger contract
        run: npm run check:deployed-triggers --workspace digithings-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          # The live check is opt-in on a laptop (no token => skipped) but mandatory here.
          REQUIRE_DEPLOYED_CONTRACT: "1"
