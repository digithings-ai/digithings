# Gold-enrichment snapshot refresh (#4804).
#
# Mirrors .github/workflows/pipeline-market-data-refresh.yml (checkout +
# setup-uv + uv run) with these deltas: workflow_dispatch only; NO secrets
# (all five pulls use anonymous tools only); NO Supabase/R2 writes (snapshots
# land in the local enrichment store, pruned to the keep bound by the script
# itself).
#
# No `schedule:` on develop (tests/scripts/test_no_gha_schedules.py): clocks
# live on digithings-cron. The weekly Monday 09:00 UTC clock this file carried
# was dropped in DIG-4464 and NOT moved to the Worker, because the 2026-10-14
# GitHub-exit cost lock keeps new GHA-dispatch clocks off. Re-clocking it is a
# wd() row in apps/digithings-cron/src/jobs.ts plus its wrangler trigger.
name: enrich-gold-refresh
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: enrich-gold-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --package digiquant --extra prices --extra research
      - run: uv run --frozen --no-sync python digiquant/scripts/refresh_gold_enrichment.py --include-slow
