name: "Smoke: site"

# Post-deploy smoke check for the static sites. Both digithings.ai and
# digiquant.io are Next.js static exports on Cloudflare Pages. The original
# #671 regression shipped because nothing ever fetched a non-HTML asset from
# production: the SPA fallback turned every missing path into a soft-200
# text/html response that MIME-blocked the asset. We keep probing one stable
# non-HTML asset per site (og.png) plus the homepages and a prerendered route.
#
# Verdicts per URL:
#   200 + expected content-type  -> pass
#   200 + text/html              -> FAIL (SPA fallback is masking a missing asset)
#   404 / 5xx                    -> FAIL
#   403 / 429                    -> warn only (Cloudflare bot challenge; inconclusive from CI IPs)
#
# The freshness jobs answer a question the asset probes structurally cannot: a
# Cloudflare Pages project that has stopped producing deployments keeps serving
# the last good build with a 200 and no `last-modified` header, so every probe
# above passes forever (#1759). They read the build stamp that
# scripts/write-build-info.sh puts in each export root — `freshness` for
# digiquant.io, `freshness-digithings` for digithings.ai. One job per site so a
# stale site cannot cancel or mask the other; see the comment on the second job.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe design assets and homepages
        id: probe
        run: |
          set -uo pipefail
          fail=0
          probe() {
            local url="$1" want_type="$2"
            local status ctype
            read -r status ctype < <(curl -sL -o /dev/null --max-time 20 \
              -A "digithings-site-smoke/1.0 (+https://github.com/digithings-ai/digithings)" \
              -w "%{http_code} %{content_type}\n" "$url" || echo "000 none")
            case "$status" in
              200)
                if [[ "$ctype" == *"$want_type"* ]]; then
                  echo "PASS  $url ($ctype)"
                elif [[ "$ctype" == *text/html* && "$want_type" != text/html ]]; then
                  echo "FAIL  $url returned text/html — SPA fallback is masking a missing asset"
                  fail=1
                else
                  echo "FAIL  $url returned unexpected content-type '$ctype' (wanted $want_type)"
                  fail=1
                fi ;;
              403|429)
                echo "WARN  $url -> $status (bot challenge; inconclusive from CI)" ;;
              *)
                echo "FAIL  $url -> HTTP $status"
                fail=1 ;;
            esac
          }
          # digithings.ai — Next.js static export (frontend/digithings-web).
          probe "https://digithings.ai/" "text/html"
          # A second prerendered route. /modules/* was removed in the design
          # epic (#1414) — module detail pages folded into the home-page terminal
          # manifest (build-digithings.sh now asserts that manifest instead) — so
          # probe /docs/, still a prerendered static-export route.
          probe "https://digithings.ai/docs/" "text/html"
          # Stable non-HTML asset (public/og.png) — the canary for the
          # SPA-fallback MIME-masking regression #671 was written to catch.
          # Brand OG cards live at the export root (not /design/assets/); the
          # old path 404'd and kept #800 open as a daily false alarm.
          probe "https://digithings.ai/og.png" "image/png"
          # digiquant.io — Next.js static export (frontend/digiquant-web) +
          # Olympus dashboard mounted at basePath /olympus.
          probe "https://digiquant.io/" "text/html"
          probe "https://digiquant.io/olympus/" "text/html"
          probe "https://digiquant.io/og.png" "image/png"
          exit "$fail"

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[site-smoke] production design assets failing"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          BODY="Scheduled smoke check found a broken asset path in production. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — a probed URL 404'd or returned a soft-200 text/html SPA fallback (MIME masking, cf. #671)."
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label agent-task --label "component:website" --body "$BODY"
          fi

  freshness:
    name: digiquant.io deploy freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build stamp
        id: stamp
        run: |
          set -uo pipefail
          # Always create the file: curl leaves it absent when it never connects,
          # and the evaluator must see an empty body rather than crash.
          : >/tmp/build-info.json
          status=$(curl -sL --max-time 20 \
            -A "digithings-site-smoke/1.0 (+https://github.com/digithings-ai/digithings)" \
            -o /tmp/build-info.json -w "%{http_code}" \
            "https://digiquant.io/build-info.json" || echo "000")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "HTTP $status from https://digiquant.io/build-info.json"

      - name: Evaluate freshness
        env:
          # Via env, not direct ${{ }} interpolation into the script body.
          STATUS: ${{ steps.stamp.outputs.status }}
        run: |
          python3 scripts/check_deploy_freshness.py \
            --url https://digiquant.io/build-info.json \
            --status "$STATUS" \
            --body-file /tmp/build-info.json \
            --max-age-hours 168

      - name: Open issue on stale deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately a different title and label set from the asset probe
          # above: the remedy for a frozen deploy lives in the Cloudflare Pages
          # dashboard, not in this repository, so this is not an agent task.
          TITLE="[site-smoke] digiquant.io deploy is stale or unstamped"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          BODY="The daily freshness probe could not confirm a recent digiquant.io deploy. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID for the verdict. Either the live build stamp is older than the 7-day limit (Cloudflare Pages has stopped producing deployments) or the deploy predates \`build-info.json\` entirely. Check the Pages project's deployment list, build log, production branch and watch paths — cf. #1759."
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "component:digiquant-web" --body "$BODY"
          fi

  # digithings.ai gets its own job rather than a matrix over the two sites. A
  # matrix defaults to `fail-fast: true`, so the first stale site would cancel
  # the other's job — and a cancelled job never runs its `if: failure()` issue
  # step, i.e. one stale site would mask the other. That is one YAML line away
  # from regressing. The issue title, body and `component:` label also differ
  # per site. Job keys are asymmetric (`freshness` predates this one) to keep
  # the working digiquant.io detector untouched; read the `name:` for the site.
  freshness-digithings:
    name: digithings.ai deploy freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build stamp
        id: stamp
        run: |
          set -uo pipefail
          # Always create the file: curl leaves it absent when it never connects,
          # and the evaluator must see an empty body rather than crash.
          : >/tmp/build-info.json
          status=$(curl -sL --max-time 20 \
            -A "digithings-site-smoke/1.0 (+https://github.com/digithings-ai/digithings)" \
            -o /tmp/build-info.json -w "%{http_code}" \
            "https://digithings.ai/build-info.json" || echo "000")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "HTTP $status from https://digithings.ai/build-info.json"

      - name: Evaluate freshness
        env:
          # Via env, not direct ${{ }} interpolation into the script body.
          STATUS: ${{ steps.stamp.outputs.status }}
        run: |
          python3 scripts/check_deploy_freshness.py \
            --url https://digithings.ai/build-info.json \
            --status "$STATUS" \
            --body-file /tmp/build-info.json \
            --max-age-hours 168

      - name: Open issue on stale deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same reasoning as the digiquant.io job: the remedy for a frozen
          # deploy is a Cloudflare Pages dashboard action, not a code change, so
          # this issue is deliberately not dispatched to an agent the way the
          # asset probe's issue above is.
          TITLE="[site-smoke] digithings.ai deploy is stale or unstamped"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          BODY="The daily freshness probe could not confirm a recent digithings.ai deploy. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID for the verdict. Either the live build stamp is older than the 7-day limit (Cloudflare Pages has stopped producing deployments) or the deploy predates \`build-info.json\` entirely. Check the Pages project's deployment list, build log, production branch and watch paths — cf. #1759. **UNSTAMPED right after the stamp shipped is expected, not an alarm:** digithings.ai only carries \`build-info.json\` once Cloudflare Pages next rebuilds it, so until then this verdict means 'not yet observable'. Trigger a Pages rebuild and re-run this workflow; if it still reports UNSTAMPED afterwards, the deploy really is frozen."
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "component:website" --body "$BODY"
          fi
