name: "Test: olympus"

on:
  workflow_call:


jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Canon ratchet (#1404) — see frontend/digiweb/MIGRATION.md
      - name: Frontend canon guard
        run: python3 scripts/check_frontend_canon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm install --no-audit --no-fund --include=optional

      # Only the Tailwind oxide binding — the install above resolves every other native
      # from package-lock.json, which locks @rolldown/binding-linux-x64-gnu 1.2.2 (an
      # optionalDependency of the locked rolldown 1.2.2, which is what vitest needs) and
      # both lightningcss Linux x64 builds the tree needs — 1.33.0 hoisted to the root
      # for vite's lightningcss, and 1.32.0 nested under the root lightningcss 1.32.0.
      # @tailwindcss/oxide is the one genuinely macOS-only tree: oxide-darwin-arm64 4.2.2
      # is its sole platform entry.
      #
      # It is not, however, the only macOS-only native tree in the lock, and saying
      # "the one" overstated it: `unrs-resolver` 1.11.1 is a NON-optional dev dep with
      # no `os` constraint, declaring 19 platform bindings of which the lock holds only
      # @unrs/resolver-binding-darwin-arm64 — no linux-x64-gnu, and no wasm fallback.
      # It does NOT follow that Linux gets nothing loadable, which an earlier version of
      # this comment claimed: `unrs-resolver` ships `postinstall: napi-postinstall
      # unrs-resolver 1.11.1 check` (hasInstallScript in the lock), which fetches the
      # right binding itself when npm did not supply it. Verified by installing with
      # --omit=optional and watching it install the binding. No lane passes
      # --ignore-scripts and there is no root .npmrc, so that repair always runs.
      #
      # So there are two independent reasons nothing breaks: the package self-heals, and
      # eslint-config-next's flat config never reaches the TypeScript resolver that would
      # load it anyway (verified with a Module._load hook — zero loads across all three
      # apps' lint runs). The durable fix is the lockfile, not this step.
      #
      # The npm/cli#4828 cache worry this step used to cite does not reach those locked
      # entries: setup-node caches the machine's global npm cache rather than
      # node_modules (per its advanced-usage docs), so the install always runs and always
      # resolves against the lock — and `--include=optional` above is already explicit.
      #
      # The old rolldown 1.0.0-rc.16 pin installed a stale duplicate of a binding the lock
      # has moved off, and the lightningcss 1.32.0 pin overwrote the hoisted 1.33.0,
      # leaving vite's lightningcss 1.33.0 resolving to a 1.32.0 binary.
      - name: Install the Linux Tailwind binding
        run: |
          npm install @tailwindcss/oxide-linux-x64-gnu@4.2.2 \
            --no-save --no-audit --no-fund

      - name: Lint
        run: npm run lint --workspace olympus

      - name: Build
        run: npm run build --workspace olympus

      - name: Test
        run: npm run test --workspace olympus
