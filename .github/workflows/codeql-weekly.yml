# CodeQL (advanced setup) — develop only, low frequency.
# Deliberately NO pull_request / push triggers to save Actions minutes.
# Revert: delete this file.
name: CodeQL weekly (develop)
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: codeql-weekly
  cancel-in-progress: true
jobs:
  analyze:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
