# Self-host <-> hosted parity (DIG-2767, DIG-2758 plan section 8).
#
# Three arms are real here and one is deliberately absent:
#
#   (a) contract lint  -- runs, and reports NOT RUN while config/contract/ does
#                         not exist. Slice S1 (DIG-2769) owns that directory. It
#                         must never pass vacuously, so exit code 3 is surfaced
#                         as NOT RUN rather than folded into a green check.
#   (b) migrations     -- applies the whole digiquant Supabase chain to a clean
#                         postgres:17 and requires the set of files that do NOT
#                         apply to match config/self-host/parity-baseline.json
#                         exactly. Today 11 of 137 do not apply from empty; the
#                         baseline records each one with a class and a reason.
#   (d) drift          -- a new Worker, binding, var or compose env key fails.
#
#   (c) `dt up --profile core` + health + API contract tests is NOT here. It
#      needs the bring-up slice (S7 / DIG-2775), which has not landed. Its
#      NIGHTLY half cannot be a `schedule:` on this repo at all: the house rule
#      in tests/scripts/test_no_gha_schedules.py is that develop has no
#      `on.schedule` and every clock lives on the digithings-cron Worker, so a
#      GHA cron here would double-fire. A nightly run has to be a
#      digithings-cron job.
name: self-host-parity

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/*/wrangler.toml"
      - "docker-compose.yml"
      - "**/compose*.yml"
      - "**/*.env.example"
      - "config/self-host/**"
      - "scripts/self_host_parity.py"
      - "scripts/self_host_migrations_check.sh"
      - "digiquant/supabase/**"
  pull_request:
    paths:
      - "apps/*/wrangler.toml"
      - "docker-compose.yml"
      - "**/compose*.yml"
      - "**/*.env.example"
      - "config/self-host/**"
      - "scripts/self_host_parity.py"
      - "scripts/self_host_migrations_check.sh"
      - "digiquant/supabase/**"

concurrency:
  group: self-host-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: self-host parity (contract + drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2"
      - name: contract lint (arm a) -- NOT RUN is acceptable, a failure is not
        run: |
          # GitHub runs every `run:` block under `bash -e {0}`, so a bare
          # `cmd; rc=$?` is dead code: `cmd` exiting 3 kills the step before
          # `rc=$?` is ever reached. A command on the left of `||` is exempt
          # from errexit, which is the only way to capture the code. CI caught
          # this on PR #5351, where the check printed NOT RUN correctly and
          # still went red with "exit code 3".
          rc=0
          python scripts/self_host_parity.py --mode contract || rc=$?
          echo "contract exit code: $rc (0 pass, 3 not run, 1 fail)"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
      - name: surface drift (arm d)
        run: python scripts/self_host_parity.py --mode drift

  migrations:
    name: self-host parity (migrations on clean PG17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: parity
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: parity
      PGDATABASE: parity_migrations_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The judge imports yaml at module scope. The runner image happens to
      # ship it, but an implicit dependency is not a dependency: install it
      # explicitly here exactly as the drift job does, so the two jobs cannot
      # drift apart by accident.
      - run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2"
      - name: report the server we are about to test against
        run: |
          psql -X -q -At -d postgres -c 'show server_version;'
          echo "digiquant/supabase/config.toml pins: $(grep -E 'major_version' digiquant/supabase/config.toml)"
      - name: apply the whole chain to a clean database (arm b)
        # --continue-on-error makes an incomplete chain DATA: this step exits 0
        # after printing MEASURED, and the next step decides PASS or FAIL from
        # the recorded baseline. Without that split the job went red on the
        # very gaps this check calls known (PR #5351).
        run: bash scripts/self_host_migrations_check.sh --continue-on-error --json-out "$RUNNER_TEMP/migrations.json"
      - name: compare the from-empty gaps with the recorded baseline
        if: always()
        run: python scripts/self_host_parity.py --mode migrations --report "$RUNNER_TEMP/migrations.json"
