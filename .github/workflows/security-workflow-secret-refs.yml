# Workflow secret references (DIG-4717).
#
# WHAT THIS RUNS
#
# Every `secrets.NAME` read under `.github/workflows/` is collected and checked
# against the secret and variable names that exist, at every level a name can
# live at: repo secret, repo variable, org secret, environment secret. A name
# that no level defines is reported as `unresolved` and fails the job.
#
# The failure this exists to stop is a silent one. Actions substitutes an EMPTY
# STRING for a secret name it cannot resolve, so a workflow that reads a name
# nobody defined does not fail: it runs, with the variable empty, until the
# tool that consumes it refuses. The stack deploy lane read
# `secrets.CLOUDFLARE_WORKERS_API_TOKEN` from #6013 and the secret was never
# created, so the lane exported an empty `CLOUDFLARE_API_TOKEN` and wrangler
# refused at the end of the run. Nothing said which credential was missing.
# The lane reads the name that exists again; the gap is closed, and this check
# is what keeps it closed.
#
# WHY THE NAMES COME FROM A COMMITTED MANIFEST
#
# The live secret listings cannot be read from a workflow, at all.
# `GET repos/{owner}/{repo}/actions/secrets`, `orgs/{org}/actions/secrets` and
# `repos/{repo}/environments/{env}/secrets` all document that they need the
# `repo` scope, and a workflow's GITHUB_TOKEN is a GitHub App installation
# token whose `permissions:` vocabulary has no key for secrets - so no value
# of `permissions:` can express it. Run 37235973852 (#5063, 2026-10-04) granted
# `actions: read` and all three listings still answered
# `Resource not accessible by integration (HTTP 403)`. Giving CI a PAT that
# could read them was rejected on purpose (Paperclip DIG-477, option D): it
# would stand up the exact category of repo-scoped credential #248 exists to
# shrink.
#
# So the names come from `.github/secret-names.json`, a committed manifest of
# NAMES ONLY - no values, ever. `docs/ops/SECRETS_INVENTORY.md` publishes most
# of those names already, so the manifest exposes little that is not public
# already; it is not a subset of the inventory, though - a name can be new, and
# the inventory publishes the `DIGI_*_PROJECT_NUMBER` variables only in glob
# form. The manifest is refreshed by an operator:
#
#     make secrets-audit-refresh
#
# and a level the refresh could not list is recorded as unread, so the audit
# refuses to claim it looked at everything rather than reporting a false
# "unresolved". See docs/ops/WORKFLOW_SECRET_REFS.md.
#
# WHY THIS IS A SEPARATE WORKFLOW AND NOT ONLY A ci.yml LANE
#
# The same check is also a `workflow-secret-refs` lane in ci.yml, folded into
# the `Required checks passed` aggregator, so that it is a real merge gate
# once CI runs. ci.yml is currently DISABLED on GitHub - the cost lock of
# 2026-10-14 (DIG-4364) turned the whole CI suite off - so a lane inside it
# reports nothing at all today. This workflow is the live reporter: it runs on
# any change to a workflow, to the manifest, or to the script, and it reports
# on the PR. When ci.yml comes back, both run the same one-line command
# against the same manifest, and the ci.yml copy is the one that gates.
#
# It is deliberately NOT a required status-check context: this workflow is
# path-filtered, and a path-filtered check can never be required - GitHub
# blocks a merge forever on a status that never arrives. Adding it to
# `.github/required-contexts.txt` is a human-only repo-settings write
# (DIG-1952 child B) and is not this seat's to make.
name: "Security: workflow secret references"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/secret-names.json"
      - "scripts/secrets_audit.py"
      - "tests/scripts/test_secrets_audit.py"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/secret-names.json"
      - "scripts/secrets_audit.py"
      - "tests/scripts/test_secrets_audit.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Named apart from the ci.yml lane on purpose: two jobs with the same
    # `name:` would report the same check-context name, and a branch-protection
    # entry cannot tell them apart. The ci.yml copy is the gate; this one is
    # the reporter that runs while ci.yml is disabled.
    name: Workflow secret references (PR reporter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyYAML, because the audit parses a workflow instead of scanning it as
      # text. A line-based scan cannot tell a comment from a `#` inside a
      # quoted scalar, and it cannot see an expression that spans two lines -
      # both were ways for a live read to vanish from the check. Twelve house
      # scripts already import yaml and ci.yml already installs it the same
      # way, so this is the house pattern rather than a new dependency.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # `--strict-unresolved` is the gate: it fails on a read that no level
      # defines, and it refuses to report success when a level could not be
      # listed. `--strict` is deliberately NOT passed - it fails on a repo
      # secret that nothing reads, and CRON_KICK_SECRET and
      # SUPABASE_SERVICE_ROLE_KEY are such a secret today. That is a rotation
      # finding, not a broken reference, and failing on it would block every
      # merge for a credential problem that is recorded in the inventory.
      - name: Check every workflow secret reference
        run: |
          python3 scripts/secrets_audit.py \
            --manifest .github/secret-names.json \
            --strict-unresolved
