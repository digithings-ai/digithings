# Answer-integrity probe against DataTap production (#DIG-306). Retired as a
# scheduled check: manual dispatch only.
#
# What this checks: that the answer DataTap serves a real visitor has not started
# carrying a customer name list or a leaked identifier. That is the failure a
# redesign of their answer page would produce, and it is not visible from the
# outside except by reading the answer itself.
#
# Why this needs no credential at all: the check reads the answer out of DataTap's
# own public page and compares it against its own public specification. There is
# nothing to authenticate against, so this workflow adds no secret. The check is
# read-only and writes nothing.
#
# One piece of configuration is not a credential and still has to come from
# somewhere: the host allowlist the check refuses to leave
# (`ANSWER_CHECK_EMBED_HOSTS`, below). The embed host is the client's own
# hostname and changes on every redeploy, so its value cannot be written into
# this file — it is a repository variable, and the refusal names both the
# variable and the host it saw, so an operator can replace the entry.
#
# A dispatch may also name the list for that one run (`embed_host`, below). The
# variable stays the default; the input exists because this workflow is manual
# only (DIG-4435), the host changes without us, and until 2026-10-27 an unset
# variable made every dispatch exit 2 before the check could see anything
# (DIG-5790). The input is not a weaker pin: the list is still named by a person
# with write access at the moment of the run, never by the page the check reads,
# and this workflow carries no secret for it to carry off (a test pins the
# absence of any secret reference in
# tests/scripts/test_datatap_answer_check_clock.py).
#
# An allowlist that resolves to nothing fails on its own step, below, and says
# so. That is the difference between "this deployment has not been vetted" and
# "the check could not reach the answer": both used to leave as exit 2 with only
# the script's line to tell them apart.
#
# No `on.schedule` here on purpose: every clock for this repo lives on the
# digithings-cron Worker (a GitHub cron on develop would double-fire, and
# tests/scripts/test_no_gha_schedules.py enforces that).
#
# The Worker clock that used to dispatch this workflow every hour at minute 17
# was retired on 2026-10-18: the client manages their own infrastructure, so we
# do not probe them on a schedule (DIG-4435). The workflow file stays on
# develop and a human can still start the probe by hand. Nothing dispatches it
# on a schedule any more, so a run here is a deliberate act, not a clock tick.
name: "Check: DataTap answer integrity"

on:
  workflow_dispatch:
    inputs:
      embed_host:
        description: >-
          Optional. Comma-separated embed host(s) this run may talk to. Overrides
          the ANSWER_CHECK_EMBED_HOSTS repository variable. Leave empty to use
          the variable.
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Supersede rather than queue. Each run is an independent read-only probe, so the
# newest run's work fully covers whatever it displaces — the condition the #2541
# writeup sets for cancel-in-progress: true. `cancel-in-progress: false` would let
# one slow hour stack a queue behind it for no gain; the check has no state to
# finish. There is no `environment:` gate and no secret, so the #2541 approval-queue
# hazard does not apply here.
concurrency:
  group: datatap-answer-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The hosts this deployment allows the check to talk to. A repository
    # variable, not a secret: the value is a hostname, and it is not written
    # here because the embed host changes on every client redeploy. A dispatch
    # may override it for one run with the `embed_host` input; both empty means
    # the check refuses to run, and the step below says which one to set.
    env:
      ANSWER_CHECK_EMBED_HOSTS: ${{ inputs.embed_host || vars.ANSWER_CHECK_EMBED_HOSTS }}
    steps:
      # Before the checkout on purpose: an unset allowlist is a configuration gap
      # and no amount of cloning changes that. It also keeps the two failures
      # apart. An empty allowlist used to reach the script, which left with
      # "COULD NOT RUN … exit 2" — the same code and the same shape as a client
      # platform that did not answer, so a blind check read as a DataTap result.
      # This step fails closed with the fix in the annotation, and exits 2 for the
      # same reason the script does: 1 is reserved for a fabrication finding.
      - name: Fail as a config gap when the host allowlist is empty
        shell: bash
        run: |
          set -uo pipefail

          # An unset variable arrives as an empty string, and a value of nothing
          # but separators is no more usable: both would leave the script with an
          # empty allowlist. Commas are stripped with the whitespace because the
          # list is comma-separated, so ",," is empty however it is spelled.
          list="${ANSWER_CHECK_EMBED_HOSTS:-}"
          usable=$(printf '%s' "$list" | tr -d '[:space:],')
          if [ -z "$usable" ]; then
            echo "::error::ANSWER_CHECK_EMBED_HOSTS is unset — set the repository variable ANSWER_CHECK_EMBED_HOSTS to the embed host the discovery page names, or dispatch this workflow with the embed_host input. This is a configuration gap, not a DataTap result."
            exit 2
          fi

          echo "answer-check: embed-host allowlist: $list"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the check and surface its real exit code
        shell: bash
        run: |
          set -uo pipefail
          LOG=$(mktemp)

          # `make datatap-answer-check` is the same command a developer runs, so a
          # dispatched run and a developer's local run cannot drift apart. Its
          # exit code, though, cannot be used directly: GNU make returns 2 for *any*
          # failing recipe and can never return 1 (verified on make 3.81 — a child
          # exiting 1 and a child exiting 2 both surface as make exit 2). That would
          # collapse two very different hours into one indistinguishable red: exit 1 is
          # a fabrication found, exit 2 is a check that could not see the answer at
          # all. The target's recipe therefore echoes the script's real code on a
          # `datatap-answer-check: exit N` line for exactly this purpose, so recover
          # that number and exit with it. Both codes still fail the job; they just stop
          # being the same failure.
          #
          # `|| rc=$?` rather than a bare call because Actions runs `run:` blocks under
          # `set -e`, which would abort before the recovery below could run. Redirecting
          # to a file rather than piping to tee keeps pipefail out of the status path.
          rc=0
          make datatap-answer-check > "$LOG" 2>&1 || rc=$?
          cat "$LOG"

          real=$(awk '/^datatap-answer-check: exit [0-9]+$/ { code = $NF } END { print code }' "$LOG")
          if [ -z "$real" ]; then
            # make failed before the recipe ran, so it never printed a status line.
            # Non-zero on purpose: an unanswered question is not a passing check.
            echo "::error::make exited $rc without datatap-answer-check reporting a status"
            exit 2
          fi

          # `real` is text lifted out of the log, so it is only ever as trustworthy as
          # the recipe that wrote it. Where the two disagree, make is the authority:
          # a failing make next to a report line claiming exit 0 means the status line
          # is lying, and a green run over a failed check is the one outcome worth
          # failing closed for. Unreachable with the committed Makefile; cheap if that
          # recipe ever changes shape. An `if` rather than an `&&` chain, because
          # Actions runs this block under `set -e` and a false chain would abort the step.
          if [ "$rc" -ne 0 ] && [ "$real" -eq 0 ]; then
            echo "::error::make exited $rc while the recipe reported datatap-answer-check: exit 0"
            exit "$rc"
          fi

          echo "datatap-answer-check: exit $real"
          exit "$real"
