# Auto-stub scripts/project_fields.tsv when relevant labels are applied to an issue.
#
# PAUSED (2026-08-21): stub-tsv + stub-tsv-phase require vars.STUB_TSV_ENABLED == 'true'
# (unset/empty → jobs skip). Avoid bare `if: false` — actionlint rejects constant if-conds.
# They opened one bot/stub-tsv-<N> PR per labeled issue and cluttered the queue.
# TSV rows for CLI-created issues still come from create_issue.sh; Project #1
# field sync still runs via set_project_fields.sh / board workflows. Reap job
# stays on so closing leftover stub PRs still deletes their branches.
# Follow-up: replace PR stubs with direct board writes (see backlog-reshape
# workflow audit § TSV-based project-field stubbing).
#
# Job 1 (stub-tsv): fires on `issues.labeled` when `agent-task` is applied.
#   Infers phase/area/kind/priority/model from existing labels and opens a PR
#   that appends a row to project_fields.tsv.
#
# Job 2 (stub-tsv-phase): fires on `issues.labeled` when the client-pilot label
#   is applied to an issue that is NOT labeled `housekeeping`. Opens the same
#   kind of stub PR. Skips if the issue already has `agent-task` (job 1 covers
#   that case). (phase-N labels were deleted in the 2026-09 board cleanup.)
#
# Job 3 (reap-stub-branch): fires on `pull_request.closed` (merged or closed
#   unmerged) for any `bot/stub-tsv-<N>` head branch and deletes it via the API.
#   Never fires while the PR is open. Idempotent — a branch already gone is not
#   an error. See #2465.
#
# Both stub jobs skip if the issue number is already in project_fields.tsv.
# See set_project_fields.sh for field-name conventions (exact em-dash strings required).
name: "Project: stub fields TSV"

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]

concurrency:
  group: auto-stub-tsv
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  stub-tsv:
    name: Append inferred row to project_fields.tsv
    # Paused: do not open bot/stub-tsv-* PRs unless repo var STUB_TSV_ENABLED=true.
    # Original: github.event.label.name == 'agent-task'
    if: vars.STUB_TSV_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Check if row already exists
        id: check
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          TSV="scripts/project_fields.tsv"
          if grep -q "^${ISSUE}	" "$TSV" 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Row for #${ISSUE} already in ${TSV} — nothing to do."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No row for #${ISSUE} — will infer and append."
          fi

      - name: Infer and append row
        if: steps.check.outputs.present == 'false'
        id: infer
        env:
          ISSUE: ${{ github.event.issue.number }}
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          TSV="scripts/project_fields.tsv"
          ROW=$(python3 scripts/infer_project_fields_row.py "$ISSUE" "$LABELS")
          echo "$ROW" >> "$TSV"
          echo "Appended inferred row for #${ISSUE}:"
          tail -1 "$TSV"
          IFS=$'\t' read -r _ PHASE AREA KIND PRIORITY MODEL <<< "$ROW"
          {
            echo "phase=$PHASE"
            echo "area=$AREA"
            echo "kind=$KIND"
            echo "priority=$PRIORITY"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"

      - name: Open stub PR
        if: steps.check.outputs.present == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ci): auto-stub TSV row for issue #${{ github.event.issue.number }}"
          branch: "bot/stub-tsv-${{ github.event.issue.number }}"
          base: develop
          title: "chore(ci): stub project_fields.tsv row for #${{ github.event.issue.number }}"
          body: |
            ## Auto-stub: project_fields.tsv row for #${{ github.event.issue.number }}

            Appended an inferred row for issue #${{ github.event.issue.number }} (`${{ github.event.issue.title }}`).

            **Inferred values — verify before merging:**
            | Column | Inferred value | Override if wrong |
            |--------|---------------|-------------------|
            | phase | `${{ steps.infer.outputs.phase }}` | Edit TSV if phase label is missing or wrong |
            | area | `${{ steps.infer.outputs.area }}` | Edit TSV if component label is missing or wrong |
            | kind | `${{ steps.infer.outputs.kind }}` | Epic, Feature, Task, Bug, Chore, or Research |
            | priority | `${{ steps.infer.outputs.priority }}` | P0, P1, P2, or P3 |
            | model | `${{ steps.infer.outputs.model }}` | sonnet (standard) or opus (complex/high-risk) |

            See `scripts/set_project_fields.sh` for exact field-name requirements.

            Refs #${{ github.event.issue.number }}
            Fixes #128
          labels: "housekeeping"
          add-paths: scripts/project_fields.tsv

  reap-stub-branch:
    name: Delete stub-tsv branch after its PR closes
    if: startsWith(github.event.pull_request.head.ref, 'bot/stub-tsv-')
    runs-on: ubuntu-latest

    steps:
      - name: Delete branch (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Passed via env, never interpolated into the script body, so an
          # attacker-controlled fork branch name can't inject shell commands
          # (see security-guidance plugin note on github.event.pull_request.head.ref).
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! [[ "$BRANCH" =~ ^bot/stub-tsv-[0-9]+$ ]]; then
            echo "'$BRANCH' doesn't match bot/stub-tsv-<N> exactly — refusing to touch it."
            exit 0
          fi
          if gh api "repos/${REPO}/git/refs/heads/${BRANCH}" &>/dev/null; then
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"
            echo "Deleted ${BRANCH}"
          else
            echo "${BRANCH} already gone — nothing to do."
          fi

  stub-tsv-phase:
    name: Append inferred row for non-agent-task client-pilot issues
    # Paused: require STUB_TSV_ENABLED=true. Original condition kept below for restore.
    # Fire when the client-pilot label is applied, but NOT for agent-task (job 1 covers that)
    # and NOT for housekeeping issues (those are exempt from project-field requirements).
    # (phase-N labels were deleted in the 2026-09 board cleanup.)
    if: |
      vars.STUB_TSV_ENABLED == 'true' &&
      github.event.label.name != 'agent-task' &&
      github.event.label.name != 'housekeeping' &&
      github.event.label.name == 'client-pilot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Guard — skip if already in TSV, housekeeping, or agent-task
        id: guard
        env:
          LABELS: ${{ toJson(github.event.issue.labels) }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          TSV="scripts/project_fields.tsv"

          LABEL_NAMES=$(echo "$LABELS" | python3 -c "
          import json,sys
          labels = json.load(sys.stdin)
          print(' '.join(l['name'] for l in labels))
          ")

          # Skip if issue is already in TSV.
          if grep -q "^${ISSUE}	" "$TSV" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Row for #${ISSUE} already in ${TSV} — nothing to do."
            exit 0
          fi

          # Skip if agent-task label is present (job 1 handles it).
          if echo "$LABEL_NAMES" | grep -qw "agent-task"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "#${ISSUE} has agent-task label — stub-tsv job handles it."
            exit 0
          fi

          # Skip if housekeeping label is present.
          if echo "$LABEL_NAMES" | grep -qw "housekeeping"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "#${ISSUE} is housekeeping — exempt from project-field requirements."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No row for #${ISSUE} — will infer and append."

      - name: Infer and append row
        if: steps.guard.outputs.skip == 'false'
        id: infer
        env:
          ISSUE: ${{ github.event.issue.number }}
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          TSV="scripts/project_fields.tsv"
          ROW=$(python3 scripts/infer_project_fields_row.py "$ISSUE" "$LABELS")
          echo "$ROW" >> "$TSV"
          echo "Appended inferred row for #${ISSUE}:"
          tail -1 "$TSV"
          IFS=$'\t' read -r _ PHASE AREA KIND PRIORITY MODEL <<< "$ROW"

          {
            echo "phase=$PHASE"
            echo "area=$AREA"
            echo "kind=$KIND"
            echo "priority=$PRIORITY"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"

      - name: Open stub PR
        if: steps.guard.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ci): auto-stub TSV row for issue #${{ github.event.issue.number }}"
          branch: "bot/stub-tsv-${{ github.event.issue.number }}"
          base: develop
          title: "chore(ci): stub project_fields.tsv row for #${{ github.event.issue.number }}"
          body: |
            ## Auto-stub: project_fields.tsv row for #${{ github.event.issue.number }}

            Appended an inferred row for issue #${{ github.event.issue.number }} (`${{ github.event.issue.title }}`).

            **Inferred values — verify before merging:**
            | Column | Inferred value | Override if wrong |
            |--------|---------------|-------------------|
            | phase | `${{ steps.infer.outputs.phase }}` | Edit TSV if phase label is missing or wrong |
            | area | `${{ steps.infer.outputs.area }}` | Edit TSV if component label is missing or wrong |
            | kind | `${{ steps.infer.outputs.kind }}` | Epic, Feature, Task, Bug, Chore, or Research |
            | priority | `${{ steps.infer.outputs.priority }}` | P0, P1, P2, or P3 |
            | model | `${{ steps.infer.outputs.model }}` | sonnet (standard) or opus (complex/high-risk) |

            See `scripts/set_project_fields.sh` for exact field-name requirements.

            Refs #${{ github.event.issue.number }}
            Fixes #128
          labels: "housekeeping"
          add-paths: scripts/project_fields.tsv
