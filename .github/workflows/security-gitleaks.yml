# Secrets-scan CI (epic #2 hardening sub-task).
#
# Scans PR diffs on every pull request and the full history on pushes to
# develop/main. Fails the job on any finding. The repo's ".gitleaks.toml"
# extends the default ruleset and allowlists known test fixtures.
#
# The pull_request trigger is deliberately unfiltered. It used to carry
# paths-ignore ["**.md", "docs/**"], which made this workflow un-runnable as a
# required status check: a workflow filtered out at the workflow level creates
# NO check run at all, so a docs-only PR never reports `gitleaks-scan`. With
# develop protection strict: true, promoting this check to required would then
# block every docs-only PR forever. Measured on merged PRs' head shas: #5286
# (scripts/merge_queue_policy.json) reported gitleaks-scan: success, while #5281
# (SECURITY.md) and #5260 (docs/ops/SECRETS_INVENTORY.md) had no gitleaks-scan
# context on the head sha at all. A job-level `if:` would also fix that (a
# skipped job does report), but GitHub expressions cannot test "changed files
# match this path glob", so the filter could not be reproduced faithfully at
# job level. Always running costs one ~10 s PR-diff scan. See DIG-2223 / DIG-2642.
name: "Security: gitleaks"

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Pinned gitleaks OSS CLI release. Bump together with a SECURITY.md note.
  # (gitleaks/gitleaks-action v2 now requires a paid license for org repos
  # per their Aug-2022 announcement, so we invoke the OSS CLI directly —
  # still MIT-licensed and identical scanner.)
  GITLEAKS_VERSION: "8.21.2"
  # Checksum of the gitleaks_<version>_linux_x64.tar.gz release asset. Pin
  # for supply-chain integrity; update when bumping GITLEAKS_VERSION.
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  scan:
    name: gitleaks-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can resolve the PR base..head diff on
          # pull_request and scan the full log on develop/main pushes.
          fetch-depth: 0

      - name: Install gitleaks (pinned release tarball)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Retry flags are load-bearing -- do not "simplify" them away. On
          # 2026-08-12 this download failed four times across two workflows
          # (`curl: (22) ... 503` and `curl: (56) Connection died`), each time
          # killing the job at install so the scan never ran at all. A red that
          # never inspected the diff teaches people to re-run reflexively, which
          # is how a real finding eventually gets waved through.
          #   --retry alone is NOT enough: curl's "transient error" set is
          #   timeouts and HTTP 408/429/500/502/503/504, so a connection reset
          #   (exit 56) is not retried without --retry-all-errors.
          #   curl's own man page calls --retry-all-errors a "sledgehammer"
          #   because retries can duplicate sent/received data. That warning
          #   does not apply here: this is an idempotent GET of an immutable
          #   release asset to a file that each attempt overwrites, and the
          #   result is checksum-verified below before anything executes it.
          # (The "tried 5 times" in the old logs was curl's internal
          # connection-reuse retry, a different mechanism -- --retry itself
          # defaults to 0, i.e. this had no retry configured at all.)
          # Accepted trade: --retry-all-errors also retries PERMANENT failures,
          # so a wrong version/asset name (404) costs ~10s of pointless retries
          # before it reports. Measured, deliberate, and cheap next to a false
          # red that needs a human to notice and re-run.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 -o /tmp/gitleaks.tgz "$url"
          # Checksum verification guards against tampered release assets, and is
          # what makes the retry above safe. If this step fails after a version
          # bump, recompute SHA256 and update GITLEAKS_SHA256.
          actual="$(sha256sum /tmp/gitleaks.tgz | awk '{print $1}')"
          if [ "$actual" != "$GITLEAKS_SHA256" ]; then
            echo "checksum mismatch: expected $GITLEAKS_SHA256 got $actual" >&2
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          # Fast path: scan only commits in the PR range. Uses git log -p.
          #
          # --report-* makes the scan self-diagnosing (DIG-872). Without it the
          # only trace of a finding is a bare "WRN leaks found: N" in a log that
          # is gone after retention, so every red costs a manual reproduction:
          # fetch the pinned scanner, pin --log-opts against the right history,
          # and discard whatever the bare run invents by walking local refs.
          # A red that will not say what it found invites a re-run reflex, and
          # on a gate that has been red for days the cheapest available action
          # is to suppress the next finding rather than reproduce it.
          #
          # The report is written under RUNNER_TEMP, never inside the repo, so
          # it cannot be committed and cannot re-enter the next scan's history.
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-report.json" \
            --log-opts="--no-merges origin/${GITHUB_BASE_REF}..HEAD"

      - name: Scan (full history)
        if: github.event_name == 'push'
        run: |
          # develop/main: scan the full repo history to catch leaks pushed
          # around checks (belt-and-braces with the PR-gate above).
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-report.json"

      # `if: always()` on both steps below is load-bearing. The artifact is
      # needed exactly when the scan fails, and a step gated on success() would
      # publish nothing on the one run a human is trying to read.
      - name: Name the findings
        if: always()
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          if [ ! -f "$report" ]; then
            echo "::warning::gitleaks wrote no report, so the scan did not complete. Read the step above."
            exit 0
          fi
          # Reads the ALREADY-redacted report and prints only locating metadata.
          # --redact rewrites both the Secret field and the Match field (the
          # latter embeds the offending source line), which is what makes it safe
          # to publish this file; verified against a seeded fixture, not assumed.
          python3 -c 'import json,sys
          f=json.load(open(sys.argv[1]))
          print("=== gitleaks findings: %d ===" % len(f))
          if not f: print("  (none)")
          for x in f:
              print("  %-24s %s:%s  commit %s" % (x.get("RuleID"), x.get("File"), x.get("StartLine"), (x.get("Commit") or "")[:9]))
          ' "$report"

      - name: Upload the findings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30

# --- seed payload PII gate (DIG-1210) ---
# A tracked data payload is copied verbatim into a running vector store, so an
# address inside one reaches whoever the tenant talks to. gitleaks looks for
# credentials; nothing looked for personal data. On 2026-10-02 (#4987) a
# 1.5 MB payload carrying 791 rows with customer email addresses and 372
# `[internal]` staff notes landed on main in this public repository, and CI was
# green.
#
# Scoped to the PR diff, so introducing the gate cannot fail on the payload that
# is already committed — the same reasoning as BASELINE_SHA in
# scripts/check_review_coverage.py. It is NOT a required status check yet;
# wiring it as one waits on the containment in DIG-1230, because a required
# check that is red from day one gets suppressed rather than fixed.
#
# Counts and locations only: the guard never prints an address, because a CI log
# in a public repo is a second disclosure channel.
      - name: Seed payloads carry no unmasked address
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          python3 scripts/check_pii_seed_payloads.py --base "origin/${GITHUB_BASE_REF}" --head HEAD
