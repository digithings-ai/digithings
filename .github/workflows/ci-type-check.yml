name: "CI: type check"

on:
  push:
    branches: [main, develop]
    paths:
      - "digibase/**"
      - "digikey/**"
      - "mypy.ini"
  pull_request:
    paths:
      - "digibase/**"
      - "digikey/**"
      - "mypy.ini"

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy — digibase + digikey
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e "./digibase"
          pip install -e "./digikey"
          # Version-bounded like ruff and the test tooling (#1711). mypy was
          # installed completely unpinned here, so a release adding checks could
          # turn this gate red on unchanged code — the failure mode that cost a
          # day in #1701/#1705. mypy 2.x is what CI already resolves and passes,
          # so this holds the current behaviour rather than changing it.
          pip install "mypy>=2,<3" types-PyYAML

      - name: Run mypy
        run: |
          mypy digibase/src/digibase/ digikey/src/digikey/ --config-file mypy.ini
