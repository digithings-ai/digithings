name: "Pipeline: digiquant prices"

# Scheduled price + technicals ingest via the migrated digiquant.data.prices
# package (issue #149, Wave 1 Unit E). Four separate jobs:
#
#   * intraday  — every 15 min across the US cash session (13:00–21:45 UTC; see DST note)
#   * at-open   — position_events at the 09:30 ET open (13:35 + 14:35 UTC, one gated out)
#   * fx-refresh — latest Yahoo daily FX candle every 2h through the FX week
#   * eod-macro — once per weekday at 21:25 UTC, after the close in both ET offsets,
#                 and because FRED is day-delayed.
#
# All three jobs are triggerable manually via workflow_dispatch.
#
# DST (#1775) — every deadline here is an America/New_York wall-clock event (09:30
# open, 16:00 close) but GitHub cron is fixed UTC, and the offset moves an hour twice
# a year. Two different techniques, because the two shapes of constraint differ:
#
#   * one-sided constraints ("after the close", "somewhere in the session") are solved
#     by picking / widening a UTC window that satisfies both offsets. Extra off-session
#     quote ticks are idempotent re-upserts of values already written, which is already
#     the status quo at one end or the other in each season — so intraday and eod-macro
#     stay UNGATED on purpose. A runtime gate there would put the entire live price feed
#     behind a clock expression, and a gate bug would be silent and total.
#   * two-sided constraints ("scheduled after 09:30 ET, never before") are unsatisfiable
#     by any single UTC cron, since the two offsets differ by exactly one hour: a fixed
#     minute is either ~65 min late in one season or ~55 min early in the other. So
#     at-open ships both crons and gates them on the ET wall clock (job `at-open-clock`).

on:
  schedule:
    # Intraday quotes + technicals. 13:00–21:45 UTC is the UNION of the two ET
    # sessions: 09:00–17:45 EDT and 08:00–16:45 EST. The old `13-20` was
    # 09:00–16:45 EDT but 08:00–15:45 EST — in winter it stopped 15 min BEFORE the
    # close, so the most-watched quarter hour of the session never refreshed.
    - cron: '*/15 13-21 * * MON-FRI'
    # EOD macro + full sector universe. 17:25 EDT / 16:25 EST — after the close in
    # both offsets, where the old `0 21` was 16:00 EST, i.e. AT the winter bell.
    # Constraints on this minute, all three binding:
    #   * > 16:00 ET so the regular-session close has settled (25 min in winter);
    #   * NOT a multiple of 15, so it never shares a minute with an intraday tick —
    #     `digiquant-prices-intraday` is a per-job concurrency group and does not
    #     cover this job, and two concurrent yfinance pulls are a rate-limit risk;
    #   * done before 22:00 UTC, because pipeline-research-metrics.yml's `0 22` cron
    #     documents that it must run after this ingest. Worst case at the 20-minute
    #     timeout is 21:45, leaving ~15 min of margin (was ~40 min).
    # Disjoint MINUTES is not disjoint RUNS: the 21:30 / 21:45 intraday ticks now
    # overlap this job, where before the widening nothing ran alongside the sector
    # fetch. Accepted — the overlapping pull is the ~40 watchlist ETFs, small next to
    # the 189 single names here. Deliberately NOT fixed by adding eod-macro to the
    # `digiquant-prices-intraday` group: queuing behind a 20-minute intraday timeout
    # would push this job into the 22:00 metrics cron it has to precede.
    - cron: '25 21 * * MON-FRI'
    # REM-102 (superseded by #1775): record position_events at the US cash open.
    # REM-102 chose a single `35 14` "EST-safe" because a pre-open run is the
    # strictly worse failure — execute_at_open.py reads a NULL price_history.open
    # and its HOLD pass skips tickers that already have a row, so NULL-priced rows
    # cannot be repaired by a later run. That much was right; what it accepted was
    # 10:35 EDT, i.e. 65 min late for ~8 months a year. Both crons now ship and
    # `at-open-clock` admits the season-correct trigger once New York has reached
    # 09:30. Schedule identity prevents the other cron from becoming a delayed
    # duplicate, while the missing upper cutoff tolerates GitHub delivery lag.
    - cron: '35 13 * * MON-FRI'
    - cron: '35 14 * * MON-FRI'
    # Current Yahoo FX daily candle. Minute 17 avoids the 15-minute equity
    # quote pulls and top-of-hour GitHub congestion. Sunday 22:17 UTC catches
    # the FX-week open; Monday-Friday refreshes every two hours.
    - cron: '17 */2 * * MON-FRI'
    - cron: '17 22 * * SUN'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which job to run'
        required: true
        default: 'intraday'
        type: choice
        options: [intraday, eod-macro, at-open, fx-refresh]

permissions:
  contents: read
  issues: write

jobs:

  intraday:
    name: Intraday quotes + technicals
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'intraday' ||
      github.event_name == 'schedule' && github.event.schedule == '*/15 13-21 * * MON-FRI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Prevent overlapping runs: the 15-minute cron + 20-minute timeout could
    # otherwise produce concurrent yfinance pulls (rate-limit risk) and duplicate
    # Supabase upserts. `cancel-in-progress: false` lets a long fetch finish
    # rather than being killed mid-write.
    concurrency:
      group: digiquant-prices-intraday
      cancel-in-progress: false
    env:
      CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # transition (#1090): legacy names fed from the same secrets until readers migrate
      SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # scheduled triggers fire from default branch; code pinned to main (#1626)
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Installs from the uv.lock in the CHECKED-OUT tree (`main`), which only
      # became possible with the develop→main release (#1721) — see #1717.
      # digibase and digikey are declared dependencies of digiquant, so naming
      # the package and its extra reproduces the previous three-line install.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra prices
      - name: Fetch quotes -> update cache -> upsert price_history
        run: |
          uv run --frozen --no-sync python -m digiquant prices fetch-quotes \
            --watchlist digiquant/src/digiquant/research/config/watchlist.md \
            --cache-dir data/price-history \
            --period 1y \
            --instrument-metadata \
            --supabase
      - name: Compute technicals -> upsert price_technicals
        run: |
          uv run --frozen --no-sync python -m digiquant prices compute-technicals \
            --cache-dir data/price-history \
            --days 365 \
            --supabase
      - name: Update persistent failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl   = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const stamp    = new Date().toISOString().slice(0, 16);
            const title    = 'digiquant-prices intraday — recurring failures';
            // Label simplification 2026-09: pipeline:*/exec:* retired. Tracker
            // dedup is by exact title + marker; agent-task keeps dispatch firing.
            const labels   = ['ci-failure', 'component:digiquant', 'agent-task', 'priority:medium'];
            const marker   = '<!-- digiquant-prices-intraday-tracker -->';
            const failLine = `- ${stamp} — [run ${context.runId}](${runUrl})`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const tracker = existing.find(i => i.title === title && (i.body || '').includes(marker));

            if (tracker) {
              const MAX_LINES = 20;
              const body    = tracker.body || '';
              const parts   = body.split('## Recent failures');
              const header  = parts[0];
              const tailRaw = (parts[1] || '').split('\n').filter(l => l.startsWith('- '));
              const tail    = [failLine, ...tailRaw].slice(0, MAX_LINES).join('\n');
              const newBody = `${header.trim()}\n\n## Recent failures (latest first)\n${tail}`;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: tracker.number, body: newBody,
              });
            } else {
              const body = [
                marker,
                '## Persistent tracker for digiquant-prices intraday failures',
                '',
                'Scheduled intraday price pipeline (`*/15 13-21 * * MON-FRI`) has been failing.',
                'This issue is updated on each failed run instead of opening new issues.',
                '',
                '**Likely causes:** upstream yfinance rate-limit, Supabase outage, schema drift.',
                '',
                '## Recent failures (latest first)',
                failLine,
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels,
              });
            }

  fx-refresh:
    name: Refresh current Yahoo FX daily mids
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'fx-refresh' ||
      github.event_name == 'schedule' && github.event.schedule == '17 */2 * * MON-FRI' ||
      github.event_name == 'schedule' && github.event.schedule == '17 22 * * SUN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: digiquant-fx-refresh
      cancel-in-progress: false
    env:
      CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra prices
      - name: Upsert Yahoo's newest daily FX candle
        run: |
          uv run --frozen --no-sync python -m digiquant prices fetch-macro \
            --sources yahoo \
            --manifest digiquant/src/digiquant/research/config/macro_series.yaml \
            --latest-only \
            --supabase

  at-open-clock:
    name: DST gate for the at-open job
    # Both at-open crons reach this job; exactly one is season-correct on any given
    # day. Deciding in a separate job rather than with a step-level `if:` inside
    # at-open means a step added later cannot accidentally escape the gate.
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'at-open' ||
      github.event_name == 'schedule' && github.event.schedule == '35 13 * * MON-FRI' ||
      github.event_name == 'schedule' && github.event.schedule == '35 14 * * MON-FRI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads the gate helper from the default-branch revision; no secrets or API calls.
    permissions:
      contents: read
    outputs:
      in_window: ${{ steps.clock.outputs.in_window }}
    steps:
      - uses: actions/checkout@v4
        # The schedule definition is read from the default branch, so this pure
        # gate helper must come from that same revision. The write job below
        # remains pinned to released `main`.
      - name: Resolve the ET wall clock
        id: clock
        env:
          # workflow_dispatch is an operator override — never gate a manual run.
          FORCE_IN_WINDOW: ${{ github.event_name != 'schedule' }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          ARGS=(--schedule "$TRIGGER_SCHEDULE")
          if [ "$FORCE_IN_WINDOW" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 digiquant/scripts/research/market_open_gate.py "${ARGS[@]}" >> "$GITHUB_OUTPUT"

  at-open:
    name: Execute at open (position_events)
    needs: at-open-clock
    # `needs` already skips this job whenever the gate job is skipped (an intraday or
    # eod-macro trigger), so the trigger discrimination lives in at-open-clock's `if:`
    # and is deliberately not duplicated here.
    if: needs.at-open-clock.outputs.in_window == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # transition (#1090): legacy names fed from the same secrets until readers migrate
      SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # scheduled triggers fire from default branch; code pinned to main (#1626)
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # execute_at_open.py imports supabase and dotenv lazily inside functions;
      # both are already in digiquant's locked closure, so the same
      # `--extra prices` sync the sibling jobs use covers this one too rather
      # than installing two packages unpinned.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra prices
      - name: execute_at_open.py (prior-trading-day rebalance)
        # `#2589` cutover: `ensure_legacy_opening_snapshot` auto-seeds open lots from the
        # prior `positions` book (one labeled `legacy_opening_snapshot` chain) when lots are
        # empty, and declines if the book still has holdings after that — so residuals never
        # invent OPEN/EXIT into append-only 069 rows. `--require-ledger` turns a decline into
        # exit 3 instead of silently falling back to prose.
        run: |
          uv run --frozen --no-sync python digiquant/scripts/research/execute_at_open.py --prior-trading-day-rebalance --require-ledger

  eod-macro:
    name: EOD macro ingest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'eod-macro' ||
      github.event_name == 'schedule' && github.event.schedule == '25 21 * * MON-FRI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # transition (#1090): legacy names fed from the same secrets until readers migrate
      SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # scheduled triggers fire from default branch; code pinned to main (#1626)
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Installs from the uv.lock in the CHECKED-OUT tree (`main`), which only
      # became possible with the develop→main release (#1721) — see #1717.
      # digibase and digikey are declared dependencies of digiquant, so naming
      # the package and its extra reproduces the previous three-line install.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra prices
      - name: Sync trading_calendar (NYSE/NASDAQ/CRYPTO/FX)
        # Daily idempotent upsert (~30s, one-shot library query + chunked
        # upsert on PK (date,venue)).  Runs before the macro ingest so any
        # downstream join sites see today's calendar row.  ADR-0013, issue #337.
        run: |
          uv run --frozen --no-sync python -m digiquant prices sync-calendar \
            --venues NYSE,NASDAQ,CRYPTO,FX \
            --start 1950-01-01 \
            --end +5y \
            --supabase
      - name: Ingest macro series (FRED + Yahoo FX)
        # Default --sources is fred,yahoo (issue #328 dropped Frankfurter+FNG).
        run: |
          uv run --frozen --no-sync python -m digiquant prices fetch-macro \
            --manifest digiquant/src/digiquant/research/config/macro_series.yaml \
            --supabase
      - name: Fetch sector single-name quotes + technicals (daily, #946)
        # The 15-min intraday job fetches only the watchlist ETFs (rate-limit / timeout
        # risk), so sector single names + sub-segment ETFs never get technicals and every
        # sector report degrades to a one-ETF read. Refresh the full sector universe once
        # after the close so price_technicals carries single-name indicators.
        run: |
          uv run --frozen --no-sync python -m digiquant prices fetch-quotes \
            --watchlist digiquant/src/digiquant/research/config/watchlist.md \
            --include-sectors \
            --cache-dir data/price-history \
            --period 1y \
            --supabase
          uv run --frozen --no-sync python -m digiquant prices compute-technicals \
            --cache-dir data/price-history \
            --days 365 \
            --supabase
      - name: Update persistent failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl   = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const stamp    = new Date().toISOString().slice(0, 10);
            const title    = 'digiquant-prices EOD macro — recurring failures';
            // Label simplification 2026-09: pipeline:*/exec:* retired. Tracker
            // dedup is by exact title + marker; agent-task keeps dispatch firing.
            const labels   = ['ci-failure', 'component:digiquant', 'agent-task', 'priority:medium'];
            const marker   = '<!-- digiquant-prices-eod-macro-tracker -->';
            const failLine = `- ${stamp} — [run ${context.runId}](${runUrl})`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const tracker = existing.find(i => i.title === title && (i.body || '').includes(marker));

            if (tracker) {
              const MAX_LINES = 20;
              const body    = tracker.body || '';
              const parts   = body.split('## Recent failures');
              const header  = parts[0];
              const tailRaw = (parts[1] || '').split('\n').filter(l => l.startsWith('- '));
              const tail    = [failLine, ...tailRaw].slice(0, MAX_LINES).join('\n');
              const newBody = `${header.trim()}\n\n## Recent failures (latest first)\n${tail}`;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: tracker.number, body: newBody,
              });
            } else {
              const body = [
                marker,
                '## Persistent tracker for digiquant-prices EOD macro failures',
                '',
                'Scheduled EOD macro ingest (`25 21 * * MON-FRI`) has been failing.',
                'This issue is updated on each failed run instead of opening new issues.',
                '',
                '**Likely causes:** FRED API_KEY missing/rotated, yfinance rate-limit, Supabase RLS misconfig.',
                '',
                '## Recent failures (latest first)',
                failLine,
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels,
              });
            }
