# Dependency-audit CI — runs `npm audit` against the monorepo's JS workspaces.
#
# Sibling of security-pip-audit.yml (Python CVEs); together they cover both
# package ecosystems. Scope is the npm workspaces declared in the root
# package.json (`apps/*` + `packages/*`), audited from the
# single root lockfile (`package-lock.json`) that already records every
# workspace's dependency closure.
#
# Blocks on HIGH/CRITICAL findings; reports (does not block) MODERATE/LOW.
# Known/accepted advisories can be listed in `npm-audit-ignore.txt` at the repo
# root (one advisory ID per line — the `GHSA-…`/numeric `id` from `npm audit
# --json` — with `#`-prefixed comments for justification).
#
# Production clock: Cloudflare Worker digithings-cron (apps/digithings-cron)
# dispatches this weekly; the GHA schedule was removed in #3579.
name: "Security: npm audit"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (root workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm audit` reads the committed lockfile; `--package-lock-only` avoids a
      # full `node_modules` install (the Python audit exports a closure rather
      # than installing for the same reason). Run it from the workspace root so
      # it sees every `apps/*` + `packages/*` workspace closure, not a single app's.
      #
      # Exit code is deliberately not asserted here: npm exits non-zero whenever
      # it reports *any* finding, including the MODERATE/LOW ones this lane only
      # warns about. The classifier below owns the verdict — including the
      # registry-failure case, where npm exits non-zero having written a JSON
      # error body.
      - name: Run npm audit (JSON capture)
        run: |
          set +e
          npm audit --audit-level=high --package-lock-only --json > audit.json 2>audit.err
          echo "npm audit exit=$?"
          set -e
          if [ -s audit.err ]; then
            echo "── npm audit stderr (first 40 lines):"
            head -40 audit.err
          fi

      # The classifier lives in scripts/ rather than inline so its two
      # safety-critical behaviours — per-advisory ignore matching, and failing
      # closed on a registry error — are pinned by tests/scripts/test_classify_npm_audit.py.
      - name: Classify findings (HIGH/CRITICAL block; MODERATE/LOW warn)
        run: python scripts/classify_npm_audit.py audit.json npm-audit-ignore.txt
