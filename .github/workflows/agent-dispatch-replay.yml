name: "Agent: dispatch replay"

# Re-dispatches open agent-task issues stuck without dispatch
# (GitHub does not fire issues:labeled for labels set via gh issue create).
# Also useful after fixing dispatch workflows or clearing quota flags.
#
# Dispatch tiers come from tiers in scripts/project_routing.json:
#         cursor tier re-fires by bouncing the label, which triggers the
#         @cursor-mention dispatch workflow.
#         claude tier bounces the label to trigger the local-dispatch comment workflow.
#
# Manual: Actions → Agent dispatch replay → Run workflow
# Optional dry_run (default true) — set false to bounce labels and trigger dispatch.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only (true) or bounce agent-task labels to re-fire dispatch (false)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tier:
        description: "Which dispatch tier to replay (per tiers in scripts/project_routing.json)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "cursor"
          - "claude"

permissions:
  contents: read
  issues: write
  actions: write

env:
  REPO: ${{ github.repository }}

jobs:
  replay:
    name: Replay stuck agent dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and replay issues
        env:
          GH_TOKEN: ${{ secrets.DIGITHINGS_PROJECT_TOKEN || github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail

          bounce_label() {
            local num="$1"
            local label="$2"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  [dry-run] would bounce ${label} on #${num}"
              return 0
            fi
            gh issue edit "$num" --repo "$REPO" --remove-label "$label" 2>/dev/null || true
            sleep 1
            gh issue edit "$num" --repo "$REPO" --add-label "$label"
            echo "  bounced ${label} on #${num}"
          }

          # List open agent-task issues in the given dispatch tier (tiers from
          # scripts/project_routing.json), as a JSON array on stdout.
          list_tier() {
            local want="$1"
            gh issue list --repo "$REPO" --state open --label "agent-task" \
              --json number,title,assignees,labels --limit 200 | WANT="$want" python3 -c "
          import json, sys, os
          routing = json.load(open('scripts/project_routing.json'))
          tiers = routing.get('tiers', {})
          want = os.environ['WANT']
          out = []
          for i in json.load(sys.stdin):
              names = [l['name'] for l in i.get('labels', [])]
              comp = next((n for n in names if n.startswith('component:')), None)
              # Fail closed like the dispatch workflows: unknown tier never joins
              # the cursor list.
              if tiers.get(comp, tiers.get('default', 'claude')) == want:
                  out.append(i)
          print(json.dumps(out))
          "
          }

          echo "=== Agent dispatch replay (dry_run=${DRY_RUN}, tier=${TIER}) ==="

          if [[ "$TIER" == "all" || "$TIER" == "cursor" ]]; then
            echo ""
            echo "--- cursor tier (no Cloud Agent session yet) ---"
            # Bouncing agent-task re-fires the @cursor-mention dispatch workflow.
            list_tier "cursor" | python3 -c "
          import json, sys, subprocess, os
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          issues = json.load(sys.stdin)
          stuck = [
              i for i in issues
              if 'pending:quota' not in [l['name'] for l in i.get('labels', [])]
          ]
          # A dispatched cursor issue has an '@cursor' dispatch comment.
          dispatched = []
          for iss in stuck:
              num = iss['number']
              r = subprocess.run(
                  ['gh', 'issue', 'view', str(num), '--repo', repo, '--json', 'comments'],
                  capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': token},
              )
              if r.returncode != 0:
                  dispatched.append(iss)
                  continue
              comments = json.loads(r.stdout).get('comments', [])
              if not any('@cursor' in c.get('body', '') for c in comments):
                  dispatched.append(iss)
          for iss in dispatched:
              print(f\"#{iss['number']}\t{iss['title'][:80]}\")
          with open('/tmp/cursor-stuck.txt', 'w') as f:
              for iss in dispatched:
                  f.write(f\"{iss['number']}\n\")
          print(f'Found {len(dispatched)} issue(s)', flush=True)
          "
            while read -r num; do
              [[ -z "${num:-}" ]] && continue
              bounce_label "$num" "agent-task"
            done < /tmp/cursor-stuck.txt 2>/dev/null || true
          fi

          if [[ "$TIER" == "all" || "$TIER" == "claude" ]]; then
            echo ""
            echo "--- claude tier (no local-dispatch comment yet) ---"
            list_tier "claude" | python3 -c "
          import json, sys, subprocess, os
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          issues = json.load(sys.stdin)
          stuck = []
          for iss in issues:
              num = iss['number']
              r = subprocess.run(
                  ['gh', 'issue', 'view', str(num), '--repo', repo, '--json', 'comments'],
                  capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': token},
              )
              if r.returncode != 0:
                  stuck.append(iss)
                  continue
              comments = json.loads(r.stdout).get('comments', [])
              if not any('Tier 3' in c.get('body', '') or 'Claude tier' in c.get('body', '') for c in comments):
                  stuck.append(iss)
          for iss in stuck:
              print(f\"#{iss['number']}\t{iss['title'][:80]}\")
          with open('/tmp/claude-stuck.txt', 'w') as f:
              for iss in stuck:
                  f.write(f\"{iss['number']}\n\")
          print(f'Found {len(stuck)} issue(s)', flush=True)
          "
            while read -r num; do
              [[ -z "${num:-}" ]] && continue
              bounce_label "$num" "agent-task"
            done < /tmp/claude-stuck.txt 2>/dev/null || true
          fi

          echo ""
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run complete. Re-run with dry_run=false to bounce labels and trigger dispatch."
          else
            echo "Replay complete. Check dispatch workflow runs and issue assignees/comments."
          fi
