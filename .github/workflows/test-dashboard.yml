name: "Test: dashboard"

on:
  workflow_call:


jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Canon ratchet (#1404) — see frontend/digiweb/MIGRATION.md
      - name: Frontend canon guard
        run: python3 scripts/check_frontend_canon.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm install --no-audit --no-fund --include=optional

      - name: Lint
        run: npm run lint --workspace dashboard

      - name: Build
        run: npm run build --workspace dashboard

      - name: Test
        run: npm run test --workspace dashboard
