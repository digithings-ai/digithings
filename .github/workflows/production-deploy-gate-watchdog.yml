# Production deploy gate watchdog (DIG-1569).
#
# The stack deploy workflow got its missing `push` trigger in DIG-1569, so a
# merge to main now actually deploys. This workflow covers the remaining half of
# that incident: the deploy still waits on the `production` environment's human
# approval, and on DIG-1484 three such deployments sat pending for 14.5h, 6h and
# 0h while production served the container holding unmasked customer PII — with
# no notification of any kind.
#
# A pending deployment is not a neutral queue entry. It means the fix you merged
# is NOT live, and the git history reads as if it were. So this fails loudly once
# a deployment has been waiting longer than GATE_ALERT_MAX_AGE_MINUTES.
#
# Cadence is every 30 minutes off the top of the hour: a stall is reported within
# 30 minutes of crossing the threshold instead of within 60. It is not on :00
# because every other scheduled workflow in this repo is, and a whole fleet of
# jobs on the same minute is how runners get starved.
#
# Exit codes from scripts/production_deploy_gate_latency.py:
#   0 — gate healthy, or a stall was alerted
#   2 — the gate could not be inspected (fail closed; an unreadable gate is not
#       a healthy gate, and it is the state this whole incident ran through)
#
# Every job step is `continue-on-error`-free on purpose: a red watchdog run is a
# signal that the alerting path itself is broken, which matters more than a green
# one.
name: "Watch: production deploy gate latency"

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: "Minutes a deployment may wait on the production gate"
        required: false
        default: "60"

permissions:
  contents: read
  issues: write
  deployments: read

concurrency:
  group: production-deploy-gate-watchdog
  cancel-in-progress: false

jobs:
  gate-latency:
    name: "Check for stalled production deployments"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.DIGITHINGS_PROJECT_TOKEN }}
      CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
      GATE_ALERT_EMAIL: ${{ vars.GATE_ALERT_EMAIL }}
      GATE_ALERT_MAX_AGE_MINUTES: ${{ inputs.max_age_minutes || '60' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # digiquant only, and no extras: the watchdog needs the Cloudflare Email
      # Sending client and nothing else. It issues no database or broker calls.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant

      - name: Report deployments stuck on the production gate
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python scripts/production_deploy_gate_latency.py