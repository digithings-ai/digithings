# Deploys the private digiquant-runner Worker and its container image (#4761).
# Push to main (path-filtered) or workflow_dispatch. No schedule key.
# environment: production — first image deploy is a human gate.
# Does not sync broker credentials. Existing Worker secrets persist across deploy.
name: "Deploy: digiquant-runner"

on:
  push:
    branches:
      - main
    paths:
      - "apps/digiquant-runner/**"
      - "Dockerfile.digiquant-runner"
      - "digiquant/**"
      - ".github/workflows/deploy-digiquant-runner.yml"
  workflow_dispatch:

concurrency:
  # Per-run group. environment: production can hold a run at the approval
  # gate; a shared group with cancel-in-progress: false queues every later
  # deploy behind that wait (#2541). A newer image is not always a superset
  # of an in-flight workflow_dispatch ref, so this does not cancel it.
  # Same pattern as deploy-digithings-stack-cloudflare.yml.
  group: deploy-digiquant-runner-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package dependencies
        run: npm ci --no-audit --no-fund

      - name: Test + typecheck
        run: |
          npm run test --workspace digiquant-runner
          npm run typecheck --workspace digiquant-runner
          python3 apps/digiquant-runner/container/exec_job_test.py

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c apps/digiquant-runner/wrangler.toml
