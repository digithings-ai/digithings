name: OpenWiki Update

# Clock: digithings-cron Worker (apps/digithings-cron/src/jobs.ts); this file is
# workflow_dispatch only so the GitHub and Cloudflare clocks never double-fire.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Outer ceiling for the whole job (DIG-5633). GitHub caps a hosted job at 6h
    # and the cap cancels every step, including the two that preserve partial
    # output. 330 leaves the step below room to fail first and still run those.
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.5.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        # Time out a stalled run (DIG-5633). Without this the step inherits the
        # job step budget and a gateway call that never returns holds the runner
        # until the 6h cap.
        #
        # 300 min is measured, not guessed: the step is the whole run, and the
        # three successful runs on this workflow took 73 min (36242796750,
        # 2026-09-26), 2h42m (35866885606, 2026-09-23) and 4h29m (35442523084,
        # 2026-09-19). A tighter ceiling (the 45 min first proposed on DIG-5633)
        # would have failed two of those three healthy runs; 300 clears the
        # 4h29m maximum with 31 min of headroom. The job timeout above is 30 min
        # higher so this step fails first and the cleanup/PR steps below still
        # run under `!cancelled()`.
        #
        # Revisit once OpenWiki bounds a single model call itself: only the
        # bedrock provider honours OPENWIKI_STREAM_IDLE_TIMEOUT, so on the
        # openai-compatible provider there is no per-request ceiling to lean on.
        timeout-minutes: 300
        # No continue-on-error: a non-zero exit must fail the run here. The steps
        # below use `!cancelled()`, so a failed run still opens the partial PR.
        run: openwiki code --update --print
        env:
          # This repo has no metered OPENAI_API_KEY secret. House LLM traffic runs
          # on the OpenAI-compatible Cheaper Inference gateway
          # (docs/providers/cheaperinference.md), so use OpenWiki's chat-completions
          # `openai-compatible` provider. OpenWiki's `openai` provider forces the
          # Responses API (`responsesApi: true`), which that gateway does not serve;
          # `gpt-5.6-terra` is also not on the house CI catalog.
          #
          # The model must satisfy two constraints:
          #
          # 1. Not `gpt-5.6-sol`. `@langchain/openai`'s `_modelPrefersResponsesAPI`
          #    hardcodes that id (and *-pro / codex) to the Responses API even when
          #    OpenWiki sets `useResponsesApi: false`, and LangChain does not send the
          #    `store: false` the gateway's stateless `/responses` endpoint requires —
          #    the run dies with `400 ... replay prior output items in input instead
          #    of using previous_response_id`.
          # 2. Not the GPT-5.6 family at all. Its OpenAI-compatible surface on this
          #    gateway returns `500 Unexpected proxy error` once OpenWiki's planning
          #    payload grows past ~300 KB (a captured failing payload failed
          #    identically on gpt-5.6-luna / -terra / -sol, while deepseek-v4-pro,
          #    deepseek-v4-flash, glm-5.3-flash, gpt-oss-120b and claude-sonnet-4.6
          #    all returned 200).
          #
          # `deepseek-v4.1-flash-1017` is a house CI-catalog id
          # (`config/litellm.cheaperinference.yaml` and
          # `digillm/src/digillm/client.py:_CHEAPERINFERENCE_HOUSE_SLUG_TO_BARE`,
          # added by the house flash-pin move — review ticket DIG-4782, PR #6107
          # — that this PR carries) and it is the checkpoint every house DeepSeek
          # flash pin moved to on 2026-10-21.
          # It stays on `/chat/completions`: OpenWiki's `openai-compatible`
          # provider sets `useResponsesApi: false`, and no model id
          # `@langchain/openai` prefers the Responses API for matches this one,
          # so the request never leaves the chat-completions path. CI pins no
          # version of that library (`openwiki@0.5.0` takes
          # `@langchain/openai@^1.5.5`) and the id list moved inside that range:
          # 1.5.11 -> 1.5.13 added `gpt-5.6-sol`, 1.6.3 widened it to
          # `gpt-5.6`. None of 1.5.11, 1.5.13 or 1.6.3 matches this id, so the
          # chat-completions path holds today; a later release that adds it
          # would move the job to the Responses API.
          #
          # The ~300 KB planning payload in constraint 2 was measured on the
          # models listed there, not on this checkpoint: DIG-4744 forbids the
          # paid Cheaper Inference calls a re-measurement needs, and this
          # workflow calls the gateway with the bare id, so the house map's
          # `deepseek/deepseek-v4-flash` alias does not carry the old 200 result
          # over.
          # No run on this checkpoint has happened yet: the first
          # `openwiki code --update` run is the live evidence.
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.CHEAPERINFERENCE_API_KEY }}
          # the old `secrets.CHEAPERINFERENCE_API_BASE` fallback was dead. Variable only.
          OPENAI_COMPATIBLE_BASE_URL: ${{ vars.CHEAPERINFERENCE_API_BASE || 'https://api.cheaperinference.com/v1' }}
          OPENWIKI_MODEL_ID: "deepseek-v4.1-flash-1017"
          # Required for the LangSmith connector's code-mode pull to authenticate.
          # Reuses the org-level LANGSMITH_API_KEY — no separate repo secret (#4357).
          # For extra workspaces, add OPENWIKI_LANGSMITH_API_KEY_2, _3, ... as repo
          # secrets and env entries here.
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # Optional: also trace this workflow's own OpenWiki run to LangSmith.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.
