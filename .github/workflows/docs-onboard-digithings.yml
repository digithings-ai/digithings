# Publish digithings client #0 docs corpus → Cloudflare D1 (clients/digithings)
# so digithings.ai/chat stays current when onboard sources change on main.
#
# Pipeline (dogfood):
#   run_onboard.py (static + OpenAPI + monorepo docs → local vault)
#   → d1_sync.py (D1 upsert + FTS rebuild)
#
# Website crawl is opt-in (workflow_dispatch) — push path filters match
# docs/projects/digithings/sources/repo-docs.yaml + openapi.yaml (+ onboard scripts).
# digisearch dual-sink is not applied from Actions runners (ingest needs a
# server-visible FS path); keep docs-reindex-guide.yml / operator apply until
# remote ingest exists. See docs/digichat/CLIENT-DOCS-ONBOARD.md.
#
# Prod-mutating apply runs under `production` (CLOUDFLARE_ACCOUNT_ID /
# CLOUDFLARE_API_TOKEN -- or the legacy VECTORIZE_ACCOUNT_ID / VECTORIZE_API_TOKEN,
# or D1_ACCOUNT_ID / D1_API_TOKEN -- plus D1_DATABASE_MAP secrets; reviewer gate on
# the `production` environment). This 3-way fallback matches the container's and
# scripts' own runtime resolution (`digivault.supabase_store._first_env`) exactly,
# so a legacy environment that set only VECTORIZE_* GitHub secrets clears this
# workflow's guard the same way it clears the deployed container's (#2239 review —
# a workflow offering fewer aliases than the runtime it drives passes the
# documented cutover and then fails here anyway).
# D1_DATABASE_MAP is the same {"clients/...": "<id>"} JSON the Worker holds
# (frontend/digithings-stack-cloudflare/wrangler.toml) -- one secret, one source
# of truth, so CI and the container can never read different databases for the
# same prefix. --database is derived from map["clients/digithings"] below.
# digithings only — the online-compliance-center corpus has its own onboarding path.
name: "Docs: onboard digithings"

on:
  push:
    branches: [main]
    paths:
      # Keep in sync with docs/projects/digithings/sources/repo-docs.yaml
      - 'docs/projects/digithings/**'
      - 'docs/openapi/**'
      - 'docs/VISION.md'
      - 'docs/adr/*.md'
      - 'docs/digichat/**'
      - 'docs/ops/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'RELEASES.md'
      - 'SECURITY.md'
      - 'BRANCHING.md'
      - 'digibase/ARCHITECTURE.md'
      - 'digibase/AGENTS.md'
      - 'digibase/README.md'
      - 'digiclaw/ARCHITECTURE.md'
      - 'digiclaw/AGENTS.md'
      - 'digigraph/ARCHITECTURE.md'
      - 'digigraph/AGENTS.md'
      - 'digikey/ARCHITECTURE.md'
      - 'digikey/AGENTS.md'
      - 'digikey/README.md'
      - 'digiquant/ARCHITECTURE.md'
      - 'digiquant/AGENTS.md'
      - 'digisearch/ARCHITECTURE.md'
      - 'digisearch/AGENTS.md'
      - 'digismith/ARCHITECTURE.md'
      - 'digismith/AGENTS.md'
      - 'digivault/ARCHITECTURE.md'
      - 'digivault/AGENTS.md'
      - 'digiskills/ARCHITECTURE.md'
      - 'digiskills/AGENTS.md'
      - 'digifetch/ARCHITECTURE.md'
      - 'digifetch/AGENTS.md'
      - 'digillm/ARCHITECTURE.md'
      - 'frontend/digichat/ARCHITECTURE.md'
      - 'frontend/digichat/AGENTS.md'
      - 'scripts/docs_onboard/**'
      - 'scripts/d1_sync.py'
      - 'scripts/sync_architecture_vault.py'
      - '.github/workflows/docs-onboard-digithings.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates only; apply writes vault + publishes to D1"
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      crawl:
        description: "Also crawl digithings.ai / digiquant.io (slow; network)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-onboard-digithings
  cancel-in-progress: true

env:
  ONBOARD_MANIFEST: docs/projects/digithings/onboard.yaml
  ONBOARD_WORKDIR: /tmp/digithings-onboard
  ONBOARD_VAULT: /tmp/digithings-onboard-vault
  # scripts/docs_onboard imports the repo-root `scripts` package (d1_sync.py does not)
  PYTHONPATH: .

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Onboard dry-run (static / OpenAPI / repo; no sinks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRAWL: ${{ github.event_name == 'workflow_dispatch' && inputs.crawl || false }}
        run: |
          CRAWL_FLAGS=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CRAWL" = "true" ]; then
            # Force live crawl even under --dry-run (otherwise dry-run skips crawl).
            export DOCS_ONBOARD_DRY_RUN_CRAWL=1
          else
            CRAWL_FLAGS+=(--skip-crawl)
          fi
          uv run --frozen --no-sync python scripts/docs_onboard/run_onboard.py \
            --manifest "$ONBOARD_MANIFEST" \
            --workdir "$ONBOARD_WORKDIR" \
            --dry-run \
            "${CRAWL_FLAGS[@]}"

  apply:
    needs: dry-run
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --frozen --all-packages --all-extras

      - name: Require D1 secrets
        env:
          # Canonical-first, legacy-fallback (#2239 credential rename): the same
          # Cloudflare account + token now authorizes both Vectorize and D1. `||` on
          # GitHub Actions secrets falls back to the legacy name when the canonical
          # one isn't defined for this environment yet (an undefined secret evaluates
          # to "", which is falsy) -- zero-downtime, no secret rotation required
          # before this ships.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.VECTORIZE_ACCOUNT_ID || secrets.D1_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.VECTORIZE_API_TOKEN || secrets.D1_API_TOKEN }}
          D1_DATABASE_MAP: ${{ secrets.D1_DATABASE_MAP }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set in the production environment (legacy VECTORIZE_ACCOUNT_ID / D1_ACCOUNT_ID fallbacks also unset)"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the production environment (legacy VECTORIZE_API_TOKEN / D1_API_TOKEN fallbacks also unset)"
            missing=1
          fi
          if [ -z "$D1_DATABASE_MAP" ]; then
            echo "::error::D1_DATABASE_MAP is not set in the production environment"
            missing=1
          elif ! python3 -c 'import json, os; json.loads(os.environ["D1_DATABASE_MAP"])["clients/digithings"]' 2>/dev/null; then
            echo "::error::D1_DATABASE_MAP is not valid JSON, or has no \"clients/digithings\" entry"
            missing=1
          fi
          exit "$missing"

      - name: Onboard apply → local vault (vault sink only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRAWL: ${{ github.event_name == 'workflow_dispatch' && inputs.crawl || false }}
        run: |
          mkdir -p "$ONBOARD_VAULT"
          CRAWL_FLAGS=(--skip-crawl)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CRAWL" = "true" ]; then
            CRAWL_FLAGS=()
          fi
          # Vault sink writes a filesystem vault; d1_sync.py (next step) publishes
          # it to D1 (production digivault FTS). digisearch is intentionally
          # omitted here — Actions runners cannot expose workdir paths to a
          # remote digisearch /ingest endpoint.
          uv run --frozen --no-sync python scripts/docs_onboard/run_onboard.py \
            --manifest "$ONBOARD_MANIFEST" \
            --workdir "$ONBOARD_WORKDIR" \
            --vault-root "$ONBOARD_VAULT" \
            --sinks vault \
            "${CRAWL_FLAGS[@]}"

      - name: Publish onboard vault → D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.VECTORIZE_ACCOUNT_ID || secrets.D1_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.VECTORIZE_API_TOKEN || secrets.D1_API_TOKEN }}
          D1_DATABASE_MAP: ${{ secrets.D1_DATABASE_MAP }}
        run: |
          # Derive the database id from the same map the container reads, so a
          # mismatch between "what CI publishes to" and "what digivault serves"
          # is structurally impossible rather than merely detected.
          DATABASE_ID=$(python3 -c 'import json, os; print(json.loads(os.environ["D1_DATABASE_MAP"])["clients/digithings"])')
          uv run --frozen --no-sync python scripts/d1_sync.py \
            --prefix clients/digithings \
            --database "$DATABASE_ID" \
            --vault "$ONBOARD_VAULT"
