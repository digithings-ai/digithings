# Put mail/notify secrets onto digiquant-runner (Phase 2 / #4761).
# Values stay inside Actions; this job never prints them.
name: "Ops: sync digiquant-runner mail secrets"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-runner-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Put mail secrets on digiquant-runner via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
        run: |
          set -euo pipefail
          script="digiquant-runner"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script}/secrets"
          put() {
            local name="$1" text="$2"
            if [ -z "${text}" ]; then
              echo "FAIL empty $name"
              exit 1
            fi
            echo "putting $name on $script (len=${#text})"
            curl -sS -f -X PUT "$base" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg n "$name" --arg t "$text" '{type:"secret_text",name:$n,text:$t}')" \
              | jq -e '.success == true' >/dev/null
            echo "ok $name"
          }
          put CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          put CLOUDFLARE_EMAIL_API_TOKEN "$CLOUDFLARE_EMAIL_API_TOKEN"
          put NOTIFY_FROM "$NOTIFY_FROM"
          echo "runner mail secrets ok"
