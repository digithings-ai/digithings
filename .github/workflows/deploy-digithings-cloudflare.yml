# Document and gate the digithings.ai Cloudflare Pages build.
# Primary deploy is Cloudflare Pages watching `main` + scripts/build-digithings.sh
# (now a Next.js static-export Node build). This workflow validates the build
# script on PRs touching digithings.ai assets.
name: "Deploy: digithings.ai build check"

on:
  pull_request:
    paths:
      - "frontend/digithings-web/**"
      - "frontend/digiweb/web/**"
      - "frontend/digiweb/design/**"
      - "scripts/build-digithings.sh"
      - ".github/workflows/deploy-digithings-cloudflare.yml"
      # Root packaging manifests are what make Cloudflare's build image auto-run a
      # dependency install ahead of the build command, so a change to one can break the
      # deploy without touching a single frontend file. #1714 was exactly that — it edited
      # only the root pyproject.toml and uv.lock, matched none of the globs above, and so
      # froze this site for three days without ever running this check.
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
      # The npm manifests break the deploy the same way, by a more direct route: the
      # build script itself installs from the root lock (`npm install` at
      # scripts/build-digithings.sh:15), so a bad resolution there fails the build with
      # no frontend file touched — no Cloudflare auto-detection needed. PR #1949 was the
      # near miss: -1646/+176 lines of package-lock.json, and the digiquant sibling of
      # this check never fired at all.
      #
      # Both entries are root-anchored, and only the root hole is closed. A bare name
      # matches the repo-root file alone — verified against the sibling Python entries,
      # which no nested pyproject.toml has ever triggered (#1702, #1708, #1712 each
      # edited 11 of them and fired neither deploy check). Do not read these two lines
      # as covering more. The workspace manifests are a wider, separate gap: the
      # `npm install` above resolves all eight workspaces (`frontend/*`,
      # `frontend/digiweb/*`) and only three match the globs above, while 31 of the 52
      # commits that have touched a workspace manifest left the root lock alone — so a
      # dependency added to frontend/digichat-ui/package.json, whose stylesheets and
      # <DigiChatMark> this site imports at build time, still reaches production with
      # neither check running. `**/package.json` is not the fix; it would fire both
      # deploy checks on every unrelated workspace.
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dist:
    name: bash scripts/build-digithings.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Cloudflare's build image auto-detects languages from the repo root, finds the root
      # pyproject.toml, and runs `pip install .` BEFORE the configured build command. If that
      # fails, the build command is never reached — so this whole job passing proves nothing
      # about the real deploy. That is not hypothetical: #1714 added the root pyproject.toml
      # on 2026-07-30 and both production sites silently built nothing until 2026-08-02, with
      # every PR green throughout. Run the same step Cloudflare runs, first, in the same order.
      # --dry-run suffices: the failure occurs in "getting requirements to build wheel", which
      # --dry-run still performs, and it avoids mutating the runner's site-packages.
      - name: Assert the repo root is pip-installable (Cloudflare runs `pip install .`)
        run: python3 -m pip install --dry-run --no-deps .

      - name: Assemble dist/ (same as Cloudflare Pages)
        run: bash scripts/build-digithings.sh

      - name: Assert dist layout
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          # /modules/* and /architecture were folded into the home-page module
          # manifest; assert the manifest rendered instead of those routes.
          # Match the aria-label, not an implementation class — the pane is the
          # shared <TerminalManifest> primitive since #1416 (was .dt-manifest).
          grep -q 'aria-label="digithings module manifest"' dist/index.html
          grep -q digithings.ai dist/CNAME
          # fonts self-hosted; no Google Fonts references in the export
          ! grep -rq "fonts.googleapis.com" dist

      # The daily freshness probe in smoke-site.yml reads this stamp off the live
      # site (#1759). Validate the stamp the build just wrote with the same
      # evaluator, so a regression in either half fails here rather than turning
      # every production probe into a false UNSTAMPED.
      - name: Assert deploy build stamp
        run: |
          test -f dist/build-info.json
          python3 scripts/check_deploy_freshness.py \
            --url dist/build-info.json \
            --status 200 \
            --body-file dist/build-info.json \
            --max-age-hours 1
