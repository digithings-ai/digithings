# Document and gate the digithings.ai Cloudflare Pages build.
# Primary deploy is Cloudflare Pages watching `main` + scripts/build-digithings.sh
# (now a Next.js static-export Node build). This workflow validates the build
# script on PRs touching digithings.ai assets.
name: "Deploy: digithings.ai build check"

on:
  pull_request:
    paths:
      - "frontend/digithings-web/**"
      - "frontend/digiweb/web/**"
      - "frontend/digiweb/design/**"
      - "scripts/build-digithings.sh"
      - ".github/workflows/deploy-digithings-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dist:
    name: bash scripts/build-digithings.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Assemble dist/ (same as Cloudflare Pages)
        run: bash scripts/build-digithings.sh

      - name: Assert dist layout
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          # /modules/* and /architecture were folded into the home-page module
          # manifest; assert the manifest rendered instead of those routes.
          # Match the aria-label, not an implementation class — the pane is the
          # shared <TerminalManifest> primitive since #1416 (was .dt-manifest).
          grep -q 'aria-label="digithings module manifest"' dist/index.html
          grep -q digithings.ai dist/CNAME
          # fonts self-hosted; no Google Fonts references in the export
          ! grep -rq "fonts.googleapis.com" dist

      # The daily freshness probe in smoke-site.yml reads this stamp off the live
      # site (#1759). Validate the stamp the build just wrote with the same
      # evaluator, so a regression in either half fails here rather than turning
      # every production probe into a false UNSTAMPED.
      - name: Assert deploy build stamp
        run: |
          test -f dist/build-info.json
          python3 scripts/check_deploy_freshness.py \
            --url dist/build-info.json \
            --status 200 \
            --body-file dist/build-info.json \
            --max-age-hours 1
