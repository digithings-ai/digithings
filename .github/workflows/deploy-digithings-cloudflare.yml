# Document and gate the digithings.ai Cloudflare Pages build.
# Primary deploy is Cloudflare Pages watching `main` + scripts/build-digithings.sh
# (now a Next.js static-export Node build). This workflow validates the build
# script on PRs touching digithings.ai assets.
name: "Deploy: digithings.ai build check"

on:
  pull_request:
    paths:
      - "frontend/digithings-web/**"
      - "frontend/digiweb/web/**"
      - "frontend/digiweb/design/**"
      - "scripts/build-digithings.sh"
      - ".github/workflows/deploy-digithings-cloudflare.yml"
      # Root packaging manifests are what make Cloudflare's build image auto-run a
      # dependency install ahead of the build command, so a change to one can break the
      # deploy without touching a single frontend file. #1714 was exactly that — it edited
      # only the root pyproject.toml and uv.lock, matched none of the globs above, and so
      # froze this site for three days without ever running this check.
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
      # The npm manifests break the deploy the same way, by a more direct route: the
      # build script runs its own root install (scripts/build-digithings.sh:15) — `npm
      # install`, which reconciles the lock against the manifests, not `npm ci`, which
      # installs from it — so a bad resolution there fails the build with no frontend
      # file touched, and no Cloudflare auto-detection needed. PR #1949 was the near
      # miss: -1646/+176 lines of package-lock.json, and the digiquant sibling of this
      # check never fired at all.
      #
      # Both entries are root-anchored, and only the root hole is closed: a `paths:`
      # pattern is matched against the whole repo-root-relative path, so a wildcard-free
      # name matches that one file and nothing nested. Do NOT re-cite #1702/#1708/#1712
      # as proof of that, the way an earlier draft did. Those three did each edit 11
      # nested pyproject.toml files and fire neither check — but they merged 2026-07-29
      # and -07-30, and `pyproject.toml` only entered these filters on 2026-08-02
      # (ff384b4f). The entry did not exist yet, so their silence is evidence of nothing.
      # The standing in-repo corroboration is docs-reindex-guide.yml, which lists bare
      # `ARCHITECTURE.md` alongside `digibase/ARCHITECTURE.md`, `digichat/ARCHITECTURE.md`
      # and ~20 further per-component paths — every one of them redundant if the bare
      # name reached nested files. The workspace manifests therefore have to be named
      # one by one, below.
      - "package.json"
      - "package-lock.json"
      # The root lock does not stand in for those manifests. Counted at PR granularity —
      # the unit a `paths:` filter actually sees — 17 of the 38 PRs that have touched one
      # of the eight left package-lock.json out of the PR entirely, and 8 of the 38
      # matched no glob in either deploy filter. PR #1385 is the clean exhibit: a
      # one-file PR changing only frontend/digichat/package.json, on which neither deploy
      # check ran. Do NOT cite 92ab99b6 for this, as an earlier draft did — it looks like
      # a tidy one-file commit, but it shipped inside PR #1505 alongside
      # package-lock.json and 15 other files, and that PR's digiquant check ran and
      # passed. Commits are the wrong unit here; develop carries merges, not squashes.
      #
      # And be equally plain about what has NOT happened: across all 38, some lane
      # running a root install always fired, so nothing has yet reached production
      # through this hole. The two manifests with no lane of their own — digichat-ui and
      # digiweb/reference — have simply never been edited alone; all three PRs touching
      # frontend/digichat-ui/package.json also touched frontend/digithings-web/**. This
      # closes a structural hole before it bites. It is not the fix for an incident.
      #
      # What follows is this site's build closure, read off the @digithings/* deps:
      # digithings-web → design + digichat-ui + web, digichat-ui → web, web → design.
      # Three of those four are already covered by the directory globs above. digichat-ui
      # is not, and digithings-web imports it at BUILD time — its stylesheets at
      # app/globals.css:25-26 and <DigiChatMark> at components/DtNav.tsx:14.
      # `**/package.json` is not the fix: it would fire both deploy checks on every
      # unrelated workspace, digigraph's vendored echarts manifest included.
      #
      # Two residuals, both deliberate. (1) The root `npm install` resolves all eight
      # workspaces, so an unresolvable manifest OUTSIDE this closure still breaks this
      # build. Four manifests sit outside it, and three are covered by a lane that runs
      # its own root install — frontend/digichat by ci.yml's `digichat`,
      # frontend/digiquant-web by its `web`, frontend/olympus by its `olympus`. The
      # fourth, frontend/digiweb/reference/package.json, is in no path filter in this
      # repo: of the eight it is the one manifest watched by nothing, and an
      # unresolvable range there fails this build (verified — ETARGET out of the root
      # install). Left out because it is in no site's closure; add it the day that
      # stops being an acceptable trade. (2) Only digichat-ui's manifest is watched,
      # not its source, so a change to its components still reaches digithings.ai with
      # this check silent; ci.yml notes the same blind spot above its frontend-canon
      # guard. Widening to `frontend/digichat-ui/**` is the defensible next step, left
      # out here only to keep this change to manifests.
      - "frontend/digichat-ui/package.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-dist:
    name: bash scripts/build-digithings.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Cloudflare's build image auto-detects languages from the repo root, finds the root
      # pyproject.toml, and runs `pip install .` BEFORE the configured build command. If that
      # fails, the build command is never reached — so this whole job passing proves nothing
      # about the real deploy. That is not hypothetical: #1714 added the root pyproject.toml
      # on 2026-07-30 and both production sites silently built nothing until 2026-08-02, with
      # every PR green throughout. Run the same step Cloudflare runs, first, in the same order.
      # --dry-run suffices: the failure occurs in "getting requirements to build wheel", which
      # --dry-run still performs, and it avoids mutating the runner's site-packages.
      - name: Assert the repo root is pip-installable (Cloudflare runs `pip install .`)
        run: python3 -m pip install --dry-run --no-deps .

      - name: Assemble dist/ (same as Cloudflare Pages)
        run: bash scripts/build-digithings.sh

      - name: Assert dist layout
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          # /modules/* and /architecture were folded into the home-page module
          # manifest; assert the manifest rendered instead of those routes.
          # Match the aria-label, not an implementation class — the pane is the
          # shared <TerminalManifest> primitive since #1416 (was .dt-manifest).
          grep -q 'aria-label="digithings module manifest"' dist/index.html
          grep -q digithings.ai dist/CNAME
          # fonts self-hosted; no Google Fonts references in the export
          ! grep -rq "fonts.googleapis.com" dist

      # The daily freshness probe in smoke-site.yml reads this stamp off the live
      # site (#1759). Validate the stamp the build just wrote with the same
      # evaluator, so a regression in either half fails here rather than turning
      # every production probe into a false UNSTAMPED.
      - name: Assert deploy build stamp
        run: |
          test -f dist/build-info.json
          python3 scripts/check_deploy_freshness.py \
            --url dist/build-info.json \
            --status 200 \
            --body-file dist/build-info.json \
            --max-age-hours 1
