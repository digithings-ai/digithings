# Package the image inputs the DIGICHAT image COPYs from.
#
# infra/docker/Dockerfile.digichat-cloudflare COPYs
# image-packages/digichat/manifests/{design,ui,digichat-ui,dashboard,hero-banner,catalog}/package.json
# and image-packages/digichat/npm/, and the image build context is the
# repository root (image_build_context = "../.."). image-packages/ is
# GENERATED by scripts/package_r5_image_inputs.py and is gitignored
# (.gitignore "/image-packages/"), so a checkout never carries it and the
# build dies computing its cache key, before a single build step runs - the
# same failure the stack lane paid for (run 39485748555: "failed to
# calculate checksum of ref ...: /image-packages/stack/digisearch-seeds: not
# found").
#
# The scope is the DIGICHAT image's, and it is named: the image installs five
# npm workspace tarballs and six workspace manifests and installs no wheel
# and no runner payload. So this action runs the generator's --npm-only mode.
# The full generator would also build the runner project - a fresh, unpinned
# `uv lock` against PyPI - and the stack image's wheels, and a production
# deploy must not inherit a network-dependent resolution step it does not use.
# The digichat publish lane already runs this scope (publish-digichat-image.yml).
#
# The toolchain: the generator packs the workspaces with `npm pack` and copies
# the manifests with python, so node and python are set up here. It needs no
# uv in this scope - that is the stack scope's toolchain.
#
# What this action does NOT claim: the --check-only that follows the packaging
# reads the tree this action just wrote, so it is a backstop, not an
# independent proof. The proof is the guard below: it fails the step when a
# path the Dockerfile COPYs is missing or empty, so no lane can report a green
# build over a context that carried no such path.
name: Package the digichat image inputs
description: >-
  Build the image-packages/digichat tree the digichat image's Dockerfile COPYs
  from, and fail the step when a packaged path the image needs is missing or
  empty.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Package the digichat image inputs
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/package_r5_image_inputs.py --npm-only
        # The generator's own verdict on the scope it just packaged: it refuses
        # a tree that is partial (another image's inputs) or stale against the
        # sources it was built from.
        python3 scripts/package_r5_image_inputs.py --check-only --npm-only
        missing=0
        for path in \
          image-packages/digichat/npm \
          image-packages/digichat/manifests/design/package.json \
          image-packages/digichat/manifests/ui/package.json \
          image-packages/digichat/manifests/digichat-ui/package.json \
          image-packages/digichat/manifests/dashboard/package.json \
          image-packages/digichat/manifests/hero-banner/package.json \
          image-packages/digichat/manifests/catalog/package.json
        do
          if [ ! -e "$path" ]; then
            echo "::error::$path is missing - the image build context would carry no such path"
            missing=1
          elif [ -d "$path" ] && [ -z "$(ls -A "$path" 2>/dev/null)" ]; then
            echo "::error::$path is empty - the image would carry no such path"
            missing=1
          elif [ -f "$path" ] && [ ! -s "$path" ]; then
            echo "::error::$path is empty - the image would carry an empty file"
            missing=1
          fi
        done
        # One tarball per packed workspace: the Dockerfile unpacks five of them
        # by name over the manifests npm ci linked. A tree with fewer is a
        # partial build, and the image would fail at `tar -xzf` instead of
        # here. The `|| true` is load-bearing: under `set -euo pipefail` a
        # missing npm directory makes find fail, the pipeline fail and the
        # script abort BEFORE the guard below can say why. The count is the
        # diagnosis, not the crash.
        tarballs=$(find image-packages/digichat/npm -name '*.tgz' 2>/dev/null | wc -l | tr -d ' ' || true)
        if [ "$tarballs" != "5" ]; then
          echo "::error::image-packages/digichat/npm holds $tarballs tarball(s), expected 5 - the image unpacks one tarball per digichat workspace"
          missing=1
        fi
        exit "$missing"
