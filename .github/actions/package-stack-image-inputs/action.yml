# Package the image inputs the STACK image COPYs from.
#
# infra/docker/Dockerfile.digithings-stack-cloudflare COPYs
# image-packages/stack/requirements.txt, image-packages/stack/wheels and
# image-packages/stack/digisearch-seeds, and the image build context is the
# repository root (image_build_context = "../.."). image-packages/ is
# GENERATED by scripts/package_r5_image_inputs.py and is gitignored
# (.gitignore "/image-packages/"), so a checkout never carries it: the build
# dies computing its cache key, before a single build step runs (run
# 39485748555, 2026-10-20: "failed to calculate checksum of ref ...:
# /image-packages/stack/digisearch-seeds: not found").
#
# The scope is the STACK image's, and it is named: the stack image installs
# nine workspace wheels, the frozen export of their dependency set and the
# seed corpus, and it installs no npm tarball and no runner payload. So this
# action runs the generator's --stack-only mode. The full generator would also
# build the runner project - a fresh, unpinned `uv lock` against PyPI - and
# pack five npm workspaces the image never installs, and a production deploy
# must not inherit a network-dependent resolution step it does not use.
#
# The digichat publish lane got the same step in #5968 (DIG-4506) with
# --npm-only, because that image installs npm tarballs and installs no wheel.
#
# The toolchain: the generator builds the workspace wheels and exports the
# frozen requirement set with uv, and reads pyproject.toml with tomllib, so
# python and uv are set up here. It packs no npm tarball in this scope, so it
# needs no node - the caller needs node for its own steps, not for this one.
#
# What this action does NOT claim: the --check-only that follows the packaging
# reads the tree this action just wrote, so it is a backstop, not an
# independent proof. The proof is the guard below: it fails the step when a
# path the Dockerfile COPYs is missing or empty, so no lane can report a green
# build over a context that carried no such path.
name: Package the stack image inputs
description: >-
  Build the image-packages/stack tree the stack image's Dockerfile COPYs from,
  and fail the step when a packaged path the image needs is missing or empty.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # The repo's uv pin (the same one the other Python lanes use). The
    # generator builds the workspace wheels and exports the frozen requirement
    # set with it.
    - uses: astral-sh/setup-uv@v5
      with:
        version: "0.12.24"
        enable-cache: true

    - name: Package the stack image inputs
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/package_r5_image_inputs.py --stack-only
        # The generator's own verdict on the scope it just packaged: it refuses
        # a tree that is partial (another image's inputs) or stale against the
        # sources it was built from.
        python3 scripts/package_r5_image_inputs.py --check-only --stack-only
        missing=0
        for path in \
          image-packages/stack/requirements.txt \
          image-packages/stack/wheels \
          image-packages/stack/digisearch-seeds
        do
          if [ ! -e "$path" ]; then
            echo "::error::$path is missing - the image build context would carry no such path"
            missing=1
          fi
        done
        # An empty path builds a SUCCESSFUL image that installs nothing, so the
        # emptiness is a failure too, not a detail.
        if [ ! -s image-packages/stack/requirements.txt ]; then
          echo "::error::image-packages/stack/requirements.txt is empty - the image would install no frozen pin"
          missing=1
        fi
        if [ -z "$(ls -A image-packages/stack/digisearch-seeds 2>/dev/null)" ]; then
          echo "::error::image-packages/stack/digisearch-seeds is empty - the image would seed an empty corpus"
          missing=1
        fi
        # One wheel per stack package: the Dockerfile installs nine of them by
        # name. A tree with fewer is a partial build, and the image would fail
        # at pip install instead of here.
        # The `|| true` is load-bearing: under `set -euo pipefail` a missing
        # wheels directory makes find fail, the pipeline fail and the script
        # abort BEFORE the guard below can say why. The count is the diagnosis,
        # not the crash.
        wheels=$(find image-packages/stack/wheels -name '*.whl' 2>/dev/null | wc -l | tr -d ' ' || true)
        if [ "$wheels" != "9" ]; then
          echo "::error::image-packages/stack/wheels holds $wheels wheel(s), expected 9 - the image installs one wheel per stack package"
          missing=1
        fi
        exit "$missing"
