name: Agent task
description: Scoped task for a coding agent (Cursor, Claude Code, etc.)
title: "[agent] "
labels: ["agent-task"]
body:
  - type: markdown
    attributes:
      value: |
        Add labels `component:<name>` and `priority:<critical|high|medium|low>`.
        Dispatch tier comes from the component (`tiers` in `scripts/project_routing.json`).
        Conventions: `docs/agent-backlog/README.md`.
  - type: dropdown
    id: component
    attributes:
      label: Primary component
      options:
        - digigraph
        - digiquant
        - digisearch
        - digiclaw
        - digitrace
        - digikey
        - digibase
        - digichat
        - website / root docs
        - other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Dispatch tier is derived from the component (`tiers` in `scripts/project_routing.json`):
        `component:digikey` runs supervised locally, everything else auto-executes.
        See `docs/agents/EXECUTION_TIERS.md`.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph — what should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist the agent can verify (tests, behavior, docs).
      placeholder: "- [ ] ...\n- [ ] Unit tests pass: pytest -m unit -k {component}\n- [ ] {component}/ARCHITECTURE.md updated if interface changed"
    validations:
      required: true
  - type: textarea
    id: vendor
    attributes:
      label: Third-party data access
      description: |
        Optional — fill in only if this task adds, changes or documents a call to
        someone else's data, endpoint, authentication flow or vendor-specific
        constant.

        **No third-party data access merges without a `docs/vendor-terms/<vendor>/INDEX.md`
        entry, written when the integration is proposed — not at review time.**

        Give the vendor and the entry's path. If the entry does not exist yet, say
        so; writing it is part of this task. An open-source `LICENSE` in the
        vendor's repository does not cover their data. Reading their public terms
        is not outreach — contacting them is Chris's decision.
      placeholder: "Vendor: <name>\nEntry: docs/vendor-terms/<name>/INDEX.md (exists | to write)"
    validations:
      required: false
  - type: textarea
    id: docs
    attributes:
      label: Documentation
      description: Which files must be updated (paths or doc names)?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / links
      description: PRs, ADRs, ARCHITECTURE sections, logs — optional.
    validations:
      required: false
