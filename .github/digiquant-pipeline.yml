# Non-secret dashboard pipeline tunables. Loaded into $GITHUB_ENV by
# workflows/pipeline-digiquant.yml
# ("Load pipeline configuration"). Secrets stay in workflow step env blocks.

env:
  # Tier policy: config/digiquant_models.yaml (cheap|balanced|quality).
  # apply_digiquant_house_env() in chain startup points the default client.
  # House default: CHEAPERINFERENCE_API_KEY (GHA secret) → Cheaper Inference for
  # mapped pins; unmapped pins raise (no fallback).
  # DIGI_HOUSE_UPSTREAM=openrouter forces OpenRouter. See docs/providers/cheaperinference.md.
  OLYMPUS_MODEL_TIER: "cheap"
  # Explicit (redundant when secret is set); use "openrouter" to force OR.
  DIGI_HOUSE_UPSTREAM: "cheaperinference"

  # Enforced for the first time by #1767 — before it, H4 passed the whole H3 thesis
  # map as "held" and the cap bypassed itself (39 analysts dispatched against 25).
  # 25 would now leave 12 of 27 live theses with no vehicle analysed (~$2.60/day);
  # 30 leaves 7 (~$3.10) against today's uncapped 39-wide $4.00. Tighten once
  # `breakdown.roster` has a week of width telemetry.
  DIGIQUANT_MAX_ANALYSTS: "30"

  # Tool-round budget for Olympus research-agent calls (#3299). High but finite:
  # cheap models need room for data-tool grounding; the cap stays to bound cost.
  # digigraph chat keeps its own max_tool_rounds=4 — do not reuse this there.
  OLYMPUS_MAX_TOOL_ROUNDS: "24"

  # Fail-soft feature flags — outages degrade signal, never block the run.
  DIGIQUANT_ONCHAIN_POSITIONING: "1"   # Hyperdash cohort GraphQL (#801)
  OLYMPUS_POSITION_RISK_FIELDS: "1"    # Pillar 2E advisory fields (migration 039)

  # Market-data serving layer (#3780, R2 cutover ON HOLD — Task 7 fix round):
  # "supabase" (default) keeps the legacy table reads AND the Supabase writers
  # (dual-write window: bespoke bulk readers still query the Supabase tables,
  # so stopping writers would freeze them on stale data — see Task 8). The R2
  # backend code + flag plumbing stay dormant-but-present for supervised parity
  # sampling (operator-run, N=3 cycles): set "r2" explicitly for a sampling run
  # only, then flip back. Re-stop the writers only after Task 8 migrates the
  # bulk readers.
  DIGIQUANT_MARKET_DATA_BACKEND: "supabase"

  DIGI_CHECKPOINTER: postgres          # Resume on retry (#665); degrades if URI absent
  LANGSMITH_TRACING: "true"            # Required for traces; key alone is insufficient (#687)
