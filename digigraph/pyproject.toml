[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digigraph"
version = "0.1.0"
description = "DigiGraph – LangGraph orchestration brain (Digi Ecosystem)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "polars>=1.0",
    "uvicorn[standard]>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "openai>=1.0",
    "pyyaml>=6",
    "jsonschema>=4.21",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "plotly>=5.0",
    "kaleido>=0.2",
    "digismith>=0.1.0",
    "digibase>=0.1.0",
    "digikey>=0.1.0",
    "digillm>=0.1.0",
]

[project.optional-dependencies]
tracing = ["langsmith>=0.1"]
dev = ["pytest>=8,<10", "pytest-cov>=4,<8", "ruff>=0.16,<0.17", "langgraph-checkpoint-sqlite>=2.0"]
otel = ["digibase[otel]"]
# Upper-bounded: mcp 2.0 removed `mcp.server.fastmcp`, which both MCP servers
# import (see #1705). Lift the bound only together with a migration to the 2.x API.
mcp = ["mcp>=1.2,<2"]
checkpoint-sqlite = ["langgraph-checkpoint-sqlite>=2.0"]
checkpoint-postgres = ["langgraph-checkpoint-postgres>=2.0"]

[project.scripts]
digi = "digigraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digigraph = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F", "I", "DTZ", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Service entrypoint imports after dotenv/sys.path bootstrap — by design.
"src/digigraph/server.py" = ["E402"]
# Package __init__ files re-export public symbols.
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
# Monorepo tests live at repo root tests/dg/; from digigraph/: `pytest` picks these up; or `make test-unit` from repo root.
testpaths = ["../tests/dg"]
pythonpath = ["src"]
