# local-ci on Forgejo (the maintainer, 4 Nov 2026: "migrate local ci into Forgejo's").
#
# Runs the repository's own run_checks() (scripts/local-ci/local_ci.py) so the
# gates, scope rules and step budgets cannot drift from the host runner. The job
# name `local-ci` is the required check. No secrets are used. Once
# .forgejo/workflows exists, Forgejo ignores .github/workflows.
name: local-ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop]
concurrency:
  group: local-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-ci:
    name: local-ci
    runs-on: local-ci
    timeout-minutes: 120
    env:
      tenantb_SMOKE_SKIP_TURN: "1"
      WRANGLER_SEND_METRICS: "false"
      DO_NOT_TRACK: "1"
      UV_VERSION: "0.10.2"
      GITLEAKS_VERSION: "8.30.1"
      ACTIONLINT_VERSION: "1.7.12"
      BUN_VERSION: "1.4.2"
      SHELLCHECK_VERSION: "0.11.0"
      UV_PYTHON: "3.12"
      UV_CACHE_DIR: /opt/local-ci-cache/uv
      UV_PYTHON_INSTALL_DIR: /opt/local-ci-cache/python
      UV_LINK_MODE: copy
      npm_config_cache: /opt/local-ci-cache/npm
      BUN_INSTALL_CACHE_DIR: /opt/local-ci-cache/bun
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the host runner's tools (same versions as the Mac)
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) UV_ARCH="x86_64"; GL_ARCH="x64"; AL_ARCH="amd64"; SC_ARCH="x86_64"; BUN_ARCH="x64" ;;
            aarch64) UV_ARCH="aarch64"; GL_ARCH="arm64"; AL_ARCH="arm64"; SC_ARCH="aarch64"; BUN_ARCH="aarch64" ;;
            *) echo "unsupported arch $ARCH"; exit 1 ;;
          esac
          mkdir -p /opt/local-ci-cache/tools /usr/local/bin

          DIR="/opt/local-ci-cache/tools/uv-${UV_VERSION}"
          if [ ! -d "$DIR" ]; then
            mkdir -p "$DIR"
            curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_ARCH}-unknown-linux-gnu.tar.gz" | tar -xz --strip-components=1 -C "$DIR"
          fi
          ln -sf "$DIR/uv" /usr/local/bin/uv
          ln -sf "$DIR/uvx" /usr/local/bin/uvx

          DIR="/opt/local-ci-cache/tools/gitleaks-${GITLEAKS_VERSION}"
          if [ ! -d "$DIR" ]; then
            mkdir -p "$DIR"
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz" | tar -xz -C "$DIR"
          fi
          ln -sf "$DIR/gitleaks" /usr/local/bin/gitleaks

          DIR="/opt/local-ci-cache/tools/actionlint-${ACTIONLINT_VERSION}"
          if [ ! -d "$DIR" ]; then
            mkdir -p "$DIR"
            curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${AL_ARCH}.tar.gz" | tar -xz -C "$DIR"
          fi
          ln -sf "$DIR/actionlint" /usr/local/bin/actionlint

          DIR="/opt/local-ci-cache/tools/shellcheck-${SHELLCHECK_VERSION}"
          if [ ! -d "$DIR" ]; then
            mkdir -p "$DIR"
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.${SC_ARCH}.tar.xz" | tar -xJ -C "$DIR" --strip-components=1
          fi
          ln -sf "$DIR/shellcheck" /usr/local/bin/shellcheck

          DIR="/opt/local-ci-cache/tools/bun-${BUN_VERSION}"
          if [ ! -d "$DIR" ]; then
            mkdir -p "$DIR"
            curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-${BUN_ARCH}.zip" -o /tmp/bun.zip
            unzip -q /tmp/bun.zip -d "$DIR"
            rm -f /tmp/bun.zip
          fi
          ln -sf "$DIR/bun-linux-${BUN_ARCH}/bun" /usr/local/bin/bun
          mkdir -p /root/.bun/bin
          ln -sf "$DIR/bun-linux-${BUN_ARCH}/bun" /root/.bun/bin/bun

          uv python install 3.12
          PYBIN="$(uv python find 3.12)"
          ln -sf "$PYBIN" /usr/local/bin/python3

          echo "=== tool versions ==="
          uv --version
          gitleaks version
          actionlint --version
          shellcheck --version
          bun --version
          python3 --version
      - name: Provide origin/main for the baseline gates
        shell: bash
        run: |
          set -euo pipefail
          # scripts/check_vendor_content.py baselines on merge-base(HEAD, origin/main). The local Forgejo has
          # no main branch yet (develop only), while the Mac's clone has GitHub's main. Use Forgejo's main when it
          # exists, otherwise fetch main read-only and anonymously from the public GitHub repo. No credentials.
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags --filter=blob:none https://github.com/digithings-ai/digithings.git +refs/heads/main:refs/remotes/origin/main
          fi
          git rev-parse --verify refs/remotes/origin/main
      - name: Warm the uv download cache (not a gate)
        shell: bash
        run: |
          # the uv-sync gate has a 900 s budget sized for the Mac's warm cache. This fills the persistent
          # cache first so the budget measures the install, not the download. A failure here is ignored on purpose:
          # the uv-sync gate below runs the same command and reports it.
          uv sync --frozen --all-packages --all-extras || echo "warm-up failed; the uv-sync gate reports it"
      - name: local-ci (scripts/local-ci/local_ci.py run_checks)
        run: python3 .forgejo/local_ci_forgejo.py