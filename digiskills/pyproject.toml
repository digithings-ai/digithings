[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digiskills"
version = "0.2.1"
description = "digiskills – compiles a codebase/docs source into an installable Agent Skill package (SKILL.md + references) for digithings"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    # YAML frontmatter rendering for SKILL.md. Already a repo-wide dependency
    # (digivault, digisearch); kept as a direct, flat dep so the core library
    # installs without monorepo-sibling ordering.
    "pyyaml>=6",
]

[project.optional-dependencies]
# Typer CLI (`digiskills compile ...`). The core library (models, ingest,
# synthesize, compiler, package) imports none of this.
cli = ["typer>=0.12"]
# Remote-source corpus builder (ingest_url.py) — fetches docs/OpenAPI URLs via
# digifetch.HttpFetcher. Lazily imported; `import digiskills` never imports it.
ingest = ["digifetch>=0.1.0"]
# Real LLM-backed synthesis (DigiLLMSynthesizer) via digillm.completion.
# Lazily imported; the default TemplateSynthesizer needs no LLM/API key.
llm = ["digillm>=0.1.0"]
dev = ["digiskills[cli,ingest,llm]"]

[project.scripts]
digiskills = "digiskills.cli:app"

[dependency-groups]
# Synced by default with plain `uv sync` (unlike [project.optional-dependencies], which
# needs --extra/--all-extras) -- so these tools are always present in digiskills's own venv
# regardless of which extras a given `uv sync` invocation requests. Bounds match CLAUDE.md's
# "Dependency version bounds": tools whose output gates CI are capped to their current major.
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F", "I", "DTZ", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-exports public symbols; ruff flags them as unused.
# Matches the repo-root ruff.toml, digibase, digisearch, digifetch, digivault.
"**/__init__.py" = ["F401"]
