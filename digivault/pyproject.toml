[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digivault"
version = "0.1.0"
description = "digivault – Obsidian-style markdown vault management (frontmatter, wikilinks, backlinks, tags, taxonomy) for digithings"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    # PyYAML for round-trip YAML frontmatter parse/serialize. Already a repo-wide
    # dependency (digisearch, config loaders); kept here as a direct, flat dep so
    # the core library installs without monorepo-sibling ordering.
    "pyyaml>=6",
    # d1_store's default HTTP transport (Cloudflare D1 REST API), lazily imported so
    # `import digivault` never pays for it. Matches digisearch's VectorizeBackend,
    # which is core (not gated behind an extra) for the same reason: a REST-backed
    # store needs no Worker binding, just an HTTP client.
    "httpx>=0.27",
]

[project.optional-dependencies]
# FastAPI service + MCP server + CLI. The core library (frontmatter, wikilinks,
# vault) imports none of these; ``import digivault`` never imports FastAPI.
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Upper-bounded: mcp 2.0 removed `mcp.server.fastmcp`, which this package's
    # MCP server imports at module scope — unbounded, it is a hard ImportError
    # (#1711). Lift only together with a migration to the 2.x API.
    "mcp>=1.0,<2",
    "typer>=0.12",
]
# Supabase-backed vault store (digivault.supabase_store). Lazily imported — the
# core stays pydantic+pyyaml-only; this extra adds the DB read/search path.
supabase = ["supabase>=2"]

[project.scripts]
digivault = "digivault.cli:app"

[dependency-groups]
# Synced by default with plain `uv sync` (unlike [project.optional-dependencies], which
# needs --extra/--all-extras) -- so these tools are always present in digivault's own venv
# regardless of which extras a given `uv sync` invocation requests. Bounds match CLAUDE.md's
# "Dependency version bounds": tools whose output gates CI are capped to their current major.
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# d1_schema.sql is data, not a .py module — setuptools does not package non-.py
# files under [tool.setuptools.packages.find] by default, so a non-editable
# install (a real `pip install digivault` or `python -m build --wheel`, as
# opposed to this monorepo's editable dev install) would silently drop it.
# NOT the reason scripts/d1_sync.py's --init keeps working either way: its
# _apply_schema resolves the file repo-relatively from scripts/, never through
# the installed digivault package, so a missing package-data entry wouldn't
# touch it. What actually depends on this entry is the schema being packaged
# next to the installed digivault.d1_store module — tests/dv/test_d1_store.py:24
# reads it via `Path(d1_store.__file__).with_name("d1_schema.sql")`, which would
# 404 against a non-editable install without this line (#2239 review, Minor
# finding: this comment previously misstated --init as the load-bearing reason).
digivault = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F", "I", "DTZ", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-exports public symbols; ruff flags them as unused.
# Matches the repo-root ruff.toml, digibase, digisearch, digifetch.
"**/__init__.py" = ["F401"]
