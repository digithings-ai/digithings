version: 1
# V1 trial POC (#3861): UI-only container on a tenant-local Foundry agent.
# Per-trial baked yaml — the pipeline clones this per trial with that
# tenant's projectEndpoint + agentName. Foundry auth is the container's
# managed identity (DefaultAzureCredential); no secret is baked here.
# The agent itself carries the tenant search index + MCP tool.
deployment:
  slug: datatap-trial-foundry
  chrome:
    mode: embed
    theme: dark
    skin: digichat
    title: ask datatap
    # Client-facing copy for the trial. The trial tenant holds a sample
    # dataset (the public Enron email archive), not the visitor's own data,
    # so the copy says what is actually there. The agent searches it with its
    # own search tool and opens items with its MCP tool; the UI shows each tool
    # call as a row, not a per-answer source list. The copy names no mechanism
    # and promises only those rows.
    # Attachments are not promised until a live run has opened one.
    # Template note: the pipeline clones this file per trial, so a tenant on
    # other data needs its own title, body and placeholder.
    welcome:
      title: Ask about the Enron email archive.
      body:
        - "This DataTap trial runs on a sample dataset: the public Enron email
          archive."
        - The agent searches and opens the emails, and shows each search it
          ran and each email it opened.
    # Starters are tested live against the trial agent (Enron sample data):
    # each must finish with no tool error on two runs and show a different
    # tool path. Re-test them when the trial data or agent changes.
    suggestions:
      - How did email volume change through 2001 as Enron collapsed?
      - What did Enron's traders say about the California energy crisis?
      - Which emails mention Arthur Andersen, and what was the concern?
      - Who sends the most emails in this archive, and what do they write about?
      - Find an email about the Dabhol power plant and open it.
    placeholder: Ask about the Enron emails
  persistence: none
  auth: anonymous
  features:
    view: balanced
    attachments: false
    dictation: false
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: foundry
    # Per-trial values — replaced by the pipeline (see
    # config/examples/datatap-trial-deploy.md).
    projectEndpoint: https://dg-agentic-1d0a8149.services.ai.azure.com/api/projects/datatap-trial-chat
    agentName: datatap-trial
    # Alias of guardrails.maxToolCallsPerTurn. Prefer the shared block below.
    # maxToolCalls: 5
    # maxToolCalls: 4
  # Proposed guardrails for this trial. Commented, so nothing is applied.
  # Uncomment the block and one maxToolCallsPerTurn line after confirming.
  # tokensPerMinute.deployment is the Azure TPM for gpt-5.6-terra in
  # westeurope. Fill that number in from Azure; do not guess it, and do not
  # change the Azure deployment from here.
  # guardrails:
  #   maxToolCallsPerTurn: 5
  #   # maxToolCallsPerTurn: 4
  #   tokensPerMinute:
  #     deployment: <Azure TPM for gpt-5.6-terra, westeurope>
  tools:
    # Declared for /tools. The Foundry agent owns these tools; the page does
    # not fetch them and the visitor cannot toggle them.
    allowUserToggle: false
    catalog:
      - id: file_search
        label: Search
        default: true
      - id: datatap
        label: DataTap
        default: true
        tools:
          - id: datatap__list_connections
            label: List connections
          - id: datatap__get_item
            label: Open item
  gate:
    mode: ungated
    activityDetail: full
    llmAccess: operator
    showByok: false
    showLanguageSelector: true
