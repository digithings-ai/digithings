version: 1
# V1 trial POC (#3861): UI-only container on a tenant-local Foundry agent.
# Per-trial baked yaml — the pipeline clones this per trial with that
# tenant's projectEndpoint + agentName. Foundry auth is the container's
# managed identity (DefaultAzureCredential); no secret is baked here.
# The agent itself carries the tenant search index + MCP tool.
#
# Overlay on house. The Foundry backend replaces the digigraph backend.
# Catalog, premium meter, house prompt, per-visitor TPM, and the context
# meter stay off. One shared allowance (tokensPerMinute.deployment) is this
# trial's cap. The Azure TPM for gpt-5.6-terra in westeurope is not in this
# repo, so that number is not filled in. The tool-call cap and the answer
# guard stay.
extends: defaults
embedHosts:
  - datatapstream.com
  - www.datatapstream.com
  - dev.datatapstream.com
  - datatap.stream
  - www.datatap.stream
  - dev.datatap.stream
  - nice-glacier-0187d6403.7.azurestaticapps.net
  - nice-glacier-0187d6403-10.westeurope.7.azurestaticapps.net
  - nice-glacier-0187d6403-11.westeurope.7.azurestaticapps.net
hosts: null
deployment:
  slug: datatap-trial-foundry
  aliases: null
  chrome:
    mode: embed
    theme: dark
    skin: digichat
    title: ask datatap
    welcome:
      title: Ask about the Enron email archive.
      body:
        - "This DataTap trial runs on a sample dataset: the public Enron email
          archive."
        - The agent searches and opens the emails, and shows each search it
          ran and each email it opened.
    suggestions:
      - How did email volume change through 2001 as Enron collapsed?
      - What did Enron's traders say about the California energy crisis?
      - Which emails mention Arthur Andersen, and what was the concern?
      - Who sends the most emails in this archive, and what do they write about?
      - Find an email about the Dabhol power plant and open it.
    placeholder: Ask about the Enron emails
    launcher: null
  persistence: none
  auth: anonymous
  features:
    view: balanced
    attachments: false
    dictation: false
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: false
  models:
    catalog: false
    allowPicker: false
    default: null
    priceCapUsdPerMillion: null
    costPerWindow: null
    presets: null
    showFullList: null
  backend:
    type: foundry
    # Per-trial values — replaced by the pipeline (see
    # config/examples/datatap-trial-deploy.md).
    projectEndpoint: https://REPLACE-FOUNDRY-ACCOUNT.services.ai.azure.com/api/projects/REPLACE-PROJECT
    agentName: REPLACE-AGENT-NAME
  # The house per-visitor minute is cleared. The shared allowance is
  # tokensPerMinute.deployment. The Azure TPM for gpt-5.6-terra in
  # westeurope is not in this repo, so the number is not filled in.
  # Tool-call cap and answer guard are inherited.
  guardrails:
    tokensPerMinute: null
  prompt: null
  tokenEnv: null
  tools:
    # Declared for /tools. The Foundry agent owns these tools; the page does
    # not fetch them and the visitor cannot toggle them.
    allowUserToggle: false
    catalog:
      - id: file_search
        label: Search
        default: true
      - id: datatap
        label: DataTap
        default: true
        tools:
          - id: datatap__list_connections
            label: List connections
          - id: datatap__get_item
            label: Open item
  # House MCP servers are not this trial's. An omitted block would inherit them.
  mcp:
    servers: []
    allowUserServers: false
    allowAddForm: false
  gate:
    mode: ungated
    activityDetail: full
    llmAccess: operator
    showByok: false
    showLanguageSelector: true
    showContextMeter: null
    webSearch: false
