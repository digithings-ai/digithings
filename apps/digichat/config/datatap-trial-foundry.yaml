version: 1
# V1 trial POC (#3861): UI-only container on a tenant-local Foundry agent.
# Per-trial baked yaml — the pipeline clones this per trial with that
# tenant's projectEndpoint + agentName. Foundry auth is the container's
# managed identity (DefaultAzureCredential); no secret is baked here.
# The agent itself carries the tenant search index + MCP tool.
deployment:
  slug: datatap-trial-foundry
  chrome:
    mode: embed
    theme: dark
    skin: digichat
    title: ask datatap
    # Client-facing copy for the trial: this tenant is a DataTap trial, and
    # the agent reaches the enterprise database through the DataTap MCP.
    welcome:
      title: Ask about your DataTap trial.
      body:
        - This is a DataTap trial. The agent reaches your enterprise database
          through the DataTap MCP, so it can answer with your own data.
    suggestions:
      - Which tables hold our customer data?
      - What feeds the revenue mart?
      - Who owns the orders table, and how fresh is it?
      - Which pipelines failed in the last 24 hours?
      - How do I add a new column to the marketing model?
    placeholder: Ask about your data, your pipelines or the platform
  persistence: none
  auth: anonymous
  features:
    view: balanced
    attachments: false
    dictation: false
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: foundry
    # Per-trial values — replaced by the pipeline (see
    # config/examples/datatap-trial-deploy.md).
    projectEndpoint: https://REPLACE-FOUNDRY-ACCOUNT.services.ai.azure.com/api/projects/REPLACE-PROJECT
    agentName: REPLACE-AGENT-NAME
  tools:
    allowUserToggle: true
    catalog: []
  gate:
    mode: ungated
    activityDetail: full
    llmAccess: operator
    showByok: false
    showLanguageSelector: true
