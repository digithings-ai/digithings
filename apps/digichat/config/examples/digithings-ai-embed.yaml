version: 1
# digithings.ai public embed (dogfood)
hosts:
  digithings.ai:
    slug: digithings-ai
    aliases:
      - www.digithings.ai
    chrome:
      mode: embed
      theme: dark
      skin: digichat
      title: ask digichat
      welcome:
        title: Ask about digithings
        body: Explore the documentation, dig into the stack, or search the vault.
      placeholder: Ask a question
      suggestions:
        - What is digigraph?
        - How do embeds work?
        - What components are in the stack?
        - How do I run the stack locally?
        - What models does digichat support?
        - How does digiquant handle backtests?
        - What is digivault?
        - How do I create an embed?
      attribution: true
      launcher:
        mode: bar
        label: ask digichat
        closeLabel: close
        mobileFullscreen: true
    persistence: none
    auth: anonymous
    features:
      attachments: false
      dictation: false
      speech: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      modelPicker: true
    models:
      # Catalog picker: presets, then every tool-capable model under the
      # output cap. The list is config/model-picker-catalog.json, not a
      # hand-written allowlist. OpenRouter appears only as the Router
      # preset, and only when OPENROUTER_API_KEY is set at load.
      # BYOK (`gate.showByok`) still replaces /models with that provider.
      allowPicker: true
      catalog: true
      default: deepseek/deepseek-v4.1-flash-1017
      priceCapUsdPerMillion: 2
      # Premium sits above that cap and at or under $2.50 (GLM 5.3, Gemini
      # 3.8 Flash). Manual picks only. costPerWindow is three typical turns
      # of the pricier one, GLM 5.3, per rolling day ($0.0125565). OCC sets
      # the same window because its picker is on.
      costPerWindow:
        usd: 0.0125565
        windowSeconds: 86400
      presets: [auto, reasoning, fast, light]
      showFullList: true
    backend:
      type: digigraph
      # Tenant corpus for D1 FTS. Without this, digigraph overwrites path_prefix
      # with None and vault search fails closed — the BFF used to render that as
      # hitCount: 0 with no error (#3838).
      digisearchIndex: digithings_docs
      vaultPathPrefix: clients/digithings
    # Proposed per-user token budget for the public chat. Commented, so it is
    # off. 80000 tokens in a rolling minute is several ordinary questions
    # (a couple of tool calls and a few thousand tokens of docs) — more than
    # a person types — and pauses a bot that loops the same prompt. Anonymous
    # traffic is keyed by the server-derived client IP, not the session header.
    # guardrails:
    #   tokensPerMinute:
    #     user: 80000
    tools:
      allowUserToggle: true
      catalog:
        - id: digisearch
          default: true
          label: Search
        - id: digivault
          default: true
          label: Vault
    mcp:
      # Fail-closed for public digithings.ai marketing embed (#3795).
      # Example ≠ live env; prod DIGICHAT_EMBED_TENANTS omits this (schema default false).
      allowUserServers: false
      allowAddForm: false
      servers:
        - id: digisearch
          url: http://digisearch-mcp:8765/mcp
          label: Search
          default: true
          setup:
            index_name: digithings_docs
        - id: digivault
          url: http://digivault-mcp:8769/mcp
          label: Vault
          default: true
          setup:
            path_prefix: clients/digithings
    gate:
      mode: ungated
      # Local website-like dogfood (`?host=digithings.ai`) must show retrieve
      # chunks / note bodies. Production can still set labels via env overlay.
      activityDetail: full
      llmAccess: free_then_byok
      showByok: true
      showLanguageSelector: true
      # The digigraph license has no hosted-web-search scope. Requesting it
      # 403s the whole turn. Leave this off; the stream adapter still retries
      # once as plain inference if an overlay turns it back on.
      webSearch: false
    # token: set via DIGICHAT_HOST_DIGITHINGS_AI_TOKEN or DIGICHAT_EMBED_TENANTS
