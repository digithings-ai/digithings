version: 1
# Dashboard / widget popup (modal chrome around /embed iframe)
deployment:
  slug: digiquant-dashboard
  chrome:
    mode: modal
    theme: dark
    skin: digichat
    title: ask digichat
    welcome: Ask about this page.
    placeholder: Ask about this page
    suggestions:
      - What changed in the house book?
      - Summarize today's research digest
      - Why is this position sized this way?
    accent:
      color: "#3dd6c4"
      foreground: "#0a0f0e"
    launcher:
      mode: bar
      label: ask digichat
      closeLabel: close
      hotkey: "meta+i"
      mobileFullscreen: true
  persistence: none
  auth: anonymous
  features:
    # System page-context.html chip is attached by the embed, not this flag.
    # Keep false so the popup does not grow a user file picker.
    attachments: false
    dictation: false
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: true
    # Page snapshot is injected into the model but renders no attachment chip.
    pageContext: silent
  models:
    # Same CI-cheap default as digithings.ai (#3829). Not OpenRouter `:free`.
    default: deepseek/deepseek-v4-flash
    available:
      - deepseek/deepseek-v4-flash
      - deepseek/deepseek-v4-flash-0731
      - openai/gpt-oss-120b
      - z-ai/glm-5.3-flash
    allowPicker: true
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
      - id: digivault
        default: true
      - id: web_search
        default: true
  mcp:
    allowUserServers: false
    allowAddForm: false
    servers:
      - id: digiquant
        url: https://mcp.digithings.ai/mcp
        label: digiquant market data
        default: true
        allowedTools:
          - dashboard_evaluate_policy_gate
          - dashboard_get_policy_comparison
          - dashboard_get_policy_gate_evaluation
          - dashboard_get_policy_replay
          - digifetch_13f_funds
          - digifetch_13f_holdings
          - digifetch_alert_add
          - digifetch_alert_list
          - digifetch_analyst_research
