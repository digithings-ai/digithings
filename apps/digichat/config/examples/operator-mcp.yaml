version: 1
# Operator MCP servers in YAML (generic example).
# URLs stay on the BFF — never projected to the browser.
# Session `/operator` empty = toggle; `/operator query` forces that server this send.
deployment:
  slug: operator
  chrome:
    mode: embed
    theme: dark
    skin: digichat
    title: Ask the assistant
    welcome: Ask about your pipelines.
    placeholder: Ask a question
  persistence: none
  auth: anonymous
  features:
    attachments: false
    dictation: false
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
  mcp:
    allowUserServers: false
    allowAddForm: false
    servers:
      - id: operator
        url: https://mcp.example.invalid/mcp
        label: Example MCP
        default: true
        # A server may authenticate via a custom header, not
        # `Authorization: Bearer` — set authHeader alongside a token or
        # tokenEnv (#3841). tokenEnv is resolved from the deploy environment
        # at load time and never committed; an inline `token` wins if both
        # are set. Neither is ever projected to the browser.
        tokenEnv: OPERATOR_MCP_TOKEN
        authHeader: X-API-Key
  gate:
    mode: ungated
    activityDetail: labels
    llmAccess: operator
    showByok: false
    showLanguageSelector: true
    # web search explicitly off: docs + MCP surface only
    webSearch: false
