version: 1
# Local / first-party app (Auth.js session + server persistence).
# House catalog, meter, prompt, and the per-visitor TPM are cleared.
# The request limiter, the tool-call cap, and the answer guard stay.
extends: defaults
hosts: null
deployment:
  slug: local-app
  aliases: null
  chrome:
    mode: app
    theme: light
    skin: base
    title: digichat
    welcome: How can I help you today?
    placeholder: Send a message...
    suggestions:
      - Summarize my last conversation
      - What can you search?
    launcher: null
  persistence: server
  auth: session
  features:
    attachments: true
    dictation: true
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: false
  models:
    catalog: false
    allowPicker: false
    default: null
    priceCapUsdPerMillion: null
    costPerWindow: null
    presets: null
    showFullList: null
  backend:
    type: digigraph
    digisearchIndex: null
    vaultPathPrefix: null
  guardrails:
    tokensPerMinute: null
  prompt: null
  tokenEnv: null
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
      - id: web_search
        default: true
        label: Web search
  mcp:
    servers: []
    allowUserServers: false
    allowAddForm: false
  gate:
    mode: ungated
    activityDetail: full
    llmAccess: operator
    showByok: true
    showLanguageSelector: true
    showContextMeter: null
    webSearch: true
