version: 1
# Official assistant-ui template `product-page-assistant` — copy to DIGICHAT_CONFIG_PATH
# or set DIGICHAT_CHROME_SKIN=product-page-assistant on any valid deployment YAML.
deployment:
  slug: client-product-page-assistant
  chrome:
    mode: app
    theme: light
    skin: product-page-assistant
    title: Support
    welcome: How can I help?
    placeholder: Describe the issue
  persistence: none
  auth: anonymous
  features:
    attachments: true
    dictation: false
    speech: false
    reasoning: collapsed
    toolCalls: collapsed
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
  gate:
    mode: ungated
    activityDetail: labels
    llmAccess: operator
