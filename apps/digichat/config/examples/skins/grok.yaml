version: 1
# Official assistant-ui template `grok` — copy to DIGICHAT_CONFIG_PATH
# or set DIGICHAT_CHROME_SKIN=grok on any valid deployment YAML.
deployment:
  slug: client-grok
  chrome:
    mode: embed
    theme: dark
    skin: grok
    title: Grok
    placeholder: What do you want to know?
  persistence: none
  auth: anonymous
  features:
    attachments: true
    dictation: false
    speech: false
    reasoning: collapsed
    toolCalls: collapsed
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
  gate:
    mode: ungated
    activityDetail: labels
    llmAccess: operator
