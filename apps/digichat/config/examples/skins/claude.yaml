version: 1
# Official assistant-ui template `claude` — copy to DIGICHAT_CONFIG_PATH
# or set DIGICHAT_CHROME_SKIN=claude on any valid deployment YAML.
deployment:
  slug: client-claude
  chrome:
    mode: embed
    theme: light
    skin: claude
    title: Claude
    welcome: How can I help you today?
    placeholder: How can I help you today?
  persistence: none
  auth: anonymous
  features:
    attachments: true
    dictation: false
    speech: false
    reasoning: collapsed
    toolCalls: collapsed
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
  gate:
    mode: ungated
    activityDetail: labels
    llmAccess: operator
