version: 1
# OCC (Online Compliance Center) corpus embed
hosts:
  occ.digithings.ai:
    slug: occ
    chrome:
      mode: embed
      theme: light
      skin: digichat
      title: OCC Help
      welcome:
        title: Ask about OCC
        body: Explore the documentation, search the knowledge base, or ask about support tickets.
      placeholder: Ask about OCC
      suggestions:
        - How do I file a support ticket?
        - What are the OCC complaint procedures?
        - Show my open support tickets
        - Where can I find the policy documentation?
        - Summarize this week's support tickets
        - What are the latest compliance updates?
        - How do I contact the OCC support team?
        - Search the knowledge base for onboarding
      attribution: true
    persistence: none
    auth: anonymous
    features:
      attachments: false
      dictation: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      modelPicker: false
      speech: false
    backend:
      type: digigraph
      digisearchIndex: occ_help
      vaultPathPrefix: clients/online-compliance-center
    tools:
      allowUserToggle: true
      catalog:
        - id: digisearch
          default: true
        - id: digivault
          default: true
        - id: web_search
          default: true
          label: Web search
    # Operator MCP servers stay on the BFF — URLs are never projected to the
    # browser. Zammad rides its `Token token=<x>` scheme as a raw authHeader
    # value (#3841); digigraph treats the dotless `zammad-mcp` name as
    # container-internal DNS (loopback URLs are never dialable, #3879).
    # On the Cloudflare stack the same server is reached via the key-gated
    # route instead: url https://graph.digithings.ai/_stack/mcp/zammad/mcp,
    # token: <MCP_EDGE_KEY value>, authHeader: x-digi-mcp-key (the dotless
    # `zammad-mcp` name does not resolve there; tokenEnv cannot resolve the
    # Worker-only MCP_EDGE_KEY secret, so the value goes in `token` literally;
    # fail-closed 401 without the key).
    mcp:
      allowUserServers: false
      allowAddForm: false
      servers:
        - id: zammad
          url: http://zammad-mcp:8770/mcp
          label: Zammad tickets
          default: true
          tokenEnv: ZAMMAD_API_TOKEN
          authHeader: Authorization
          allowedTools:
            - aggregate_tickets
            - get_ticket
            - list_tickets
            - search_tickets
            - ticket_report
        - id: digisearch
          url: http://digisearch-mcp:8765/mcp
          label: Help search
          default: true
          setup:
            # Docs only. The ticket corpus snapshot was retired in DIG-1380, so there is no second leg to fan out to.
            index_name: occ_help
          allowedTools:
            - grokipedia_get_page
            - grokipedia_search
            - monitors_create_watch
            - monitors_get_runs
            - monitors_list_watches
            - monitors_trigger_watch
            - research_turn
            - search_strategies
            - semantic
            - web_search
            - websets_add_search
            - websets_create
            - websets_events
            - websets_export
            - websets_get
            - websets_list_items
        - id: digivault
          url: http://digivault-mcp:8769/mcp
          label: Knowledge vault
          default: true
          setup:
            path_prefix: clients/online-compliance-center
          allowedTools:
            - digivault_backlinks
            - digivault_create_note
            - digivault_get_note
            - digivault_lint
            - digivault_search_notes
            - digivault_search_tag
    gate:
      mode: ungated
      activityDetail: labels
      llmAccess: operator
      showByok: false
      showLanguageSelector: true
      webSearch: true
