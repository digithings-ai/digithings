version: 1
# OCC (Online Compliance Center). Unique copy, light theme, and its own MCP
# servers. The Cheaper Inference picker (Auto, Fast, Reasoning) is inherited
# from defaults; OCC does not re-state it. The keys below clear the public
# house spend limits: per-visitor TPM, the premium cost meter, and the
# context meter. The invite link is the only gate. The tool-call cap and
# the answer guard stay.
extends: defaults
deployment: null
hosts:
  occ.digithings.ai:
    slug: occ
    aliases: null
    chrome:
      mode: embed
      theme: light
      skin: digichat
      title: OCC Help
      welcome:
        title: Ask about OCC
        body: Explore the documentation, search the knowledge base, or ask about support tickets.
      placeholder: Ask about OCC
      suggestions:
        - How do I file a support ticket?
        - What are the OCC complaint procedures?
        - Show my open support tickets
        - Where can I find the policy documentation?
        - Summarize this week's support tickets
        - What are the latest compliance updates?
        - How do I contact the OCC support team?
        - Search the knowledge base for onboarding
      attribution: true
      launcher: null
    features:
      attachments: false
      dictation: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      speech: false
    # Premium spend meter off. The picker list stays the default catalog.
    models:
      # Picker is the inherited catalog. `occPicker: false` is the off
      # switch (Chris, 21 Oct 2026, 19:19 Rome). No premium meter
      # (22:51 Rome: the invite link is the gate).
      costPerWindow: null
    backend:
      type: digigraph
      digisearchIndex: null
      vaultPathPrefix: null
    # Per-visitor TPM off. Request limiter off. The invite is the only gate.
    # Tool-call cap and answer guard stay from defaults.
    guardrails:
      rateLimit: false
      tokensPerMinute: null
    prompt: null
    tokenEnv: null
    tools:
      allowUserToggle: true
      catalog: []
    # Operator MCP servers stay on the BFF. Zammad rides Token token=<x> as a
    # raw authHeader (#3841). tokenEnv names the var; the value is not here.
    mcp:
      allowUserServers: false
      allowAddForm: false
      servers:
        - id: zammad
          url: http://zammad-mcp:8770/mcp
          label: Zammad tickets
          default: true
          tokenEnv: ZAMMAD_API_TOKEN
          authHeader: Authorization
          allowedTools:
            - search_tickets
            - list_tickets
            - get_ticket
            - ticket_report
            - aggregate_tickets
          mutatingTools: []
        - id: digisearch
          url: http://digisearch-mcp:8765/mcp
          label: Help search
          default: true
          allowedTools: [semantic, web_search]
          mutatingTools: []
          setup:
            index_name: occ_help
        - id: digivault
          url: http://digivault-mcp:8769/mcp
          label: Knowledge vault
          default: true
          allowedTools: [search_notes, search_tag, backlinks]
          mutatingTools: []
          setup:
            path_prefix: clients/online-compliance-center
    gate:
      mode: ungated
      activityDetail: labels
      llmAccess: operator
      showByok: false
      showLanguageSelector: true
      showContextMeter: null
      lockSessionControls: true
      webSearch: false
