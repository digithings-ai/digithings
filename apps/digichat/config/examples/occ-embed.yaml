version: 1
# OCC (Online Compliance Center) corpus embed
hosts:
  occ.digithings.ai:
    slug: occ
    chrome:
      mode: embed
      theme: light
      skin: digichat
      title: OCC Help
      welcome:
        title: Ask about OCC
        body: Explore the documentation, search the knowledge base, or ask about support tickets.
      placeholder: Ask about OCC
      suggestions:
        - How do I file a support ticket?
        - What are the OCC complaint procedures?
        - Show my open support tickets
        - Where can I find the policy documentation?
        - Summarize this week's support tickets
        - What are the latest compliance updates?
        - How do I contact the OCC support team?
        - Search the knowledge base for onboarding
      attribution: true
    persistence: none
    auth: anonymous
    features:
      attachments: false
      dictation: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      modelPicker: true
      speech: false
    models:
      # Chris, 21 Oct 2026 19:19 Rome: "Yes, enable the model picker on OCC
      # for 2.6.6, I sign off on overriding the DIG-4488 lock". occPicker is
      # the switch (off keeps the operator model). The catalog is the same
      # policy as digithings.ai. lockSessionControls below still hides MCP
      # and tool session controls. DIG-4750 still refuses a raw id list.
      occPicker: true
      allowPicker: true
      catalog: true
      default: deepseek/deepseek-v4.1-flash-1017
      priceCapUsdPerMillion: 2
      # Same premium meter as digithings.ai, active because occPicker is on.
      costPerWindow:
        usd: 0.0125565
        windowSeconds: 86400
      presets: [auto, reasoning, fast, light]
      showFullList: true
    backend:
      type: digigraph
    # digisearch/digivault reach the model only as the MCP servers below
    # (Help search, Knowledge vault) — no built-in duplicates in the tool list.
    tools:
      allowUserToggle: true
      catalog: []
    # Operator MCP servers stay on the BFF — URLs are never projected to the
    # browser. Zammad rides its `Token token=<x>` scheme as a raw authHeader
    # value (#3841); digigraph treats the dotless `zammad-mcp` name as
    # container-internal DNS (loopback URLs are never dialable, #3879).
    # In production (Cloudflare) the same server runs inside the digichat
    # image and is served via the key-gated digichat Worker route instead:
    # url https://digithings.ai/api/mcp/zammad/mcp,
    # token: <ZAMMAD_EDGE_KEY value>, authHeader: x-digi-mcp-key (tokenEnv
    # cannot resolve the digichat Worker's ZAMMAD_EDGE_KEY secret, which is
    # Worker-scoped and never forwarded to the container, so the value goes in
    # `token` literally; fail-closed 401 without the key).
    mcp:
      allowUserServers: false
      allowAddForm: false
      servers:
        - id: zammad
          url: http://zammad-mcp:8770/mcp
          label: Zammad tickets
          default: true
          tokenEnv: ZAMMAD_API_TOKEN
          authHeader: Authorization
          # Read-only ticket tools. The MCP brake (DIG-284) refuses every tool
          # of a server row without an explicit allowedTools list.
          allowedTools:
            - search_tickets
            - list_tickets
            - get_ticket
            - ticket_report
            - aggregate_tickets
          # All five are read-only; an explicit empty list stops the brake
          # from falling back to allowedTools and asking approval for each read.
          mutatingTools: []
        - id: digisearch
          url: http://digisearch-mcp:8765/mcp
          label: Help search
          default: true
          allowedTools: [semantic, web_search]
          mutatingTools: []
          setup:
            # Docs only. The ticket corpus snapshot was retired in DIG-1380, so there is no second leg to fan out to.
            index_name: occ_help
        - id: digivault
          url: http://digivault-mcp:8769/mcp
          label: Knowledge vault
          default: true
          allowedTools: [search_notes, search_tag, backlinks]
          mutatingTools: []
          setup:
            path_prefix: clients/online-compliance-center
    gate:
      mode: ungated
      activityDetail: labels
      llmAccess: operator
      showByok: false
      showLanguageSelector: true
      # Pins the session: digigraph strips the session_* tools and the client
      # hides MCP server controls (tools.allowUserToggle above still shows
      # the tool toggle). The model picker stays available because
      # models.available is the catalog, not empty. /theme stays available.
      lockSessionControls: true
      webSearch: false
