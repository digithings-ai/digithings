# dashboard-api — central read-only dashboard API (issue #4651).

# Standalone Cloudflare Worker. Contract: `CONTRACT.md` in this directory.
# Dashboard surfaces in `apps/dashboard` become thin renderers over these
# routes and compute nothing locally.
#
# No new public hostname or routes on any domain (human gate) — this worker
# deploys with no custom domain until a follow-up decision.

name = "dashboard-api"
main = "src/index.ts"
compatibility_date = "2026-09-04"
workers_dev = true

# ~10 events/week; logs off to cut noise (cost epic). Re-enable when debugging.
[observability]
enabled = false

[vars]
SUPABASE_URL = "https://rwagjbkvxkdwqmouagad.supabase.co"
# Market-data base for GET /v1/market/closes and /v1/market/tickers (declared in
# config/contract/contract.yaml). Unset means closes resolve to an empty map and
# every mark reads "unavailable" (CONTRACT §6.7, R2-API-only, no Supabase
# fallback). Keep it equal to the dashboard client's NEXT_PUBLIC_MARKET_DATA_URL.
MARKET_DATA_URL = "https://graph.digithings.ai"

# Secrets (wrangler secret put; never commit values):
#   SUPABASE_SERVICE_ROLE_KEY — house-book reads via PostgREST. Lives ONLY in
#   worker secrets. Never in the static bundle, no NEXT_PUBLIC_ service key.

# BEGIN config-contract (generated by scripts/render_config_contract.py — do not hand-edit)
DT_VARIANT = "hosted"
DT_TARGET = "hosted"
DT_BASE_URL = "https://digithings.ai"
# END config-contract
