# LOCAL DEV ONLY — ClickHouse + Redis for Langfuse bring-up on a laptop.
# NOT for production. Production CH/Redis are managed/VM outside Cloudflare
# (see docs/ops/digitrace-langfuse.md). Do not treat this as a CF Container.
#
# Usage (from this directory):
#   docker compose -f docker-compose.local.yml up -d
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7
    ports:
      - "6379:6379"
