# digitrace-ingest — OTLP/HTTP receiver Worker and Queue consumer (ADR-0036, DIG-2657).
#
# One Worker, two entry points:
#   fetch  — POST /v1/traces, the OTLP/HTTP receiver (JSON and protobuf).
#   queue  — the consumer that writes R2, the Supabase index and Analytics Engine.
#
# HUMAN STEPS (prepared here, not performed; ADR-0036 §15):
#   [ ] Confirm the account is on Workers Paid (Queues needs it).
#   [ ] Create the R2 bucket `digitrace-archive`.
#   [ ] Create the Queue `digitrace-ingest` and the dead-letter queue
#       `digitrace-ingest-dlq`. max_retries is set explicitly below.
#   [ ] Create the KV namespace for the ingest tokens and put its id below.
#       Key = sha256 hex of the token; value = {"source": "...", "tenants": [...]}.
#   [ ] Create the Analytics Engine dataset `digitrace_ingest`.
#   [ ] `wrangler secret put CORE_SUPABASE_SERVICE_KEY` (never commit the value).
#   [ ] Attach the custom domain route for trace.digithings.ai and create the DNS
#       record, then approve the production deploy.
#
# The ingest token is NOT a Worker secret: it lives in KV so one namespace holds
# one entry per source, and the KV key is the token's SHA-256 so the store never
# holds a usable credential. Never print a token or a secret value.

name = "digitrace-ingest"
account_id = "ae2ea3eb4ce5f7cc9bec1478f6e60e15"
main = "src/index.ts"
compatibility_date = "2026-09-04"
# Keep workers.dev off: ingest is a public write endpoint under a per-source
# token, and a guessable *.workers.dev front is a second, unmanaged ingress.
# The custom-domain route below is the only intended entry point.
workers_dev = false

[observability]
enabled = true

# Raw OTLP-JSON NDJSON, one object per queue message:
#   tenant=<slug>/date=<YYYY-MM-DD>/<source>/<uuid>.ndjson
# 180-day lifecycle rule is a human step (ADR-0036 §3).
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "digitrace-archive"

# Per-source ingest tokens. Replace the id before the first deploy
# (`wrangler kv namespace create digitrace-ingest-tokens`).
[[kv_namespaces]]
binding = "INGEST_TOKENS"
id = "00000000000000000000000000000000"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "digitrace-ingest"

# The must-fix of the DIG-2664 review: an explicit max_retries and a
# dead-letter queue, so a poison batch lands somewhere inspectable instead of
# retrying for ever or vanishing.
[[queues.consumers]]
queue = "digitrace-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 6
max_retries = 5
dead_letter_queue = "digitrace-ingest-dlq"

# Per-tenant and per-model token, cost and latency aggregates. Fire-and-forget:
# no read-after-write guarantee, sampled by Cloudflare under load (ADR-0036 §3).
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "digitrace_ingest"

[vars]
# The `core` Supabase project. The consumer reaches the index over PostgREST,
# the only precedented Worker-to-Supabase path (ADR-0036 §3); Hyperdrive is
# DIG-2658's decision and is not used here.
SUPABASE_URL = "https://rwagjbkvxkdwqmouagad.supabase.co"

# Secrets (`wrangler secret put`; never commit values):
#   CORE_SUPABASE_SERVICE_KEY — PostgREST service role for the index writes.
#   It bypasses RLS, so the tenant boundary on this path is the
#   application-layer `workspace_id` filter named in ADR-0036 §5.

