<text x="132.0" y="98.0" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="bold">GROUPED BARS — one group per capturing indicator</text>
<text x="840.0" y="116.0" font-size="10" fill="#5f5f5f" text-anchor="middle" font-weight="normal">each bar is that indicator's selected frozen-grid row at that level: height = |separation|, ABOVE the axis = expected polarity (+1), BELOW and hatched = inverted (-1)</text>
<text x="1548.0" y="98.0" font-size="10" fill="#5f5f5f" text-anchor="end" font-weight="normal">window-day share  @15% 0.2234 | @10% 0.3554 | @5% 0.5990</text>
<text x="132.0" y="518.0" font-size="10" fill="#5f5f5f" text-anchor="start" font-weight="normal">only indicators capturing at SOME level are drawn · the circle marks the chosen level's bar · a leg vetoed for a direction flip is labelled [UNSTABLE]</text>
<text x="132.0" y="592.0" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="bold">CAPTURE DEPTH per level — the ranking key</text>
<text x="132.0" y="610.0" font-size="10" fill="#5f5f5f" text-anchor="start" font-weight="normal">summed |separation| of that level's captures. Depth, not headcount, is what the choice is made on; a knife-edge leg cannot hand the decision to a different granularity.</text>
