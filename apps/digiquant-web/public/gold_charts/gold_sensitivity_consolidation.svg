<text x="148.0" y="842.0" font-size="10" fill="#5f5f5f" text-anchor="start" font-weight="normal">expected polarity (+1), trough-high / peak-low</text>
<rect x="449.6" y="833.0" width="11" height="11" fill="url(#hatch-inverted)" stroke="#c62828" stroke-width="1"/>
<text x="465.6" y="842.0" font-size="10" fill="#5f5f5f" text-anchor="start" font-weight="normal">inverted (-1), rich at the bottoms</text>
<text x="132.0" y="862.0" font-size="11" fill="#1c1c1c" text-anchor="start" font-weight="normal">chosen: min_move_pct=15 — the most sensitive granularity the indicators can still capture: finer pin sets are harder scoring targets, so sensitivity</text>
<text x="132.0" y="876.0" font-size="11" fill="#1c1c1c" text-anchor="start" font-weight="normal">is taken as far as the indicator evidence carries it and no further. Among the levels the indicators do carry, the one they carry DEEPLY wins,</text>
<text x="132.0" y="890.0" font-size="11" fill="#1c1c1c" text-anchor="start" font-weight="normal">because headcount cannot tell a vote held from conviction from one held by 0.0042</text>
<text x="132.0" y="908.0" font-size="10" fill="#5f5f5f" text-anchor="start" font-weight="normal">direction_unstable: none — every fitting leg reads the same way at every level it clears the bar at (a flip would be vetoed)</text>
<rect x="132" y="918.0" width="1416" height="252" fill="#fbfbfb" stroke="#dcdcdc"/>
<text x="144.0" y="940.0" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="bold">HOW TO READ THIS</text>
<circle cx="150.0" cy="956.0" r="2.4" fill="#1c1c1c"/>
<text x="162.0" y="960.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">Grid-row selection maximises |separation| (ties to the shorter window), so an indicator's direction is FITTED from the sign of its</text>
<text x="162.0" y="974.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">winning row, never imposed.</text>
<circle cx="150.0" cy="988.0" r="2.4" fill="#1c1c1c"/>
<text x="162.0" y="992.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">A row CAPTURES a level iff |separation| &gt;= the bar AND neither window side's mean is inside the +/-0.06 dead zone. abs() is applied</text>
<text x="162.0" y="1006.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">to the bar — a mirrored leg is recorded, not refused.</text>
<circle cx="150.0" cy="1020.0" r="2.4" fill="#1c1c1c"/>
<text x="162.0" y="1024.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">DIRECTION STABILITY (veto): a leg capturing at more than one level must carry the same fitted direction at each; a flip is flagged</text>
<text x="162.0" y="1038.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">direction_unstable, captures nowhere, and is recorded as evidence. A single-level capture carries no such obligation.</text>
<circle cx="150.0" cy="1052.0" r="2.4" fill="#1c1c1c"/>
<text x="162.0" y="1056.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">A level QUALIFIES iff its capture count loses nothing against EVERY coarser level; among qualifiers the largest capture DEPTH wins,</text>
<text x="162.0" y="1070.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal">ties to the coarser rung.</text>
<text x="144.0" y="1096.0" font-size="10" fill="#5f5f5f" text-anchor="start" font-weight="normal">Detector turns -&gt; ±45d cycle windows. A SCORING TARGET only: no exposure floor, no execution period, no perfect-strategy oracle.</text>
<rect x="144" y="1118" width="1392" height="42" fill="#ffffff" stroke="#c62828" stroke-width="1.4"/>
<text x="154.0" y="1134.0" font-size="11" fill="#1c1c1c" text-anchor="start" font-weight="bold">IN-SAMPLE — scoring target only, NOT a performance claim. Every separation is fit against the same detected turns it is measured on, at every bar with</text>
<text x="154.0" y="1149.0" font-size="10" fill="#1c1c1c" text-anchor="start" font-weight="normal"> a valid z. This calibrates indicator windows to detected history; it is NOT out-of-sample predictive skill, the holdout stays spent, and no return / Sharpe / trade count is claimed anywhere here.</text>
