[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# NOTE: Do NOT use stdout_logfile=/dev/stdout under Cloudflare Firecracker —
# supervisord gets ENXIO ("unknown error making dispatchers") and never starts
# programs. Log to files under /var/log/supervisor instead.

# --- Edge ports first (Cloudflare probes :8000; digichat needs :8005) ---

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
autostart=true
autorestart=true
priority=10
startsecs=1
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# SearXNG metasearch — the in-stack PRIMARY backend for digisearch web_search
# (#4297). Loopback-only; granian/wsgi mirrors the upstream searxng dist image
# (GRANIAN_* env), and the copied /etc/searxng/settings.yml is the same file
# docker-compose.yml mounts for the dev searxng sidecar. Started after redis
# (priority 10), which backs searxng's limiter via the `valkey` host alias that
# entrypoint.sh points at 127.0.0.1 — and before digisearch (priority 40).
[program:searxng]
command=/usr/local/searxng/.venv/bin/granian searx.webapp:app
directory=/usr/local/searxng
environment=GRANIAN_INTERFACE="wsgi",GRANIAN_HOST="127.0.0.1",GRANIAN_PORT="8080",GRANIAN_WEBSOCKETS="false",GRANIAN_BLOCKING_THREADS="4",GRANIAN_PROCESS_NAME="searxng",SEARXNG_SETTINGS_PATH="/etc/searxng/settings.yml"
autostart=true
autorestart=true
priority=15
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/searxng.log
stderr_logfile=/var/log/supervisor/searxng.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:digikey]
command=/bin/sh /start_digikey.sh
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/digikey.log
stderr_logfile=/var/log/supervisor/digikey.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:digigraph]
command=uvicorn digigraph.server:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=25
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/digigraph.log
stderr_logfile=/var/log/supervisor/digigraph.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# Seed Chroma once per volume while digisearch is not yet holding the DB.
# digithings_docs (digithings.ai/chat) + occ_help (digithings.ai/chat/occ).
[program:seed_chroma]
command=/bin/sh /seed_chroma.sh
directory=/app
autostart=true
autorestart=false
priority=30
startsecs=0
startretries=1
stdout_logfile=/var/log/supervisor/seed_chroma.log
stderr_logfile=/var/log/supervisor/seed_chroma.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# --- Loopback-only services (after edge + seed) ---

[program:digivault]
command=uvicorn digivault.server:app --host 127.0.0.1 --port 8004
directory=/app
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/var/log/supervisor/digivault.log
stderr_logfile=/var/log/supervisor/digivault.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:digisearch]
command=/bin/sh /start_digisearch.sh
directory=/app
# Explicit, not defaulted: searxng :8080 is the PRIMARY web-search backend
# (started above at priority 15); the ddgs scrape is only the secondary (#4297).
environment=DIGISEARCH_SEARXNG_URL="http://127.0.0.1:8080"
autostart=true
autorestart=true
priority=40
startsecs=3
stdout_logfile=/var/log/supervisor/digisearch.log
stderr_logfile=/var/log/supervisor/digisearch.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:digisearch-mcp]
command=python -m digisearch.cli mcp --port 8765
environment=DIGISEARCH_MCP_HOST="0.0.0.0",DIGISEARCH_SEARXNG_URL="http://127.0.0.1:8080"
directory=/app
autostart=true
autorestart=true
priority=45
startsecs=3
stdout_logfile=/var/log/supervisor/digisearch-mcp.log
stderr_logfile=/var/log/supervisor/digisearch-mcp.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:digivault-mcp]
command=python -m digivault.mcp_server --port 8769 --host 0.0.0.0
directory=/app
autostart=true
autorestart=true
priority=45
startsecs=2
stdout_logfile=/var/log/supervisor/digivault-mcp.log
stderr_logfile=/var/log/supervisor/digivault-mcp.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:digigraph-mcp]
command=python -m digigraph.mcp_server --port 8766
directory=/app
autostart=true
autorestart=true
priority=46
startsecs=3
environment=DIGI_ENABLE_THREAD_API="1",DIGI_MCP_REQUIRE_AUTH="1",DIGIKEY_JWKS_URL="http://127.0.0.1:8005/.well-known/jwks.json",OPENAI_API_BASE="http://127.0.0.1:4000/v1"
stdout_logfile=/var/log/supervisor/digigraph-mcp.log
stderr_logfile=/var/log/supervisor/digigraph-mcp.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# Read-only Zammad helpdesk MCP for the OCC embed (ticket search/get/report).
# digigraph dials the dotless name `zammad-mcp` (remote-MCP guard, #3879);
# entrypoint.sh aliases that name to this container's IP before supervisord
# starts. Bind 0.0.0.0 so the alias resolves; nothing exposes :8770 publicly.
[program:zammad-mcp]
command=python -m scripts.zammad_mcp.server --port 8770
directory=/app
autostart=true
autorestart=true
priority=45
startsecs=3
environment=ZAMMAD_MCP_HOST="0.0.0.0",ZAMMAD_MCP_ALLOWED_HOSTS="zammad-mcp"
stdout_logfile=/var/log/supervisor/zammad-mcp.log
stderr_logfile=/var/log/supervisor/zammad-mcp.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:litellm]
command=litellm --config %(ENV_LITELLM_CONFIG)s --port 4000 --host 127.0.0.1
directory=/app
autostart=true
autorestart=true
priority=50
startsecs=5
stdout_logfile=/var/log/supervisor/litellm.log
stderr_logfile=/var/log/supervisor/litellm.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
