# digithings Profile A stack on Cloudflare Containers (Workers Paid).
# One multi-process Container: digikey + digigraph + digisearch + digivault + LiteLLM.
# Public hostnames (auth still required on APIs):
#   graph.digithings.ai  → digigraph   :8000
#   key.digithings.ai    → digikey     :8005
#   search.digithings.ai → digisearch  :8002  (digikey JWT `digisearch:query`)
# digivault / LiteLLM stay loopback-only inside the Container.
#
# HUMAN GATE — infra/network: these hostnames expose digigraph + digikey +
# digisearch to the public internet (JWT/BFF still required). The search route
# is a new external route, owner-approved for CI web grounding (#4063).
# Secrets via `wrangler secret put` only.
name = "digithings-stack"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# Public *.workers.dev endpoint disabled — it fronted digigraph:8000 / digikey on a
# guessable hostname alongside the intended custom domains. Reach the stack only
# through the custom-domain routes below.
workers_dev = false

# Workers Logs (free at this volume — Workers Paid includes 20M events/mo).
# Enabled so container wake frequency is measurable; full sampling is fine at
# ~4.6k requests/week.
[observability]
enabled = true

# Read-only market data (#4013 Task 8): same digithings-archive bucket the
# Python store writes (see the R2_BUCKET secret note below). The Worker serves
# /v1/market/* from it directly — no container hop, no writes.
[[r2_buckets]]
binding = "MARKET_DATA"
bucket_name = "digithings-archive"

# Custom domains — the only ingress. Verify /healthz on each after deploy.
# Human gate: public digigraph + digikey + digisearch; JWT/BFF still required
# on APIs. Auth-exempt on each host is only the shared service allowlist
# (/health, /healthz, /metrics, /docs, /redoc, /openapi.json, OPTIONS
# preflights) plus the Worker-served /_stack/meta and /v1/market/tickers|closes,
# and /_stack/key/* which proxies to digikey. /_stack/mcp/* is not
# auth-exempt: it is key-gated (x-digi-mcp-key vs the MCP_EDGE_KEY secret,
# fail-closed 401).
[[routes]]
pattern = "graph.digithings.ai"
zone_name = "digithings.ai"
custom_domain = true

[[routes]]
pattern = "key.digithings.ai"
zone_name = "digithings.ai"
custom_domain = true

# Hosted digisearch (#4063 — new external route, owner-approved): the CI book
# pipeline's web grounding calls digisearch's POST /v1/orchestrator_invoke with
# a digikey JWT scoped `digisearch:query`, enforced per path by digisearch's
# DigiAuthMiddleware (digisearch_path_scopes). Auth-exempt is only the shared
# service allowlist — /health, /healthz, /metrics, /docs, /redoc,
# /openapi.json — plus OPTIONS preflights (CORS is enforced separately);
# everything else (/query, /ingest, /v1/*) needs a scoped JWT. The in-container
# base stays http://127.0.0.1:8002 for digigraph, and digisearch binds
# 0.0.0.0:8002 (container/start_digisearch.sh) so the Worker can proxy to the
# container network address — a loopback-only bind is unreachable (#4071).
# Declared here like graph/key; `wrangler deploy` provisions the custom domain.
[[routes]]
pattern = "search.digithings.ai"
zone_name = "digithings.ai"
custom_domain = true

# HUMAN GATE — infra/network: mcp.digithings.ai exposes the digiquant-mcp
# market-data tools to the public internet, and those tools are unauthenticated
# localhost today. Enable this route ONLY together with Worker-edge digikey JWT
# enforcement (scope `digiquant:backtest`, see digiquant/ARCHITECTURE.md § MCP
# hosting). Until then the MCP container answers only on the custom-domain route
# once enabled with that gate — there is deliberately no workers.dev forwarding
# route (an unauthenticated /_stack/mcp/* forwarder must not ship).
# [[routes]]
# pattern = "mcp.digithings.ai"
# zone_name = "digithings.ai"
# custom_domain = true

# The digichat product surface is deliberately NOT served from this Worker.
# Decision (Chris, 2026-10-19): OCC is client work and must not ride the base
# digithings platform. Every digithings.ai digichat path (embed, api/chat,
# api/embed, api/byok, api/plan-proof, api/health, _dtchat, chat/occ) is owned
# by apps/digichat-cloudflare / the `digithings-digichat` Worker and its own
# container. The earlier fold (cost epic, #5411) moved those routes here to
# idle a duplicate container; that mixed the client surface into the base tool,
# so it was dropped. This Worker serves ONLY its own custom domains below.
#
# Consequence: a deploy of this Worker no longer claims any digithings.ai path,
# which is what made every stack deploy fail with
# `Can't deploy routes that are assigned to another worker`.

[[containers]]
class_name = "DigiStackContainer"
# `image` and `image_build_context` resolve relative to THIS config file's
# directory. Wrangler defaults the container build context to the Dockerfile's
# own directory (`dirname(image)`); pinned to the monorepo root explicitly so
# the COPY digibase/ / digikey/ / ... lines can never drift to a narrower
# context (#4046).
image = "../../infra/docker/Dockerfile.digithings-stack-cloudflare"
image_build_context = "../.."
# Cost minimum (Cloudflare cost epic): one replica; traffic is ~2k req/day.
max_instances = 1
# Multi-process Profile A needs real RAM/disk (lite = 256MiB is far too small).
# standard-1 = 4 GiB (was standard-2, 6 GiB). Memory is billed per GiB-s.
# Verify container RSS stays under ~3 GiB after deploy; revert to standard-2 if OOM.
instance_type = "standard-1"

# Dedicated digiquant-mcp market-data container (#3780, Task 8). Separate image
# with the [research]+[mcp] extras serving FastMCP streamable-http on :8767 —
# never the backtest engine, never part of the Profile A image above.
# Single replica by design (max_instances = 1 + one pinned Durable Object id
# MCP_CONTAINER_ID in src/ports.ts): the MCP read path assumes a single replica
# (in-memory 900s TTL keyed by as_of + manifest version).
# Cold-start policy: sleepAfter = "3m" on the class in src/index.ts. A cold
# start pays only the FastMCP import, never a data load (R2 is the cache); the
# daily market-data-refresh cron keeps R2 fresh and never touches the container.
# Once the custom-domain route is enabled it can be pinged manually:
#   curl -sS https://mcp.digithings.ai/mcp -H 'Accept: application/json'
# Egress verified 2026-09-10: query1.finance.yahoo.com reachable (HTTP 429 =
# Yahoo rate-limit, i.e. egress works; same retry/backoff as the cron applies),
# api.stlouisfed.org reachable (HTTP 301 to the API docs).
[[containers]]
class_name = "DigiQuantMcpContainer"
# Build context MUST be the monorepo root. Wrangler's default is the
# Dockerfile's directory (digiquant/), where `COPY digibase/...`,
# `COPY digikey/...`, `COPY digiquant/...` fail with "failed to calculate
# checksum ... not found" (CI run 34863926273, #4046). Resolved relative to
# this config file: ../.. is the repo root.
image = "../../digiquant/Dockerfile.mcp"
image_build_context = "../.."
max_instances = 1
# FastMCP read path over R2; standard-1 (4 GiB) for cost. p50/p99 budget was set
# on standard-2 — re-check latency after deploy.
instance_type = "standard-1"

# The folded DigiChatContainer is GONE from this Worker (Chris, 2026-10-19):
# the digichat product (and OCC, one of its tenants) runs only in
# apps/digichat-cloudflare on the `digithings-digichat` Worker's own container.
# The container app that used to back this class
# (digithings-stack-digichatcontainer) is deleted; the class, its Durable
# Object binding and the digichat image COPY/untar in
# infra/docker/Dockerfile.digithings-stack-cloudflare are removed with it.

# Ops SSH debug key removed (cost/hygiene epic). Re-add [[containers.authorized_keys]]
# temporarily only for a live debugging session.

[[durable_objects.bindings]]
name = "STACK"
class_name = "DigiStackContainer"

[[durable_objects.bindings]]
name = "MCP_STACK"
class_name = "DigiQuantMcpContainer"

# v3 (DigiChatContainer) is left in the migration history deliberately: the DO
# namespace it created is unbound now, and rewriting an applied migration tag
# is not a supported operation.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DigiStackContainer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DigiQuantMcpContainer"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DigiChatContainer"]

# v4 completes the fold: the live Worker still holds a Durable Object instance of
# the folded class, and Cloudflare refuses a script that no longer exports it
# (error 10064). The namespace was unbound by the fold, so those instances are
# orphans; deleting them is what the fold means. Tags are never rewritten.
[[migrations]]
tag = "v4"
deleted_classes = ["DigiChatContainer"]

# Secrets (wrangler secret put) — never commit values:
#   DIGIKEY_BFF_TOKEN
#   DIGIKEY_PRIVATE_KEY_PEM   # stable RS256; do not use ephemeral in prod
#   DIGIKEY_ADMIN_TOKEN       # optional; for key issue / ops
#   DIGIKEY_DATABASE_URL      # REQUIRED. Durable Postgres/Supabase URL for API
#                             # keys + revocation state. There is no fallback --
#                             # the instance's /data is ephemeral, so digikey
#                             # refuses to start rather than silently losing every
#                             # issued key (#4080). A bare postgresql:// URL is
#                             # accepted (routed to psycopg 3).
#   GROQ_API_KEY / OPENROUTER_API_KEY / OPENAI_API_KEY  (as needed by LiteLLM)
#   CHEAPERINFERENCE_API_KEY  # house default digillm upstream when set
#   CHEAPERINFERENCE_API_BASE # optional; default https://api.cheaperinference.com/v1
#   DIGI_HOUSE_UPSTREAM       # optional; set "openrouter" to force OpenRouter
#   LITELLM_PROXY_API_KEY     # optional shared proxy key
#   GLOOMBERB_SESSION_COOKIE  # digiquant-mcp session-gated digifetch tools (#4260)
#   R2_ACCOUNT_ID             # digiquant-mcp market-data history reads
#   R2_BUCKET                 # digiquant-mcp (same digithings-archive bucket)
#   R2_ACCESS_KEY_ID          # digiquant-mcp
#   R2_SECRET_ACCESS_KEY      # digiquant-mcp
#   CLOUDFLARE_ACCOUNT_ID     # Cloudflare account id owning both the Vectorize indexes and
#                             # the D1 databases -- canonical name (wrangler's own convention,
#                             # #2239 credential rename: Vectorize and D1 share one account).
#   CLOUDFLARE_API_TOKEN      # Token for both Vectorize and D1 access (same account, same
#                             # token). For D1 access via D1Store.query() (POST
#                             # .../d1/database/{id}/query, digivault/src/digivault/d1_store.py)
#                             # -- confirm the token's scope actually authorizes that POST
#                             # before relying on it; if not, use a token with D1 write/edit
#                             # scope instead.
#   D1_DATABASE_MAP           # {"clients/digithings":"<id>","clients/online-compliance-center":"<id>"}
#
# TRAP -- CLOUDFLARE_API_TOKEN is ALSO wrangler's own authentication variable.
# Sourcing .env before running wrangler (`set -a; . ../../.env; set +a`) exports it,
# wrangler then stops using your `wrangler login` OAuth session and authenticates as
# that token instead. Since this token carries only Vectorize + D1 permissions and not
# Workers, every `wrangler secret put` / `wrangler deploy` fails with:
#
#   A request to the Cloudflare API (/accounts/<id>/workers/scripts/...) failed.
#   Authentication error [code: 10000]
#
# which reads like a broken token but is actually the wrong identity. Unset it for
# wrangler's own process; the secret VALUE still reaches it on stdin, which is a
# separate channel from the environment:
#
#   printf '%s' "$VALUE" | env -u CLOUDFLARE_API_TOKEN npx wrangler secret put NAME
#
# Keep CLOUDFLARE_ACCOUNT_ID exported -- wrangler uses it to pick the account, and
# without it the fallback lookup needs a User->Memberships scope this token lacks.
#
# Legacy (still read as a fallback by the container's Python side -- see
# digivault/src/digivault/server.py's _d1_credentials and
# digisearch/src/digisearch/search/_stub.py's _first_env -- so this rename is
# zero-downtime; safe to delete once CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN
# are set and verified working):
#   VECTORIZE_ACCOUNT_ID
#   VECTORIZE_API_TOKEN
#   D1_ACCOUNT_ID
#   D1_API_TOKEN
#
# After deploy, retarget digichat Worker secrets:
#   DIGIGRAPH_INTERNAL_URL=https://graph.digithings.ai
#   DIGIKEY_URL=https://key.digithings.ai
#   DIGIKEY_BFF_TOKEN=<same as stack>
# Folded digichat (#4689): the stack worker's own DIGICHAT binding needs the
# same secrets (wrangler secret put on THIS worker) — the standalone worker
# stays deployed until cutover, so set both until then:
#   AUTH_SECRET                    # same value as the standalone digichat worker
#   DIGICHAT_EMBED_TENANTS         # digithings + occ JSON — see apps/digichat-cloudflare/README
#   DIGIGRAPH_INTERNAL_URL=https://graph.digithings.ai
#   DIGIKEY_URL=https://key.digithings.ai
#   DIGIKEY_BFF_TOKEN=<same as stack>
#   DIGICHAT_PLAN_PROOF_SECRET
#   (deleted post-#4700: DIGICHAT_DASHBOARD_SUPABASE_URL/_ANON_KEY collapse to
#   canonical SUPABASE_URL ([vars] above) + SUPABASE_ANON_KEY secret via the
#   index.ts fallback chain — do not re-add)
# (DIGICHAT_DATABASE_URL stays intentionally unset: the Cloudflare deployment
# is DB-less, same as the standalone worker — see apps/digichat-cloudflare/wrangler.toml.)

# Tenant/client configuration. Chris ruling 2026-10-15 01:26: tenant configs live in
# Cloudflare KV only, never as repo files. The namespace already exists, so this adds
# no Cloudflare resource and needs no new binding grant; key layout is Counsel's
# (DIG-3567).
# BOUND BUT INERT: readTenantConfig() is not yet called from src/index.ts, so nothing
# reads this binding at runtime today. See src/tenant-config.ts and DIG-3699.
# The account resource id lives HERE and never in config/contract/ -- an account id is
# not a reproducible config value (DIG-3699 ruling element 1).
[[kv_namespaces]]
binding = "TENANT_CONFIG"
id = "361b710bee56466097053275404535ba"

[vars]
# Canonical Supabase project ref (#4700): public value, same as the standalone
# dashboard-api worker's [vars]; doubles as the fallback source for the legacy
# DIGICHAT_DASHBOARD_SUPABASE_URL forward (post-deploy the old secret is deleted).
SUPABASE_URL = "https://rwagjbkvxkdwqmouagad.supabase.co"
DIGIKEY_ISSUER = "https://key.digithings.ai"
DIGIKEY_AUDIENCE = "digi-ecosystem"
DIGIKEY_ALLOW_EPHEMERAL_KEY = "0"
DIGIKEY_ALLOW_DEV_GLOBAL = "0"
DIGIVAULT_URL = "http://127.0.0.1:8004"
DIGISEARCH_URL = "http://127.0.0.1:8002"
# Chat-only Profile A — digiquant / digitrace HTTP are not in this Container.
DIGIQUANT_URL = ""
DIGITRACE_URL = ""
# #4053: containers must read the R2 market seam — 127 drops the Supabase tables.
DIGIQUANT_MARKET_DATA_BACKEND = "r2"
OPENAI_API_BASE = "http://127.0.0.1:4000/v1"
# DIGI_CONFIG_PATH / DIGI_PROJECT_CONFIG / DIGI_WORKFLOW_PROFILE / DIGI_ALLOWED_TOOLS are
# deliberately NOT set here: src/index.ts forwards an explicit envVars whitelist and does
# not include them, so container/entrypoint.sh's defaults are the live values. Setting them
# here would be inert (and the old DIGI_ALLOWED_TOOLS value here was stale vs that default).
DIGI_LLM_MODE = "test"
CHROMA_PATH = "/data/chroma"
DIGIVAULT_ROOT = "/data/vault"
# DIGIKEY_DATABASE_URL is deliberately NOT a var: a connection URL carries a
# password, and the Container's /data is ephemeral -- a fallback would lose every
# issued API key and the JWT revocation blocklist on the next instance replace
# (#4080). It is required: set it with
# `npx wrangler secret put DIGIKEY_DATABASE_URL` (see the secrets list above), or
# digikey refuses to start.
DIGISEARCH_INDEX = "digithings_docs"
# All indexes (docs + tickets, all tenants) embed with this model id (#4756).
# Same 384 dims across models: ingest, backfill, and query must agree on
# exactly this value or retrieval silently misses.
DIGISEARCH_EMBEDDING_PROVIDER = "Xenova/paraphrase-multilingual-MiniLM-L12-v2"
# Per-index bge-m3 override (DIG-4657): the indexes listed here are queried with
# Cloudflare Workers AI @cf/baai/bge-m3 (1024 dims) instead of the global
# 384-dim provider above. Every listed index must also be WRITTEN with bge-m3
# (the corpus-index worker writes those with bge-m3) -- a 384-dim query vector
# against a 1024-dim index matches nothing. Unset means every index keeps the
# default provider. The list is forwarded to the digisearch container by
# src/index.ts; digisearch reads it per query (search/_stub.py).
DIGISEARCH_WORKERS_AI_INDEXES = "occ-tickets"
# Folded digichat (#4689) non-secret defaults — same values as the standalone
# digichat worker's [vars] (apps/digichat-cloudflare/wrangler.toml). Secrets
# (above) land via `wrangler secret put`; nothing secret ships here.
DIGICHAT_REQUIRE_ROOT_AUTH = "0"
DIGICHAT_EMBED_HOSTS = "digithings.ai,www.digithings.ai,occ.digithings.ai,digiquant.io,www.digiquant.io"
# Profile A: digisearch/digivault are loopback inside the stack container;
# digichat only talks to digigraph (+ digikey for bff_session).
DIGICHAT_ENABLED_SERVICES = "digigraph"
# Session model picker (OCC settings): the house-upstream slugs a visitor may
# pick per session. digigraph binds X-Digi-House-Model only for a slug on this
# list (digigraph/src/digigraph/model_config.py); BYOK is unaffected.
DIGI_SESSION_MODEL_ALLOWLIST = "deepseek/deepseek-v4.1-flash-1017,deepseek/deepseek-v4.1-flash,deepseek/deepseek-v4-flash,deepseek/deepseek-v4-flash-0731,deepseek/deepseek-v4-flash-0731-fast,deepseek/deepseek-v3.1,deepseek/deepseek-v3.2,deepseek/deepseek-v4-pro,deepseek/deepseek-v4-pro-0813,deepseek/deepseek-r1-0528,deepseek/deepseek-r1,openai/gpt-oss-120b,openai/gpt-6-luna,openai/gpt-5.6-luna,openai/gpt-5-mini,openai/gpt-5.6-sol,google/gemma-4-31b-it,google/gemini-3.1-flash-lite,google/gemini-3.7-flash,z-ai/glm-4.7-flash,z-ai/glm-5.3-flash,qwen/qwen3.8-flash,xiaomi/mimo-v2.6-flash,minimax/minimax-m3,openrouter/auto"
# Defense-in-depth corpus map (headers from digichat still win).
DIGI_TENANT_CORPUS_MAP = "{\"digithings\": {\"digisearchIndex\": \"digithings_docs\", \"vaultPathPrefix\": \"clients/digithings\"}, \"occ\": {\"digisearchIndex\": \"occ_help\", \"vaultPathPrefix\": \"clients/online-compliance-center\", \"researchSystemPrompt\": \"You are the Online Compliance Center (OCC) help assistant for digithings.ai/chat/occ.\\nAnswer only from what you retrieve. You get several tool rounds per question.\\n\\nGround every answer in retrieved corpus from Help search (digisearch, index `occ_help`, help docs)\\nand/or Knowledge vault (digivault_search_notes, digivault_search_tag, digivault_backlinks) under `clients/online-compliance-center/`.\\nAlways cite help article URLs or PDF source paths from metadata.\\n\\nSearch results are excerpts, not whole documents. A row marked \\\"truncated\\\": true\\nmeans you have not seen that note \\u2014 run digivault_search_notes again with a narrower query\\naimed at that note (same path prefix) until you have read the part that answers, before answering. An unmarked row is not a promise of completeness:\\nevery row is a preview. Always do this when the question involves a\\nprocedure, a list of steps, a table, a count, or the words every, all, or which:\\nhelp PDFs are stored one page per note, and an excerpt routinely stops before the\\nstep that answers the question.\\n\\nNever say a policy, step, or exception does not exist unless you searched for it\\nspecifically and looked. If all you saw was a truncated excerpt, say what it showed and that the\\nrest was not loaded.\\n\\nAnswer questions about OCC policies, procedures, FAQ topics, and public help\\nPDFs. Do not invent product features, pricing, or portal capabilities not\\npresent in the retrieved sources. E-learning / YouTube videos are out of\\nscope for this corpus \\u2014 say so if asked.\\n\\nDo not cite digithings or digiquant internal architecture docs. If the\\ncorpus has no grounded answer, say so clearly.\\n\\nChoosing a search tool: use digisearch with index `occ_help` for how-to questions, features, settings, manuals and any policy or procedure question. The help corpus does not contain support tickets; for live ticket lists, counts, status or details use the read-only zammad tools, and say so clearly when they do not ground the answer.\\n\\nLanguage of shown terms: the chat language is the language the user writes in (or the response language set for this chat). Whenever your answer, or your description of what you searched, shows any word in a different language from the chat language (search queries you ran, ticket statuses or labels, ticket or article titles, UI terms, error messages, quoted snippets from tickets or docs), give the translation in the chat language every time: translated term first, then the original in parentheses and quotes, for example: in progress (\\\"in Bearbeitung\\\"), or: I searched for mailbox (\\\"Postfach\\\"). This applies to every non-chat-language word or phrase you show, including inside lists and tables. Do not add a translation when the source text is already in the chat language.\\n\\nSkills: for any ticket question, first call list_skills, then get_skill for the matching workflow (summarize-tickets-by-topic for themes and grouping, find-precedent-tickets for how a similar issue was solved) and follow it. For a how-to or documentation question, get_skill guide-help-docs and follow its map. Always get_skill present-results before writing the final answer and follow its display rules.\\n\\nCitations: there is no automatic source list. When you use retrieved content, cite it inline in the answer: put a markdown link on the relevant words when the source has an http(s) URL (for example [activation steps](https://help.online-compliance-center.com/...)), otherwise add a short reference in parentheses, such as (Portal manual, 2.2) or (ticket #28394). Only http(s) URLs may be links: never put repo://, vault paths or other non-web paths inside a markdown link. Do not add a separate Sources section or list.\\n\\nIdentity: you are the digichat assistant for Online Compliance Center. Do not claim to be Claude, GPT, DeepSeek or any other named model or vendor; if asked which model you run on, say you are the digichat assistant and that the model is managed by the operator.\",\"lockSessionControls\":true}}"

# Market-data base for GET /v1/market/closes and /v1/market/tickers (declared in
# config/contract/contract.yaml). The standalone dashboard-api worker already
# carries this var; the fold (#4689) forwards the worker env verbatim and this key
# was missed, so the embedded dashboard-api resolved relative URLs, got no universe,
# and served /benchmarks with every series empty. Unset means closes resolve to an
# empty map (CONTRACT §6.7, R2-API-only, no Supabase fallback). Keep it equal to the
# dashboard client's NEXT_PUBLIC_MARKET_DATA_URL.
MARKET_DATA_URL = "https://graph.digithings.ai"

# BEGIN config-contract (generated by scripts/render_config_contract.py — do not hand-edit)
DT_VARIANT = "hosted"
DT_TARGET = "hosted"
DT_BASE_URL = "https://digithings.ai"
# END config-contract
