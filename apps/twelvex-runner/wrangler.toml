# twelvex-runner — on-demand container for twelve-x ingest + session heartbeat.
# No public hostname. digithings-cron calls this Worker through the
# TWELVEX_RUNNER service binding. The container starts per request and
# sleeps after 2m (see src/runner.ts). It is not always-on.
#
# Do not deploy this Worker until the DevOps Lead checks it off.
# GitHub workflows stay scheduled through digithings-cron until this
# container has completed each job once. GITHUB_OVERRIDE_JOBS on
# digithings-cron flips a job id back to workflow_dispatch.
#
# Secrets (wrangler secret put; never commit values). Unset CLOUDFLARE_API_TOKEN
# in the shell first — it is also wrangler's own auth var:
#   printf '%s' "$VALUE" | env -u CLOUDFLARE_API_TOKEN npx wrangler secret put NAME
#
#   RUNNER_AUTH_TOKEN            — Bearer on POST /run/*; the value digithings-cron
#                                  sends as its TWELVEX_RUNNER_AUTH secret
#   GH_ISSUES_TOKEN              — Issues read/write on digithings-ai/twelve-x only
#   PRIMEMARKET_SESSION_TOKEN    — desk session, forwarded into the container
#   TWELVEX_SUPABASE_SERVICE_KEY — ingest writes, forwarded into the container
#   TWELVEX_SUPABASE_URL         — optional; twelve-x has a code default
#
# Required by the FX research session route (route "session", the asia,
# london and new_york clocks). The session runs twelve_x.graph, which calls
# the model and writes the shared core calendar, so it needs:
#
#   CHEAPERINFERENCE_API_KEY  — the model key, forwarded into the container as
#                               OPENAI_API_KEY
#   CORE_SUPABASE_SERVICE_KEY — the shared core calendar writes
#
# OPENAI_API_BASE is not a secret. It is the model endpoint the house path
# uses, and it is a plain var below with the same literal the twelve-x
# workflow job env carries.
#
# Cutover flag (DIG-2887 S2), optional plain var, unset = "1":
#   TWELVEX_FORWARD_CORE_KEY = "0" stops forwarding CORE_SUPABASE_SERVICE_KEY.
#   Leave it unset until the twelve-x graph no longer writes the core calendar;
#   the pinned graph refuses to start without the key.
#
# twelve-x data API (moved here from the retired digidata-api Worker, S2):
#   DATA_API_TOKEN  -- secret; bearer on /v1/* (not RUNNER_AUTH_TOKEN)
#   DATA_BACKEND    -- optional plain var; "supabase" (default, uses the
#                      TWELVEX_SUPABASE_* secrets above) | "d1" (TWELVEX_DB)
#
# Not required for the ingest and heartbeat jobs (checked against the
# workflow env blocks and twelve_x market_context / heartbeat): TWELVEX_R2_*,
# SUPABASE_DB_URL. Ingest writes Supabase. It does not call an LLM and it
# does not write R2.
name = "twelvex-runner"
account_id = "ae2ea3eb4ce5f7cc9bec1478f6e60e15"
main = "src/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[vars]
DRY_RUN = "0"
# The model endpoint the house path uses. Same literal as the twelve-x
# workflow job env (daily_run_reusable.yml). A public URL, not a secret.
OPENAI_API_BASE = "https://api.cheaperinference.com/v1"

[[containers]]
class_name = "TwelveXRunnerContainer"
image = "../../infra/docker/Dockerfile.twelvex-runner"
image_build_context = "../.."
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "TWELVEX_CONTAINER"
class_name = "TwelveXRunnerContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TwelveXRunnerContainer"]

# twelve-x's own D1 database (DIG-2887 S2). This Worker is the only one that
# binds twelve-x data, and it binds nothing of core.
# PLACEHOLDER database_id: `wrangler d1 create twelvex` needs Chris's go, then
# replace the id. Do not deploy this Worker while the id is all zeros.
[[d1_databases]]
binding = "TWELVEX_DB"
database_name = "twelvex"
database_id = "00000000-0000-0000-0000-00000000d1a1"
migrations_dir = "d1/twelvex"
