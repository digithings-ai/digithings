# digithings digichat on Cloudflare Containers (Workers Paid).
# One Container serves digithings + OCC (and future) tenants via DIGICHAT_EMBED_TENANTS.
# Deploy from this directory; image builds from monorepo-root Dockerfile.
name = "digithings-digichat"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# DIG-3585: no *.workers.dev hostname. The zone routes below are the only way
# in, so the edge gates (OCC invite, MCP edge key) cannot be reached on a
# second hostname. Nothing in the repo uses the workers.dev URL. Takes effect
# on the next deploy.
workers_dev = false

# Workers Logs (free at this volume — Workers Paid includes 20M events/mo).
# Enabled so container wake frequency is measurable; full sampling is fine at
# ~4.6k requests/week.
[observability]
enabled = true
# The OCC invite link carries its key as ?token= on its first hit. On
# /chat/occ the edge swaps it for a cookie and 302s to the clean address
# before any app code logs or proxies it; the legacy /embed?host=...&token=
# door still hands the URL on, and the app does not log request URLs. The
# platform's invocation log, however, records the request URL itself, so
# query strings are dropped from this Worker's logs and traces (the repo's
# wrangler 4.133 pin validates the key). Pinned in occ-route.contract.test.ts.
redact_query_string = true

# ROUTE OWNERSHIP (this file owns the digichat surface; the 2026-10-18
# "ROUTE HOLD" note is retired — DIG-5121, 2026-10-22).
#
# That note said the zone routes had been folded into digithings-stack in code
# (cost epic: one DigiChat container, not two) and that the seven routes below
# would MOVE there once that cutover was deployed. The fold is dead: every
# digithings.ai digichat path — embed, api/chat, api/embed, api/byok,
# api/plan-proof, api/health, _dtchat, chat/occ and now chat* — is owned by
# THIS Worker and its one shared container. The stack Worker serves only its
# own custom domains (graph/key/search), which is what ended every stack deploy
# failing with `Can't deploy routes that are assigned to another worker`.
#
# Superseded rationale (2026-10-19 → 2026-10-27, DIG-3585): this note used to
# say OCC is client work that must not ride the shared digithings platform.
# Chris reversed that on 2026-10-27: OCC is one tenant of the shared stack and
# of this Worker's one container, like the house chat. What keeps it apart is
# not a separate deployment but the gate — the invite link (src/occ-gate.ts)
# is the only way in to /chat/occ, its API calls are bound to the OCC tenant
# at this edge only from that page with a valid invite cookie, and the OCC
# indexes answer only the OCC tenant. The route ownership above is unchanged.
#
# So the seven routes below are this Worker's live surface and they STAY here.
# They are not a temporary bridge with a stack move behind them, and the stack
# holds no fallback copy of them: dropping them here drops them from the zone,
# and Pages would 404 /embed and /api/chat with OCC in active use. Do not
# "complete the cutover" by moving them to the stack — the decision is the
# other way round.
#
# The /api/mcp/zammad* route below is additive and secret-gated (stage 1 of
# moving the OCC helpdesk MCP off the shared base stack); nothing consumes it
# yet.
#
# DIG-5121 (2026-10-22): this deploy is no longer traffic-neutral. The route
# set now ALSO claims digithings.ai/chat*, so the canonical /chat path stops
# being the Pages marketing shell and becomes the digichat app — the Container
# is built with DIGICHAT_BASE_PATH=/chat, so the app answers under /chat and
# the legacy paths below keep working through the Worker (see
# src/paths.ts: containerPathFor).
#
# Compatibility window (ADR 0018): the seven routes below stay declared.
# /embed* stays for good — the marketing site's own shell points it at
# digithings.ai/embed?host=digithings.ai and customer embeds use it, so that
# route is not a temporary bridge (its host=occ door stays invite-gated: see
# occEmbedGate). The /api/* routes below are the legacy spelling of what the
# app now serves under /chat/api/*; they are reviewed once the cutover is
# verified live. /chat/occ* is no Pages shell any more: this Worker's invite
# gate serves the app itself there (DIG-3585).
#
# To roll back: this exact route list IS the rollback shape.
[[routes]]
pattern = "digithings.ai/embed*"
zone_name = "digithings.ai"

[[routes]]
pattern = "digithings.ai/api/chat*"
zone_name = "digithings.ai"

[[routes]]
pattern = "digithings.ai/api/embed*"
zone_name = "digithings.ai"

[[routes]]
pattern = "digithings.ai/api/byok*"
zone_name = "digithings.ai"

[[routes]]
pattern = "digithings.ai/api/plan-proof*"
zone_name = "digithings.ai"

[[routes]]
pattern = "digithings.ai/api/health"
zone_name = "digithings.ai"

[[routes]]
pattern = "digithings.ai/_dtchat*"
zone_name = "digithings.ai"

# Post-deploy read-back for scripts/deploy.mjs. That script injects
# `--var DIGICHAT_CONTAINER_REV:<sha12>` and then fetches this path to confirm
# the Worker is addressing the Container its commit implies. `paths.ts` records
# that the route must be enabled here; without it the deploy finishes
# DEPLOYED-but-UNVERIFIED (non-zero) *after* a successful upload, so a real
# problem reads as a verification failure and a verification failure reads as a
# deploy failure.
[[routes]]
pattern = "digithings.ai/_digichat/meta"
zone_name = "digithings.ai"

# Worker-owned, secret-gated container reset lever: intercepted by this Worker
# (never proxied to the container) so an instance that outlived its idle tail
# can be destroyed. Additive; gated by x-digi-admin-key == DIGICHAT_ADMIN_KEY.
[[routes]]
pattern = "digithings.ai/_digichat-admin*"
zone_name = "digithings.ai"

# Read-only OCC helpdesk MCP (stage 1): secret-gated by x-digi-mcp-key ==
# ZAMMAD_EDGE_KEY, then served by the in-container zammad-mcp through the
# trusted proxy. The OCC assistant's MCP row points at
# https://digithings.ai/api/mcp/zammad/mcp and sends that key
# (infra/digichat-digithings/README.md). The base-path spelling
# (/chat/api/mcp/zammad*) is gated by the same key and mapped onto this
# container-local path (src/paths.ts).
[[routes]]
pattern = "digithings.ai/api/mcp/zammad*"
zone_name = "digithings.ai"

# DIG-3585: the invite-gated OCC page. This Worker answers /chat/occ itself
# (src/occ-gate.ts): a valid ?token= is traded for the occ_invite cookie, and a
# valid cookie gets the app's own embed route from the Container. Pages is not
# in this path; anything else gets the site's 404.
[[routes]]
pattern = "digithings.ai/chat/occ*"
zone_name = "digithings.ai"

# DIG-5121: the canonical digichat surface. The app is served under /chat by
# the Container, so without this route the path never reaches this Worker and
# Pages keeps answering it. The trailing `*` (not `/chat/*`) claims the bare
# /chat too, so the canonical URL is served directly instead of bouncing off
# the Pages trailing-slash redirect — the same shape as the /embed* and
# /api/chat* routes above.
#
# /chat/occ needs no route of its own for safety: every request is matched by
# the /chat* pattern below, and the Worker answers /chat/occ itself
# (src/occ-gate.ts) before anything is proxied. That in-Worker gate is the
# guarantee, whichever order the routes are matched in.
[[routes]]
pattern = "digithings.ai/chat*"
zone_name = "digithings.ai"

[[containers]]
class_name = "DigiChatContainer"
# `image` and `image_build_context` resolve relative to THIS config file's
# directory, and wrangler defaults the container build context to the
# Dockerfile's own directory (`dirname(image)`). Pinned to the monorepo root
# explicitly: the Dockerfile's COPY lines are repo-root-relative, so the
# default would narrow the context to `infra/docker/` and break the build.
image = "../../infra/docker/Dockerfile.digichat-cloudflare"
image_build_context = "../.."
# DIGICHAT_VERSION for GET /api/health is baked from apps/digichat/package.json
# inside infra/docker/Dockerfile.digichat-cloudflare. Do not pin it here or as a dashboard secret
# (it would drift). Optional override: image_vars = { DIGICHAT_VERSION = "…" }.
# Ten slots (owner call, t1702u; was two). A rolling deploy must be able to
# start the new revision while the old one drains, or the container-instance
# cap refuses the start (DIG-4459). The id is derived from the deploying commit
# (src/paths.ts), so every deploy addresses a NEW id while the previous id's
# instance is still running, warm or draining for up to 15 minutes after the
# rollout's SIGTERM, and a start then fails with "Maximum number of running
# container instances exceeded" (DIG-4487). All traffic routes to that ONE id,
# so ten slots are rollover headroom (back-to-back deploys, a stuck draining
# instance), not per-user capacity. Billing is per running instance: steady
# state is still one instance; idle slots cost nothing.
max_instances = 10
instance_type = "basic"

[[durable_objects.bindings]]
name = "DIGICHAT"
class_name = "DigiChatContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DigiChatContainer"]

# Secrets (wrangler secret put):
#   OCC_INVITE_KEY           # Worker-only /chat/occ gate; never forwarded to the container
#   AUTH_SECRET
#   DIGICHAT_EMBED_TENANTS   # digithings + occ JSON — see README
#   DIGIGRAPH_INTERNAL_URL   # reachable digigraph base URL
#   DIGIKEY_URL
#   DIGIKEY_BFF_TOKEN
#   DIGICHAT_PLAN_PROOF_SECRET
#   DIGICHAT_MONITOR_TOKENS   # monitor free-turn bypass (DIG-613); optional, fails open
#   DIGICHAT_DASHBOARD_SUPABASE_URL
#   DIGICHAT_DASHBOARD_SUPABASE_ANON_KEY
#   ZAMMAD_API_TOKEN         # read-only Zammad helpdesk MCP (in-container zammad-mcp, OCC tickets)
#   ZAMMAD_BASE_URL          # Zammad base URL for that MCP (optional; client default otherwise)
#   ZAMMAD_EDGE_KEY          # Worker-only /api/mcp/zammad gate; never forwarded to the container
#   DIGICHAT_ADMIN_KEY       # Worker-only /_digichat-admin container reset lever; never forwarded
# Optional: DIGICHAT_DATABASE_URL if you enable Auth.js / conversations DB.
# It is deliberately NOT forwarded to the Container. This Cloudflare deployment
# is DB-less (no Postgres instance or secret), so digichat falls back to
# localStorage and /api/health reports `database: skipped`. The Worker forwards
# no such var, and the Env/envVars parity test pins that absence (audit D5,
# issue #4314) -- enabling Postgres means adding the secret, the Env member, the
# envVars entry, and removing it from that test's DOCUMENTED_NOT_FORWARDED.
#
# digigraph + LiteLLM + digikey + digivault + digisearch are NOT inside this
# Container — deploy apps/digithings-stack-cloudflare and point secrets at:
#   DIGIGRAPH_INTERNAL_URL=https://graph.digithings.ai
#   DIGIKEY_URL=https://key.digithings.ai
# Never use Mac Compose / *.trycloudflare.com quick tunnels in production.

# Embed tenant config (DIG-1210): non-secret JSON in KV key `embed-tenants`,
# credentials referenced by name (tokenEnv) and set as Worker secrets.
# Create once:  npx wrangler kv namespace create DIGICHAT_TENANTS_KV
# (created 2026-10-13). Without the binding the Worker uses
# the legacy DIGICHAT_EMBED_TENANTS secret unchanged.
#
# The same namespace holds the digichat deployment document under key
# `config-yaml` (non-secret YAML or JSON, same shape as config/digichat.yaml:
# deployment + hosts). The Worker forwards it to the Container as
# DIGICHAT_CONFIG_YAML at boot; the container prefers it over the file on disk
# and merges DIGICHAT_EMBED_TENANTS over it. A KV edit applies on the next
# boot (the Container sleeps after 1m idle) — no redeploy:
#   npx wrangler kv key put --namespace-id 361b710bee56466097053275404535ba \
#     config-yaml --path <digichat-config.yaml>
# Keep it non-secret: credentials are named env refs (tokenEnv), never inline.
[[kv_namespaces]]
binding = "DIGICHAT_TENANTS_KV"
id = "361b710bee56466097053275404535ba"

[vars]
# Legacy generic anonymous embed is intentionally NOT set (OFF). A stock deploy
# must not grant `/embed` to unregistered hosts. To opt in for a dedicated legacy
# deployment (no DIGICHAT_EMBED_TENANTS), add:
#   DIGICHAT_LEGACY_EMBED_ENABLED = "1"
# The Worker forwards it to the Container (deprecated alias DIGICHAT_EMBED_ENABLED
# is also honored). With tenants configured the flag is ignored.
DIGICHAT_REQUIRE_ROOT_AUTH = "0"
DIGICHAT_EMBED_HOSTS = "digithings.ai,www.digithings.ai,occ.digithings.ai,digiquant.io,www.digiquant.io"
# Profile A: digisearch/digivault are loopback inside digithings-stack; digichat
# only talks to digigraph (+ digikey for bff_session). Do not probe digisearch
# / digiquant / digitrace from /api/health (defaults would be unreachable).
DIGICHAT_ENABLED_SERVICES = "digigraph"
# /chat/occ invite cookie lifetime in whole days (1-365). Non-secret: the cookie
# carries its issued-at inside the MAC, and the edge refuses it once it is older
# than this. Reopening the invite link issues a fresh one. Worker-only.
OCC_INVITE_MAX_AGE_DAYS = "30"

# BEGIN config-contract (generated by scripts/render_config_contract.py — do not hand-edit)
DT_VARIANT = "hosted"
DT_TARGET = "hosted"
DT_BASE_URL = "https://digithings.ai"
# END config-contract
