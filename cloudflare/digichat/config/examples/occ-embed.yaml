version: 1
# OCC (Online Compliance Center) corpus embed
hosts:
  occ.digithings.ai:
    slug: occ
    chrome:
      mode: embed
      theme: light
      skin: digichat
      title: OCC Help
      welcome: Ask about OCC policies and procedures.
      placeholder: Ask OCC help
      attribution: true
    persistence: none
    auth: anonymous
    features:
      attachments: false
      dictation: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      modelPicker: false
      speech: false
    backend:
      type: digigraph
      digisearchIndex: occ_help
      vaultPathPrefix: clients/online-compliance-center
    tools:
      allowUserToggle: true
      catalog:
        - id: digisearch
          default: true
        - id: digivault
          default: true
        - id: web_search
          default: true
          label: Web search
    # Operator MCP servers stay on the BFF — URLs are never projected to the
    # browser. Zammad rides its `Token token=<x>` scheme as a raw authHeader
    # value (#3841); digigraph treats the dotless `zammad-mcp` name as
    # container-internal DNS (loopback URLs are never dialable, #3879).
    mcp:
      allowUserServers: false
      allowAddForm: false
      servers:
        - id: zammad
          url: http://zammad-mcp:8770/mcp
          label: Zammad tickets
          default: true
          tokenEnv: ZAMMAD_API_TOKEN
          authHeader: Authorization
    gate:
      mode: ungated
      activityDetail: labels
      llmAccess: operator
      showByok: false
      showLanguageSelector: true
      webSearch: true
