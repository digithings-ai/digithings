version: 1
# Local / first-party app (Auth.js session + server persistence)
deployment:
  slug: local-app
  chrome:
    mode: app
    theme: light
    # Official assistant-ui templates (11 catalog ids): base | chatgpt | claude |
    # grok | gemini | perplexity | react-ink | expo-react-native |
    # base-assistant-ui | webpage-assistant | product-page-assistant.
    # Overlay: DIGICHAT_CHROME_SKIN.
    skin: base
    title: digichat
    welcome: How can I help you today?
    placeholder: Send a message...
    suggestions:
      - Summarize my last conversation
      - What can you search?
  persistence: server
  auth: session
  features:
    attachments: true
    dictation: true
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
      - id: web_search
        default: true
        label: Web search
  mcp:
    servers: []
    allowUserServers: false
    allowAddForm: false
  gate:
    mode: ungated
    activityDetail: full
    llmAccess: operator
    showByok: true
    showLanguageSelector: true
    webSearch: true
