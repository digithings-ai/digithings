version: 1
# Official assistant-ui template `expo-react-native` — copy to DIGICHAT_CONFIG_PATH
# or set DIGICHAT_CHROME_SKIN=expo-react-native on any valid deployment YAML.
deployment:
  slug: client-expo-react-native
  chrome:
    mode: app
    theme: light
    skin: expo-react-native
    title: assistant-ui
    welcome: How can I help you today?
    placeholder: Send a message...
  persistence: none
  auth: anonymous
  features:
    attachments: true
    dictation: false
    speech: false
    reasoning: collapsed
    toolCalls: collapsed
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
  gate:
    mode: ungated
    activityDetail: labels
    llmAccess: operator
