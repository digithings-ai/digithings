version: 1
# Local live test: tenant-emulating digichat container talking to the
# DataTap dev MCP server via digigraph operator MCP (#3841).
# Token comes from DATATAP_MCP_TOKEN in the deploy environment — never committed.
deployment:
  slug: datatap-trial-test
  chrome:
    mode: embed
    theme: dark
    skin: digichat
    title: ask datatap
    welcome: Ask about your pipelines.
    placeholder: Ask a question
  persistence: none
  auth: anonymous
  features:
    attachments: false
    dictation: false
    speech: false
    reasoning: true
    toolCalls: true
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
  mcp:
    allowUserServers: false
    allowAddForm: false
    servers:
      - id: datatap
        url: https://datatap-dev-mcp.azurewebsites.net/
        label: DataTap
        default: true
        tokenEnv: DATATAP_MCP_TOKEN
        authHeader: X-API-Key
  gate:
    mode: ungated
    activityDetail: labels
    llmAccess: operator
    showByok: false
    showLanguageSelector: true
