[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digisearch"
version = "0.1.0"
description = "digisearch – RAG, vectorization, document search for Digi ecosystem"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Base install is intentionally LIGHT: only what the importable library core
# (core models, config, client, ingestion parsers) needs. The HTTP/MCP/CLI
# service stack lives in the [server] extra; document-parser third-party deps
# live in [ingestion]. This lets consumers `pip install digisearch[ingestion]`
# (or just the base) and import e.g. digisearch.ingestion.parsers.pdf WITHOUT
# pulling fastapi/uvicorn/mcp/typer/digikey. See ARCHITECTURE.md §"Lazy package
# surface and install extras". The running service installs [server,ingestion].
dependencies = [
    "polars>=1.0",
    "pydantic>=2",
    "httpx>=0.27",
    "pyyaml>=6",
    "digibase>=0.1.0",
]

[project.optional-dependencies]
# Server / runtime stack: FastAPI HTTP app, uvicorn, MCP server, Typer CLI, and
# the digikey auth middleware. python-json-logger backs digisearch.logging,
# which only the entrypoints (server, mcp_server, ingest_worker) import.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Upper-bounded: mcp 2.0 removed `mcp.server.fastmcp`, which this package's
    # MCP server imports at module scope — unbounded, it is a hard ImportError
    # (#1711). Lift only together with a migration to the 2.x API.
    "mcp>=1.0,<2",
    "typer>=0.12",
    "digikey>=0.1.0",
    "python-json-logger>=2.0",
]
chroma = ["chromadb>=0.4"]
embedding = ["openai>=1.0"]
# BGE cross-encoder path (Reranker provider=bge). Kept separate from [embedding]
# so OpenAI-only consumers are not forced to pull sentence-transformers (#2441).
rerank = ["sentence-transformers>=3.0"]
azure = ["azure-search-documents>=11.4", "azure-core>=1.0"]
# Document-parser third-party deps. polars is in the base install; the rest are
# parser-only (html→beautifulsoup4, docx→python-docx, pdf→pdfplumber,
# plaintext→chardet). Each parser try-imports its dep at module scope (guarded by
# try/except), so the parser module imports cleanly without it; installing
# [ingestion] is what makes the corresponding parser functional.
# chonkie[semantic] supplies SemanticChunker (default ingest) + TokenChunker.
# Do NOT add pandas-ta (deleted upstream); use pandas-ta-classic if TA is ever needed.
ingestion = [
    "beautifulsoup4>=4",
    "python-docx>=1.0",
    "pdfplumber>=0.10",
    "chardet>=5",
    "chonkie[semantic]>=1.0",
]
agent = ["langgraph>=0.2"]
edgar-corpus = ["datasets>=3.0"]
# dev folds in [server] + [ingestion] so every CI/dev install (and pip-audit's
# [dev] row) exercises and audits the full shipped surface, not just the light
# base. Keep this in sync when adding runtime/parser deps.
dev = ["digisearch[server]", "digisearch[ingestion]", "langgraph>=0.2"]
otel = ["digibase[otel]"]
all = ["digisearch[server]", "digisearch[chroma]", "digisearch[embedding]", "digisearch[rerank]", "digisearch[azure]", "digisearch[ingestion]", "digisearch[agent]"]

[project.scripts]
digisearch = "digisearch.cli:main"
digisearch-worker = "digisearch.ingest_worker:main"

[dependency-groups]
# Synced by default with plain `uv sync` (unlike [project.optional-dependencies], which
# needs --extra/--all-extras) -- so these tools are always present in digisearch's own venv
# regardless of which extras a given `uv sync` invocation requests. Bounds match CLAUDE.md's
# "Dependency version bounds": tools whose output gates CI are capped to their current major.
dev = ["pytest>=8,<10", "pytest-cov>=4,<8", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
# Service entrypoint imports after dotenv/sys.path bootstrap — by design.
"src/digisearch/server.py" = ["E402"]
# Parsers check third-party availability via try/import; ruff can't see through.
"src/digisearch/ingestion/parsers/*.py" = ["F401"]
# Package __init__ files re-export public symbols.
"**/__init__.py" = ["F401"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F", "I", "DTZ", "RUF100"]

[tool.pytest.ini_options]
# Monorepo tests live at repo root tests/ds/; from digisearch/: `pytest` picks these up; or `make test-unit` from repo root.
#
# pythonpath must list the repo root plus every workspace sibling that src/digisearch or
# tests/ds imports directly (digibase, digikey) -- not just "src". Reason: when pytest is
# invoked with no path args from *inside* digisearch/ (e.g. `cd digisearch && uv run
# pytest -m unit`), its rootdir/config search starts at cwd and stops at the first
# ancestor with a recognized config -- this file -- so it never walks up to the
# repo-root pytest.ini, which carries the full list (". digibase/src digillm/src
# digikey/src ..."). If that's the only thing putting a sibling's editable install (or
# the repo root, needed for `from tests.digi_test_jwt import ...` / `from tests.conftest
# import ...`) on sys.path, the omission silently resolves imports against whatever
# global site-packages is on the fallback interpreter instead of the workspace's
# editable copy -- see digigraph's fix for the full root-cause writeup. Listing them
# here is both the fix and the safety net.
testpaths = ["../tests/ds"]
pythonpath = ["..", "src", "../digibase/src", "../digikey/src"]
