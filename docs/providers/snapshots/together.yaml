cle, retained as-is pending a direct recheck. Qwen3.6-Plus $0.50/$3.00 reconfirmed unchanged. DeepSeek-V3-0324 naming may have been superseded industry-wide by V3.1/V3.2 (seen on SambaNova too) — not confirmed for Together specifically. No key configured yet; no probe run (method: skipped)."
