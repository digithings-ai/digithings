notes: "claude-opus-4-8 released 2026-05-28. Claude Sonnet 5 released late June/early July 2026 as new default (introductory $2/$10 through 2026-08-31, standard $3/$15 from 2026-09-01 — same rate as old Sonnet 4.6; exact GA date varies slightly by source, June 30 vs July). CONFIRMED 2026-07-26: Claude Fable 5 (launched 2026-06-09) pricing at $10/$50/MTok is now corroborated by a second independent source (tldl.io) — confidence upgraded from single-source flag to confirmed. A 'Claude Mythos 5' was reported by one source at the same $10/$50 tier but still could not be corroborated as of this cycle — not added to this snapshot, flag for re-check. Opus 4.7 fast-mode feature (not the model itself) is being deprecated 2026-07-24. All Opus/Sonnet context windows are 1M (not 200K). Haiku max output 64K; Opus max output 128K. Cache reads = 10% of each model's input price. Newer tokenizer on Opus 4.7+/Sonnet 5/Fable 5 produces ~30% more tokens for the same text vs. the previous tokenizer — an effective cost increase not visible in sticker price. Lowest hallucination rate on finance reasoning benchmarks. Needs separate ANTHROPIC_API_KEY (CLAUDE_CODE_OAUTH_TOKEN is for CLI only). No free-tier probe (method: skipped, no free tier to test)."
