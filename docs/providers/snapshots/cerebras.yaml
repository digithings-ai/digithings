notes: "RESOLVED 2026-07-26 (was flagged conflicting last cycle): the 'Free Trial requiring a verified payment method' claim is NOT current — 3+ independent 2026-07 sources (aicreditmart, tokenmix, morphllm) agree the standing free tier requires NO credit card, at 5 RPM / 30K TPM / 1,000,000 tokens/day (resets daily, no rollover), 8,192-token context cap, on gpt-oss-120b and GLM-4.7 only per the official rate-limits doc. Updated rate_limits.rpm 30→5 and tpm 60000→30000 to match; cc_required confirmed false. STILL CONFLICTING: one source (threads.com) lists Qwen-3-235B as also free alongside gpt-oss-120b, contradicting the 'only 2 models' framing from morphllm/tokenmix — kept qwen3-235b as active pending resolution, but do not treat this as a safe production dependency until confirmed via a direct signup-flow check. gpt-oss-120b is the one model confirmed free by every source checked this cycle — treat it as the only fully-reliable free pick. GLM-4.7/gemma-4-31b mentioned as free-tier-adjacent by some sources but not added as full model entries here (exact context/output specs not confirmed to DigiThings's accuracy bar). PROBE 2026-07-26: llama-3.3-70b again returns 404 model_not_found (2nd consecutive cycle) — fully consistent with its removal from the free roster; llama-4-scout and qwen-3-32b also downgraded to deprecated this cycle as no source lists them as free anymore. Fastest inference on market (>2000 tok/s; gpt-oss-120b ~3000 tok/s). Paid per-token rate card not reverified this cycle (pricing page previously emphasized Code Pro $50/mo / Code Max $200/mo subscription tiers, both listed 'sold out' last check)."
