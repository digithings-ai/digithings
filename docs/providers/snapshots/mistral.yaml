notes: "RECONFIRMED 2026-09-06: Mistral still does not publish exact free-tier RPM/RPD/TPM figures (Admin Console 'Limits' page only) — third-party estimates conflict (1 RPS/500K TPM vs 5 RPS burst-10), no authoritative number available. RISK FLAG 2026-09-06 (medium-low confidence, aggregator sources only — Mistral's own pricing page 404'd this cycle): multiple sources now cite a 'Mistral Large 3' (launched Dec 2025) at $0.50/$1.50 per 1M — a 75% cut vs the $2/$6 tracked for mistral-large-latest — and a 'Small 4'/'Ministral 3' family at $0.15/$0.60 vs the $0.20/$0.60 tracked for mistral-small-latest. NOT applied to structured pricing above pending confirmation of whether the `-latest` aliases actually resolve to these newer generations — recommend a direct API probe next cycle. codestral-latest ($0.30/$0.90) and mistral-medium-3.5 ($1.50/$7.50) reconfirmed unchanged. PROBE 2026-08-30: mistral-small-latest verified ok (755ms, up from 435ms last cycle — single data point, not treated as a regression). RATE LIMIT CONFIDENCE DOWNGRADE (unchanged from 2026-07-19): Mistral's public docs no longer publish exact RPM/RPD/token numbers — limits are now gated behind the logged-in Admin Console 'Limits' page. Could not independently re-confirm the 2 RPM figure or the phone-verification requirement this cycle either — retained as-is but still flagged LOW CONFIDENCE pending a manual Admin Console check. ~1B tokens/month ceiling still referenced by secondary sources only. Add aggressive retry logic — 429s common at low RPM. Privacy: free tier trains on data; paid is zero-retention. mistral-medium-3.5 ($1.50/$7.50, 262K ctx) pricing not reconfirmed this cycle. Large and Codestral pricing not reconfirmed this cycle."
