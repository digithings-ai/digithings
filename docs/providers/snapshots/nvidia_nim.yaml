notes: "DISCREPANCY FLAG 2026-09-06 (unresolved): a fresh check of the live build.nvidia.com model page for llama-3.3-70b-instruct shows it rendering as active with no deprecation banner, in tension with the 2026-08-30 probe's direct 410 Gone response citing an exact EOL timestamp. A direct API probe (which actually calls the endpoint) is a stronger signal than a webpage render (which may simply be stale/cached), so status is NOT reverted to active here — but flagged for a fresh probe re-run next cycle to confirm one way or the other. Separately, one low-quality secondary source (non-authoritative GitHub issue) claims a 'DeepSeek V4 Pro' NIM hit EOL 2026-08-07 — not corroborated, and not a model tracked in this snapshot's roster (this provider tracks deepseek-ai/deepseek-r1, not v4-pro), so not acted on. 40 RPM ceiling and 1000-5000 credit grant reconfirmed unchanged 2026-09-06. PROBE 2026-08-30: meta/llama-3.3-70b-instruct now returns 410 Gone, stating end-of-life 2026-08-26T09:00:00Z — this supersedes the prior cycle's 91.8s timeout finding; the model is confirmed retired, not merely overloaded. No official replacement/redirect model was named in NVIDIA's public EOL notices found this cycle. ACTION NEEDED: scripts/provider_review/probe.py:51 should be repointed at a still-live free-tier model — nvidia/llama-3.3-nemotron-super-49b-v1, deepseek-ai/deepseek-r1, or nvidia/nemotron-3-ultra-550b-a55b are all still listed active in this snapshot and unaffected by this EOL. No deprecation found for those three this cycle. Catalog still 100+ models. Tool calling confirmed on many models. 40 RPM remains the practical free-tier ceiling (200 RPM forum-requested bumps do not appear to be actually granted per staff comments recorded last cycle). Credits do not refill — best for prototyping. Developer Program grants 5000 additional credits. Prior cycle's reliability finding (chronic free-tier latency spikes/timeouts under load, not a status-page outage) is retained pending a fresh check against one of the still-live models."
