notes: "RESOLVED 2026-09-06: last cycle's 'unconfirmed' flag on deepseek/deepseek-chat-v3:free, deepseek/deepseek-chat-v3-0324:free, deepseek/deepseek-r1:free, google/gemini-2.0-flash-exp:free, and qwen/qwen3-235b-a22b:free is lifted — all five directly re-checked on their individual openrouter.ai model pages and confirmed still 'Price: Free', no 404s. Two new free models added to the catalog in August 2026 (medium confidence, aggregator-sourced): 'ox-alpha' (stealth model revealed as a Zhipu GLM variant, 1M ctx, coding/agentic) and an NVIDIA Nemotron 3 Ultra 550B free variant. Rate limits reconfirmed unchanged: 20 RPM, 50 RPD (<$10 balance) / 1000 RPD ($10+). Note: a bulk fetch of the /api/v1/models JSON endpoint this cycle returned an apparently bogus/truncated list — treated as a tool artifact, not evidence of catalog changes, disregarded. CONFIRMED 2026-08-30: meta-llama/llama-3.3-70b-instruct:free is fully removed from the free tier — the probe's 404 explicitly states 'This model is unavailable for free. The paid version is available now - use this slug instead: meta-llama/llama-3.3-70b-instruct', finalizing the sunset flagged last cycle (model-page banner said 'Going away July 19, 2026'; that date's probe saw a 429 upstream-rate-limit as the wind-down in progress). Status flipped deprecated -> paid-only. Do not keep recommending this model — replacements already in this snapshot from last cycle: openai/gpt-oss-20b:free (Apache 2.0, near o3-mini on coding benchmarks) and qwen/qwen3-coder:free (480B MoE, 1M ctx, strong agentic/tool-calling). ACTION NEEDED: scripts/provider_review/probe.py:61 still probes the dead :free slug — repoint to openai/gpt-oss-20b:free or qwen/qwen3-coder:free. STILL UNCONFIRMED from last cycle (secondary aggregator did not list deepseek-chat-v3:free, deepseek-r1:free, gemini-2.0-flash-exp:free, or qwen3-235b-a22b:free as currently active; could not independently verify via OpenRouter's own JS-rendered model index this cycle either) — retained pending direct API confirmation (GET /api/v1/models filtered for :free) rather than removed on secondary-source evidence alone. Free model catalog grew from ~4 to ~25-29 models since May 2026. openrouter/free meta-router (Feb 2026): auto-selects from free pool by required features, 200K ctx, same rate limits. :free roster rotates — verify at https://openrouter.ai/models?q=free. Rate limits last reconfirmed 2026-07-19: 20 RPM, 50 RPD (<$10 balance) / 1000 RPD ($10+ balance) — not independently rechecked this cycle."
