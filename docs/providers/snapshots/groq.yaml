notes: "PROBE 2026-09-06: llama-3.3-70b-versatile still 404s model_not_found (71ms) — third consecutive cycle, deprecation reconfirmed, no new information. RATE LIMITS CORRECTED 2026-09-06: openai/gpt-oss-120b's actual free-tier limits are 30 RPM / 1,000 RPD / 8,000 TPM / 200,000 TPD (per console.groq.com/docs/rate-limits) — the previous 12,000 TPM figure belonged to the now-dead llama-3.3-70b-versatile, not gpt-oss-120b. Model-name flag: sources this cycle consistently reference 'qwen/qwen3-32b' (60 RPM/6,000 TPM) rather than 'qwen3.6-27b' for the second free model — the tracked id may be stale, not renamed without a direct console check. PROBE 2026-08-30 (superseded): llama-3.3-70b-versatile returned 404 model_not_found (112ms) — confirms Groq's June 17 2026 deprecation notice ('by August 2026, requests to these models will no longer be served' for free/developer tier; enterprise committed-spend contracts unaffected). This is the hard cutover, not a transient probe failure — status flipped active -> deprecated. Groq's own migration guidance (unchanged from last cycle): openai/gpt-oss-120b or qwen/qwen3.6-27b, both already in this snapshot's free roster. ACTION NEEDED: infra/digichat-release/config/litellm.yaml:37-40 still routes a production model_name to groq/llama-3.3-70b-versatile — that route is now dead and any caller will 404. scripts/provider_review/probe.py:36 should also be repointed to openai/gpt-oss-120b so next cycle's probe exercises a live model. TPM 12k on the now-dead llama-3.3-70b-versatile was already below research extraction phase needs (41k/run) — gpt-oss-120b does not appear rate-limited lower per Groq's docs, but its free-tier TPM/RPD have not been independently reconfirmed this cycle. ACQUISITION CLARIFIED (unchanged from 2026-07-19): the Nvidia deal is a non-exclusive inference-tech licensing deal + acquihire, not a straight acquisition — GroqCloud continues operating nominally independently."
