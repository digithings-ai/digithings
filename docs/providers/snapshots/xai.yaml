notes: "CONFIRMED 2026-09-06: grok-4.5 is superseded (grok-4.6 is the recommended flagship) but NOT deprecated — same base model/specs, still active; only its cached-input price reportedly differs from grok-4.6 ($0.50 vs $0.30/1M — direction/exact field unconfirmed, not applied to structured pricing above pending clarity). grok-3's hard full-retirement on 2026-08-15 is confirmed to have happened as scheduled. 'Grok Build' confirmed real: an open-source (Apache 2.0) agentic coding CLI that left beta at v1.0 on 2026-08-07; its underlying API model grok-build-0.1 (256K ctx, $0.20/$1.50 per 1M, 70.8% SWE-Bench Verified) is now added below — note this conflicts with an earlier lower-confidence sighting of $1.00/$2.00 (<200k) / $2.00/$4.00 (>=200k) for the same SKU name, unresolved which is authoritative. MATERIAL CHANGE 2026-08-15: grok-4.6 launched 2026-08-12 (SpaceXAI), superseding grok-4.5 as the flagship — pitched as agent/coding-focused, frontier on coding/knowledge/STEM, same $2/$6 per 1M under 200K-token prompts and $4/$12 >=200K as grok-4.5, 500K context, knowledge cutoff 2026-02-01. Available on the xAI API, OpenRouter (`x-ai/grok-4.6`), Cursor, Grok Build, Vercel, and Cloudflare. grok-4.5 retained below as still-active (not yet confirmed deprecated) rather than removed outright. Prior entry (unchanged): grok-4.5 launched 2026-07-08 (xAI's first release since the SpaceXAI/Cursor deal) — pitched by Musk as 'Opus-class', not yet available in the EU. CORRECTION (2026-07-19, still valid): grok-4-20's price was previously mis-recorded as $2/$6 (that figure actually belongs to grok-4.5) — corrected to its confirmed $1.25/$2.50. grok-3, already deprecated since the May 15 2026 slug retirement, has a confirmed hard full-retirement date of 2026-08-15 — after that the slug stops resolving entirely rather than redirecting. A 'Grok Build 0.1' SKU (256K ctx, $1.00/$2.00 <200k, $2.00/$4.00 >=200k) was also spotted in current lineups, likely tied to an agentic/coding product —