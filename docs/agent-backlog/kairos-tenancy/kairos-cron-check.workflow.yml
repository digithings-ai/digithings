# Production clock: Cloudflare Worker digithings-cron (frontend/digithings-cron). Schedule removed #3579.
name: "Pipeline: execution cron check"

# Fail-closed probe for overlay dispatch env, Alpaca paper sync env, route
# kill-switch visibility, Mailgun names, and digest candidate counts.
# Separate process from pipeline-digiquant.yml on purpose: overlay usage.start is
# process-global, so overlay must never share the house portfolio chain job.
#
# Probe only. The run: steps below are --check / --dry-run. They must never
# pass --execute, --all, or invoke digiquant.portfolio.chain.
# Do not run --execute --all against Observer until Stripe + BYOK land.
#
# Checkout is the triggering ref (default branch is develop), not a pin to main:
# overlay / execution sync CLIs live on develop until a Pages/promote hop. This is
# a read-only env probe, not a production apply.
#
# Expected red until GitHub secrets include CORE_SUPABASE_* (or SUPABASE_*)
# plus MAILGUN_API_KEY / MAILGUN_DOMAIN / NOTIFY_FROM. Missing names fail
# closed (exit 2). That is the production signal, not a skip.
#
# Installed at .github/workflows/execution-cron-check.yml — must match this spec
# byte-for-byte (tests/scripts/test_execution_cron_workflow.py). Probe-only.
# tests/scripts/test_execution_cron_workflow.py pins the probe-only invariants
# against this spec.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: execution-cron-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORE_SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      CORE_SUPABASE_SERVICE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.CORE_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CORE_SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
      MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
      NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # supabase extra arrives via research. NautilusTrader stays out — this job
      # never runs the graph.
      - name: Install from lockfile
        run: uv sync --frozen --package digiquant --extra research

      - name: Probe overlay + sync + route + Mailgun env
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python scripts/execution_cron_check.py

      - name: Overlay dry-run (no job_runs writes)
        if: success() || failure()
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python -m digiquant.dashboard.overlay --dry-run

      - name: Execution sync dry-run (no unseal, no poll)
        if: success() || failure()
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python -m digiquant.execution.sync_cron --dry-run

      - name: Execution route dry-run (no unseal, no submit)
        if: success() || failure()
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python -m digiquant.execution.route_cron --dry-run

      - name: Digest dry-run (no send, no notification_log claim)
        if: success() || failure()
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python -m digiquant.notify.dispatch --dry-run
