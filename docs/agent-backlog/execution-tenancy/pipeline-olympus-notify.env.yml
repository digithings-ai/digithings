# Splice into `.github/workflows/pipeline-olympus.yml` step
# "Run Olympus research pipeline" `env:` on a `chore/` or `feat/` branch.
# `cursor/*` cannot write `.github/workflows/`.
#
# House `hermes.chain` close-out reads these names for K5 digest send.
# Missing values fail-soft (`NOTIFY_NOT_CONFIGURED`) and do not fail the book.
# Do not put secret values in this file.

CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
