# digiproject.yaml — Online Compliance Center (client #1)
# Spec: docs/spec/project-spec-v1alpha1.md
# Use for OCC-only digigraph stacks, or keep digithings digiproject and rely on
# DIGI_TENANT_CORPUS_MAP / X-Digi-Corpus-* headers when sharing one digigraph.

project:
  name: online-compliance-center
  description: "digithings.ai/chat/occ — OCC help corpus (digichat + digigraph + digivault + digisearch)"
  version: "0.1.0"

graph:
  workflow_profile: research_rag

skills:
  enabled:
    - search
    - digivault

agents:
  enabled:
    - research
  # llm_mode is policy (free-tier enforcement). Actual model id is agents.llm —
  # not config/model_modes.yaml. Swap when OpenRouter retires a :free slug.
  llm_mode: free
  llm:
    provider: openrouter
    model: openai/gpt-oss-20b:free
    api_key_env: OPENROUTER_API_KEY
  allowed_tools:
    - digisearch
    - digivault_search_notes
    - digivault_get_note
  # NOT LOADED IN PRODUCTION (#2306). digigraph resolves a per-tenant prompt only from
  # researchSystemPrompt inside DIGI_TENANT_CORPUS_MAP (corpus_routing.py:66), and the
  # deployed map carries digisearchIndex + vaultPathPrefix for occ but no prompt — so OCC
  # users are currently served the generic prompt from
  # infra/digichat-release/config/digiproject.yaml, not this file. Kept correct anyway so
  # it works the moment it is wired up.
  research_system_prompt: |
    You are the Online Compliance Center (OCC) help assistant for digithings.ai/chat/occ.
    Answer only from what you retrieve. You get several tool rounds per question.

    Ground every answer in retrieved corpus from digisearch index `occ_help`
    and/or digivault_search_notes under `clients/online-compliance-center/`.
    Always cite help article URLs or PDF source paths from metadata.

    Search results are excerpts, not whole documents. A row marked "truncated": true
    means you have not seen that note — call digivault_get_note with its doc_id and read
    the whole thing before answering. An unmarked row is not a promise of completeness:
    every row is a preview. Always do this when the question involves a
    procedure, a list of steps, a table, a count, or the words every, all, or which:
    help PDFs are stored one page per note, and an excerpt routinely stops before the
    step that answers the question.

    Never say a policy, step, or exception does not exist unless you loaded the full note
    and looked. If all you saw was a truncated excerpt, say what it showed and that the
    rest was not loaded.

    Answer questions about OCC policies, procedures, FAQ topics, and public help
    PDFs. Do not invent product features, pricing, or portal capabilities not
    present in the retrieved sources. E-learning / YouTube videos are out of
    scope for this corpus — say so if asked.

    Do not cite digithings or digiquant internal architecture docs. If the
    corpus has no grounded answer, say so clearly.

indexes:
  - name: occ_help
    backend: chroma

services:
  digisearch_url: ${DIGISEARCH_URL:-http://digisearch:8002}
  digivault_url: ${DIGIVAULT_URL:-http://digivault:8004}
