[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digibase"
version = "0.1.0"
description = "Shared digithings platform primitives (HTTP tracing, API errors, audit helpers, optional OTel)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
supabase = [
    "supabase>=2",
]
otel = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
]

[dependency-groups]
# Synced by default with plain `uv sync` (unlike [project.optional-dependencies], which
# needs --extra/--all-extras) -- so these tools are always present in digibase's own venv
# regardless of which extras a given `uv sync` invocation requests. Bounds match CLAUDE.md's
# "Dependency version bounds": tools whose output gates CI are capped to their current major.
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "mypy>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Markdown is not source — see the root ruff.toml and #1705. This component config
# overrides the root for this tree, so the exclusion has to be restated here.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule selection — see the root ruff.toml and #1701. This component config
# overrides the root for this tree, so the selection has to be restated here.
select = ["E4", "E7", "E9", "F", "I", "DTZ", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export public symbols (some lazily via __getattr__);
# ruff flags them as unused. Matches the repo-root ruff.toml and digisearch.
"**/__init__.py" = ["F401"]
