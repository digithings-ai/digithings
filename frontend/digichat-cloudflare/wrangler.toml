# DigiThings DigiChat on Cloudflare Containers.
# Deploy from this directory; image builds via Dockerfile at monorepo root path.
name = "digithings-digichat"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Zone routes (uncomment + set zone_id after first deploy, or attach in Dashboard):
# [[routes]]
# pattern = "digithings.ai/embed*"
# zone_name = "digithings.ai"
# [[routes]]
# pattern = "digithings.ai/api/chat*"
# zone_name = "digithings.ai"
# [[routes]]
# pattern = "digithings.ai/api/embed*"
# zone_name = "digithings.ai"
# [[routes]]
# pattern = "digithings.ai/api/byok*"
# zone_name = "digithings.ai"
# [[routes]]
# pattern = "digithings.ai/_dtchat*"
# zone_name = "digithings.ai"

[[containers]]
class_name = "DigiChatContainer"
# Build context is monorepo root (two levels up from this package).
image = "../../Dockerfile.digichat-cloudflare"
max_instances = 3

[[durable_objects.bindings]]
name = "DIGICHAT"
class_name = "DigiChatContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DigiChatContainer"]

# Secrets (wrangler secret put): AUTH_SECRET, DIGITHINGS_SUPABASE_URL,
# DIGITHINGS_SUPABASE_ANON_KEY, DIGITHINGS_OPENROUTER_API_KEY, DIGICHAT_EMBED_TENANTS
# Optional: DIGICHAT_EMBED_ENABLED=1 as plain var below.

[vars]
DIGICHAT_EMBED_ENABLED = "1"
DIGICHAT_ENABLED_SERVICES = ""
