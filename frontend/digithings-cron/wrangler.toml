# digithings-cron — org-wide production clocks (issue #3579).
# Thin Worker: Cron Triggers → GitHub workflow_dispatch / repository_dispatch.
# No Containers / Durable Objects. Deploy from main only.
# wrangler deploy is the source of truth for [triggers] crons.
name = "digithings-cron"
main = "src/index.ts"
compatibility_date = "2026-09-04"
workers_dev = true

[observability]
enabled = true

[vars]
DRY_RUN = "0"

# Secrets (wrangler secret put; never commit values):
#   GH_DISPATCH_TOKEN   — Actions write on digithings-ai/digithings + digithings-ai/twelve-x
#   CRON_KICK_SECRET    — optional; enables POST /kick

[triggers]
crons = [
  "40 13 * * 1-5",
  "40 14 * * 1-5",
  "7,22,37,52 13-21 * * 1-5",
  "19 */2 * * 1-5",
  "19 22 * * 0",
  "27 21 * * 1-5",
  "17 9 * * 1-5",
  "17 10 * * 1-5",
  "17 11 * * 1-5",
  "17 12 * * 1-5",
  "5 22 * * *",
  "12 0 * * *",
  "40 22 * * *",
  "15 12 * * *",
  "8 22 * * 0",
  "8 8 * * 1",
  "9 0 * * 0",
  "11 7 * * *",
  "13 6 * * 1",
  "21 6 * * *",
  "10 6 * * 1",
  "23 9 * * *",
  "27 7 * * *",
  "33 6 * * 1",
  "17 6 * * *",
  "7 0 * * 1-5",
  "12 7 * * 1-5",
  "4 */4 * * *",
  "30 5 * * *",
  "8 7 * * 6",
  "30 17 * * 1-5",
  "3 6,18 * * *",
  "52 * * * 1-5"
]
