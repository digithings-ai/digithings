version: 1
# First-party digichat Thread — copy to DIGICHAT_CONFIG_PATH
# or set DIGICHAT_CHROME_SKIN=digichat on any valid deployment YAML.
# Default product skin remains `base` until an explicit cutover.
deployment:
  slug: client-digichat
  chrome:
    mode: embed
    theme: dark
    skin: digichat
    title: digichat
    welcome:
      title: digichat
      body: The chat surface for this stack. Scoped to the tools and data in this deployment — not a general-purpose chatbot.
    placeholder: Ask digichat…
    transcript:
      userAlign: left
  persistence: none
  auth: anonymous
  features:
    attachments: true
    dictation: false
    speech: false
    reasoning: collapsed
    toolCalls: collapsed
    sources: true
    branchPicker: true
    modelPicker: false
  backend:
    type: digigraph
  tools:
    allowUserToggle: true
    catalog:
      - id: digisearch
        default: true
        label: Search
      - id: digivault
        default: true
        label: Vault
  gate:
    mode: ungated
    activityDetail: labels
    llmAccess: operator
