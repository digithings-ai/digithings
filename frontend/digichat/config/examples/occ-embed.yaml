version: 1
# OCC (Online Compliance Center) corpus embed
hosts:
  occ.digithings.ai:
    slug: occ
    chrome:
      mode: embed
      theme: light
      title: OCC Help
      welcome: Ask about OCC policies and procedures.
      placeholder: Ask OCC help
      attribution: true
    persistence: none
    auth: anonymous
    features:
      attachments: false
      dictation: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      modelPicker: false
      speech: false
    backend:
      type: digigraph
      digisearchIndex: occ_help
      vaultPathPrefix: clients/online-compliance-center
    tools:
      allowUserToggle: true
      catalog:
        - id: digisearch
          default: true
        - id: digivault
          default: true
    gate:
      mode: ungated
      activityDetail: labels
      llmAccess: operator
      showByok: false
      showLanguageSelector: true
