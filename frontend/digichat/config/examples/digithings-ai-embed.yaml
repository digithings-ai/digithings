version: 1
# digithings.ai public embed (dogfood)
hosts:
  digithings.ai:
    slug: digithings-ai
    aliases:
      - www.digithings.ai
    chrome:
      mode: embed
      theme: dark
      skin: digichat
      title: ask digichat
      welcome: Ask about digithings — agents, digigraph, and the stack.
      placeholder: Ask a question
      suggestions:
        - What is digigraph?
        - How do embeds work?
      attribution: true
      launcher:
        mode: bar
        label: ask digichat
        closeLabel: close
        mobileFullscreen: true
    persistence: none
    auth: anonymous
    features:
      attachments: false
      dictation: false
      speech: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      modelPicker: false
    backend:
      type: digigraph
    tools:
      allowUserToggle: true
      catalog:
        - id: digisearch
          default: true
          label: Search
        - id: digivault
          default: true
          label: Vault
        - id: web_search
          default: false
          label: Web search
    gate:
      mode: ungated
      activityDetail: labels
      llmAccess: free_then_byok
      showByok: true
      showLanguageSelector: true
      webSearch: true
    # token: set via DIGICHAT_HOST_DIGITHINGS_AI_TOKEN or DIGICHAT_EMBED_TENANTS
