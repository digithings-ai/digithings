version: 1
# digithings.ai public embed (dogfood)
hosts:
  digithings.ai:
    slug: digithings-ai
    aliases:
      - www.digithings.ai
    chrome:
      mode: embed
      theme: dark
      skin: digichat
      title: ask digichat
      welcome: Ask about digithings.
      placeholder: Ask a question
      suggestions:
        - What is digigraph?
        - How do embeds work?
      attribution: true
      launcher:
        mode: bar
        label: ask digichat
        closeLabel: close
        mobileFullscreen: true
    persistence: none
    auth: anonymous
    features:
      attachments: false
      dictation: false
      speech: false
      reasoning: true
      toolCalls: true
      sources: true
      branchPicker: true
      modelPicker: true
    models:
      # Cheap/free public picker (#3777). Default is CI DeepSeek V4 Flash
      # (~$0.056/$0.113 per 1M). Allowlist is V4 Flash-or-cheaper OSS plus every
      # current OpenRouter `:free` chat model that supports tools. Not
      # gemini-3.1-flash-lite (~$0.20/$1.21) or gpt-5.6-luna (~$0.08/$0.48).
      default: deepseek/deepseek-v4-flash
      available:
        - deepseek/deepseek-v4-flash
        - deepseek/deepseek-v4-flash-0731
        - openai/gpt-oss-120b
        - openai/gpt-oss-20b
        - z-ai/glm-5.3-flash
        - google/gemma-3-12b-it
        - inclusionai/ling-3.0-flash
        - meta-llama/llama-3.1-8b-instruct
        - mistralai/mistral-nemo
        - mistralai/mistral-small-3.2-24b-instruct
        - nvidia/nemotron-3-nano-30b-a3b
        - qwen/qwen3-30b-a3b-instruct-2507
        - qwen/qwen3.7-flash
        - cohere/north-mini-code:free
        - dots-studio/dots-3-note-preview:free
        - google/gemma-4-26b-a4b-it:free
        - google/gemma-4-31b-it:free
        - inclusionai/ling-3.0-flash-fin:free
        - inclusionai/ling-3.0-flash-sante:free
        - liquid/lfm-2.5-2.6b:free
        - nex-agi/nex-n2.5-mini:free
        - nex-agi/nex-n2.5-pro:free
        - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
        - nvidia/nemotron-3-super-120b-a12b:free
        - nvidia/nemotron-3-ultra-550b-a55b:free
        - nvidia/nemotron-3.5-lightning:free
        - poolside/laguna-s-2.1:free
        - poolside/laguna-xs-2.1:free
        - thinkingmachines/inkling-small:free
        - thinkingmachines/inkling:free
      allowPicker: true
    backend:
      type: digigraph
    tools:
      allowUserToggle: true
      catalog:
        - id: digisearch
          default: true
          label: Search
        - id: digivault
          default: true
          label: Vault
        - id: web_search
          default: true
          label: Web search
    mcp:
      allowUserServers: true
      allowAddForm: false
    gate:
      mode: ungated
      # Local website-like dogfood (`?host=digithings.ai`) must show retrieve
      # chunks / note bodies. Production can still set labels via env overlay.
      activityDetail: full
      llmAccess: free_then_byok
      showByok: true
      showLanguageSelector: true
      webSearch: true
    # token: set via DIGICHAT_HOST_DIGITHINGS_AI_TOKEN or DIGICHAT_EMBED_TENANTS
