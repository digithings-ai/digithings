[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# --- Edge ports first (Cloudflare probes :8000; digichat needs :8005) ---

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
autostart=true
autorestart=true
priority=10
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:digikey]
command=/bin/sh /start_digikey.sh
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:digigraph]
command=uvicorn digigraph.server:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=25
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Seed Chroma once per volume while digisearch is not yet holding the DB.
[program:seed_occ]
command=/bin/sh /seed_occ_help.sh
directory=/app
autostart=true
autorestart=false
priority=30
startsecs=0
startretries=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- Loopback-only services (after edge + seed) ---

[program:digivault]
command=uvicorn digivault.server:app --host 127.0.0.1 --port 8004
directory=/app
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:digisearch]
command=/bin/sh /start_digisearch.sh
directory=/app
autostart=true
autorestart=true
priority=40
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:litellm]
command=litellm --config /app/config/litellm.yaml --port 4000 --host 127.0.0.1
directory=/app
autostart=true
autorestart=true
priority=50
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
