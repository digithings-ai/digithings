[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# NOTE: Do NOT use stdout_logfile=/dev/stdout under Cloudflare Firecracker —
# supervisord gets ENXIO ("unknown error making dispatchers") and never starts
# programs. Log to files under /var/log/supervisor instead.

# --- Edge ports first (Cloudflare probes :8000; digichat needs :8005) ---

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
autostart=true
autorestart=true
priority=10
startsecs=1
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:digikey]
command=/bin/sh /start_digikey.sh
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=10
stdout_logfile=/var/log/supervisor/digikey.log
stderr_logfile=/var/log/supervisor/digikey.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:digigraph]
command=uvicorn digigraph.server:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=25
startsecs=5
startretries=10
stdout_logfile=/var/log/supervisor/digigraph.log
stderr_logfile=/var/log/supervisor/digigraph.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# Seed Chroma once per volume while digisearch is not yet holding the DB.
# digithings_docs (digithings.ai/chat) + occ_help (digithings.ai/chat/occ).
[program:seed_chroma]
command=/bin/sh /seed_chroma.sh
directory=/app
autostart=true
autorestart=false
priority=30
startsecs=0
startretries=1
stdout_logfile=/var/log/supervisor/seed_chroma.log
stderr_logfile=/var/log/supervisor/seed_chroma.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# --- Loopback-only services (after edge + seed) ---

[program:digivault]
command=uvicorn digivault.server:app --host 127.0.0.1 --port 8004
directory=/app
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/var/log/supervisor/digivault.log
stderr_logfile=/var/log/supervisor/digivault.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:digisearch]
command=/bin/sh /start_digisearch.sh
directory=/app
autostart=true
autorestart=true
priority=40
startsecs=3
stdout_logfile=/var/log/supervisor/digisearch.log
stderr_logfile=/var/log/supervisor/digisearch.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:litellm]
command=litellm --config %(ENV_LITELLM_CONFIG)s --port 4000 --host 127.0.0.1
directory=/app
autostart=true
autorestart=true
priority=50
startsecs=5
stdout_logfile=/var/log/supervisor/litellm.log
stderr_logfile=/var/log/supervisor/litellm.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
